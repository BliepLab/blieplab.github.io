45 минут каждый день, чем 5 часов в воскресенье. Один пропущенный день не страшен: просто продолжайте.</li><li><b>Не исправляйте за него.</b> Если что-то не работает, спросите: «Что показывает проверка? Что говорит код?» Ошибка — часть обучения.</li><li><b>Пусть объяснит вам.</b> Попросите подростка показать результат и рассказать, как это работает: так закрепляется понимание.</li><li><b>Раз в неделю смотрите проект недели</b> (дни 7, 14, 21) и хвалите конкретное: цвет, идею, аккуратный код.</li><li><b>Безопасность в интернете.</b> Если сайт будет опубликован (день 28), не размещайте на нём адрес, телефон, школу, фото лица и настоящую фамилию без договорённости. Выберите сервис вместе, прочитайте условия и возрастные ограничения.</li><li><b>Код сохраняется в этом браузере.</b> Не очищайте данные сайта и не меняйте браузер, пока курс не закончен; в день 28 можно скачать файлы.</li></ul>","de":"<p>Du musst nicht programmieren können. Deine Rolle: helfen, jeden Tag 45 ruhige Minuten zu finden, und nach dem Ergebnis fragen.</p><ul><li><b>Rhythmus ist wichtiger als Tempo.</b> Besser jeden Tag 45 Minuten als 5 Stunden am Sonntag. Ein verpasster Tag ist nicht schlimm: einfach weitermachen.</li><li><b>Nicht für das Kind korrigieren.</b> Wenn etwas nicht funktioniert, frage: „Was zeigt die Prüfung? Was sagt der Code?“ Fehler gehören zum Lernen.</li><li><b>Lass es dir erklären.</b> Bitte den Jugendlichen, das Ergebnis zu zeigen und zu erklären, wie es funktioniert: So festigt sich das Verständnis.</li><li><b>Einmal pro Woche das Wochenprojekt ansehen</b> (Tage 7, 14, 21) und etwas Konkretes loben: Farbe, Idee, sauberen Code.</li><li><b>Sicherheit im Netz.</b> Wenn die Website veröffentlicht wird (Tag 28), gehören keine Adresse, Telefonnummer, Schule, kein Gesichtsfoto und kein echter Nachname ohne Absprache darauf. Wählt den Dienst gemeinsam aus und lest die Bedingungen und Altersgrenzen.</li><li><b>Der Code wird in diesem Browser gespeichert.</b> Lösche die Websitedaten nicht und wechsle den Browser nicht, bis der Kurs fertig ist; an Tag 28 kannst du die Dateien herunterladen.</li></ul>"},"resetAll":{"ru":"Начать курс заново","de":"Kurs von vorn beginnen"},"resetConfirm":{"ru":"Удалить весь прогресс и код? Это нельзя отменить.","de":"Gesamten Fortschritt und Code löschen? Das lässt sich nicht rückgängig machen."},"plan":{"ru":"План","de":"Plan"},"min":{"ru":"минут","de":"Minuten"},"goal":{"ru":"Цель","de":"Ziel"},"theory":{"ru":"Что нужно знать","de":"Das musst du wissen"},"lv1":{"ru":"Уровень 1 · Разминка","de":"Stufe 1 · Aufwärmen"},"lv2":{"ru":"Уровень 2 · Дополни","de":"Stufe 2 · Erweitern"},"lv3":{"ru":"★ Уровень 3 · Вызов (по желанию)","de":"★ Stufe 3 · Herausforderung (freiwillig)"},"task":{"ru":"Задание","de":"Aufgabe"},"quiz":{"ru":"Проверь себя","de":"Teste dich"},"checklist":{"ru":"Чек-лист","de":"Checkliste"},"hint":{"ru":"Подсказка","de":"Tipp"},"result":{"ru":"Результат","de":"Ergebnis"},"check":{"ru":"Проверить","de":"Prüfen"},"solution":{"ru":"Показать решение","de":"Lösung zeigen"},"reset":{"ru":"Сбросить","de":"Zurücksetzen"},"download":{"ru":"Скачать файлы","de":"Dateien herunterladen"},"requirements":{"ru":"Что должно получиться","de":"Das soll herauskommen"},"resetLesson":{"ru":"Вернуть код задания к началу? Твои изменения будут удалены.","de":"Code der Aufgabe auf den Anfang zurücksetzen? Deine Änderungen gehen verloren."},"nosol":{"ru":"Для этого задания нет готового решения: оно твоё.","de":"Für diese Aufgabe gibt es keine fertige Lösung: Sie gehört dir."},"solConfirm":{"ru":"Попробуй ещё раз сам(а) минут 10. Показать решение? Оно заменит твой код.","de":"Versuche es noch einmal selbst, etwa 10 Minuten. Lösung zeigen? Sie ersetzt deinen Code."},"dayDone":{"ru":"День пройден!","de":"Tag geschafft!"},"next":{"ru":"Следующий день","de":"Nächster Tag"},"codeOkRest":{"ru":"Код готов. Осталось ответить на вопросы или отметить пункты чек-листа.","de":"Der Code ist fertig. Beantworte noch die Fragen oder hake die Checkliste ab."},"notYet":{"ru":"Пока не всё. Посмотри на пункты с ✗, поправь код и нажми «Проверить» ещё раз. Если застрял, открой подсказку.","de":"Noch nicht alles. Schau dir die Punkte mit ✗ an, verbessere den Code und drücke wieder „Prüfen“. Wenn du feststeckst, öffne den Tipp."},"certText":{"ru":"Сертификат: успешно прошёл(а) курс «Сайт за месяц»","de":"Zertifikat: Kurs „Eine Website in einem Monat“ erfolgreich abgeschlossen"},"certSub":{"ru":"28 уроков HTML и CSS · свой сайт","de":"28 Lektionen HTML und CSS · eigene Website"},"yourName":{"ru":"Твоё имя","de":"Dein Name"},"printCert":{"ru":"Распечатать сертификат","de":"Zertifikat drucken"},"welcomeLink":{"ru":"👋 Приветствие","de":"👋 Begrüßung"},"welcomeEyebrow":{"ru":"Приветствие","de":"Begrüßung"},"welcomeTitle":{"ru":"Привет, Святослав!","de":"Hallo, Swjatoslaw!"},"welcome":{"ru":"<p class=\"lead\">Ты выбрал путь программиста — одно из самых перспективных направлений для будущей профессии. Программисты нужны везде: в медицине, на транспорте, в играх, в науке, в любом деле. Это решение твоё, а значит, и результат будет твоим.</p><h2>Зачем учиться, если есть ИИ?</h2><p>Сегодня много инструментов, которые создают сайты по запросу к искусственному интеллекту: написал пару строк — получил готовую страницу. Это здорово, и ты ещё будешь ими пользоваться. Но есть важное «но»:</p><ul><li><b>Не зная основ, ты не поймёшь, что получил.</b> Что в этом коде главное, а что лишнее, что можно менять, а что нельзя.</li><li><b>ИИ ошибается — и делает это очень часто,</b> иногда уверенно и убедительно. Заметить и исправить ошибку может только тот, кто умеет читать код.</li><li><b>Без базовых принципов программистом не стать.</b> Ты не сможешь объяснить ИИ, что именно нужно изменить, и будешь просто нажимать кнопки.</li></ul><p>Поэтому этот курс — про основы: HTML, CSS, умение читать код и проверять результат. ИИ станет твоим сильным помощником тогда, когда ты сам понимаешь, что он делает.</p><h2>Как проходит курс</h2><ol><li><b>Первое занятие открыто сразу.</b></li><li><b>Каждое следующее занятие закрыто кодом.</b> Код тебе даёт мама в конце дня — после того как ты выполнил все домашние обязанности. Введи код на странице занятия, и оно откроется.</li><li>Каждый день выполняй уровни 1 и 2. Если остались силы — попробуй ★ уровень 3.</li><li><b>Ты обязан отчитываться о результатах.</b> Нажми кнопку «Отправить результат проделанной работы»: сформируется PDF-документ. Отправь его маме, а мама передаст его Денису.</li></ol><p>Удачи! Первая строка кода уже ждёт тебя.</p>","de":"<p class=\"lead\">Du hast den Weg des Programmierers gewählt — eine der zukunftsträchtigsten Richtungen für den späteren Beruf. Programmierer werden überall gebraucht: in der Medizin, im Verkehr, in Spielen, in der Wissenschaft, in jedem Geschäft. Die Entscheidung ist deine, also wird auch das Ergebnis deins sein.</p><h2>Warum lernen, wenn es KI gibt?</h2><p>Heute gibt es viele Werkzeuge, die Websites auf Anfrage an eine künstliche Intelligenz erzeugen: ein paar Zeilen geschrieben — fertige Seite bekommen. Das ist toll, und du wirst sie noch benutzen. Aber es gibt ein wichtiges „Aber“:</p><ul><li><b>Ohne Grundlagen verstehst du nicht, was du bekommen hast.</b> Was in diesem Code wichtig ist und was überflüssig, was man ändern darf und was nicht.</li><li><b>KI macht Fehler — und zwar sehr oft,</b> manchmal ganz selbstsicher und überzeugend. Einen Fehler bemerken und beheben kann nur, wer Code lesen kann.</li><li><b>Ohne Grundprinzipien wird man kein Programmierer.</b> Du könntest der KI nicht erklären, was genau geändert werden soll, und würdest nur Knöpfe drücken.</li></ul><p>Darum geht es in diesem Kurs um die Grundlagen: HTML, CSS, Code lesen und Ergebnisse prüfen. KI wird dein starker Helfer, wenn du selbst verstehst, was sie tut.</p><h2>So läuft der Kurs</h2><ol><li><b>Die erste Lektion ist sofort offen.</b></li><li><b>Jede weitere Lektion ist mit einem Code gesperrt.</b> Den Code gibt dir Mama am Ende des Tages — nachdem du alle Pflichten im Haushalt erledigt hast. Gib den Code auf der Seite der Lektion ein, dann öffnet sie sich.</li><li>Mache jeden Tag die Stufen 1 und 2. Wenn noch Kraft übrig ist, probiere ★ Stufe 3.</li><li><b>Du musst über die Ergebnisse berichten.</b> Drücke den Knopf „Ergebnis der geleisteten Arbeit senden“: Es entsteht ein PDF-Dokument. Schicke es Mama, und Mama gibt es an Denis weiter.</li></ol><p>Viel Erfolg! Die erste Codezeile wartet schon auf dich.</p>"},"welcomeBtn":{"ru":"Начать: день 1 →","de":"Los geht’s: Tag 1 →"},"lockTitle":{"ru":"Занятие закрыто","de":"Lektion gesperrt"},"lockText":{"ru":"Код тебе даёт мама в конце дня — после того как ты выполнил все домашние обязанности.","de":"Den Code gibt dir Mama am Ende des Tages — nachdem du alle Pflichten im Haushalt erledigt hast."},"lockLabel":{"ru":"Введи код","de":"Code eingeben"},"lockOpen":{"ru":"Открыть занятие","de":"Lektion öffnen"},"lockBad":{"ru":"Код не подошёл. Проверь буквы и цифры и попробуй ещё раз.","de":"Der Code passt nicht. Prüfe Buchstaben und Zahlen und versuche es noch einmal."},"lockNoCrypto":{"ru":"Браузер не может проверить код на этой странице. Открой курс по адресу https://blieplab.github.io/kurs/","de":"Der Browser kann den Code auf dieser Seite nicht prüfen. Öffne den Kurs unter https://blieplab.github.io/kurs/"},"reportBtn":{"ru":"📤 Отправить результат проделанной работы","de":"📤 Ergebnis der geleisteten Arbeit senden"},"repBox":{"ru":"Отчёт о проделанной работе","de":"Bericht über die geleistete Arbeit"},"repHint":{"ru":"Нажми кнопку: откроется окно печати. Выбери «Сохранить как PDF», сохрани файл и отправь его маме. Мама передаст его Денису.","de":"Drücke den Knopf: Das Druckfenster öffnet sich. Wähle „Als PDF speichern“, speichere die Datei und schicke sie Mama. Mama gibt sie an Denis weiter."},"repName":{"ru":"Имя","de":"Name"},"repGood":{"ru":"Что получилось сегодня","de":"Was heute gut geklappt hat"},"repHard":{"ru":"Что было трудно","de":"Was schwierig war"},"repAsk":{"ru":"Вопрос к Денису","de":"Frage an Denis"},"repTitle":{"ru":"Отчёт о ходе курса «Сайт за месяц»","de":"Bericht zum Kurs „Eine Website in einem Monat“"},"repStudent":{"ru":"Ученик","de":"Schüler"},"repDate":{"ru":"Дата","de":"Datum"},"repSum":{"ru":"Пройдено дней","de":"Abgeschlossene Tage"},"repOpen":{"ru":"Открыто занятий","de":"Freigeschaltete Lektionen"},"repL2":{"ru":"Уровень 2 выполнен","de":"Stufe 2 erfüllt"},"repL3":{"ru":"★ Уровень 3 выполнен","de":"★ Stufe 3 erfüllt"},"repColDay":{"ru":"День","de":"Tag"},"repColTitle":{"ru":"Тема","de":"Thema"},"repColSt":{"ru":"Статус","de":"Status"},"repColL1":{"ru":"Ур. 1","de":"St. 1"},"repColL2":{"ru":"Ур. 2","de":"St. 2"},"repColL3":{"ru":"★ Ур. 3","de":"★ St. 3"},"repColQ":{"ru":"Вопросы","de":"Fragen"},"repColD":{"ru":"Пройден","de":"Abgeschlossen"},"stDone":{"ru":"✔ пройден","de":"✔ geschafft"},"stWork":{"ru":"в работе","de":"in Arbeit"},"stLock":{"ru":"закрыт","de":"gesperrt"},"stNew":{"ru":"открыт","de":"offen"},"repCode":{"ru":"Последняя работа: день","de":"Letzte Arbeit: Tag"},"repNotes":{"ru":"Заметки ученика","de":"Notizen des Schülers"},"repFlow":{"ru":"Как отправить: сохранить PDF → отправить маме → мама передаёт Денису.","de":"So geht es weiter: PDF speichern → an Mama schicken → Mama gibt es an Denis weiter."},"repNone":{"ru":"(пусто)","de":"(leer)"}},"weeks":[{"title":{"ru":"Каркас: HTML","de":"Gerüst: HTML"},"sub":{"ru":"Теги, текст, списки, ссылки, картинки и скелет страницы.","de":"Tags, Text, Listen, Links, Bilder und das Gerüst einer Seite."}},{"title":{"ru":"Внешний вид: CSS","de":"Aussehen: CSS"},"sub":{"ru":"Селекторы, шрифты, коробочная модель, цвета и отдельный файл стилей.","de":"Selektoren, Schrift, Box-Modell, Farben und eine eigene Stil-Datei."}},{"title":{"ru":"Макет и аккуратность","de":"Layout und Sauberkeit"},"sub":{"ru":"Инструменты разработчика, flexbox, наведение, адаптивность.","de":"Entwicklerwerkzeuge, Flexbox, Hover, Responsive Design."}},{"title":{"ru":"Свой сайт","de":"Eigene Website"},"sub":{"ru":"Чуть-чуть JavaScript, формы, план, сборка, шлифовка и публикация.","de":"Ein bisschen JavaScript, Formulare, Plan, Bau, Feinschliff und Veröffentlichung."}}],"lessons":[{"day":1,"week":1,"title":{"ru":"Что такое сайт и как он устроен","de":"Was ist eine Website und wie funktioniert sie?"},"goal":{"ru":"Понять, что сайт — это текстовые файлы, и написать первые строки HTML.","de":"Verstehen, dass eine Website aus Textdateien besteht, und die ersten HTML-Zeilen schreiben."},"theory":{"ru":"<p>Когда ты открываешь сайт, браузер (Chrome, Firefox, Safari) просит у <b>сервера</b> файлы и показывает их. Файлы — обычный текст, который люди написали на трёх языках:</p><ul><li><b>HTML</b> — каркас и смысл: что здесь заголовок, что абзац, что ссылка.</li><li><b>CSS</b> — внешний вид: цвета, шрифты, отступы.</li><li><b>JavaScript</b> — поведение: что происходит, когда нажимаешь кнопку.</li></ul><p>Сравни с домом: HTML — стены и комнаты, CSS — краска и мебель, JavaScript — электричество и выключатели.</p><p>Любой сайт можно «подсмотреть». Открой другую вкладку с простым сайтом, например <code>example.com</code> (на этой странице не пробуй: здесь код очень длинный). Дальше любой из способов:</p><ul><li><b>Правая кнопка мыши</b> на пустом месте страницы → «Просмотр кода страницы» (Chrome, Edge, Firefox) или «Показать исходный код» (Safari).</li><li><b>Chrome / Edge / Firefox:</b> <code>Ctrl+U</code>, на Mac в Chrome <code>Cmd+Option+U</code>, в Firefox <code>Cmd+U</code>.</li><li><b>Адресная строка</b> (Chrome, Edge, Firefox): допиши <code>view-source:</code> перед адресом, например <code>view-source:https://example.com</code>.</li><li><b>Safari:</b> сначала включи меню «Разработка»: Safari → Настройки → Дополнения → «Показывать меню Разработка». Потом <code>Cmd+Option+U</code>.</li></ul><p>Откроется страница с текстом кода. Найди в нём <code>&lt;h1&gt;</code>: это тот же заголовок, который ты видишь на сайте.</p><p>Вот самая первая страница. Тег <code>&lt;h1&gt;</code> — главный заголовок, <code>&lt;p&gt;</code> — абзац:</p><pre class=\"ex\" data-l=\"html\">&lt;h1&gt;Привет, мир!&lt;/h1&gt;\n&lt;p&gt;Это моя первая страница.&lt;/p&gt;</pre>","de":"<p>Wenn du eine Website öffnest, bittet der Browser (Chrome, Firefox, Safari) einen <b>Server</b> um Dateien und zeigt sie an. Die Dateien sind einfacher Text, den Menschen in drei Sprachen geschrieben haben:</p><ul><li><b>HTML</b> — Gerüst und Bedeutung: Was ist hier eine Überschrift, was ein Absatz, was ein Link.</li><li><b>CSS</b> — Aussehen: Farben, Schriften, Abstände.</li><li><b>JavaScript</b> — Verhalten: Was passiert, wenn man auf einen Knopf drückt.</li></ul><p>Vergleiche es mit einem Haus: HTML sind Wände und Zimmer, CSS Farbe und Möbel, JavaScript Strom und Schalter.</p><p>Jede Website kann man „ansehen“. Öffne in einem anderen Tab eine einfache Seite, zum Beispiel <code>example.com</code> (auf dieser Seite nicht: Hier ist der Code sehr lang). Dann geht einer dieser Wege:</p><ul><li><b>Rechtsklick</b> auf eine leere Stelle der Seite → „Seitenquelltext anzeigen“ (Chrome, Edge, Firefox) oder „Seitenquelltext einblenden“ (Safari).</li><li><b>Chrome / Edge / Firefox:</b> <code>Strg+U</code>, am Mac in Chrome <code>Cmd+Option+U</code>, in Firefox <code>Cmd+U</code>.</li><li><b>Adressleiste</b> (Chrome, Edge, Firefox): Setze <code>view-source:</code> vor die Adresse, zum Beispiel <code>view-source:https://example.com</code>.</li><li><b>Safari:</b> Schalte zuerst das Menü „Entwickler“ ein: Safari → Einstellungen → Erweitert → „Menü ‚Entwickler‘ in der Menüleiste anzeigen“. Dann <code>Cmd+Option+U</code>.</li></ul><p>Es öffnet sich eine Seite mit dem Code als Text. Suche darin <code>&lt;h1&gt;</code>: Das ist dieselbe Überschrift, die du auf der Website siehst.</p><p>Hier ist die allererste Seite. Der Tag <code>&lt;h1&gt;</code> ist die Hauptüberschrift, <code>&lt;p&gt;</code> ein Absatz:</p><pre class=\"ex\" data-l=\"html\">&lt;h1&gt;Hallo, Welt!&lt;/h1&gt;\n&lt;p&gt;Das ist meine erste Seite.&lt;/p&gt;</pre>"},"task":{"ru":"<ol><li>Измени текст в <code>&lt;h1&gt;</code>: пусть там будет твоё имя.</li><li>Добавь под ним ещё один абзац <code>&lt;p&gt;…&lt;/p&gt;</code> о том, что тебе нравится.</li><li>Нажми «Проверить».</li></ol>","de":"<ol><li>Ändere den Text in <code>&lt;h1&gt;</code>: Dort soll dein Name stehen.</li><li>Füge darunter einen weiteren Absatz <code>&lt;p&gt;…&lt;/p&gt;</code> hinzu, über etwas, das dir gefällt.</li><li>Drücke „Prüfen“.</li></ol>"},"files":{"index.html":{"ru":"<h1>Привет, мир!</h1>\n<p>Это моя первая страница.</p>\n","de":"<h1>Hallo, Welt!</h1>\n<p>Das ist meine erste Seite.</p>\n"}},"checks":[{"t":"has","m":{"ru":"Есть заголовок <code>&lt;h1&gt;</code>","de":"Es gibt eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"text","m":{"ru":"Текст заголовка изменён (там твоё имя)","de":"Der Überschrifttext ist geändert (dein Name steht dort)"},"s":"h1","r":"^(?!Привет, мир!$|Hallo, Welt!$).+","w":null},{"t":"count","m":{"ru":"Есть минимум два абзаца <code>&lt;p&gt;</code>","de":"Es gibt mindestens zwei Absätze <code>&lt;p&gt;</code>"},"s":"p","n":2,"w":null},{"t":"count","m":{"ru":"Не меньше четырёх абзацев <code>&lt;p&gt;</code>","de":"Mindestens vier Absätze <code>&lt;p&gt;</code>"},"s":"p","n":4,"w":null,"lv":2},{"t":"text","m":{"ru":"Один абзац — целое предложение (больше 40 символов)","de":"Ein Absatz ist ein ganzer Satz (mehr als 40 Zeichen)"},"s":"p","r":".{41,}","w":null,"lv":2},{"t":"count","m":{"ru":"Три заголовка уровней <code>h2</code>–<code>h6</code>","de":"Drei Überschriften der Stufen <code>h2</code>–<code>h6</code>"},"s":"h2,h3,h4,h5,h6","n":3,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть самый маленький заголовок <code>&lt;h6&gt;</code>","de":"Es gibt die kleinste Überschrift <code>&lt;h6&gt;</code>"},"s":"h6","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<h1>Аня</h1>\n<p>Это моя первая страница.</p>\n<p>Мне нравится рисовать и слушать музыку.</p>\n<p>Моё любимое блюдо — пельмени.</p>\n<p>Я хочу научиться делать сайты, чтобы показывать свои рисунки.</p>\n<h2>Мои планы</h2>\n<h3>На эту неделю</h3>\n<h6>Самый маленький заголовок</h6>\n","de":"<h1>Anna</h1>\n<p>Das ist meine erste Seite.</p>\n<p>Ich zeichne gern und höre Musik.</p>\n<p>Mein Lieblingsessen sind Maultaschen.</p>\n<p>Ich möchte Websites bauen lernen, um meine Zeichnungen zu zeigen.</p>\n<h2>Meine Pläne</h2>\n<h3>Für diese Woche</h3>\n<h6>Die kleinste Überschrift</h6>\n"}},"hint":{"ru":"<p>Теги пишутся парами: открывающий <code>&lt;p&gt;</code> и закрывающий <code>&lt;/p&gt;</code> (со слэшем). Текст — между ними. Новый абзац — новая пара тегов на новой строке.</p>","de":"<p>Tags werden paarweise geschrieben: öffnend <code>&lt;p&gt;</code> und schließend <code>&lt;/p&gt;</code> (mit Schrägstrich). Der Text steht dazwischen. Ein neuer Absatz ist ein neues Tag-Paar in einer neuen Zeile.</p>"},"quiz":[{"q":{"ru":"Какой язык отвечает за внешний вид страницы (цвета, шрифты)?","de":"Welche Sprache ist für das Aussehen der Seite zuständig (Farben, Schriften)?"},"o":[{"ru":"HTML","de":"HTML"},{"ru":"CSS","de":"CSS"},{"ru":"JavaScript","de":"JavaScript"}],"a":1},{"q":{"ru":"Что делает браузер, когда ты открываешь сайт?","de":"Was macht der Browser, wenn du eine Website öffnest?"},"o":[{"ru":"Просит у сервера файлы и показывает их","de":"Er bittet einen Server um Dateien und zeigt sie an"},{"ru":"Рисует страницу сам, без файлов","de":"Er zeichnet die Seite selbst, ohne Dateien"},{"ru":"Скачивает сайт и удаляет его с сервера","de":"Er lädt die Website herunter und löscht sie vom Server"}],"a":0}],"lv2":{"ru":"<p>Теперь страница о тебе должна стать настоящей. Допиши в тот же код:</p><ol><li>Ещё два абзаца: про любимую еду и про то, чему ты хочешь научиться.</li><li>Хотя бы один абзац должен быть целым предложением длиннее 40 символов (не просто пара слов).</li><li>Нажми «Проверить» и посмотри на галочки.</li></ol><p>Совет: после каждого нового абзаца нажимай <code>Ctrl+Enter</code> и смотри на результат справа. Так ошибки видно сразу, пока они маленькие.</p>","de":"<p>Jetzt soll die Seite über dich richtig echt werden. Ergänze im selben Code:</p><ol><li>Noch zwei Absätze: über dein Lieblingsessen und darüber, was du lernen möchtest.</li><li>Mindestens ein Absatz soll ein ganzer Satz mit mehr als 40 Zeichen sein (nicht nur ein paar Wörter).</li><li>Drücke „Prüfen“ und sieh dir die Häkchen an.</li></ol><p>Tipp: Drücke nach jedem neuen Absatz <code>Strg+Enter</code> und sieh dir rechts das Ergebnis an. So siehst du Fehler sofort, solange sie klein sind.</p>"},"lv3":{"ru":"<p>Исследование! Мы знаем <code>&lt;h1&gt;</code>, но есть ещё <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> … до <code>&lt;h6&gt;</code>. Попробуй их без объяснений:</p><ol><li>Добавь минимум три заголовка разных уровней (от <code>h2</code> до <code>h6</code>).</li><li>Посмотри, как меняется размер. Какой самый большой? Какой самый маленький?</li><li>Эксперимент: удали закрывающий <code>&lt;/p&gt;</code> у одного абзаца. Что произошло? Верни тег обратно.</li></ol><p>Так программисты и учатся: меняют что-то маленькое и смотрят, что сломалось.</p>","de":"<p>Entdeckungsreise! Wir kennen <code>&lt;h1&gt;</code>, aber es gibt auch <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> … bis <code>&lt;h6&gt;</code>. Probiere sie ohne Erklärung aus:</p><ol><li>Füge mindestens drei Überschriften unterschiedlicher Stufen hinzu (von <code>h2</code> bis <code>h6</code>).</li><li>Sieh dir an, wie sich die Größe ändert. Welche ist die größte? Welche die kleinste?</li><li>Experiment: Lösche das schließende <code>&lt;/p&gt;</code> bei einem Absatz. Was ist passiert? Setze das Tag wieder ein.</li></ol><p>So lernen auch Programmierer: Sie ändern etwas Kleines und schauen, was kaputtgeht.</p>"}},{"day":2,"week":1,"title":{"ru":"Теги, элементы и заголовки","de":"Tags, Elemente und Überschriften"},"goal":{"ru":"Понимать, из чего состоит элемент, и строить структуру из заголовков и абзацев.","de":"Verstehen, woraus ein Element besteht, und eine Struktur aus Überschriften und Absätzen bauen."},"theory":{"ru":"<p><b>Элемент</b> = открывающий тег + содержимое + закрывающий тег:</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Это абзац&lt;/p&gt;\n&lt;!--  ↑ открывающий  ↑ содержимое  ↑ закрывающий --&gt;</pre><ul><li>Заголовки: <code>&lt;h1&gt;</code> самый важный (на странице он один), затем <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> и так до <code>&lt;h6&gt;</code>. Они как главы книги.</li><li>Абзац: <code>&lt;p&gt;</code>. Браузер сам делает отступы между абзацами.</li><li><code>&lt;hr&gt;</code> — горизонтальная линия, <code>&lt;br&gt;</code> — перенос строки. Они «пустые» и закрывающего тега не имеют.</li><li><b>Комментарий</b> <code>&lt;!-- … --&gt;</code> виден только в коде, браузер его пропускает. Удобно оставлять заметки себе.</li></ul><p>Элементы можно вкладывать друг в друга, но закрывать нужно в обратном порядке, как матрёшки.</p>","de":"<p>Ein <b>Element</b> = öffnendes Tag + Inhalt + schließendes Tag:</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Das ist ein Absatz&lt;/p&gt;\n&lt;!--  ↑ öffnend  ↑ Inhalt  ↑ schließend --&gt;</pre><ul><li>Überschriften: <code>&lt;h1&gt;</code> ist die wichtigste (es gibt nur eine pro Seite), dann <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> bis <code>&lt;h6&gt;</code>. Sie sind wie Buchkapitel.</li><li>Absatz: <code>&lt;p&gt;</code>. Der Browser macht die Abstände zwischen Absätzen selbst.</li><li><code>&lt;hr&gt;</code> ist eine waagerechte Linie, <code>&lt;br&gt;</code> ein Zeilenumbruch. Sie sind „leer“ und haben kein schließendes Tag.</li><li>Ein <b>Kommentar</b> <code>&lt;!-- … --&gt;</code> ist nur im Code sichtbar, der Browser überspringt ihn. Praktisch für Notizen an dich selbst.</li></ul><p>Elemente kann man ineinander verschachteln, aber man muss sie in umgekehrter Reihenfolge schließen, wie Matroschkas.</p>"},"task":{"ru":"<p>Напиши страницу о своём увлечении (хобби, игра, спорт, музыка):</p><ol><li>Один заголовок <code>&lt;h1&gt;</code> с названием.</li><li>Два подзаголовка <code>&lt;h2&gt;</code> (например, «Почему мне это нравится» и «С чего начать»).</li><li>Под каждым подзаголовком — абзац <code>&lt;p&gt;</code> из 1–2 предложений.</li><li>Одна линия <code>&lt;hr&gt;</code> между разделами.</li></ol>","de":"<p>Schreibe eine Seite über dein Hobby (Spiel, Sport, Musik …):</p><ol><li>Eine Überschrift <code>&lt;h1&gt;</code> mit dem Titel.</li><li>Zwei Unterüberschriften <code>&lt;h2&gt;</code> (z. B. „Warum mir das gefällt“ und „Wie man anfängt“).</li><li>Unter jeder Unterüberschrift ein Absatz <code>&lt;p&gt;</code> mit 1–2 Sätzen.</li><li>Eine Linie <code>&lt;hr&gt;</code> zwischen den Abschnitten.</li></ol>"},"files":{"index.html":{"ru":"<!-- Напиши здесь свою страницу. Строки в такой рамке — комментарии, их не видно. -->\n","de":"<!-- Schreibe hier deine Seite. Zeilen in diesem Rahmen sind Kommentare, man sieht sie nicht. -->\n"}},"checks":[{"t":"count","m":{"ru":"Один заголовок <code>&lt;h1&gt;</code>","de":"Eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","n":1,"w":null},{"t":"nocode","m":{"ru":"Не больше одного <code>&lt;h1&gt;</code>","de":"Nicht mehr als ein <code>&lt;h1&gt;</code>"},"r":"<h1[^>]*>[\\s\\S]*<h1","f":null},{"t":"count","m":{"ru":"Минимум два подзаголовка <code>&lt;h2&gt;</code>","de":"Mindestens zwei Unterüberschriften <code>&lt;h2&gt;</code>"},"s":"h2","n":2,"w":null},{"t":"count","m":{"ru":"Минимум два абзаца <code>&lt;p&gt;</code>","de":"Mindestens zwei Absätze <code>&lt;p&gt;</code>"},"s":"p","n":2,"w":null},{"t":"has","m":{"ru":"Есть линия <code>&lt;hr&gt;</code>","de":"Es gibt eine Linie <code>&lt;hr&gt;</code>"},"s":"hr","w":null},{"t":"count","m":{"ru":"Минимум три подзаголовка <code>&lt;h2&gt;</code>","de":"Mindestens drei Unterüberschriften <code>&lt;h2&gt;</code>"},"s":"h2","n":3,"w":null,"lv":2},{"t":"count","m":{"ru":"Минимум две линии <code>&lt;hr&gt;</code>","de":"Mindestens zwei Linien <code>&lt;hr&gt;</code>"},"s":"hr","n":2,"w":null,"lv":2},{"t":"count","m":{"ru":"Строки стиха разделены тегами <code>&lt;br&gt;</code>","de":"Die Gedichtzeilen sind mit <code>&lt;br&gt;</code> getrennt"},"s":"br","n":2,"w":null,"lv":2},{"t":"code","m":{"ru":"Есть комментарий <code>&lt;!-- … --&gt;</code>","de":"Es gibt einen Kommentar <code>&lt;!-- … --&gt;</code>"},"r":"<!--[\\s\\S]*?-->","f":null,"lv":2},{"t":"count","m":{"ru":"Минимум три подраздела <code>&lt;h3&gt;</code>","de":"Mindestens drei Unterabschnitte <code>&lt;h3&gt;</code>"},"s":"h3","n":3,"w":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Минимум шесть абзацев","de":"Mindestens sechs Absätze"},"s":"p","n":6,"w":null,"lv":3,"opt":true},{"t":"nocode","m":{"ru":"Уровни заголовков не перепрыгнуты (нет <code>h4</code>–<code>h6</code>)","de":"Keine Überschriftenstufen übersprungen (kein <code>h4</code>–<code>h6</code>)"},"r":"<h4|<h5|<h6","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<h1>Скейтбординг</h1>\n<h2>Почему мне это нравится</h2>\n<h3>Свобода</h3>\n<p>Это свобода и каждый день новый трюк.</p>\n<hr>\n<h2>С чего начать</h2>\n<h3>Что купить</h3>\n<p>Нужны доска, шлем и терпение.</p>\n<h3>Где кататься</h3>\n<p>Лучше всего на ровной площадке во дворе.</p>\n<hr>\n<!-- здесь третий раздел -->\n<h2>Мой девиз</h2>\n<h3>Короткий стих</h3>\n<p>Упал — поднялся,<br>снова попробовал,<br>получилось!</p>\n<p>Этот девиз помогает не сдаваться.</p>\n<p>Я повторяю его каждый раз.</p>\n","de":"<h1>Skateboarden</h1>\n<h2>Warum es mir gefällt</h2>\n<h3>Freiheit</h3>\n<p>Es ist Freiheit und jeden Tag ein neuer Trick.</p>\n<hr>\n<h2>Wie man anfängt</h2>\n<h3>Was man kauft</h3>\n<p>Man braucht ein Board, einen Helm und Geduld.</p>\n<h3>Wo man fährt</h3>\n<p>Am besten auf einer ebenen Fläche im Hof.</p>\n<hr>\n<!-- hier der dritte Abschnitt -->\n<h2>Mein Motto</h2>\n<h3>Ein kurzes Gedicht</h3>\n<p>Hingefallen — aufgestanden,<br>nochmal probiert,<br>geschafft!</p>\n<p>Dieses Motto hilft mir, nicht aufzugeben.</p>\n<p>Ich sage es jedes Mal.</p>\n"}},"hint":{"ru":"<p>Не забывай закрывающие теги: <code>&lt;/h2&gt;</code>, <code>&lt;/p&gt;</code>. Заголовок <code>&lt;h1&gt;</code> только один, подзаголовков может быть сколько угодно.</p>","de":"<p>Vergiss die schließenden Tags nicht: <code>&lt;/h2&gt;</code>, <code>&lt;/p&gt;</code>. Es gibt nur ein <code>&lt;h1&gt;</code>, Unterüberschriften darf es beliebig viele geben.</p>"},"quiz":[{"q":{"ru":"Какой тег закрывает абзац?","de":"Welches Tag schließt einen Absatz?"},"o":[{"ru":"&lt;p/&gt;","de":"&lt;p/&gt;"},{"ru":"&lt;/p&gt;","de":"&lt;/p&gt;"},{"ru":"&lt;end p&gt;","de":"&lt;end p&gt;"}],"a":1}],"lv2":{"ru":"<p>Добавь в страницу третий раздел и научись пользоваться комментариями:</p><ol><li>Ещё один <code>&lt;h2&gt;</code> — например «Мой девиз» — и ещё одна линия <code>&lt;hr&gt;</code> перед ним.</li><li>В нём стихотворение или цитата в три строки в одном абзаце. Строки разделяй тегом <code>&lt;br&gt;</code>.</li><li>Перед разделом напиши комментарий <code>&lt;!-- здесь третий раздел --&gt;</code>. Комментарий браузер не показывает, он нужен людям, которые читают код.</li></ol>","de":"<p>Füge der Seite einen dritten Abschnitt hinzu und lerne Kommentare kennen:</p><ol><li>Noch ein <code>&lt;h2&gt;</code> — zum Beispiel „Mein Motto“ — und noch eine Linie <code>&lt;hr&gt;</code> davor.</li><li>Darin ein Gedicht oder Zitat mit drei Zeilen in einem Absatz. Trenne die Zeilen mit dem Tag <code>&lt;br&gt;</code>.</li><li>Schreibe vor den Abschnitt einen Kommentar <code>&lt;!-- hier der dritte Abschnitt --&gt;</code>. Den Kommentar zeigt der Browser nicht an, er ist für Menschen, die den Code lesen.</li></ol>"},"lv3":{"ru":"<p>Построй «оглавление книги» о чём угодно (игра, животное, город). Правила автора:</p><ol><li>Один <code>&lt;h1&gt;</code> — название книги.</li><li>Три главы <code>&lt;h2&gt;</code>. В каждой главе минимум один <code>&lt;h3&gt;</code>-подраздел и абзац под ним.</li><li>Всего не меньше шести абзацев. Следи, чтобы заголовки шли по порядку, без пропусков уровней: после <code>h1</code> не сразу <code>h4</code>.</li></ol><p>Идеальная структура похожа на дерево: ствол — <code>h1</code>, ветки — <code>h2</code>, веточки — <code>h3</code>.</p>","de":"<p>Baue das „Inhaltsverzeichnis eines Buchs“ zu einem beliebigen Thema (Spiel, Tier, Stadt). Regeln für den Autor:</p><ol><li>Ein <code>&lt;h1&gt;</code> — der Buchtitel.</li><li>Drei Kapitel <code>&lt;h2&gt;</code>. In jedem Kapitel mindestens einen <code>&lt;h3&gt;</code>-Unterabschnitt und darunter einen Absatz.</li><li>Insgesamt mindestens sechs Absätze. Achte darauf, dass die Überschriften der Reihe nach kommen, ohne Stufen zu überspringen: nach <code>h1</code> nicht gleich <code>h4</code>.</li></ol><p>Die ideale Struktur sieht aus wie ein Baum: Stamm — <code>h1</code>, Äste — <code>h2</code>, Zweige — <code>h3</code>.</p>"}},{"day":3,"week":1,"title":{"ru":"Текст: выделение и списки","de":"Text: Hervorhebung und Listen"},"goal":{"ru":"Выделять слова и делать маркированные и нумерованные списки.","de":"Wörter hervorheben und Aufzählungen sowie nummerierte Listen machen."},"theory":{"ru":"<ul><li><code>&lt;strong&gt;</code> — важное слово (жирный), <code>&lt;em&gt;</code> — акцент (курсив). Они несут смысл, а не только вид.</li><li><code>&lt;ul&gt;</code> — маркированный список, <code>&lt;ol&gt;</code> — нумерованный. Каждый пункт — <code>&lt;li&gt;</code>.</li></ul><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Хлеб&lt;/li&gt;\n  &lt;li&gt;Молоко&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;ol&gt;\n  &lt;li&gt;Открой редактор&lt;/li&gt;\n  &lt;li&gt;Напиши код&lt;/li&gt;\n&lt;/ol&gt;</pre><p>Обрати внимание: <code>&lt;li&gt;</code> стоит <b>внутри</b> <code>&lt;ul&gt;</code> или <code>&lt;ol&gt;</code>, а отступ (два пробела) помогает видеть вложенность.</p>","de":"<ul><li><code>&lt;strong&gt;</code> — wichtiges Wort (fett), <code>&lt;em&gt;</code> — Betonung (kursiv). Sie tragen Bedeutung, nicht nur Aussehen.</li><li><code>&lt;ul&gt;</code> — Aufzählung mit Punkten, <code>&lt;ol&gt;</code> — nummerierte Liste. Jeder Punkt ist ein <code>&lt;li&gt;</code>.</li></ul><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Brot&lt;/li&gt;\n  &lt;li&gt;Milch&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;ol&gt;\n  &lt;li&gt;Öffne den Editor&lt;/li&gt;\n  &lt;li&gt;Schreibe Code&lt;/li&gt;\n&lt;/ol&gt;</pre><p>Beachte: <code>&lt;li&gt;</code> steht <b>innerhalb</b> von <code>&lt;ul&gt;</code> oder <code>&lt;ol&gt;</code>, und die Einrückung (zwei Leerzeichen) hilft, die Verschachtelung zu sehen.</p>"},"task":{"ru":"<p>Сделай страницу «Рецепт бутерброда» (или любого блюда):</p><ol><li>Заголовок <code>&lt;h1&gt;</code>.</li><li>Маркированный список <code>&lt;ul&gt;</code> с тремя ингредиентами.</li><li>Нумерованный список <code>&lt;ol&gt;</code> с тремя шагами.</li><li>Одно слово сделай <code>&lt;strong&gt;</code>, одно — <code>&lt;em&gt;</code>.</li></ol>","de":"<p>Mache eine Seite „Rezept für ein Butterbrot“ (oder ein anderes Gericht):</p><ol><li>Eine Überschrift <code>&lt;h1&gt;</code>.</li><li>Eine Aufzählung <code>&lt;ul&gt;</code> mit drei Zutaten.</li><li>Eine nummerierte Liste <code>&lt;ol&gt;</code> mit drei Schritten.</li><li>Ein Wort als <code>&lt;strong&gt;</code>, ein Wort als <code>&lt;em&gt;</code>.</li></ol>"},"files":{"index.html":{"ru":"<h1>Рецепт</h1>\n<!-- Добавь списки ниже -->\n","de":"<h1>Rezept</h1>\n<!-- Füge unten die Listen hinzu -->\n"}},"checks":[{"t":"has","m":{"ru":"Есть заголовок <code>&lt;h1&gt;</code>","de":"Es gibt eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"count","m":{"ru":"Список <code>&lt;ul&gt;</code> минимум из 3 пунктов <code>&lt;li&gt;</code>","de":"Liste <code>&lt;ul&gt;</code> mit mindestens 3 Punkten <code>&lt;li&gt;</code>"},"s":"ul > li","n":3,"w":null},{"t":"count","m":{"ru":"Список <code>&lt;ol&gt;</code> минимум из 3 пунктов","de":"Liste <code>&lt;ol&gt;</code> mit mindestens 3 Punkten"},"s":"ol > li","n":3,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;strong&gt;</code>","de":"Es gibt <code>&lt;strong&gt;</code>"},"s":"strong","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;em&gt;</code>","de":"Es gibt <code>&lt;em&gt;</code>"},"s":"em","w":null},{"t":"has","m":{"ru":"Есть вложенный список (<code>ul</code> внутри <code>li</code>)","de":"Es gibt eine verschachtelte Liste (<code>ul</code> in <code>li</code>)"},"s":"ul li ul li","w":null,"lv":2},{"t":"count","m":{"ru":"В нумерованном списке минимум 5 шагов","de":"Die nummerierte Liste hat mindestens 5 Schritte"},"s":"ol li","n":5,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть выделение <code>&lt;mark&gt;</code>","de":"Es gibt eine Markierung <code>&lt;mark&gt;</code>"},"s":"mark","w":null,"lv":2},{"t":"has","m":{"ru":"Есть мелкий текст <code>&lt;small&gt;</code>","de":"Es gibt kleinen Text <code>&lt;small&gt;</code>"},"s":"small","w":null,"lv":2},{"t":"count","m":{"ru":"Три термина <code>&lt;dt&gt;</code>","de":"Drei Begriffe <code>&lt;dt&gt;</code>"},"s":"dt","n":3,"w":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Три пояснения <code>&lt;dd&gt;</code>","de":"Drei Erklärungen <code>&lt;dd&gt;</code>"},"s":"dd","n":3,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть цитата <code>&lt;blockquote&gt;</code>","de":"Es gibt ein Zitat <code>&lt;blockquote&gt;</code>"},"s":"blockquote","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть <code>&lt;del&gt;</code>","de":"Es gibt <code>&lt;del&gt;</code>"},"s":"del","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<h1>Рецепт бутерброда</h1>\n<h2>Ингредиенты</h2>\n<ul>\n  <li>Хлеб</li>\n  <li>Сыр\n    <ul>\n      <li>Твёрдый</li>\n      <li>Плавленый</li>\n    </ul>\n  </li>\n  <li>Помидор</li>\n</ul>\n<h2>Шаги</h2>\n<ol>\n  <li>Отрежь хлеб</li>\n  <li>Положи <strong>сыр</strong></li>\n  <li>Добавь <em>помидор</em></li>\n  <li>Накрой вторым куском</li>\n  <li>Разрежь пополам</li>\n</ol>\n<p><mark>Важно:</mark> нож — только со взрослыми. <small>готовить с родителями</small></p>\n<h2>Мой рейтинг</h2>\n<dl>\n  <dt>Сыр</dt><dd>Лучше всего плавленый</dd>\n  <dt>Хлеб</dt><dd>Свежий, с корочкой</dd>\n  <dt>Помидор</dt><dd>Спелый и сочный</dd>\n</dl>\n<blockquote>Вкусно — значит удалось.</blockquote>\n<p><del>скучно</del> <ins>интересно</ins></p>\n","de":"<h1>Rezept für ein Butterbrot</h1>\n<h2>Zutaten</h2>\n<ul>\n  <li>Brot</li>\n  <li>Käse\n    <ul>\n      <li>Hartkäse</li>\n      <li>Schmelzkäse</li>\n    </ul>\n  </li>\n  <li>Tomate</li>\n</ul>\n<h2>Schritte</h2>\n<ol>\n  <li>Schneide das Brot ab</li>\n  <li>Lege den <strong>Käse</strong> darauf</li>\n  <li>Füge die <em>Tomate</em> hinzu</li>\n  <li>Decke es mit der zweiten Scheibe zu</li>\n  <li>Schneide es in der Mitte durch</li>\n</ol>\n<p><mark>Wichtig:</mark> Messer nur mit Erwachsenen. <small>mit den Eltern kochen</small></p>\n<h2>Mein Ranking</h2>\n<dl>\n  <dt>Käse</dt><dd>Am besten Schmelzkäse</dd>\n  <dt>Brot</dt><dd>Frisch, mit Kruste</dd>\n  <dt>Tomate</dt><dd>Reif und saftig</dd>\n</dl>\n<blockquote>Lecker heißt: gelungen.</blockquote>\n<p><del>langweilig</del> <ins>spannend</ins></p>\n"}},"hint":{"ru":"<p>Структура: <code>&lt;ul&gt;</code>, внутри него три <code>&lt;li&gt;…&lt;/li&gt;</code>, потом <code>&lt;/ul&gt;</code>.</p>","de":"<p>Aufbau: <code>&lt;ul&gt;</code>, darin drei <code>&lt;li&gt;…&lt;/li&gt;</code>, dann <code>&lt;/ul&gt;</code>.</p>"},"quiz":[{"q":{"ru":"Где должен стоять тег &lt;li&gt;?","de":"Wo muss das Tag &lt;li&gt; stehen?"},"o":[{"ru":"Внутри &lt;ul&gt; или &lt;ol&gt;","de":"Innerhalb von &lt;ul&gt; oder &lt;ol&gt;"},{"ru":"Где угодно","de":"Irgendwo"},{"ru":"Только в заголовке","de":"Nur in einer Überschrift"}],"a":0}],"lv2":{"ru":"<p>Рецепту нужен порядок. Добавь:</p><ol><li>Вложенный список: внутри одного пункта <code>&lt;li&gt;</code> положи ещё один <code>&lt;ul&gt;</code> с двумя подпунктами (например, у «Сыра» — «Твёрдый» и «Плавленый»).</li><li>Ещё два шага в нумерованный список — всего минимум 5.</li><li>Один абзац с пометкой: слово <code>&lt;mark&gt;</code> подсветит важное, а <code>&lt;small&gt;</code> напишет мелким шрифтом, например «готовить с родителями».</li></ol><p>Вложенный список выглядит так:</p><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Сыр\n    &lt;ul&gt;\n      &lt;li&gt;Твёрдый&lt;/li&gt;\n      &lt;li&gt;Плавленый&lt;/li&gt;\n    &lt;/ul&gt;\n  &lt;/li&gt;\n&lt;/ul&gt;</pre>","de":"<p>Ein Rezept braucht Ordnung. Ergänze:</p><ol><li>Eine verschachtelte Liste: Lege in einen Punkt <code>&lt;li&gt;</code> noch ein <code>&lt;ul&gt;</code> mit zwei Unterpunkten (zum Beispiel bei „Käse“ — „Hartkäse“ und „Schmelzkäse“).</li><li>Noch zwei Schritte in der nummerierten Liste — insgesamt mindestens 5.</li><li>Ein Absatz mit Markierung: Das Wort <code>&lt;mark&gt;</code> hebt Wichtiges hervor, <code>&lt;small&gt;</code> schreibt klein, zum Beispiel „mit den Eltern kochen“.</li></ol><p>Eine verschachtelte Liste sieht so aus:</p><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Käse\n    &lt;ul&gt;\n      &lt;li&gt;Hartkäse&lt;/li&gt;\n      &lt;li&gt;Schmelzkäse&lt;/li&gt;\n    &lt;/ul&gt;\n  &lt;/li&gt;\n&lt;/ul&gt;</pre>"},"lv3":{"ru":"<p>Теперь придумай свой «рейтинг» — любимые игры, фильмы или места. Сделай страницу, где:</p><ol><li>Есть список-описание <code>&lt;dl&gt;</code> с тремя парами: <code>&lt;dt&gt;</code> — название, <code>&lt;dd&gt;</code> — пояснение. Это тоже тег для списков, но для «термин — определение».</li><li>Есть цитата <code>&lt;blockquote&gt;</code> с любимой фразой.</li><li>Есть <code>&lt;del&gt;</code> (зачёркнутое) и <code>&lt;ins&gt;</code> (добавленное): «<del>скучно</del> <ins>интересно</ins>».</li></ol><p>Подсказка: в справочнике MDN (<code>developer.mozilla.org</code>) у каждого тега есть пример. Найди там <code>dl</code> и скопируй идею.</p>","de":"<p>Jetzt erfinde dein eigenes „Ranking“ — Lieblingsspiele, Filme oder Orte. Baue eine Seite, auf der:</p><ol><li>Es eine Beschreibungsliste <code>&lt;dl&gt;</code> mit drei Paaren gibt: <code>&lt;dt&gt;</code> — Name, <code>&lt;dd&gt;</code> — Erklärung. Das ist auch ein Listen-Tag, aber für „Begriff — Erklärung“.</li><li>Es ein Zitat <code>&lt;blockquote&gt;</code> mit einem Lieblingssatz gibt.</li><li>Es <code>&lt;del&gt;</code> (durchgestrichen) und <code>&lt;ins&gt;</code> (hinzugefügt) gibt: „<del>langweilig</del> <ins>spannend</ins>“.</li></ol><p>Tipp: Im Nachschlagewerk MDN (<code>developer.mozilla.org</code>) hat jedes Tag ein Beispiel. Suche dort <code>dl</code> und übernimm die Idee.</p>"}},{"day":4,"week":1,"title":{"ru":"Ссылки","de":"Links"},"goal":{"ru":"Делать ссылки на другие сайты и страницы и понимать атрибуты.","de":"Links zu anderen Websites und Seiten machen und Attribute verstehen."},"theory":{"ru":"<p>Ссылка — элемент <code>&lt;a&gt;</code> (anchor, «якорь»). Адрес лежит в <b>атрибуте</b> <code>href</code>:</p><pre class=\"ex\" data-l=\"html\">&lt;a href=\"https://wikipedia.org\"&gt;Википедия&lt;/a&gt;</pre><p><b>Атрибут</b> — дополнительная информация внутри открывающего тега: <code>имя=\"значение\"</code>. Значение всегда в кавычках.</p><ul><li><code>target=\"_blank\"</code> — открыть в новой вкладке (добавь рядом <code>rel=\"noopener\"</code> для безопасности).</li><li>Ссылка на другую страницу своего сайта: <code>&lt;a href=\"kontakt.html\"&gt;</code> (без https), это «относительный» адрес.</li><li>Ссылка на почту: <code>&lt;a href=\"mailto:name@example.com\"&gt;</code>.</li></ul>","de":"<p>Ein Link ist das Element <code>&lt;a&gt;</code> (Anker). Die Adresse steht im <b>Attribut</b> <code>href</code>:</p><pre class=\"ex\" data-l=\"html\">&lt;a href=\"https://wikipedia.org\"&gt;Wikipedia&lt;/a&gt;</pre><p>Ein <b>Attribut</b> ist zusätzliche Information im öffnenden Tag: <code>name=\"wert\"</code>. Der Wert steht immer in Anführungszeichen.</p><ul><li><code>target=\"_blank\"</code> — in neuem Tab öffnen (setze zur Sicherheit <code>rel=\"noopener\"</code> dazu).</li><li>Link auf eine andere Seite deiner Website: <code>&lt;a href=\"kontakt.html\"&gt;</code> (ohne https), das ist eine „relative“ Adresse.</li><li>Link zu einer E-Mail: <code>&lt;a href=\"mailto:name@example.com\"&gt;</code>.</li></ul>"},"task":{"ru":"<ol><li>Добавь ссылку на сайт, который тебе нравится: <code>href</code> начинается с <code>https://</code>.</li><li>Пусть она открывается в новой вкладке (<code>target=\"_blank\"</code>).</li><li>Добавь вторую ссылку на другую страницу: <code>href=\"kontakt.html\"</code> с текстом «Контакты».</li></ol>","de":"<ol><li>Füge einen Link zu einer Website hinzu, die dir gefällt: <code>href</code> beginnt mit <code>https://</code>.</li><li>Er soll sich in einem neuen Tab öffnen (<code>target=\"_blank\"</code>).</li><li>Füge einen zweiten Link zu einer anderen Seite hinzu: <code>href=\"kontakt.html\"</code> mit dem Text „Kontakt“.</li></ol>"},"files":{"index.html":{"ru":"<h1>Мои ссылки</h1>\n<p>Здесь будут мои любимые места в интернете.</p>\n","de":"<h1>Meine Links</h1>\n<p>Hier kommen meine liebsten Orte im Internet hin.</p>\n"}},"checks":[{"t":"attr","m":{"ru":"Есть ссылка с адресом <code>https://…</code>","de":"Es gibt einen Link mit Adresse <code>https://…</code>"},"s":"a","a":"href","r":"^https?://","w":null},{"t":"attr","m":{"ru":"Одна ссылка открывается в новой вкладке","de":"Ein Link öffnet sich in einem neuen Tab"},"s":"a","a":"target","r":"^_blank$","w":null},{"t":"attr","m":{"ru":"Есть ссылка на <code>kontakt.html</code>","de":"Es gibt einen Link auf <code>kontakt.html</code>"},"s":"a","a":"href","r":"^kontakt\\.html$","w":null},{"t":"text","m":{"ru":"У ссылки есть текст между тегами","de":"Der Link hat Text zwischen den Tags"},"s":"a","r":".+","w":null},{"t":"attr","m":{"ru":"Есть ссылка-письмо <code>mailto:</code>","de":"Es gibt einen Mail-Link <code>mailto:</code>"},"s":"a","a":"href","r":"^mailto:.+@","w":null,"lv":2},{"t":"attr","m":{"ru":"У ссылки есть подсказка <code>title</code>","de":"Ein Link hat einen Hilfetext <code>title</code>"},"s":"a","a":"title","r":".{3,}","w":null,"lv":2},{"t":"attr","m":{"ru":"Есть ссылка <code>#bottom</code>","de":"Es gibt einen Link <code>#bottom</code>"},"s":"a","a":"href","r":"^#bottom$","w":null,"lv":2},{"t":"has","m":{"ru":"Есть элемент с <code>id=\"bottom\"</code>","de":"Es gibt ein Element mit <code>id=\"bottom\"</code>"},"s":"#bottom","w":null,"lv":2},{"t":"count","m":{"ru":"Оглавление: три ссылки внутри списка","de":"Inhaltsverzeichnis: drei Links in der Liste"},"s":"ul li a[href^=\"#\"]","n":3,"w":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Три раздела <code>&lt;h2&gt;</code> с <code>id</code>","de":"Drei Abschnitte <code>&lt;h2&gt;</code> mit <code>id</code>"},"s":"h2[id]","n":3,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть элемент с <code>id=\"top\"</code>","de":"Es gibt ein Element mit <code>id=\"top\"</code>"},"s":"#top","w":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Три ссылки «Наверх» на <code>#top</code>","de":"Drei Links „Nach oben“ zu <code>#top</code>"},"s":"a[href=\"#top\"]","n":3,"w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<h1 id=\"top\">Мои ссылки</h1>\n<p>Здесь будут мои любимые места в интернете.</p>\n<p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\" title=\"Свободная энциклопедия\">Википедия</a></p>\n<p><a href=\"kontakt.html\">Контакты</a></p>\n<p><a href=\"mailto:anya@example.com\">Напиши мне</a></p>\n<p><a href=\"#bottom\">Вниз</a></p>\n<h2>Оглавление</h2>\n<ul>\n  <li><a href=\"#music\">Музыка</a></li>\n  <li><a href=\"#games\">Игры</a></li>\n  <li><a href=\"#sport\">Спорт</a></li>\n</ul>\n<h2 id=\"music\">Музыка</h2>\n<p>Слушаю всё подряд.</p>\n<p><a href=\"#top\">↑ Наверх</a></p>\n<h2 id=\"games\">Игры</h2>\n<p>Люблю головоломки.</p>\n<p><a href=\"#top\">↑ Наверх</a></p>\n<h2 id=\"sport\">Спорт</h2>\n<p>Катаюсь на велосипеде.</p>\n<p><a href=\"#top\">↑ Наверх</a></p>\n<h2 id=\"bottom\">Конец</h2>\n","de":"<h1 id=\"top\">Meine Links</h1>\n<p>Hier kommen meine liebsten Orte im Internet hin.</p>\n<p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\" title=\"Die freie Enzyklopädie\">Wikipedia</a></p>\n<p><a href=\"kontakt.html\">Kontakt</a></p>\n<p><a href=\"mailto:anna@example.com\">Schreib mir</a></p>\n<p><a href=\"#bottom\">Nach unten</a></p>\n<h2>Inhalt</h2>\n<ul>\n  <li><a href=\"#music\">Musik</a></li>\n  <li><a href=\"#games\">Spiele</a></li>\n  <li><a href=\"#sport\">Sport</a></li>\n</ul>\n<h2 id=\"music\">Musik</h2>\n<p>Ich höre alles Mögliche.</p>\n<p><a href=\"#top\">↑ Nach oben</a></p>\n<h2 id=\"games\">Spiele</h2>\n<p>Ich mag Knobelspiele.</p>\n<p><a href=\"#top\">↑ Nach oben</a></p>\n<h2 id=\"sport\">Sport</h2>\n<p>Ich fahre Fahrrad.</p>\n<p><a href=\"#top\">↑ Nach oben</a></p>\n<h2 id=\"bottom\">Ende</h2>\n"}},"hint":{"ru":"<p>Текст ссылки стоит между <code>&lt;a …&gt;</code> и <code>&lt;/a&gt;</code>. Если нажмёшь на «Контакты» в результате, откроется пустая страница: такой файл мы ещё не создали, это нормально.</p>","de":"<p>Der Linktext steht zwischen <code>&lt;a …&gt;</code> und <code>&lt;/a&gt;</code>. Wenn du im Ergebnis auf „Kontakt“ klickst, öffnet sich eine leere Seite: Diese Datei haben wir noch nicht erstellt, das ist normal.</p>"},"quiz":[{"q":{"ru":"Где в ссылке лежит адрес?","de":"Wo liegt in einem Link die Adresse?"},"o":[{"ru":"В атрибуте href","de":"Im Attribut href"},{"ru":"В тексте между тегами","de":"Im Text zwischen den Tags"},{"ru":"В теге &lt;link&gt;","de":"Im Tag &lt;link&gt;"}],"a":0}],"lv2":{"ru":"<p>Научимся делать ссылки умнее:</p><ol><li>Ссылка-письмо: <code>&lt;a href=\"mailto:anya@example.com\"&gt;Напиши мне&lt;/a&gt;</code>. Клик по ней откроет почтовую программу.</li><li>Всплывающая подсказка: добавь одной ссылке атрибут <code>title=\"…\"</code> (минимум 3 символа). Он показывается, когда наводишь курсор.</li><li>Ссылка внутри страницы: поставь в самом конце страницы заголовок <code>&lt;h2 id=\"bottom\"&gt;Конец&lt;/h2&gt;</code> и сделай вверху ссылку <code>&lt;a href=\"#bottom\"&gt;Вниз&lt;/a&gt;</code>. Значок <code>#</code> означает «к элементу с таким id на этой же странице».</li></ol><p>Чтобы страница была достаточно длинной и ссылка «Вниз» было видно, добавь между ссылкой и концом несколько абзацев.</p>","de":"<p>Wir machen Links schlauer:</p><ol><li>Mail-Link: <code>&lt;a href=\"mailto:anna@example.com\"&gt;Schreib mir&lt;/a&gt;</code>. Ein Klick öffnet das Mailprogramm.</li><li>Hilfetext: Gib einem Link das Attribut <code>title=\"…\"</code> (mindestens 3 Zeichen). Er erscheint, wenn man mit dem Mauszeiger darüberfährt.</li><li>Link innerhalb der Seite: Setze ganz ans Ende der Seite eine Überschrift <code>&lt;h2 id=\"bottom\"&gt;Ende&lt;/h2&gt;</code> und oben einen Link <code>&lt;a href=\"#bottom\"&gt;Nach unten&lt;/a&gt;</code>. Das Zeichen <code>#</code> bedeutet „zum Element mit dieser id auf derselben Seite“.</li></ol><p>Damit die Seite lang genug ist und man den Link „Nach unten“ sinnvoll nutzt, füge zwischen Link und Ende einige Absätze ein.</p>"},"lv3":{"ru":"<p>Построй мини-справочник с оглавлением, как в настоящей Википедии:</p><ol><li>Вверху — <code>&lt;h1 id=\"top\"&gt;</code> и список <code>&lt;ul&gt;</code> из трёх ссылок на разделы (<code>#music</code>, <code>#games</code>, <code>#sport</code> или свои).</li><li>Ниже три раздела <code>&lt;h2&gt;</code> с такими id и абзацем в каждом.</li><li>В конце каждого раздела ссылка «↑ Наверх» на <code>#top</code>.</li></ol><p>Проверь руками: нажми на пункт оглавления в окне результата. Страница должна прокрутиться к разделу.</p>","de":"<p>Baue ein Mini-Nachschlagewerk mit Inhaltsverzeichnis wie in einer echten Wikipedia:</p><ol><li>Oben — <code>&lt;h1 id=\"top\"&gt;</code> und eine Liste <code>&lt;ul&gt;</code> mit drei Links zu den Abschnitten (<code>#music</code>, <code>#games</code>, <code>#sport</code> oder eigene).</li><li>Darunter drei Abschnitte <code>&lt;h2&gt;</code> mit diesen ids und je einem Absatz.</li><li>Am Ende jedes Abschnitts ein Link „↑ Nach oben“ zu <code>#top</code>.</li></ol><p>Probiere es aus: Klicke im Ergebnisfenster auf einen Punkt im Inhaltsverzeichnis. Die Seite soll zum Abschnitt scrollen.</p>"}},{"day":5,"week":1,"title":{"ru":"Картинки","de":"Bilder"},"goal":{"ru":"Вставлять картинки и понимать, зачем нужен атрибут alt.","de":"Bilder einfügen und verstehen, wozu das Attribut alt da ist."},"theory":{"ru":"<p>Картинка — элемент <code>&lt;img&gt;</code>. Он «пустой» (без закрывающего тега) и имеет атрибуты:</p><pre class=\"ex\" data-l=\"html\">&lt;img src=\"cat.svg\" alt=\"Рыжий кот\" width=\"200\"&gt;</pre><ul><li><code>src</code> — путь к файлу картинки.</li><li><code>alt</code> — описание словами. Его читают программы для незрячих, и он виден, если картинка не загрузилась. Поисковики тоже его читают. <b>alt нужен всегда.</b></li><li><code>width</code> — ширина в пикселях (высота подберётся сама).</li></ul><p>В этом курсе у тебя есть четыре готовые картинки: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>. На настоящем сайте ты положишь файл рядом с HTML и напишешь его имя в <code>src</code>.</p>","de":"<p>Ein Bild ist das Element <code>&lt;img&gt;</code>. Es ist „leer“ (ohne schließendes Tag) und hat Attribute:</p><pre class=\"ex\" data-l=\"html\">&lt;img src=\"cat.svg\" alt=\"Rote Katze\" width=\"200\"&gt;</pre><ul><li><code>src</code> — Pfad zur Bilddatei.</li><li><code>alt</code> — Beschreibung in Worten. Sie wird von Programmen für Blinde vorgelesen und erscheint, wenn das Bild nicht lädt. Auch Suchmaschinen lesen sie. <b>alt ist immer nötig.</b></li><li><code>width</code> — Breite in Pixeln (die Höhe passt sich an).</li></ul><p>In diesem Kurs hast du vier fertige Bilder: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>. Auf einer echten Website legst du die Datei neben das HTML und schreibst ihren Namen in <code>src</code>.</p>"},"task":{"ru":"<ol><li>Вставь две картинки из списка выше.</li><li>У каждой напиши осмысленный <code>alt</code> (не «картинка», а что на ней).</li><li>Одной задай <code>width=\"200\"</code>.</li></ol>","de":"<ol><li>Füge zwei Bilder aus der Liste oben ein.</li><li>Schreibe bei jedem ein sinnvolles <code>alt</code> (nicht „Bild“, sondern was darauf zu sehen ist).</li><li>Gib einem <code>width=\"200\"</code>.</li></ol>"},"files":{"index.html":{"ru":"<h1>Моя галерея</h1>\n<!-- Вставь картинки здесь -->\n","de":"<h1>Meine Galerie</h1>\n<!-- Füge hier die Bilder ein -->\n"}},"checks":[{"t":"count","m":{"ru":"Минимум две картинки <code>&lt;img&gt;</code>","de":"Mindestens zwei Bilder <code>&lt;img&gt;</code>"},"s":"img","n":2,"w":null},{"t":"allattr","m":{"ru":"У каждой картинки есть <code>src</code> (файл .svg)","de":"Jedes Bild hat <code>src</code> (Datei .svg)"},"s":"img","a":"src","r":"svg","w":null},{"t":"allattr","m":{"ru":"У каждой картинки есть описание <code>alt</code> (минимум 4 символа)","de":"Jedes Bild hat eine Beschreibung <code>alt</code> (mindestens 4 Zeichen)"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"attr","m":{"ru":"Одной картинке задана ширина 200","de":"Bei einem Bild ist die Breite 200 gesetzt"},"s":"img","a":"width","r":"^200$","w":null},{"t":"count","m":{"ru":"Минимум три картинки","de":"Mindestens drei Bilder"},"s":"img","n":3,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть <code>figure</code> с подписью <code>figcaption</code>","de":"Es gibt <code>figure</code> mit <code>figcaption</code>"},"s":"figure figcaption","w":null,"lv":2},{"t":"has","m":{"ru":"Одна картинка стала ссылкой (<code>img</code> внутри <code>a</code>)","de":"Ein Bild ist ein Link (<code>img</code> in <code>a</code>)"},"s":"a img","w":null,"lv":2},{"t":"code","m":{"ru":"Использованы все четыре картинки","de":"Alle vier Bilder sind benutzt"},"r":"(?=[\\s\\S]*cat\\.svg)(?=[\\s\\S]*sun\\.svg)(?=[\\s\\S]*rocket\\.svg)(?=[\\s\\S]*plant\\.svg)","f":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Четыре <code>&lt;figure&gt;</code>","de":"Vier <code>&lt;figure&gt;</code>"},"s":"figure","n":4,"w":null,"lv":3,"opt":true},{"t":"count","m":{"ru":"Четыре подписи <code>&lt;figcaption&gt;</code>","de":"Vier Beschriftungen <code>&lt;figcaption&gt;</code>"},"s":"figcaption","n":4,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть заголовок <code>&lt;h2&gt;</code>","de":"Es gibt eine Überschrift <code>&lt;h2&gt;</code>"},"s":"h2","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<h1>Моя галерея</h1>\n<h2>Выставка картинок</h2>\n<p>Четыре рисунка из курса.</p>\n<figure>\n  <img src=\"cat.svg\" alt=\"Рыжий кот с усами\" width=\"200\">\n  <figcaption>Мой кот</figcaption>\n</figure>\n<figure>\n  <img src=\"rocket.svg\" alt=\"Ракета летит среди звёзд\">\n  <figcaption>Ракета</figcaption>\n</figure>\n<figure>\n  <a href=\"https://wikipedia.org\"><img src=\"sun.svg\" alt=\"Жёлтое солнце с лучами\"></a>\n  <figcaption>Солнце</figcaption>\n</figure>\n<figure>\n  <img src=\"plant.svg\" alt=\"Зелёное растение в горшке\">\n  <figcaption>Растение</figcaption>\n</figure>\n","de":"<h1>Meine Galerie</h1>\n<h2>Bilderausstellung</h2>\n<p>Vier Zeichnungen aus dem Kurs.</p>\n<figure>\n  <img src=\"cat.svg\" alt=\"Rote Katze mit Schnurrhaaren\" width=\"200\">\n  <figcaption>Meine Katze</figcaption>\n</figure>\n<figure>\n  <img src=\"rocket.svg\" alt=\"Rakete fliegt zwischen Sternen\">\n  <figcaption>Rakete</figcaption>\n</figure>\n<figure>\n  <a href=\"https://wikipedia.org\"><img src=\"sun.svg\" alt=\"Gelbe Sonne mit Strahlen\"></a>\n  <figcaption>Sonne</figcaption>\n</figure>\n<figure>\n  <img src=\"plant.svg\" alt=\"Grüne Pflanze im Topf\">\n  <figcaption>Pflanze</figcaption>\n</figure>\n"}},"hint":{"ru":"<p>Пример одной строки: <code>&lt;img src=\"sun.svg\" alt=\"Жёлтое солнце с лучами\"&gt;</code>. Закрывающего тега нет.</p>","de":"<p>Beispiel für eine Zeile: <code>&lt;img src=\"sun.svg\" alt=\"Gelbe Sonne mit Strahlen\"&gt;</code>. Es gibt kein schließendes Tag.</p>"},"quiz":[{"q":{"ru":"Зачем нужен alt?","de":"Wozu ist alt da?"},"o":[{"ru":"Чтобы картинка была красивее","de":"Damit das Bild schöner aussieht"},{"ru":"Чтобы описать картинку словами для незрячих и на случай ошибки загрузки","de":"Um das Bild in Worten zu beschreiben, für Blinde und falls das Laden fehlschlägt"},{"ru":"Чтобы изменить размер","de":"Um die Größe zu ändern"}],"a":1}],"lv2":{"ru":"<p>Сделай галерею аккуратнее:</p><ol><li>Добавь третью картинку <code>sun.svg</code> с описанием <code>alt</code>.</li><li>Оберни одну картинку в подпись: <code>&lt;figure&gt;&lt;img …&gt;&lt;figcaption&gt;Мой кот&lt;/figcaption&gt;&lt;/figure&gt;</code>. Тег <code>figure</code> — «иллюстрация», <code>figcaption</code> — её подпись.</li><li>Сделай одну картинку ссылкой: положи <code>&lt;img&gt;</code> внутрь <code>&lt;a href=\"https://wikipedia.org\"&gt;…&lt;/a&gt;</code>.</li></ol><pre class=\"ex\" data-l=\"html\">&lt;figure&gt;\n  &lt;img src=\"cat.svg\" alt=\"Рыжий кот с усами\" width=\"200\"&gt;\n  &lt;figcaption&gt;Мой кот&lt;/figcaption&gt;\n&lt;/figure&gt;</pre>","de":"<p>Mache die Galerie ordentlicher:</p><ol><li>Füge ein drittes Bild <code>sun.svg</code> mit Beschreibung <code>alt</code> hinzu.</li><li>Gib einem Bild eine Beschriftung: <code>&lt;figure&gt;&lt;img …&gt;&lt;figcaption&gt;Meine Katze&lt;/figcaption&gt;&lt;/figure&gt;</code>. Das Tag <code>figure</code> ist eine „Abbildung“, <code>figcaption</code> ihre Beschriftung.</li><li>Mache ein Bild zum Link: Lege das <code>&lt;img&gt;</code> in <code>&lt;a href=\"https://wikipedia.org\"&gt;…&lt;/a&gt;</code>.</li></ol><pre class=\"ex\" data-l=\"html\">&lt;figure&gt;\n  &lt;img src=\"cat.svg\" alt=\"Rote Katze mit Schnurrhaaren\" width=\"200\"&gt;\n  &lt;figcaption&gt;Meine Katze&lt;/figcaption&gt;\n&lt;/figure&gt;</pre>"},"lv3":{"ru":"<p>Сделай «выставку» из всех четырёх картинок курса: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>.</p><ol><li>Каждая картинка — в своём <code>&lt;figure&gt;</code> с подписью.</li><li>Над выставкой <code>&lt;h2&gt;</code> и абзац: что за выставка.</li><li>Эксперимент со сломанной картинкой: поменяй у одной <code>cat.svg</code> на <code>cat.png</code>. Что показывает браузер вместо неё? Теперь ты знаешь, зачем нужен <code>alt</code>. Верни правильное имя.</li></ol>","de":"<p>Baue eine „Ausstellung“ aus allen vier Bildern des Kurses: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>.</p><ol><li>Jedes Bild in einem eigenen <code>&lt;figure&gt;</code> mit Beschriftung.</li><li>Über der Ausstellung ein <code>&lt;h2&gt;</code> und ein Absatz: Was ist das für eine Ausstellung.</li><li>Experiment mit einem kaputten Bild: Ändere bei einem <code>cat.svg</code> in <code>cat.png</code>. Was zeigt der Browser stattdessen? Jetzt weißt du, wozu <code>alt</code> gut ist. Setze den richtigen Namen wieder ein.</li></ol>"}},{"day":6,"week":1,"title":{"ru":"Скелет страницы: head и body","de":"Das Gerüst einer Seite: head und body"},"goal":{"ru":"Знать структуру настоящего HTML-файла и ориентироваться в нём.","de":"Den Aufbau einer echten HTML-Datei kennen und sich darin zurechtfinden."},"theory":{"ru":"<p>До сих пор мы писали только содержимое. Настоящий HTML-файл имеет скелет:</p><pre class=\"ex\" data-l=\"html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"ru\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Название вкладки&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Всё, что видно на странице&lt;/h1&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><ul><li><code>&lt;!DOCTYPE html&gt;</code> — сообщает браузеру: «это современный HTML».</li><li><code>&lt;html lang=\"ru\"&gt;</code> — весь документ и его язык.</li><li><code>&lt;head&gt;</code> — служебное, не показывается на странице: кодировка (<code>meta charset</code>) и <code>&lt;title&gt;</code> — название во вкладке браузера.</li><li><code>&lt;body&gt;</code> — всё, что видит посетитель.</li></ul><p><b>Как ориентироваться в коде:</b> смотри на отступы. Всё, что внутри <code>&lt;head&gt;</code>, сдвинуто на два пробела. Закрывающий тег стоит на том же уровне, что и открывающий.</p>","de":"<p>Bisher haben wir nur Inhalt geschrieben. Eine echte HTML-Datei hat ein Gerüst:</p><pre class=\"ex\" data-l=\"html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"de\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Name des Tabs&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Alles, was auf der Seite zu sehen ist&lt;/h1&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><ul><li><code>&lt;!DOCTYPE html&gt;</code> — sagt dem Browser: „Das ist modernes HTML“.</li><li><code>&lt;html lang=\"de\"&gt;</code> — das ganze Dokument und seine Sprache.</li><li><code>&lt;head&gt;</code> — Technisches, wird nicht angezeigt: Zeichensatz (<code>meta charset</code>) und <code>&lt;title&gt;</code> — der Name im Browser-Tab.</li><li><code>&lt;body&gt;</code> — alles, was der Besucher sieht.</li></ul><p><b>So findest du dich im Code zurecht:</b> Achte auf die Einrückung. Alles in <code>&lt;head&gt;</code> ist um zwei Leerzeichen eingerückt. Das schließende Tag steht auf derselben Ebene wie das öffnende.</p>"},"task":{"ru":"<p>Ниже — только содержимое. Оберни его в полный скелет:</p><ol><li><code>&lt;!DOCTYPE html&gt;</code> в первой строке.</li><li><code>&lt;html lang=\"ru\"&gt;</code>, внутри <code>&lt;head&gt;</code> и <code>&lt;body&gt;</code>.</li><li>В <code>&lt;head&gt;</code>: <code>&lt;meta charset=\"utf-8\"&gt;</code> и <code>&lt;title&gt;</code> со своим названием.</li><li>Содержимое перенеси в <code>&lt;body&gt;</code>. Посмотри, как изменилось название вкладки браузера в твоём окне (здесь его не видно, но на сайте оно будет).</li></ol>","de":"<p>Unten steht nur der Inhalt. Verpacke ihn in ein vollständiges Gerüst:</p><ol><li><code>&lt;!DOCTYPE html&gt;</code> in der ersten Zeile.</li><li><code>&lt;html lang=\"de\"&gt;</code>, darin <code>&lt;head&gt;</code> und <code>&lt;body&gt;</code>.</li><li>In <code>&lt;head&gt;</code>: <code>&lt;meta charset=\"utf-8\"&gt;</code> und <code>&lt;title&gt;</code> mit deinem eigenen Namen.</li><li>Verschiebe den Inhalt in <code>&lt;body&gt;</code>. (Der Tab-Name ist hier nicht zu sehen, aber auf einer echten Website erscheint er.)</li></ol>"},"files":{"index.html":{"ru":"<h1>Мой сайт</h1>\n<p>Скоро здесь будет много интересного.</p>\n","de":"<h1>Meine Website</h1>\n<p>Bald gibt es hier viel Interessantes.</p>\n"}},"checks":[{"t":"code","m":{"ru":"Первая строка: <code>&lt;!DOCTYPE html&gt;</code>","de":"Erste Zeile: <code>&lt;!DOCTYPE html&gt;</code>"},"r":"^\\s*<!DOCTYPE html>","f":null},{"t":"code","m":{"ru":"Есть <code>&lt;html lang=\"…\"&gt;</code>","de":"Es gibt <code>&lt;html lang=\"…\"&gt;</code>"},"r":"<html[^>]*\\blang=","f":null},{"t":"code","m":{"ru":"В <code>&lt;head&gt;</code> есть <code>meta charset</code>","de":"In <code>&lt;head&gt;</code> gibt es <code>meta charset</code>"},"r":"<head>[\\s\\S]*<meta\\s+charset=[\\s\\S]*</head>","f":null},{"t":"code","m":{"ru":"Есть <code>&lt;title&gt;</code> с названием","de":"Es gibt <code>&lt;title&gt;</code> mit einem Namen"},"r":"<title>\\s*[^<\\s][^<]*</title>","f":null},{"t":"code","m":{"ru":"Заголовок <code>&lt;h1&gt;</code> находится внутри <code>&lt;body&gt;</code>","de":"Die Überschrift <code>&lt;h1&gt;</code> steht in <code>&lt;body&gt;</code>"},"r":"<body>[\\s\\S]*<h1[\\s\\S]*</body>","f":null},{"t":"code","m":{"ru":"Есть <code>meta description</code> (от 20 символов)","de":"Es gibt <code>meta description</code> (ab 20 Zeichen)"},"r":"<meta\\s+name=\"description\"\\s+content=\"[^\"]{20,}\"","f":null,"lv":2},{"t":"code","m":{"ru":"Есть <code>meta viewport</code>","de":"Es gibt <code>meta viewport</code>"},"r":"<meta\\s+name=\"viewport\"","f":null,"lv":2},{"t":"code","m":{"ru":"Название <code>&lt;title&gt;</code> от 5 символов","de":"<code>&lt;title&gt;</code> hat mindestens 5 Zeichen"},"r":"<title>[^<]{5,}</title>","f":null,"lv":2},{"t":"code","m":{"ru":"Минимум четыре комментария","de":"Mindestens vier Kommentare"},"r":"(<!--[\\s\\S]*?-->[\\s\\S]*){4}","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Название вида «Страница | Сайт»","de":"Titel in der Form „Seite | Website“"},"r":"<title>[^<|]+\\|[^<]+</title>","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть <code>meta author</code>","de":"Es gibt <code>meta author</code>"},"r":"<meta\\s+name=\"author\"\\s+content=\"[^\"]+\"","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <!-- HEAD: паспорт страницы -->\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"description\" content=\"Мой первый сайт: пишу код и учусь делать страницы.\">\n  <meta name=\"author\" content=\"Аня\">\n  <title>Главная | Мой сайт</title>\n</head>\n<body>\n  <!-- BODY: то, что видно на странице -->\n  <h1>Мой сайт</h1>\n  <!-- абзац с приветствием -->\n  <p>Скоро здесь будет много интересного.</p>\n  <!-- конец страницы -->\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <!-- HEAD: Pass der Seite -->\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"description\" content=\"Meine erste Website: Ich schreibe Code und lerne, Seiten zu bauen.\">\n  <meta name=\"author\" content=\"Anna\">\n  <title>Start | Meine Website</title>\n</head>\n<body>\n  <!-- BODY: das Sichtbare auf der Seite -->\n  <h1>Meine Website</h1>\n  <!-- Absatz mit Begrüßung -->\n  <p>Bald gibt es hier viel Interessantes.</p>\n  <!-- Ende der Seite -->\n</body>\n</html>\n"}},"hint":{"ru":"<p>Порядок: <code>html</code> содержит <code>head</code> и <code>body</code>. Внутри <code>head</code> — <code>meta</code> и <code>title</code>. Внутри <code>body</code> — всё видимое.</p>","de":"<p>Reihenfolge: <code>html</code> enthält <code>head</code> und <code>body</code>. In <code>head</code> stehen <code>meta</code> und <code>title</code>. In <code>body</code> steht alles Sichtbare.</p>"},"quiz":[{"q":{"ru":"Где находится элемент &lt;title&gt;?","de":"Wo steht das Element &lt;title&gt;?"},"o":[{"ru":"В &lt;head&gt;","de":"In &lt;head&gt;"},{"ru":"В &lt;body&gt;","de":"In &lt;body&gt;"},{"ru":"После &lt;/html&gt;","de":"Nach &lt;/html&gt;"}],"a":0},{"q":{"ru":"Что видит посетитель на странице?","de":"Was sieht der Besucher auf der Seite?"},"o":[{"ru":"Всё из &lt;head&gt;","de":"Alles aus &lt;head&gt;"},{"ru":"Всё из &lt;body&gt;","de":"Alles aus &lt;body&gt;"},{"ru":"Только &lt;title&gt;","de":"Nur &lt;title&gt;"}],"a":1}],"lv2":{"ru":"<p>Дополни «паспорт» страницы (<code>&lt;head&gt;</code>) тем, что видят поисковики и телефоны:</p><ol><li><code>&lt;meta name=\"description\" content=\"…\"&gt;</code> — одно предложение о сайте (от 20 символов). Именно его Google показывает под названием.</li><li><code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code> — чтобы страница нормально выглядела на телефоне. Пока просто скопируй, смысл разберём на 20-м дне.</li><li>Сделай <code>&lt;title&gt;</code> длиннее: минимум 5 символов.</li></ol>","de":"<p>Ergänze den „Pass“ der Seite (<code>&lt;head&gt;</code>) um das, was Suchmaschinen und Handys sehen:</p><ol><li><code>&lt;meta name=\"description\" content=\"…\"&gt;</code> — ein Satz über die Website (ab 20 Zeichen). Genau den zeigt Google unter dem Titel.</li><li><code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code> — damit die Seite auf dem Handy gut aussieht. Kopiere es erstmal, den Sinn klären wir an Tag 20.</li><li>Mache den <code>&lt;title&gt;</code> länger: mindestens 5 Zeichen.</li></ol>"},"lv3":{"ru":"<p>Стань детективом: разложи свою страницу по полочкам.</p><ol><li>Подпиши комментариями каждую часть: <code>&lt;!-- HEAD: паспорт страницы --&gt;</code>, <code>&lt;!-- BODY: то, что видно --&gt;</code> и т.д. Минимум 4 комментария.</li><li>Сделай название вида «Страница | Мой сайт» (с вертикальной чертой). Так подписаны вкладки на многих сайтах.</li><li>Добавь <code>&lt;meta name=\"author\" content=\"твоё имя\"&gt;</code>.</li><li>Открой любой сайт, нажми <code>Ctrl+U</code>, найди <code>&lt;title&gt;</code> и <code>&lt;meta charset&gt;</code> в чужом коде. Нашёл? Ты уже читаешь код профессионалов.</li></ol>","de":"<p>Werde zum Detektiv: Sortiere deine Seite in Fächer.</p><ol><li>Beschrifte jeden Teil mit Kommentaren: <code>&lt;!-- HEAD: Pass der Seite --&gt;</code>, <code>&lt;!-- BODY: das Sichtbare --&gt;</code> usw. Mindestens 4 Kommentare.</li><li>Gib dem Titel die Form „Seite | Meine Website“ (mit senkrechtem Strich). So sind die Tabs vieler Websites beschriftet.</li><li>Füge <code>&lt;meta name=\"author\" content=\"dein Name\"&gt;</code> hinzu.</li><li>Öffne eine beliebige Website, drücke <code>Strg+U</code>, finde <code>&lt;title&gt;</code> und <code>&lt;meta charset&gt;</code> im fremden Code. Gefunden? Dann liest du schon Code von Profis.</li></ol>"}},{"day":7,"week":1,"title":{"ru":"Проект недели: страница-визитка","de":"Wochenprojekt: eine Visitenkarten-Seite"},"goal":{"ru":"Собрать всё из первой недели в одну страницу о себе.","de":"Alles aus der ersten Woche in einer Seite über dich zusammenführen."},"theory":{"ru":"<p>Сегодня ты ничего нового не учишь, а собираешь всё в одном месте. Перед работой повтори: заголовки, абзацы, списки, ссылки, картинки, скелет.</p><p>Подумай, что ты хочешь рассказать: как тебя зовут, чем увлекаешься, что любишь. Не пиши личных данных (адрес, телефон, школа): страница может когда-нибудь стать публичной.</p>","de":"<p>Heute lernst du nichts Neues, sondern bringst alles an einem Ort zusammen. Wiederhole vorab: Überschriften, Absätze, Listen, Links, Bilder, Gerüst.</p><p>Überlege, was du erzählen möchtest: wie du heißt, was du magst. Schreibe keine persönlichen Daten (Adresse, Telefon, Schule): Die Seite könnte irgendwann öffentlich werden.</p>"},"task":{"ru":"<p>Построй страницу «Обо мне». В ней должно быть:</p><ol><li>Полный скелет страницы (DOCTYPE, head с title, body).</li><li>Заголовок <code>&lt;h1&gt;</code> с твоим именем или ником.</li><li>Минимум два абзаца о себе.</li><li>Одна картинка с осмысленным <code>alt</code>.</li><li>Список <code>&lt;ul&gt;</code> из трёх увлечений, в одном слове <code>&lt;strong&gt;</code>.</li><li>Одна ссылка на то, что тебе нравится, и линия <code>&lt;hr&gt;</code>.</li></ol><p>Ответь ещё на вопросы внизу.</p>","de":"<p>Baue eine Seite „Über mich“. Sie soll enthalten:</p><ol><li>Ein vollständiges Gerüst (DOCTYPE, head mit title, body).</li><li>Eine Überschrift <code>&lt;h1&gt;</code> mit deinem Namen oder Nicknamen.</li><li>Mindestens zwei Absätze über dich.</li><li>Ein Bild mit sinnvollem <code>alt</code>.</li><li>Eine Liste <code>&lt;ul&gt;</code> mit drei Interessen, bei einem Wort <code>&lt;strong&gt;</code>.</li><li>Einen Link zu etwas, das dir gefällt, und eine Linie <code>&lt;hr&gt;</code>.</li></ol><p>Beantworte unten noch die Fragen.</p>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!-- Собери здесь страницу «Обо мне» -->\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!-- Baue hier die Seite „Über mich“ -->\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть <code>&lt;!DOCTYPE html&gt;</code>","de":"Es gibt <code>&lt;!DOCTYPE html&gt;</code>"},"r":"^\\s*<!DOCTYPE html>","f":null},{"t":"code","m":{"ru":"У страницы есть <code>&lt;title&gt;</code>","de":"Die Seite hat einen <code>&lt;title&gt;</code>"},"r":"<title>\\s*[^<\\s][^<]*</title>","f":null},{"t":"has","m":{"ru":"Заголовок <code>&lt;h1&gt;</code>","de":"Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"count","m":{"ru":"Минимум два абзаца","de":"Mindestens zwei Absätze"},"s":"p","n":2,"w":null},{"t":"allattr","m":{"ru":"Картинка с осмысленным <code>alt</code>","de":"Bild mit sinnvollem <code>alt</code>"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"count","m":{"ru":"Список из трёх пунктов","de":"Liste mit drei Punkten"},"s":"ul > li","n":3,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;strong&gt;</code>","de":"Es gibt <code>&lt;strong&gt;</code>"},"s":"li strong, p strong","w":null},{"t":"attr","m":{"ru":"Есть внешняя ссылка","de":"Es gibt einen externen Link"},"s":"a","a":"href","r":"^https?://","w":null},{"t":"has","m":{"ru":"Есть линия <code>&lt;hr&gt;</code>","de":"Es gibt eine Linie <code>&lt;hr&gt;</code>"},"s":"hr","w":null},{"t":"count","m":{"ru":"Минимум два раздела <code>&lt;h2&gt;</code>","de":"Mindestens zwei Abschnitte <code>&lt;h2&gt;</code>"},"s":"h2","n":2,"w":null,"lv":2},{"t":"count","m":{"ru":"Нумерованный список из трёх проектов","de":"Nummerierte Liste mit drei Projekten"},"s":"ol li","n":3,"w":null,"lv":2},{"t":"count","m":{"ru":"Таблица минимум из трёх строк <code>tr</code>","de":"Tabelle mit mindestens drei Zeilen <code>tr</code>"},"s":"table tr","n":3,"w":null,"lv":2},{"t":"has","m":{"ru":"В таблице есть заголовки <code>th</code>","de":"Die Tabelle hat Überschriften <code>th</code>"},"s":"table th","w":null,"lv":2},{"t":"code","m":{"ru":"Минимум три комментария","de":"Mindestens drei Kommentare"},"r":"(<!--[\\s\\S]*?-->[\\s\\S]*){3}","f":null,"lv":2},{"t":"has","m":{"ru":"<code>figure</code> с картинкой и подписью","de":"<code>figure</code> mit Bild und Beschriftung"},"s":"figure img + figcaption","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть цитата <code>&lt;blockquote&gt;</code>","de":"Es gibt ein Zitat <code>&lt;blockquote&gt;</code>"},"s":"blockquote","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть вложенный список","de":"Es gibt eine verschachtelte Liste"},"s":"ul li ul li","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"У <code>h1</code> есть <code>id=\"top\"</code>","de":"<code>h1</code> hat <code>id=\"top\"</code>"},"s":"h1#top","w":null,"lv":3,"opt":true},{"t":"attr","m":{"ru":"Есть ссылка «Наверх»","de":"Es gibt den Link „Nach oben“"},"s":"a","a":"href","r":"^#top$","w":null,"lv":3,"opt":true},{"t":"attr","m":{"ru":"Есть ссылка <code>mailto:</code>","de":"Es gibt einen <code>mailto:</code>-Link"},"s":"a","a":"href","r":"^mailto:","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Обо мне</title>\n</head>\n<body>\n  <h1 id=\"top\">Привет, я Макс</h1>\n  <!-- ФОТО -->\n  <figure>\n    <img src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"160\">\n    <figcaption>Моя любимая ракета</figcaption>\n  </figure>\n  <p>Мне 15 лет, и я учусь делать сайты.</p>\n  <p>Больше всего мне нравится придумывать и мастерить.</p>\n  <hr>\n  <h2>Мои увлечения</h2>\n  <ul>\n    <li><strong>Космос</strong></li>\n    <li>Музыка\n      <ul>\n        <li>Рок</li>\n        <li>Джаз</li>\n      </ul>\n    </li>\n    <li>Игры</li>\n  </ul>\n  <p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Читаю Википедию</a></p>\n  <!-- ПРОЕКТЫ -->\n  <h2>Мои проекты</h2>\n  <ol>\n    <li>Робот-пылесос</li>\n    <li>Сайт о космосе</li>\n    <li>Игра-викторина</li>\n  </ol>\n  <!-- РАСПИСАНИЕ -->\n  <table>\n    <tr><th>День</th><th>Занятие</th></tr>\n    <tr><td>Пн</td><td>Код</td></tr>\n    <tr><td>Ср</td><td>Спорт</td></tr>\n  </table>\n  <blockquote>Каждый эксперт когда-то был новичком.</blockquote>\n  <p><a href=\"#top\">↑ Наверх</a> · <a href=\"mailto:max@example.com\">Написать мне</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Über mich</title>\n</head>\n<body>\n  <h1 id=\"top\">Hallo, ich bin Max</h1>\n  <!-- FOTO -->\n  <figure>\n    <img src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"160\">\n    <figcaption>Meine Lieblingsrakete</figcaption>\n  </figure>\n  <p>Ich bin 15 und lerne, Websites zu bauen.</p>\n  <p>Am liebsten denke ich mir Dinge aus und baue sie.</p>\n  <hr>\n  <h2>Meine Interessen</h2>\n  <ul>\n    <li><strong>Weltraum</strong></li>\n    <li>Musik\n      <ul>\n        <li>Rock</li>\n        <li>Jazz</li>\n      </ul>\n    </li>\n    <li>Spiele</li>\n  </ul>\n  <p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Ich lese Wikipedia</a></p>\n  <!-- PROJEKTE -->\n  <h2>Meine Projekte</h2>\n  <ol>\n    <li>Saugroboter</li>\n    <li>Website über den Weltraum</li>\n    <li>Quiz-Spiel</li>\n  </ol>\n  <!-- STUNDENPLAN -->\n  <table>\n    <tr><th>Tag</th><th>Beschäftigung</th></tr>\n    <tr><td>Mo</td><td>Code</td></tr>\n    <tr><td>Mi</td><td>Sport</td></tr>\n  </table>\n  <blockquote>Jeder Experte war einmal Anfänger.</blockquote>\n  <p><a href=\"#top\">↑ Nach oben</a> · <a href=\"mailto:max@example.com\">Schreib mir</a></p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Двигайся по пунктам и после каждого нажимай «Проверить». Если что-то не показывается, посмотри, закрыт ли тег и стоит ли элемент внутри <code>&lt;body&gt;</code>.</p>","de":"<p>Arbeite die Punkte der Reihe nach ab und drücke nach jedem „Prüfen“. Wenn etwas nicht angezeigt wird, schau, ob das Tag geschlossen ist und das Element in <code>&lt;body&gt;</code> steht.</p>"},"quiz":[{"q":{"ru":"Какой тег делает пункт в списке?","de":"Welches Tag macht einen Listenpunkt?"},"o":[{"ru":"&lt;li&gt;","de":"&lt;li&gt;"},{"ru":"&lt;ul&gt;","de":"&lt;ul&gt;"},{"ru":"&lt;p&gt;","de":"&lt;p&gt;"}],"a":0},{"q":{"ru":"Какой атрибут хранит адрес ссылки?","de":"Welches Attribut speichert die Adresse eines Links?"},"o":[{"ru":"src","de":"src"},{"ru":"href","de":"href"},{"ru":"alt","de":"alt"}],"a":1},{"q":{"ru":"Что не нужно писать на публичной странице о себе?","de":"Was gehört nicht auf eine öffentliche Seite über dich?"},"o":[{"ru":"Любимую музыку","de":"Lieblingsmusik"},{"ru":"Домашний адрес и телефон","de":"Wohnadresse und Telefonnummer"},{"ru":"Свои увлечения","de":"Deine Interessen"}],"a":1}],"proj":true,"lv2":{"ru":"<p>Сделай визитку настоящей «страницей-портфолио»:</p><ol><li>Добавь второй раздел <code>&lt;h2&gt;Мои проекты&lt;/h2&gt;</code> и под ним <b>нумерованный список</b> <code>&lt;ol&gt;</code> из трёх проектов (хоть выдуманных).</li><li>Новый тег — <b>таблица</b>. Сделай расписание недели из трёх строк:</li></ol><pre class=\"ex\" data-l=\"html\">&lt;table&gt;\n  &lt;tr&gt;&lt;th&gt;День&lt;/th&gt;&lt;th&gt;Занятие&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Пн&lt;/td&gt;&lt;td&gt;Код&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Ср&lt;/td&gt;&lt;td&gt;Спорт&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;</pre><p><code>tr</code> — строка, <code>th</code> — заголовок столбца, <code>td</code> — ячейка. Нужно минимум три строки <code>tr</code> (с заголовком).</p><ol start=\"3\"><li>Подпиши каждую часть страницы комментарием (минимум 3).</li></ol>","de":"<p>Mache aus der Visitenkarte eine echte „Portfolio-Seite“:</p><ol><li>Füge einen zweiten Abschnitt <code>&lt;h2&gt;Meine Projekte&lt;/h2&gt;</code> hinzu und darunter eine <b>nummerierte Liste</b> <code>&lt;ol&gt;</code> mit drei Projekten (gern ausgedachte).</li><li>Ein neues Tag — die <b>Tabelle</b>. Baue einen Wochenplan aus drei Zeilen:</li></ol><pre class=\"ex\" data-l=\"html\">&lt;table&gt;\n  &lt;tr&gt;&lt;th&gt;Tag&lt;/th&gt;&lt;th&gt;Beschäftigung&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Mo&lt;/td&gt;&lt;td&gt;Code&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Mi&lt;/td&gt;&lt;td&gt;Sport&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;</pre><p><code>tr</code> ist eine Zeile, <code>th</code> eine Spaltenüberschrift, <code>td</code> eine Zelle. Du brauchst mindestens drei Zeilen <code>tr</code> (mit Überschrift).</p><ol start=\"3\"><li>Beschrifte jeden Teil der Seite mit einem Kommentar (mindestens 3).</li></ol>"},"lv3":{"ru":"<p>Усложняем. Собери страницу, которую не стыдно показать друзьям:</p><ol><li>Оформи фото как <code>&lt;figure&gt;</code> с подписью <code>&lt;figcaption&gt;</code>.</li><li>Добавь цитату <code>&lt;blockquote&gt;</code> с любимой фразой.</li><li>Во вложенном списке интересов («Музыка» → два жанра) используй <code>&lt;ul&gt;</code> внутри <code>&lt;li&gt;</code>.</li><li>Внизу ссылка «
