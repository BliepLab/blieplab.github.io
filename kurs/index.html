 auf Hellgelb"},{"ru":"Жёлтый на белом","de":"Gelb auf Weiß"}],"a":1},{"q":{"ru":"Что обозначает <code>#ff0000</code>?","de":"Was bedeutet <code>#ff0000</code>?"},"o":[{"ru":"Красный","de":"Rot"},{"ru":"Зелёный","de":"Grün"},{"ru":"Синий","de":"Blau"}],"a":0}]},{"day":13,"week":2,"title":{"ru":"Отдельный файл style.css","de":"Eine eigene Datei style.css"},"goal":{"ru":"Вынести стили в отдельный файл и подключить его.","de":"Die Stile in eine eigene Datei auslagern und einbinden."},"theory":{"ru":"<p>Когда стилей много, их выносят в файл <code>style.css</code>. Один такой файл можно подключить ко всем страницам сайта: поменял цвет в одном месте, и он поменялся везде.</p><pre class=\"ex\" data-l=\"html\">&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Моя страница&lt;/title&gt;\n  &lt;link rel=\"stylesheet\" href=\"style.css\"&gt;\n&lt;/head&gt;</pre><ul><li><code>&lt;link&gt;</code> стоит в <code>&lt;head&gt;</code>, он «пустой» (без закрывающего тега).</li><li><code>rel=\"stylesheet\"</code> — это таблица стилей. <code>href</code> — путь к файлу.</li><li>В CSS-файле нет тегов HTML, только правила и комментарии <code>/* … */</code>.</li></ul><p>Теперь в редакторе две вкладки: <code>index.html</code> и <code>style.css</code>. Переключайся между ними.</p>","de":"<p>Wenn es viele Stile gibt, lagert man sie in die Datei <code>style.css</code> aus. Eine solche Datei kann man in alle Seiten einer Website einbinden: Farbe an einer Stelle geändert, und sie ändert sich überall.</p><pre class=\"ex\" data-l=\"html\">&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Meine Seite&lt;/title&gt;\n  &lt;link rel=\"stylesheet\" href=\"style.css\"&gt;\n&lt;/head&gt;</pre><ul><li><code>&lt;link&gt;</code> steht in <code>&lt;head&gt;</code>, es ist „leer“ (ohne schließendes Tag).</li><li><code>rel=\"stylesheet\"</code> bedeutet Stylesheet. <code>href</code> ist der Pfad zur Datei.</li><li>In der CSS-Datei gibt es keine HTML-Tags, nur Regeln und Kommentare <code>/* … */</code>.</li></ul><p>Jetzt gibt es im Editor zwei Tabs: <code>index.html</code> und <code>style.css</code>. Wechsle zwischen ihnen.</p>"},"task":{"ru":"<ol><li>В <code>index.html</code> подключи <code>style.css</code> тегом <code>&lt;link&gt;</code> в <code>&lt;head&gt;</code>. Сразу изменится вид страницы.</li><li>В <code>style.css</code> добавь правило для ссылок <code>a</code> с цветом, отличным от стандартного синего.</li><li>Добавь в <code>style.css</code> комментарий <code>/* … */</code> над одним из правил.</li></ol>","de":"<ol><li>Binde in <code>index.html</code> die Datei <code>style.css</code> mit <code>&lt;link&gt;</code> in <code>&lt;head&gt;</code> ein. Das Aussehen der Seite ändert sich sofort.</li><li>Füge in <code>style.css</code> eine Regel für Links <code>a</code> mit einer anderen Farbe als dem Standardblau hinzu.</li><li>Füge in <code>style.css</code> über einer Regel einen Kommentar <code>/* … */</code> hinzu.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Моя страница</title>\n  <!-- подключи style.css здесь -->\n</head>\n<body>\n  <h1>Файл со стилями</h1>\n  <p>Теперь стили живут отдельно.</p>\n  <p><a href=\"https://wikipedia.org\">Читать больше</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Meine Seite</title>\n  <!-- binde style.css hier ein -->\n</head>\n<body>\n  <h1>Datei mit Stilen</h1>\n  <p>Jetzt wohnen die Stile getrennt.</p>\n  <p><a href=\"https://wikipedia.org\">Mehr lesen</a></p>\n</body>\n</html>\n"},"style.css":"body {\n  font-family: Arial, sans-serif;\n  background-color: #fff8e6;\n  padding: 20px;\n}\n\nh1 {\n  color: #5b48e8;\n}\n"},"checks":[{"t":"code","m":{"ru":"В <code>index.html</code> подключён <code>style.css</code>","de":"In <code>index.html</code> ist <code>style.css</code> eingebunden"},"r":"<link[^>]+rel=[\"\\']stylesheet[\"\\'][^>]+href=[\"\\']style\\.css[\"\\']|<link[^>]+href=[\"\\']style\\.css[\"\\'][^>]+rel=[\"\\']stylesheet[\"\\']","f":"index.html"},{"t":"cssnot","m":{"ru":"Стили из файла работают (заголовок цветной)","de":"Die Stile aus der Datei wirken (Überschrift ist farbig)"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"Ссылки <code>a</code> имеют свой цвет","de":"Links <code>a</code> haben eine eigene Farbe"},"s":"a","p":"color","r":"^rgb\\(0, 0, 238\\)$","w":null},{"t":"code","m":{"ru":"В <code>style.css</code> есть комментарий","de":"In <code>style.css</code> gibt es einen Kommentar"},"r":"/\\*[\\s\\S]*?\\*/","f":"style.css"}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Моя страница</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Файл со стилями</h1>\n  <p>Теперь стили живут отдельно.</p>\n  <p><a href=\"https://wikipedia.org\">Читать больше</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Meine Seite</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Datei mit Stilen</h1>\n  <p>Jetzt wohnen die Stile getrennt.</p>\n  <p><a href=\"https://wikipedia.org\">Mehr lesen</a></p>\n</body>\n</html>\n"},"style.css":"body {\n  font-family: Arial, sans-serif;\n  background-color: #fff8e6;\n  padding: 20px;\n}\n\nh1 {\n  color: #5b48e8;\n}\n\n/* цвет ссылок / Linkfarbe */\na {\n  color: #ee6a3c;\n}\n"},"hint":{"ru":"<p>Строка подключения: <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Она должна быть между <code>&lt;head&gt;</code> и <code>&lt;/head&gt;</code>. Комментарий в CSS: <code>/* текст */</code>.</p>","de":"<p>Die Einbindungszeile: <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Sie muss zwischen <code>&lt;head&gt;</code> und <code>&lt;/head&gt;</code> stehen. Kommentar in CSS: <code>/* Text */</code>.</p>"},"quiz":[{"q":{"ru":"Где в HTML подключают файл стилей?","de":"Wo bindet man in HTML die Stildatei ein?"},"o":[{"ru":"В &lt;head&gt; тегом &lt;link&gt;","de":"In &lt;head&gt; mit dem Tag &lt;link&gt;"},{"ru":"В &lt;body&gt; тегом &lt;style&gt;","de":"In &lt;body&gt; mit dem Tag &lt;style&gt;"},{"ru":"В имени файла","de":"Im Dateinamen"}],"a":0}]},{"day":14,"week":2,"title":{"ru":"Проект недели: оформляем визитку","de":"Wochenprojekt: die Visitenkarte gestalten"},"goal":{"ru":"Применить всё из недели CSS на готовой странице.","de":"Alles aus der CSS-Woche auf einer fertigen Seite anwenden."},"theory":{"ru":"<p>HTML уже написан, он перед тобой. Твоя задача — открыть <code>style.css</code> и оформить страницу. Сначала <b>прочитай</b> HTML: найди классы (<code>card</code>, <code>photo</code>, <code>lead</code>, <code>hobbies</code>, <code>link</code>). По ним ты будешь выбирать элементы.</p><p>Совет: делай по одному правилу, смотри результат справа, потом следующее.</p>","de":"<p>Das HTML ist schon geschrieben, es liegt vor dir. Deine Aufgabe ist, <code>style.css</code> zu öffnen und die Seite zu gestalten. <b>Lies</b> zuerst das HTML: Finde die Klassen (<code>card</code>, <code>photo</code>, <code>lead</code>, <code>hobbies</code>, <code>link</code>). Mit ihnen wählst du die Elemente aus.</p><p>Tipp: Mache eine Regel nach der anderen, schau dir das Ergebnis rechts an, dann die nächste.</p>"},"task":{"ru":"<p>Открой вкладку <code>style.css</code> и сделай:</p><ol><li><code>body</code>: шрифт без засечек и цветной фон или градиент.</li><li><code>.card</code>: ширина до 420px, по центру, <code>padding</code> от 20px, скруглённые углы, белый фон и тень <code>box-shadow</code>.</li><li><code>.photo</code>: круглая (<code>border-radius: 50%</code>), ширина около 120px, по центру (<code>display: block; margin: 0 auto;</code>).</li><li><code>h1</code> по центру и цветной.</li><li><code>.hobbies</code>: убери маркеры (<code>list-style: none;</code>).</li><li><code>.link</code>: как кнопка: цвет, padding, скруглённые углы, без подчёркивания.</li></ol>","de":"<p>Öffne den Tab <code>style.css</code> und mache:</p><ol><li><code>body</code>: Schrift ohne Serifen und farbiger Hintergrund oder Verlauf.</li><li><code>.card</code>: Breite bis 420px, zentriert, <code>padding</code> ab 20px, runde Ecken, weißer Hintergrund und Schatten <code>box-shadow</code>.</li><li><code>.photo</code>: rund (<code>border-radius: 50%</code>), Breite etwa 120px, zentriert (<code>display: block; margin: 0 auto;</code>).</li><li><code>h1</code> zentriert und farbig.</li><li><code>.hobbies</code>: Aufzählungspunkte entfernen (<code>list-style: none;</code>).</li><li><code>.link</code>: wie ein Knopf: Farbe, Padding, runde Ecken, ohne Unterstreichung.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Визитка</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Рыжий кот\">\n    <h1>Привет, я кот Мурзик</h1>\n    <p class=\"lead\">Обожаю спать и мечтаю о рыбе.</p>\n    <ul class=\"hobbies\">\n      <li>Сон</li>\n      <li>Рыба</li>\n      <li>Солнечные ванны</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Мой блог</a>\n  </main>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Visitenkarte</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Rote Katze\">\n    <h1>Hallo, ich bin Kater Murzik</h1>\n    <p class=\"lead\">Ich liebe Schlafen und träume von Fisch.</p>\n    <ul class=\"hobbies\">\n      <li>Schlafen</li>\n      <li>Fisch</li>\n      <li>Sonnenbaden</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Mein Blog</a>\n  </main>\n</body>\n</html>\n"},"style.css":"/* Оформи страницу здесь / Gestalte die Seite hier */\n"},"checks":[{"t":"code","m":{"ru":"Задан фон страницы","de":"Der Seitenhintergrund ist gesetzt"},"r":"background(-color)?\\s*:","f":"style.css"},{"t":"css","m":{"ru":"<code>body</code>: шрифт без засечек","de":"<code>body</code>: Schrift ohne Serifen"},"s":"body","p":"font-family","r":"(arial|helvetica|verdana|tahoma|sans|trebuchet|segoe|system)","w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> не шире 420px","de":"<code>.card</code> höchstens 420px breit"},"s":".card","p":"width","o":"<=","n":420,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> по центру","de":"<code>.card</code> zentriert"},"s":".card","p":"margin-left","o":">=","n":20,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: padding от 20px","de":"<code>.card</code>: padding ab 20px"},"s":".card","p":"padding-top","o":">=","n":20,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> со скруглёнными углами","de":"<code>.card</code> mit runden Ecken"},"s":".card","p":"border-top-left-radius","o":">=","n":8,"w":null},{"t":"cssnot","m":{"ru":"<code>.card</code> с тенью","de":"<code>.card</code> mit Schatten"},"s":".card","p":"box-shadow","r":"^none$","w":null},{"t":"cssnum","m":{"ru":"<code>.photo</code> круглая","de":"<code>.photo</code> ist rund"},"s":".photo","p":"border-top-left-radius","o":">=","n":50,"w":null},{"t":"css","m":{"ru":"<code>h1</code> по центру","de":"<code>h1</code> zentriert"},"s":"h1","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"У списка нет маркеров","de":"Die Liste hat keine Punkte"},"s":".hobbies","p":"list-style-type","r":"^none$","w":null},{"t":"cssnot","m":{"ru":"<code>.link</code> без подчёркивания","de":"<code>.link</code> ohne Unterstreichung"},"s":".link","p":"text-decoration-line","r":"^underline$","w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Визитка</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Рыжий кот\">\n    <h1>Привет, я кот Мурзик</h1>\n    <p class=\"lead\">Обожаю спать и мечтаю о рыбе.</p>\n    <ul class=\"hobbies\">\n      <li>Сон</li>\n      <li>Рыба</li>\n      <li>Солнечные ванны</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Мой блог</a>\n  </main>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Visitenkarte</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Rote Katze\">\n    <h1>Hallo, ich bin Kater Murzik</h1>\n    <p class=\"lead\">Ich liebe Schlafen und träume von Fisch.</p>\n    <ul class=\"hobbies\">\n      <li>Schlafen</li>\n      <li>Fisch</li>\n      <li>Sonnenbaden</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Mein Blog</a>\n  </main>\n</body>\n</html>\n"},"style.css":"* { box-sizing: border-box; }\nbody { font-family: Arial, sans-serif; background: linear-gradient(135deg, #cfeaff, #fde8ff); margin: 0; padding: 20px; }\n.card { width: 340px; margin: 30px auto; padding: 24px; background: #fff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }\n.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto 12px; }\nh1 { text-align: center; color: #5b48e8; }\n.lead { text-align: center; color: #555; }\n.hobbies { list-style: none; padding: 0; }\n.link { display: inline-block; padding: 8px 16px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; }\n"},"hint":{"ru":"<p>Пример для круглой картинки: <code>.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto; }</code>. Тень: <code>box-shadow: 0 8px 24px rgba(0,0,0,.15);</code>.</p>","de":"<p>Beispiel für ein rundes Bild: <code>.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto; }</code>. Schatten: <code>box-shadow: 0 8px 24px rgba(0,0,0,.15);</code>.</p>"},"quiz":[{"q":{"ru":"Какое свойство делает картинку круглой?","de":"Welche Eigenschaft macht ein Bild rund?"},"o":[{"ru":"border-radius: 50%","de":"border-radius: 50%"},{"ru":"margin: 50%","de":"margin: 50%"},{"ru":"round: yes","de":"round: yes"}],"a":0},{"q":{"ru":"Что нужно сделать, чтобы CSS из <code>style.css</code> заработал?","de":"Was muss man tun, damit das CSS aus <code>style.css</code> wirkt?"},"o":[{"ru":"Подключить файл тегом &lt;link&gt;","de":"Die Datei mit &lt;link&gt; einbinden"},{"ru":"Переименовать файл в style.html","de":"Die Datei in style.html umbenennen"},{"ru":"Ничего","de":"Nichts"}],"a":0}],"proj":true},{"day":15,"week":3,"title":{"ru":"Инструменты разработчика: находим ошибки","de":"Entwicklerwerkzeuge: Fehler finden"},"goal":{"ru":"Открывать инструменты браузера, читать чужой код и исправлять ошибки.","de":"Die Browser-Werkzeuge öffnen, fremden Code lesen und Fehler korrigieren."},"theory":{"ru":"<p>В каждом браузере есть <b>инструменты разработчика</b>. Открой их так: правая кнопка мыши по элементу → «Просмотреть код» (Inspect), или <code>F12</code> (на Mac: <code>Cmd+Option+I</code>). Попробуй прямо сейчас: нажми правой кнопкой на результат справа и выбери «Просмотреть код».</p><ul><li><b>Elements</b> — дерево HTML. Наведи курсор на строку: элемент подсветится на странице.</li><li><b>Styles</b> — правила CSS выбранного элемента. Зачёркнутые строки — перебитые или неверные правила. Значения можно менять прямо там и сразу видеть результат.</li><li><b>Computed</b> — итоговые стили и схема коробки (margin, border, padding).</li><li><b>Console</b> — сообщения об ошибках.</li></ul><p><b>Важно:</b> изменения в инструментах не сохраняются, это только эксперимент. Удачное нужно перенести в свой код.</p><p>Три самые частые ошибки новичков: опечатка в имени класса, опечатка в названии свойства и забытая точка с запятой.</p>","de":"<p>Jeder Browser hat <b>Entwicklerwerkzeuge</b>. So öffnest du sie: Rechtsklick auf ein Element → „Untersuchen“ (Inspect), oder <code>F12</code> (am Mac: <code>Cmd+Option+I</code>). Probiere es gleich aus: Klicke rechts auf das Ergebnis und wähle „Untersuchen“.</p><ul><li><b>Elements</b> — der HTML-Baum. Fahre mit der Maus über eine Zeile: Das Element wird auf der Seite markiert.</li><li><b>Styles</b> — die CSS-Regeln des gewählten Elements. Durchgestrichene Zeilen sind überschriebene oder fehlerhafte Regeln. Werte kann man dort direkt ändern und sieht das Ergebnis sofort.</li><li><b>Computed</b> — die endgültigen Stile und das Boxschema (margin, border, padding).</li><li><b>Console</b> — Fehlermeldungen.</li></ul><p><b>Wichtig:</b> Änderungen in den Werkzeugen werden nicht gespeichert, das ist nur ein Experiment. Das Gelungene musst du in deinen Code übertragen.</p><p>Die drei häufigsten Anfängerfehler: ein Tippfehler im Klassennamen, ein Tippfehler im Eigenschaftsnamen und ein vergessenes Semikolon.</p>"},"task":{"ru":"<p>В этом коде спрятаны <b>три ошибки</b>. Из-за них заголовок не фиолетовый, а блок без фона и отступов. Найди и исправь их, глядя на результат и читая код:</p><ol><li>Заголовок не красится.</li><li>У блока нет фона.</li><li>У блока нет отступа и скругления.</li></ol>","de":"<p>In diesem Code stecken <b>drei Fehler</b>. Deshalb ist die Überschrift nicht violett und der Block ohne Hintergrund und Abstand. Finde und korrigiere sie, indem du das Ergebnis ansiehst und den Code liest:</p><ol><li>Die Überschrift wird nicht gefärbt.</li><li>Der Block hat keinen Hintergrund.</li><li>Der Block hat keinen Abstand und keine runden Ecken.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .titel {\n      color: #5b48e8;\n    }\n    .box {\n      backgroud-color: #fff3d6;\n      padding: 20px\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Найди ошибки</h1>\n  <div class=\"box\">\n    <p>Этот блок должен быть светло-жёлтым, с отступом и скруглёнными углами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    .titel {\n      color: #5b48e8;\n    }\n    .box {\n      backgroud-color: #fff3d6;\n      padding: 20px\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Finde die Fehler</h1>\n  <div class=\"box\">\n    <p>Dieser Block soll hellgelb sein, mit Abstand und runden Ecken.</p>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"Заголовок <code>h1</code> цветной","de":"Die Überschrift <code>h1</code> ist farbig"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"У <code>.box</code> есть фон","de":"<code>.box</code> hat einen Hintergrund"},"s":".box","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"У <code>.box</code> есть отступ <code>padding</code>","de":"<code>.box</code> hat einen <code>padding</code>"},"s":".box","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"У <code>.box</code> скруглены углы","de":"<code>.box</code> hat runde Ecken"},"s":".box","p":"border-top-left-radius","o":">=","n":8,"w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .title {\n      color: #5b48e8;\n    }\n    .box {\n      background-color: #fff3d6;\n      padding: 20px;\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Найди ошибки</h1>\n  <div class=\"box\">\n    <p>Этот блок должен быть светло-жёлтым, с отступом и скруглёнными углами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    .title {\n      color: #5b48e8;\n    }\n    .box {\n      background-color: #fff3d6;\n      padding: 20px;\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Finde die Fehler</h1>\n  <div class=\"box\">\n    <p>Dieser Block soll hellgelb sein, mit Abstand und runden Ecken.</p>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Ищи: (1) в HTML класс <code>title</code>, а в CSS <code>.titel</code>: имена не совпадают. (2) В слове <code>backgroud-color</code> не хватает буквы <code>n</code>. (3) После <code>padding: 20px</code> нет точки с запятой, и браузер слил две строки.</p>","de":"<p>Suche: (1) Im HTML steht die Klasse <code>title</code>, im CSS <code>.titel</code>: Die Namen stimmen nicht überein. (2) Im Wort <code>backgroud-color</code> fehlt der Buchstabe <code>n</code>. (3) Nach <code>padding: 20px</code> fehlt das Semikolon, und der Browser hat zwei Zeilen verschmolzen.</p>"},"quiz":[{"q":{"ru":"Что значит зачёркнутая строка в панели Styles?","de":"Was bedeutet eine durchgestrichene Zeile im Styles-Panel?"},"o":[{"ru":"Правило перебито другим или неверно","de":"Die Regel wurde überschrieben oder ist fehlerhaft"},{"ru":"Правило работает особенно сильно","de":"Die Regel wirkt besonders stark"},{"ru":"Файл удалён","de":"Die Datei ist gelöscht"}],"a":0},{"q":{"ru":"Сохраняются ли изменения, сделанные в инструментах разработчика?","de":"Werden Änderungen in den Entwicklerwerkzeugen gespeichert?"},"o":[{"ru":"Нет, их нужно перенести в код","de":"Nein, man muss sie in den Code übertragen"},{"ru":"Да, навсегда","de":"Ja, für immer"},{"ru":"Только на мобильном","de":"Nur auf dem Handy"}],"a":0}]},{"day":16,"week":3,"title":{"ru":"Блоки, строки и смысловые теги","de":"Blöcke, Zeilenelemente und semantische Tags"},"goal":{"ru":"Отличать блочные и строчные элементы и использовать смысловые теги.","de":"Block- und Zeilenelemente unterscheiden und semantische Tags nutzen."},"theory":{"ru":"<p><b>Блочные</b> элементы (<code>p</code>, <code>h1</code>, <code>div</code>) занимают всю строку и стоят друг под другом. <b>Строчные</b> (<code>a</code>, <code>span</code>, <code>strong</code>) стоят в строке с текстом и занимают столько места, сколько нужно.</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Это &lt;span class=\"accent\"&gt;важное&lt;/span&gt; слово.&lt;/p&gt;</pre><p><code>&lt;div&gt;</code> — универсальный блок, <code>&lt;span&gt;</code> — универсальный «кусочек» текста. Но есть теги с <b>смыслом</b>, их лучше использовать вместо безликих div:</p><ul><li><code>&lt;header&gt;</code> — шапка сайта или раздела</li><li><code>&lt;nav&gt;</code> — навигация (меню)</li><li><code>&lt;main&gt;</code> — главное содержимое (один на странице)</li><li><code>&lt;section&gt;</code> — тематический раздел</li><li><code>&lt;footer&gt;</code> — подвал</li></ul><p>Смысловые теги помогают поисковикам и программам для незрячих понять страницу.</p>","de":"<p><b>Blockelemente</b> (<code>p</code>, <code>h1</code>, <code>div</code>) nehmen die ganze Zeile ein und stehen untereinander. <b>Zeilenelemente</b> (<code>a</code>, <code>span</code>, <code>strong</code>) stehen im Text und nehmen nur so viel Platz wie nötig.</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Das ist ein &lt;span class=\"accent\"&gt;wichtiges&lt;/span&gt; Wort.&lt;/p&gt;</pre><p><code>&lt;div&gt;</code> ist ein universeller Block, <code>&lt;span&gt;</code> ein universelles Textstück. Aber es gibt Tags mit <b>Bedeutung</b>, die man statt gesichtsloser divs nutzen sollte:</p><ul><li><code>&lt;header&gt;</code> — Kopf der Website oder eines Abschnitts</li><li><code>&lt;nav&gt;</code> — Navigation (Menü)</li><li><code>&lt;main&gt;</code> — Hauptinhalt (einer pro Seite)</li><li><code>&lt;section&gt;</code> — thematischer Abschnitt</li><li><code>&lt;footer&gt;</code> — Fußbereich</li></ul><p>Semantische Tags helfen Suchmaschinen und Programmen für Blinde, die Seite zu verstehen.</p>"},"task":{"ru":"<p>Перед тобой страница из одних <code>div</code>. Переделай её:</p><ol><li>Замени div на <code>header</code>, <code>nav</code>, <code>main</code>, два <code>section</code> и <code>footer</code> (не забудь закрывающие теги!).</li><li>Вместо <code>&lt;b&gt;</code> вокруг слова «роботов» поставь <code>&lt;span class=\"accent\"&gt;</code>.</li><li>В CSS дай <code>.accent</code> цвет.</li></ol>","de":"<p>Vor dir steht eine Seite aus lauter <code>div</code>. Baue sie um:</p><ol><li>Ersetze die divs durch <code>header</code>, <code>nav</code>, <code>main</code>, zwei <code>section</code> und <code>footer</code> (vergiss die schließenden Tags nicht!).</li><li>Setze statt <code>&lt;b&gt;</code> um das Wort „Roboter“ ein <code>&lt;span class=\"accent\"&gt;</code>.</li><li>Gib <code>.accent</code> im CSS eine Farbe.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    /* стиль для .accent */\n  </style>\n</head>\n<body>\n  <div class=\"header\">\n    <h1>Мой клуб</h1>\n    <div class=\"nav\"><a href=\"#about\">О нас</a> <a href=\"#events\">События</a></div>\n  </div>\n  <div class=\"main\">\n    <div class=\"section\" id=\"about\">\n      <h2>О нас</h2>\n      <p>Мы встречаемся по субботам и делаем <b>роботов</b>.</p>\n    </div>\n    <div class=\"section\" id=\"events\">\n      <h2>События</h2>\n      <p>Ближайшая встреча в субботу в 10:00.</p>\n    </div>\n  </div>\n  <div class=\"footer\"><p>© 2025 Мой клуб</p></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    /* Stil für .accent */\n  </style>\n</head>\n<body>\n  <div class=\"header\">\n    <h1>Mein Club</h1>\n    <div class=\"nav\"><a href=\"#about\">Über uns</a> <a href=\"#events\">Termine</a></div>\n  </div>\n  <div class=\"main\">\n    <div class=\"section\" id=\"about\">\n      <h2>Über uns</h2>\n      <p>Wir treffen uns samstags und bauen <b>Roboter</b>.</p>\n    </div>\n    <div class=\"section\" id=\"events\">\n      <h2>Termine</h2>\n      <p>Das nächste Treffen ist am Samstag um 10:00 Uhr.</p>\n    </div>\n  </div>\n  <div class=\"footer\"><p>© 2025 Mein Club</p></div>\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть <code>&lt;header&gt;</code>","de":"Es gibt <code>&lt;header&gt;</code>"},"s":"header","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;nav&gt;</code>","de":"Es gibt <code>&lt;nav&gt;</code>"},"s":"nav","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;main&gt;</code>","de":"Es gibt <code>&lt;main&gt;</code>"},"s":"main","w":null},{"t":"count","m":{"ru":"Минимум два <code>&lt;section&gt;</code>","de":"Mindestens zwei <code>&lt;section&gt;</code>"},"s":"section","n":2,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;footer&gt;</code>","de":"Es gibt <code>&lt;footer&gt;</code>"},"s":"footer","w":null},{"t":"nocode","m":{"ru":"Не осталось ни одного <code>&lt;div&gt;</code>","de":"Es ist kein <code>&lt;div&gt;</code> mehr übrig"},"r":"<div","f":null},{"t":"has","m":{"ru":"Есть <code>&lt;span class=\"accent\"&gt;</code>","de":"Es gibt <code>&lt;span class=\"accent\"&gt;</code>"},"s":"span.accent","w":null},{"t":"cssnot","m":{"ru":"У <code>.accent</code> есть цвет","de":"<code>.accent</code> hat eine Farbe"},"s":".accent","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    .accent { color: #ee6a3c; font-weight: 700; }\n  </style>\n</head>\n<body>\n  <header>\n    <h1>Мой клуб</h1>\n    <nav><a href=\"#about\">О нас</a> <a href=\"#events\">События</a></nav>\n  </header>\n  <main>\n    <section id=\"about\">\n      <h2>О нас</h2>\n      <p>Мы встречаемся по субботам и делаем <span class=\"accent\">роботов</span>.</p>\n    </section>\n    <section id=\"events\">\n      <h2>События</h2>\n      <p>Ближайшая встреча в субботу в 10:00.</p>\n    </section>\n  </main>\n  <footer><p>© 2025 Мой клуб</p></footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    .accent { color: #ee6a3c; font-weight: 700; }\n  </style>\n</head>\n<body>\n  <header>\n    <h1>Mein Club</h1>\n    <nav><a href=\"#about\">Über uns</a> <a href=\"#events\">Termine</a></nav>\n  </header>\n  <main>\n    <section id=\"about\">\n      <h2>Über uns</h2>\n      <p>Wir treffen uns samstags und bauen <span class=\"accent\">Roboter</span>.</p>\n    </section>\n    <section id=\"events\">\n      <h2>Termine</h2>\n      <p>Das nächste Treffen ist am Samstag um 10:00 Uhr.</p>\n    </section>\n  </main>\n  <footer><p>© 2025 Mein Club</p></footer>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Открывающий <code>&lt;div class=\"header\"&gt;</code> становится <code>&lt;header&gt;</code>, а соответствующий закрывающий <code>&lt;/div&gt;</code> становится <code>&lt;/header&gt;</code>. Меняй парами, по очереди.</p>","de":"<p>Aus dem öffnenden <code>&lt;div class=\"header\"&gt;</code> wird <code>&lt;header&gt;</code>, und das passende schließende <code>&lt;/div&gt;</code> wird zu <code>&lt;/header&gt;</code>. Ändere Paar für Paar, nacheinander.</p>"},"quiz":[{"q":{"ru":"Какой из этих элементов строчный?","de":"Welches dieser Elemente ist ein Zeilenelement?"},"o":[{"ru":"&lt;span&gt;","de":"&lt;span&gt;"},{"ru":"&lt;div&gt;","de":"&lt;div&gt;"},{"ru":"&lt;h1&gt;","de":"&lt;h1&gt;"}],"a":0},{"q":{"ru":"Для чего нужен &lt;nav&gt;?","de":"Wozu ist &lt;nav&gt; da?"},"o":[{"ru":"Для навигации (меню)","de":"Für die Navigation (Menü)"},{"ru":"Для подвала","de":"Für den Fußbereich"},{"ru":"Для картинок","de":"Für Bilder"}],"a":0}]},{"day":17,"week":3,"title":{"ru":"Flexbox: элементы в ряд","de":"Flexbox: Elemente in einer Reihe"},"goal":{"ru":"Выстроить элементы в ряд и выровнять их с помощью flexbox.","de":"Elemente mit Flexbox in einer Reihe anordnen und ausrichten."},"theory":{"ru":"<p>Раньше блоки стояли друг под другом. <b>Flexbox</b> — способ управлять рядом элементов. Надо включить его у <b>родителя</b>, и все дети выстроятся в ряд:</p><pre class=\"ex\" data-l=\"css\">nav ul {\n  display: flex;                  /* включить flexbox */\n  gap: 16px;                      /* расстояние между элементами */\n  justify-content: space-between; /* как распределить по горизонтали */\n  align-items: center;            /* выравнивание по вертикали */\n  list-style: none;               /* убрать маркеры */\n  padding: 0;\n}</pre><ul><li><code>justify-content</code>: <code>flex-start</code> (к началу), <code>center</code> (по центру), <code>space-between</code> (по краям с равными промежутками), <code>space-around</code>.</li><li><code>align-items</code>: выравнивание поперёк ряда.</li><li>Запомни: <b>display: flex пишется у родителя</b>, а не у детей.</li></ul>","de":"<p>Bisher standen Blöcke untereinander. <b>Flexbox</b> ist eine Methode, eine Reihe von Elementen zu steuern. Man schaltet sie beim <b>Elternelement</b> ein, und alle Kinder ordnen sich in einer Reihe an:</p><pre class=\"ex\" data-l=\"css\">nav ul {\n  display: flex;                  /* Flexbox einschalten */\n  gap: 16px;                      /* Abstand zwischen Elementen */\n  justify-content: space-between; /* Verteilung horizontal */\n  align-items: center;            /* Ausrichtung vertikal */\n  list-style: none;               /* Aufzählungspunkte entfernen */\n  padding: 0;\n}</pre><ul><li><code>justify-content</code>: <code>flex-start</code> (zum Anfang), <code>center</code> (zentriert), <code>space-between</code> (an den Rändern mit gleichen Abständen), <code>space-around</code>.</li><li><code>align-items</code>: Ausrichtung quer zur Reihe.</li><li>Merke: <b>display: flex schreibt man beim Elternelement</b>, nicht bei den Kindern.</li></ul>"},"task":{"ru":"<p>Сделай из вертикального списка горизонтальное меню:</p><ol><li>Для <code>nav ul</code> включи <code>display: flex</code>.</li><li>Задай <code>gap</code> между пунктами (от 8px).</li><li>Распредели пункты: <code>justify-content</code> (например, <code>center</code>).</li><li>Убери маркеры <code>list-style: none</code> и <code>padding: 0</code>.</li></ol>","de":"<p>Mache aus der senkrechten Liste ein waagerechtes Menü:</p><ol><li>Schalte für <code>nav ul</code> <code>display: flex</code> ein.</li><li>Setze <code>gap</code> zwischen den Punkten (ab 8px).</li><li>Verteile die Punkte: <code>justify-content</code> (z. B. <code>center</code>).</li><li>Entferne die Punkte mit <code>list-style: none</code> und <code>padding: 0</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    /* твои правила для nav ul */\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Главная</a></li>\n      <li><a href=\"#\">Проекты</a></li>\n      <li><a href=\"#\">Блог</a></li>\n      <li><a href=\"#\">Контакты</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    /* deine Regeln für nav ul */\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Start</a></li>\n      <li><a href=\"#\">Projekte</a></li>\n      <li><a href=\"#\">Blog</a></li>\n      <li><a href=\"#\">Kontakt</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>nav ul</code>: <code>display: flex</code>","de":"<code>nav ul</code>: <code>display: flex</code>"},"s":"nav ul","p":"display","r":"^flex$","w":null},{"t":"cssnum","m":{"ru":"Есть <code>gap</code> от 8px","de":"Es gibt <code>gap</code> ab 8px"},"s":"nav ul","p":"column-gap","o":">=","n":8,"w":null},{"t":"cssnot","m":{"ru":"Задан <code>justify-content</code>","de":"<code>justify-content</code> ist gesetzt"},"s":"nav ul","p":"justify-content","r":"^(normal|flex-start)$","w":null},{"t":"css","m":{"ru":"Маркеры убраны","de":"Aufzählungspunkte sind entfernt"},"s":"nav ul","p":"list-style-type","r":"^none$","w":null},{"t":"cssnum","m":{"ru":"<code>padding: 0</code>","de":"<code>padding: 0</code>"},"s":"nav ul","p":"padding-left","o":"<=","n":0,"w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    nav ul { display: flex; gap: 16px; justify-content: center; align-items: center; list-style: none; padding: 0; margin: 0; }\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Главная</a></li>\n      <li><a href=\"#\">Проекты</a></li>\n      <li><a href=\"#\">Блог</a></li>\n      <li><a href=\"#\">Контакты</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    nav ul { display: flex; gap: 16px; justify-content: center; align-items: center; list-style: none; padding: 0; margin: 0; }\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Start</a></li>\n      <li><a href=\"#\">Projekte</a></li>\n      <li><a href=\"#\">Blog</a></li>\n      <li><a href=\"#\">Kontakt</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Одно правило: <code>nav ul { display: flex; gap: 16px; justify-content: center; list-style: none; padding: 0; }</code>.</p>","de":"<p>Eine Regel: <code>nav ul { display: flex; gap: 16px; justify-content: center; list-style: none; padding: 0; }</code>.</p>"},"quiz":[{"q":{"ru":"Где нужно писать <code>display: flex</code>?","de":"Wo muss man <code>display: flex</code> schreiben?"},"o":[{"ru":"У родителя (контейнера)","de":"Beim Elternelement (Container)"},{"ru":"У каждого ребёнка","de":"Bei jedem Kind"},{"ru":"В теге &lt;head&gt;","de":"Im Tag &lt;head&gt;"}],"a":0}]},{"day":18,"week":3,"title":{"ru":"Flexbox: карточки","de":"Flexbox: Karten"},"goal":{"ru":"Сделать ряд карточек, который сам переносится на новую строку.","de":"Eine Kartenreihe machen, die von selbst in die nächste Zeile umbricht."},"theory":{"ru":"<p>Flexbox умеет не только выстраивать в ряд, но и управлять шириной детей и переносом строк:</p><pre class=\"ex\" data-l=\"css\">.cards {\n  display: flex;\n  flex-wrap: wrap;        /* переносить на новую строку, если не помещаются */\n  gap: 16px;\n}\n.card {\n  flex: 1 1 200px;        /* расти, сжиматься, базовая ширина 200px */\n  padding: 16px;\n}</pre><p><code>flex: 1 1 200px</code> читается так: «хочу быть шириной примерно 200px, но если есть место, расти (<code>1</code>), а если мало, сжимайся (<code>1</code>)». Благодаря <code>flex-wrap: wrap</code> карточки не лезут за край, а переходят вниз.</p>","de":"<p>Flexbox kann nicht nur in einer Reihe anordnen, sondern auch die Breite der Kinder und den Umbruch steuern:</p><pre class=\"ex\" data-l=\"css\">.cards {\n  display: flex;\n  flex-wrap: wrap;        /* in die nächste Zeile umbrechen, wenn kein Platz ist */\n  gap: 16px;\n}\n.card {\n  flex: 1 1 200px;        /* wachsen, schrumpfen, Basisbreite 200px */\n  padding: 16px;\n}</pre><p><code>flex: 1 1 200px</code> liest sich so: „Ich will etwa 200px breit sein, aber wenn Platz ist, wachse (<code>1</code>), und wenn wenig Platz ist, schrumpfe (<code>1</code>).“ Durch <code>flex-wrap: wrap</code> ragen die Karten nicht über den Rand, sondern rutschen nach unten.</p>"},"task":{"ru":"<ol><li>Для <code>.cards</code>: <code>display: flex</code>, <code>flex-wrap: wrap</code> и <code>gap</code>.</li><li>Для <code>.card</code>: <code>flex: 1 1 200px</code>, <code>padding</code> от 10px, фон и скруглённые углы.</li><li>Потяни разделитель окна и посмотри на кнопки 📱 ▭ 🖥 над результатом: карточки перестраиваются.</li></ol>","de":"<ol><li>Für <code>.cards</code>: <code>display: flex</code>, <code>flex-wrap: wrap</code> und <code>gap</code>.</li><li>Für <code>.card</code>: <code>flex: 1 1 200px</code>, <code>padding</code> ab 10px, Hintergrund und runde Ecken.</li><li>Probiere die Knöpfe 📱 ▭ 🖥 über dem Ergebnis aus: Die Karten ordnen sich neu an.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* правила для .cards и .card */\n  </style>\n</head>\n<body>\n  <h1>Мои проекты</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Сайт</h2><p>Страница-визитка о моих увлечениях.</p></div>\n    <div class=\"card\"><h2>Робот</h2><p>Колёса, мотор и датчик расстояния.</p></div>\n    <div class=\"card\"><h2>Игра</h2><p>Простая игра, которую можно пройти за минуту.</p></div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* Regeln für .cards und .card */\n  </style>\n</head>\n<body>\n  <h1>Meine Projekte</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Website</h2><p>Eine Visitenkarten-Seite über meine Interessen.</p></div>\n    <div class=\"card\"><h2>Roboter</h2><p>Räder, Motor und ein Abstandssensor.</p></div>\n    <div class=\"card\"><h2>Spiel</h2><p>Ein einfaches Spiel, das man in einer Minute schafft.</p></div>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>.cards</code>: <code>display: flex</code>","de":"<code>.cards</code>: <code>display: flex</code>"},"s":".cards","p":"display","r":"^flex$","w":null},{"t":"css","m":{"ru":"<code>flex-wrap: wrap</code>","de":"<code>flex-wrap: wrap</code>"},"s":".cards","p":"flex-wrap","r":"^wrap$","w":null},{"t":"cssnum","m":{"ru":"Есть <code>gap</code>","de":"Es gibt <code>gap</code>"},"s":".cards","p":"column-gap","o":">=","n":8,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> растёт (<code>flex: 1 …</code>)","de":"<code>.card</code> wächst (<code>flex: 1 …</code>)"},"s":".card","p":"flex-grow","o":">=","n":1,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: padding от 10px","de":"<code>.card</code>: padding ab 10px"},"s":".card","p":"padding-top","o":">=","n":10,"w":null},{"t":"cssnot","m":{"ru":"<code>.card</code> с фоном","de":"<code>.card</code> mit Hintergrund"},"s":".card","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> со скруглёнными углами","de":"<code>.card</code> mit runden Ecken"},"s":".card","p":"border-top-left-radius","o":">=","n":6,"w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; flex-wrap: wrap; gap: 16px; }\n    .card { flex: 1 1 200px; padding: 16px; background: #ecebff; border-radius: 14px; }\n  </style>\n</head>\n<body>\n  <h1>Мои проекты</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Сайт</h2><p>Страница-визитка о моих увлечениях.</p></div>\n    <div class=\"card\"><h2>Робот</h2><p>Колёса, мотор и датчик расстояния.</p></div>\n    <div class=\"card\"><h2>Игра</h2><p>Простая игра, которую можно пройти за минуту.</p></div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; flex-wrap: wrap; gap: 16px; }\n    .card { flex: 1 1 200px; padding: 16px; background: #ecebff; border-radius: 14px; }\n  </style>\n</head>\n<body>\n  <h1>Meine Projekte</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Website</h2><p>Eine Visitenkarten-Seite über meine Interessen.</p></div>\n    <div class=\"card\"><h2>Roboter</h2><p>Räder, Motor und ein Abstandssensor.</p></div>\n    <div class=\"card\"><h2>Spiel</h2><p>Ein einfaches Spiel, das man in einer Minute schafft.</p></div>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Родитель: <code>.cards { display: flex; flex-wrap: wrap; gap: 16px; }</code>. Дети: <code>.card { flex: 1 1 200px; … }</code>.</p>","de":"<p>Eltern: <code>.cards { display: flex; flex-wrap: wrap; gap: 16px; }</code>. Kinder: <code>.card { flex: 1 1 200px; … }</code>.</p>"},"quiz":[{"q":{"ru":"Что делает <code>flex-wrap: wrap</code>?","de":"Was macht <code>flex-wrap: wrap</code>?"},"o":[{"ru":"Переносит элементы на новую строку, если не хватает места","de":"Bricht Elemente in die nächste Zeile um, wenn der Platz fehlt"},{"ru":"Упаковывает элементы в коробку","de":"Packt Elemente in eine Box"},{"ru":"Скрывает лишние элементы","de":"Versteckt überzählige Elemente"}],"a":0}]},{"day":19,"week":3,"title":{"ru":"Наведение и плавные переходы","de":"Hover und sanfte Übergänge"},"goal":{"ru":"Делать кнопки, которые реагируют на мышь, и добавлять плавность.","de":"Knöpfe machen, die auf die Maus reagieren, und Sanftheit hinzufügen."},"theory":{"ru":"<p><b>Псевдокласс</b> описывает состояние элемента. Самый известный — <code>:hover</code>, когда курсор над элементом:</p><pre class=\"ex\" data-l=\"css\">.btn {\n  background: #5b48e8;\n  color: #fff;\n  padding: 10px 20px;\n  border-radius: 999px;\n  text-decoration: none;\n  display: inline-block;\n  transition: background 0.3s;   /* плавно за 0,3 секунды */\n}\n.btn:hover {\n  background: #3e2fc4;           /* когда курсор сверху */\n}</pre><ul><li><code>transition</code> делает смену значения плавной, а не мгновенной.</li><li><code>cursor: pointer</code> показывает «руку» над кликабельным.</li><li><code>transform: scale(1.05)</code> слегка увеличивает элемент: можно добавить в <code>:hover</code>.</li><li>Есть и другие состояния: <code>:focus</code> (выбран с клавиатуры), <code>:active</code> (нажат). Для удобства людей без мыши <code>:focus</code> стоит оформлять так же, как <code>:hover</code>.</li></ul>","de":"<p>Eine <b>Pseudoklasse</b> beschreibt einen Zustand eines Elements. Die bekannteste ist <code>:hover</code>, wenn der Mauszeiger über dem Element ist:</p><pre class=\"ex\" data-l=\"css\">.btn {\n  background: #5b48e8;\n  color: #fff;\n  padding: 10px 20px;\n  border-radius: 999px;\n  text-decoration: none;\n  display: inline-block;\n  transition: background 0.3s;   /* sanft in 0,3 Sekunden */\n}\n.btn:hover {\n  background: #3e2fc4;           /* wenn der Zeiger darüber ist */\n}</pre><ul><li><code>transition</code> macht den Wechsel eines Wertes sanft statt abrupt.</li><li><code>cursor: pointer</code> zeigt die „Hand“ über etwas Klickbarem.</li><li><code>transform: scale(1.05)</code> vergrößert ein Element leicht: Man kann es in <code>:hover</code> einsetzen.</li><li>Es gibt weitere Zustände: <code>:focus</code> (per Tastatur ausgewählt), <code>:active</code> (gedrückt). Für Menschen ohne Maus sollte <code>:focus</code> genauso gestaltet werden wie <code>:hover</code>.</li></ul>"},"task":{"ru":"<ol><li>Оформи ссылку-кнопку <code>.btn</code>: фон, цвет текста, <code>padding</code> от 8px, скруглённые углы, без подчёркивания, <code>display: inline-block</code>.</li><li>Добавь <code>.btn:hover</code> с другим цветом фона.</li><li>Добавь плавность <code>transition</code>.</li></ol>","de":"<ol><li>Gestalte den Link-Knopf <code>.btn</code>: Hintergrund, Textfarbe, <code>padding</code> ab 8px, runde Ecken, ohne Unterstreichung, <code>display: inline-block</code>.</li><li>Füge <code>.btn:hover</code> mit anderer Hintergrundfarbe hinzu.</li><li>Füge die Sanftheit mit <code>transition</code> hinzu.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* стили для .btn и .btn:hover */\n  </style>\n</head>\n<body>\n  <h1>Кнопка</h1>\n  <p>Наведи курсор на кнопку:</p>\n  <a class=\"btn\" href=\"#\">Нажми меня</a>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* Stile für .btn und .btn:hover */\n  </style>\n</head>\n<body>\n  <h1>Knopf</h1>\n  <p>Fahre mit dem Zeiger über den Knopf:</p>\n  <a class=\"btn\" href=\"#\">Drück mich</a>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"У <code>.btn</code> есть фон","de":"<code>.btn</code> hat einen Hintergrund"},"s":".btn","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"<code>.btn</code>: padding от 8px","de":"<code>.btn</code>: padding ab 8px"},"s":".btn","p":"padding-top","o":">=","n":8,"w":null},{"t":"cssnum","m":{"ru":"<code>.btn</code> со скруглёнными углами","de":"<code>.btn</code> mit runden Ecken"},"s":".btn","p":"border-top-left-radius","o":">=","n":4,"w":null},{"t":"cssnot","m":{"ru":"Без подчёркивания","de":"Ohne Unterstreichung"},"s":".btn","p":"text-decoration-line","r":"^underline$","w":null},{"t":"code","m":{"ru":"Есть правило <code>.btn:hover</code>","de":"Es gibt die Regel <code>.btn:hover</code>"},"r":"\\.btn:hover\\s*\\{","f":null},{"t":"code","m":{"ru":"Есть <code>transition</code>","de":"Es gibt <code>transition</code>"},"r":"transition\\s*:","f":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background 0.3s; }\n    .btn:hover { background: #3e2fc4; }\n  </style>\n</head>\n<body>\n  <h1>Кнопка</h1>\n  <p>Наведи курсор на кнопку:</p>\n  <a class=\"btn\" href=\"#\">Нажми меня</a>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background 0.3s; }\n    .btn:hover { background: #3e2fc4; }\n  </style>\n</head>\n<body>\n  <h1>Knopf</h1>\n  <p>Fahre mit dem Zeiger über den Knopf:</p>\n  <a class=\"btn\" href=\"#\">Drück mich</a>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Ссылка по умолчанию подчёркнута: убери <code>text-decoration: none;</code>. Правило наведения пишется отдельно: <code>.btn:hover { … }</code>.</p>","de":"<p>Ein Link ist standardmäßig unterstrichen: Entferne das mit <code>text-decoration: none;</code>. Die Hover-Regel schreibt man separat: <code>.btn:hover { … }</code>.</p>"},"quiz":[{"q":{"ru":"Что делает <code>transition</code>?","de":"Was macht <code>transition</code>?"},"o":[{"ru":"Делает смену стиля плавной","de":"Macht den Stilwechsel sanft"},{"ru":"Открывает новую страницу","de":"Öffnet eine neue Seite"},{"ru":"Удаляет стили","de":"Löscht Stile"}],"a":0}]},{"day":20,"week":3,"title":{"ru":"Адаптивность: сайт и на телефоне","de":"Responsive Design: auch auf dem Handy"},"goal":{"ru":"Сделать страницу удобной на экранах разных размеров.","de":"Die Seite auf Bildschirmen verschiedener Größen gut nutzbar machen."},"theory":{"ru":"<p>Больше половины людей открывают сайты на телефоне. Сайт должен сам подстраиваться. Три шага:</p><ol><li>Строка в <code>&lt;head&gt;</code>: <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code>. Без неё телефон показывает страницу уменьшенной, как на компьютере.</li><li>Гибкие картинки: <code>img { max-width: 100%; height: auto; }</code> — картинка не шире экрана.</li><li><b>Медиазапрос</b> — правила только для узких экранов:</li></ol><pre class=\"ex\" data-l=\"css\">@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;   /* на узком экране карточки друг под другом */\n  }\n}</pre><p>Кнопки <b>📱 ▭ 🖥</b> над результатом меняют ширину окна просмотра: проверяй так, как увидит посетитель.</p>","de":"<p>Mehr als die Hälfte der Menschen öffnet Websites auf dem Handy. Die Seite muss sich selbst anpassen. Drei Schritte:</p><ol><li>Eine Zeile in <code>&lt;head&gt;</code>: <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code>. Ohne sie zeigt das Handy die Seite verkleinert wie am Computer.</li><li>Flexible Bilder: <code>img { max-width: 100%; height: auto; }</code> — das Bild ist nie breiter als der Bildschirm.</li><li>Eine <b>Media Query</b> — Regeln nur für schmale Bildschirme:</li></ol><pre class=\"ex\" data-l=\"css\">@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;   /* auf schmalem Bildschirm Karten untereinander */\n  }\n}</pre><p>Die Knöpfe <b>📱 ▭ 🖥</b> über dem Ergebnis ändern die Breite der Vorschau: Prüfe so, wie der Besucher es sehen wird.</p>"},"task":{"ru":"<ol><li>Добавь в <code>&lt;head&gt;</code> строку <code>viewport</code>.</li><li>Задай картинке <code>max-width: 100%; height: auto;</code>.</li><li>Напиши <code>@media (max-width: 600px)</code>, где <code>.cards</code> получают <code>flex-direction: column</code>.</li><li>Нажми 📱 над результатом: карточки должны стоять друг под другом.</li></ol>","de":"<ol><li>Füge in <code>&lt;head&gt;</code> die <code>viewport</code>-Zeile hinzu.</li><li>Gib dem Bild <code>max-width: 100%; height: auto;</code>.</li><li>Schreibe <code>@media (max-width: 600px)</code>, in der <code>.cards</code> <code>flex-direction: column</code> bekommt.</li><li>Drücke 📱 über dem Ergebnis: Die Karten sollen untereinander stehen.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    /* добавь правила для картинки и @media */\n  </style>\n</head>\n<body>\n  <h1>Адаптивная страница</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Раз</div>\n    <div class=\"card\">Два</div>\n    <div class=\"card\">Три</div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    /* füge Regeln für das Bild und @media hinzu */\n  </style>\n</head>\n<body>\n  <h1>Responsive Seite</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Eins</div>\n    <div class=\"card\">Zwei</div>\n    <div class=\"card\">Drei</div>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть <code>meta viewport</code>","de":"Es gibt <code>meta viewport</code>"},"r":"<meta[^>]+name=[\"\\']viewport[\"\\']","f":null},{"t":"css","m":{"ru":"Картинка: <code>max-width: 100%</code>","de":"Bild: <code>max-width: 100%</code>"},"s":"img","p":"max-width","r":"^100%$","w":null},{"t":"code","m":{"ru":"Есть медиазапрос <code>@media (max-width: …)</code>","de":"Es gibt eine Media Query <code>@media (max-width: …)</code>"},"r":"@media\\s*\\(\\s*max-width","f":null},{"t":"css","m":{"ru":"На широком экране карточки в ряд","de":"Auf breitem Bildschirm stehen die Karten nebeneinander"},"s":".cards","p":"flex-direction","r":"^row$","w":null},{"t":"css","m":{"ru":"На узком экране (400px) карточки друг под другом","de":"Auf schmalem Bildschirm (400px) stehen die Karten untereinander"},"s":".cards","p":"flex-direction","r":"^column$","w":400}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    img { max-width: 100%; height: auto; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    @media (max-width: 600px) {\n      .cards { flex-direction: column; }\n    }\n  </style>\n</head>\n<body>\n  <h1>Адаптивная страница</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Раз</div>\n    <div class=\"card\">Два</div>\n    <div class=\"card\">Три</div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    img { max-width: 100%; height: auto; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    @media (max-width: 600px) {\n      .cards { flex-direction: column; }\n    }\n  </style>\n</head>\n<body>\n  <h1>Responsive Seite</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Eins</div>\n    <div class=\"card\">Zwei</div>\n    <div class=\"card\">Drei</div>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Строка viewport идёт в <code>&lt;head&gt;</code> после <code>meta charset</code>. Медиазапрос — отдельный блок <code>@media (max-width: 600px) { … }</code>, внутри него обычные правила.</p>","de":"<p>Die viewport-Zeile steht in <code>&lt;head&gt;</code> nach <code>meta charset</code>. Die Media Query ist ein eigener Block <code>@media (max-width: 600px) { … }</code> mit normalen Regeln darin.</p>"},"quiz":[{"q":{"ru":"Когда срабатывает <code>@media (max-width: 600px)</code>?","de":"Wann greift <code>@media (max-width: 600px)</code>?"},"o":[{"ru":"Когда экран не шире 600px","de":"Wenn der Bildschirm höchstens 600px breit ist"},{"ru":"Когда экран шире 600px","de":"Wenn der Bildschirm breiter als 600px ist"},{"ru":"Всегда","de":"Immer"}],"a":0}]},{"day":21,"week":3,"title":{"ru":"Проект недели: лендинг клуба","de":"Wochenprojekt: Landingpage eines Clubs"},"goal":{"ru":"Собрать полноценную адаптивную страницу из шапки, героя, карточек и подвала.","de":"Eine vollständige responsive Seite aus Kopf, Held-Bereich, Karten und Fußbereich bauen."},"theory":{"ru":"<p>Сегодня у тебя готовый HTML (прочитай его: найди <code>header</code>, <code>nav</code>, секции, <code>article</code>, <code>footer</code> и их классы) и пустой <code>style.css</code>. Твоя работа — сделать из голой страницы настоящий сайт.</p><p>План: сначала общие стили (<code>body</code>, <code>box-sizing</code>), потом шапка и меню, потом hero, карточки, подвал, и в конце адаптивность. После каждого блока смотри результат.</p>","de":"<p>Heute hast du ein fertiges HTML (lies es: Finde <code>header</code>, <code>nav</code>, die Abschnitte, <code>article</code>, <code>footer</code> und ihre Klassen) und eine leere <code>style.css</code>. Deine Arbeit: aus der nackten Seite eine richtige Website machen.</p><p>Plan: zuerst die allgemeinen Stile (<code>body</code>, <code>box-sizing</code>), dann Kopf und Menü, dann Hero, Karten, Fußbereich, am Ende die Anpassung an kleine Bildschirme. Schau nach jedem Block das Ergebnis an.</p>"},"task":{"ru":"<p>Оформи страницу в <code>style.css</code>:</p><ol><li><code>.top</code> — flex, элементы по краям; <code>nav</code> — flex с <code>gap</code>.</li><li><code>.hero</code> — по центру, фон-градиент, <code>h1</code> крупнее 32px.</li><li><code>.btn</code> — кнопка с фоном и <code>:hover</code>.</li><li><code>.cards</code> — flex с переносом, <code>.card</code> с отступами, скруглением и <code>:hover</code>.</li><li><code>.foot</code> — по центру с фоном.</li><li><code>@media (max-width: 600px)</code> — карточки в колонку.</li></ol>","de":"<p>Gestalte die Seite in <code>style.css</code>:</p><ol><li><code>.top</code> — flex, Elemente an den Rändern; <code>nav</code> — flex mit <code>gap</code>.</li><li><code>.hero</code> — zentriert, Farbverlauf, <code>h1</code> größer als 32px.</li><li><code>.btn</code> — Knopf mit Hintergrund und <code>:hover</code>.</li><li><code>.cards</code> — flex mit Umbruch, <code>.card</code> mit Abständen, runden Ecken und <code>:hover</code>.</li><li><code>.foot</code> — zentriert mit Hintergrund.</li><li><code>@media (max-width: 600px)</code> — Karten in einer Spalte.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Клуб мейкеров</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Клуб мейкеров</strong>\n    <nav>\n      <a href=\"#about\">О клубе</a>\n      <a href=\"#events\">События</a>\n      <a href=\"#join\">Вступить</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Клуб юных мейкеров</h1>\n    <p>Паяем, программируем и придумываем.</p>\n    <a class=\"btn\" href=\"#join\">Вступить</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Мастерим</h2><p>Собираем настоящие устройства.</p></article>\n    <article class=\"card\"><h2>Программируем</h2><p>Пишем код и сразу видим результат.</p></article>\n    <article class=\"card\"><h2>Показываем</h2><p>Делимся проектами с друзьями.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Клуб юных мейкеров</p>\n  </footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Maker-Club</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Maker-Club</strong>\n    <nav>\n      <a href=\"#about\">Über den Club</a>\n      <a href=\"#events\">Termine</a>\n      <a href=\"#join\">Mitmachen</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Club junger Maker</h1>\n    <p>Wir löten, programmieren und erfinden.</p>\n    <a class=\"btn\" href=\"#join\">Mitmachen</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Basteln</h2><p>Wir bauen echte Geräte.</p></article>\n    <article class=\"card\"><h2>Programmieren</h2><p>Wir schreiben Code und sehen sofort das Ergebnis.</p></article>\n    <article class=\"card\"><h2>Zeigen</h2><p>Wir teilen Projekte mit Freunden.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Club junger Maker</p>\n  </footer>\n</body>\n</html>\n"},"style.css":"/* Оформи лендинг / Gestalte die Landingpage */\n"},"checks":[{"t":"css","m":{"ru":"<code>.top</code>: flex","de":"<code>.top</code>: flex"},"s":".top","p":"display","r":"^flex$","w":null},{"t":"css","m":{"ru":"<code>.top</code>: элементы по краям","de":"<code>.top</code>: Elemente an den Rändern"},"s":".top","p":"justify-content","r":"^space-between$","w":null},{"t":"css","m":{"ru":"<code>nav</code>: flex","de":"<code>nav</code>: flex"},"s":"nav","p":"display","r":"^flex$","w":null},{"t":"cssnum","m":{"ru":"Меню с <code>gap</code>","de":"Menü mit <code>gap</code>"},"s":"nav","p":"column-gap","o":">=","n":8,"w":null},{"t":"css","m":{"ru":"<code>.hero</code> по центру","de":"<code>.hero</code> zentriert"},"s":".hero","p":"text-align","r":"^center$","w":null},{"t":"code","m":{"ru":"У <code>.hero</code> есть фон","de":"<code>.hero</code> hat einen Hintergrund"},"r":"\\.hero\\s*\\{[^}]*background","f":"style.css"},{"t":"cssnum","m":{"ru":"Заголовок hero крупнее 32px","de":"Hero-Überschrift größer als 32px"},"s":".hero h1","p":"font-size","o":">=","n":32,"w":null},{"t":"cssnot","m":{"ru":"У <code>.btn</code> есть фон","de":"<code>.btn</code> hat einen Hintergrund"},"s":".btn","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"Есть <code>.btn:hover</code>","de":"Es gibt <code>.btn:hover</code>"},"r":"\\.btn:hover","f":"style.css"},{"t":"css","m":{"ru":"<code>.cards</code>: flex","de":"<code>.cards</code>: flex"},"s":".cards","p":"display","r":"^flex$","w":null},{"t":"css","m":{"ru":"<code>.cards</code>: перенос строк","de":"<code>.cards</code>: Zeilenumbruch"},"s":".cards","p":"flex-wrap","r":"^wrap$","w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: отступ","de":"<code>.card</code>: Innenabstand"},"s":".card","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: скругление","de":"<code>.card</code>: runde Ecken"},"s":".card","p":"border-top-left-radius","o":">=","n":8,"w":null},{"t":"code","m":{"ru":"Есть <code>.card:hover</code>","de":"Es gibt <code>.card:hover</code>"},"r":"\\.card:hover","f":"style.css"},{"t":"css","m":{"ru":"<code>.foot</code> по центру","de":"<code>.foot</code> zentriert"},"s":".foot","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"На узком экране карточки в колонку","de":"Auf schmalem Bildschirm stehen die Karten in einer Spalte"},"s":".cards","p":"flex-direction","r":"^column$","w":400}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Клуб мейкеров</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Клуб мейкеров</strong>\n    <nav>\n      <a href=\"#about\">О клубе</a>\n      <a href=\"#events\">События</a>\n      <a href=\"#join\">Вступить</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Клуб юных мейкеров</h1>\n    <p>Паяем, программируем и придумываем.</p>\n    <a class=\"btn\" href=\"#join\">Вступить</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Мастерим</h2><p>Собираем настоящие устройства.</p></article>\n    <article class=\"card\"><h2>Программируем</h2><p>Пишем код и сразу видим результат.</p></article>\n    <article class=\"card\"><h2>Показываем</h2><p>Делимся проектами с друзьями.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Клуб юных мейкеров</p>\n  </footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Maker-Club</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Maker-Club</strong>\n    <nav>\n      <a href=\"#about\">Über den Club</a>\n      <a href=\"#events\">Termine</a>\n      <a href=\"#join\">Mitmachen</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Club junger Maker</h1>\n    <p>Wir löten, programmieren und erfinden.</p>\n    <a class=\"btn\" href=\"#join\">Mitmachen</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Basteln</h2><p>Wir bauen echte Geräte.</p></article>\n    <article class=\"card\"><h2>Programmieren</h2><p>Wir schreiben Code und sehen sofort das Ergebnis.</p></article>\n    <article class=\"card\"><h2>Zeigen</h2><p>Wir teilen Projekte mit Freunden.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Club junger Maker</p>\n  </footer>\n</body>\n</html>\n"},"style.css":"* { box-sizing: border-box; }\nbody { margin: 0; font-family: Arial, sans-serif; color: #15172e; }\n.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #15172e; color: #fff; }\nnav { display: flex; gap: 16px; }\nnav a { color: #fff; text-decoration: none; }\n.hero { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #cfeaff, #fde8ff); }\n.hero h1 { font-size: 40px; margin: 0 0 12px; }\n.btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background .3s; }\n.btn:hover { background: #3e2fc4; }\n.cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px 20px; }\n.card { flex: 1 1 220px; padding: 20px; background: #f2f1fc; border-radius: 14px; transition: transform .2s; }\n.card:hover { transform: translateY(-4px); }\n.foot { text-align: center; padding: 20px; background: #ecebff; }\n@media (max-width: 600px) {\n  .cards { flex-direction: column; }\n  .top { flex-direction: column; gap: 8px; }\n}\n"},"hint":{"ru":"<p>Не пиши всё сразу: сначала <code>.top</code> и <code>nav</code>, проверь. Потом <code>.hero</code>. Если блок не меняется, проверь, что класс в CSS совпадает с классом в HTML, и что есть точка в начале.</p>","de":"<p>Schreibe nicht alles auf einmal: zuerst <code>.top</code> und <code>nav</code>, prüfen. Dann <code>.hero</code>. Wenn sich ein Block nicht ändert, prüfe, ob die Klasse im CSS mit der im HTML übereinstimmt und ob der Punkt am Anfang steht.</p>"},"quiz":[{"q":{"ru":"Что нужно, чтобы <code>nav</code> стоял в ряд?","de":"Was braucht <code>nav</code>, damit es in einer Reihe steht?"},"o":[{"ru":"<code>display: flex</code>","de":"<code>display: flex</code>"},{"ru":"<code>display: row</code>","de":"<code>display: row</code>"},{"ru":"<code>float: none</code>","de":"<code>float: none</code>"}],"a":0},{"q":{"ru":"Зачем в <code>head</code> нужна строка viewport?","de":"Wozu braucht <code>head</code> die viewport-Zeile?"},"o":[{"ru":"Чтобы страница правильно выглядела на телефоне","de":"Damit die Seite auf dem Handy richtig aussieht"},{"ru":"Чтобы страница быстрее грузилась","de":"Damit die Seite schneller lädt"},{"ru":"Для заголовка вкладки","de":"Für den Tab-Titel"}],"a":0}],"proj":true},{"day":22,"week":4,"title":{"ru":"Чуть-чуть JavaScript","de":"Ein bisschen JavaScript"},"goal":{"ru":"Увидеть, как страница оживает: кнопка меняет текст.","de":"Sehen, wie die Seite lebendig wird: Ein Knopf ändert Text."},"theory":{"ru":"<p>HTML — каркас, CSS — вид, <b>JavaScript</b> — поведение. Код JavaScript пишут в <code>&lt;script&gt;</code> в конце <code>&lt;body&gt;</code>. Сегодня только знакомство, на целый курс его не хватит.</p><pre class=\"ex\" data-l=\"js\">const btn = document.getElementById('btn');   // найти элемент по id\nbtn.addEventListener('click', function () {   // когда нажали\n  btn.textContent = 'Нажато!';                // поменять текст\n});</pre><ul><li><code>const</code> создаёт «коробочку» с именем (переменную).</li><li><code>document.getElementById('btn')</code> находит на странице элемент с <code>id=\"btn\"</code>.</li><li><code>addEventListener('click', …)</code> говорит: «когда на элемент нажмут, сделай вот это».</li><li><code>textContent</code> — текст элемента, его можно прочитать и поменять.</li><li>Две косые черты <code>//</code> — комментарий в JavaScript.</li></ul>","de":"<p>HTML ist das Gerüst, CSS das Aussehen, <b>JavaScript</b> das Verhalten. JavaScript-Code schreibt man in <code>&lt;script&gt;</code> am Ende von <code>&lt;body&gt;</code>. Heute ist es nur ein Kennenlernen, für einen ganzen Kurs reicht die Zeit nicht.</p><pre class=\"ex\" data-l=\"js\">const btn = document.getElementById('btn');   // Element per id finden\nbtn.addEventListener('click', function () {   // wenn geklickt wird\n  btn.textContent = 'Gedrückt!';              // Text ändern\n});</pre><ul><li><code>const</code> erstellt eine „Schachtel“ mit einem Namen (eine Variable).</li><li><code>document.getElementById('btn')</code> findet auf der Seite das Element mit <code>id=\"btn\"</code>.</li><li><code>addEventListener('click', …)</code> sagt: „Wenn auf das Element geklickt wird, tu dies.“</li><li><code>textContent</code> ist der Text des Elements, man kann ihn lesen und ändern.</li><li>Zwei Schrägstriche <code>//</code> sind in JavaScript ein Kommentar.</li></ul>"},"task":{"ru":"<ol><li>Найди в коде кнопку и абзац (<code>getElementById</code>).</li><li>Добавь обработчик клика (<code>addEventListener</code>).</li><li>Внутри поменяй <code>textContent</code> абзаца.</li><li>Нажми кнопку в результате справа: текст должен поменяться.</li></ol>","de":"<ol><li>Finde im Code den Knopf und den Absatz (<code>getElementById</code>).</li><li>Füge einen Klick-Handler hinzu (<code>addEventListener</code>).</li><li>Ändere darin den <code>textContent</code> des Absatzes.</li><li>Drücke im Ergebnis rechts den Knopf: Der Text soll sich ändern.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Кнопка-волшебница</h1>\n  <button id=\"btn\">Нажми меня</button>\n  <p id=\"msg\">Здесь появится сообщение.</p>\n  <script>\n    // 1. Найди кнопку и абзац по id\n    // 2. Когда на кнопку нажимают, поменяй текст абзаца\n  <\/script>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Zauberknopf</h1>\n  <button id=\"btn\">Drück mich</button>\n  <p id=\"msg\">Hier erscheint die Nachricht.</p>\n  <script>\n    // 1. Finde den Knopf und den Absatz per id\n    // 2. Wenn auf den Knopf gedrückt wird, ändere den Text des Absatzes\n  <\/script>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Найден элемент (<code>getElementById</code> или <code>querySelector</code>)","de":"Ein Element wurde gefunden (<code>getElementById</code> oder <code>querySelector</code>)"},"r":"getElementById|querySelector","f":null},{"t":"code","m":{"ru":"Есть обработчик клика","de":"Es gibt einen Klick-Handler"},"r":"addEventListener|onclick","f":null},{"t":"code","m":{"ru":"Текст элемента меняется (<code>textContent</code>)","de":"Der Text des Elements wird geändert (<code>textContent</code>)"},"r":"textContent|innerText|innerHTML","f":null},{"t":"code","m":{"ru":"В скрипте есть переменная (<code>const</code>)","de":"Im Skript gibt es eine Variable (<code>const</code>)"},"r":"<script>[\\s\\S]*(const|let|var)\\s+\\w+[\\s\\S]*<\/script>","f":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Кнопка-волшебница</h1>\n  <button id=\"btn\">Нажми меня</button>\n  <p id=\"msg\">Здесь появится сообщение.</p>\n  <script>\n    const btn = document.getElementById('btn');\n    const msg = document.getElementById('msg');\n    btn.addEventListener('click', function () {\n      msg.textContent = 'Ура, получилось!';\n    });\n  <\/script>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Zauberknopf</h1>\n  <button id=\"btn\">Drück mich</button>\n  <p id=\"msg\">Hier erscheint die Nachricht.</p>\n  <script>\n    const btn = document.getElementById('btn');\n    const msg = document.getElementById('msg');\n    btn.addEventListener('click', function () {\n      msg.textContent = 'Hurra, es hat geklappt!';\n    });\n  <\/script>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Три строки в скрипте: найти кнопку, найти абзац, повесить обработчик: <code>btn.addEventListener('click', function () { msg.textContent = 'Ура!'; });</code>. Для усложнения: пусть кнопка считает нажатия (<code>let count = 0;</code> и <code>count++</code>).</p>","de":"<p>Drei Zeilen im Skript: Knopf finden, Absatz finden, Handler anhängen: <code>btn.addEventListener('click', function () { msg.textContent = 'Hurra!'; });</code>. Zur Steigerung: Der Knopf soll die Klicks zählen (<code>let count = 0;</code> und <code>count++</code>).</p>"},"quiz":[{"q":{"ru":"Какой язык делает страницу «живой» (реагирует на нажатия)?","de":"Welche Sprache macht die Seite „lebendig“ (reagiert auf Klicks)?"},"o":[{"ru":"JavaScript","de":"JavaScript"},{"ru":"HTML","de":"HTML"},{"ru":"CSS","de":"CSS"}],"a":0},{"q":{"ru":"Что делает <code>getElementById('btn')</code>?","de":"Was macht <code>getElementById('btn')</code>?"},"o":[{"ru":"Находит элемент с id=\"btn\"","de":"Findet das Element mit id=\"btn\""},{"ru":"Создаёт новую кнопку","de":"Erstellt einen neuen Knopf"},{"ru":"Удаляет кнопку","de":"Löscht den Knopf"}],"a":0}]},{"day":23,"week":4,"title":{"ru":"Формы и доступность","de":"Formulare und Barrierefreiheit"},"goal":{"ru":"Сделать форму с подписями и вспомнить, как сделать сайт удобным для всех.","de":"Ein Formular mit Beschriftungen bauen und daran denken, die Seite für alle nutzbar zu machen."},"theory":{"ru":"<p>Форма собирает ввод от посетителя:</p><pre class=\"ex\" data-l=\"html\">&lt;form&gt;\n  &lt;label for=\"email\"&gt;Почта&lt;/label&gt;\n  &lt;input type=\"email\" id=\"email\" name=\"email\"&gt;\n  &lt;textarea id=\"msg\" name=\"msg\"&gt;&lt;/textarea&gt;\n  &lt;button type=\"submit\"&gt;Отправить&lt;/button&gt;\n&lt;/form&gt;</pre><ul><li><code>&lt;label for=\"email\"&gt;</code> — подпись. Значение <code>for</code> совпадает с <code>id</code> поля, тогда клик по подписи выбирает поле, а программы для незрячих читают, что это за поле.</li><li><code>type</code> у <code>input</code>: <code>text</code>, <code>email</code>, <code>number</code>, <code>password</code>… Браузер сам проверит, что в поле для почты есть @.</li><li><code>&lt;textarea&gt;</code> — большое поле. <code>&lt;button type=\"submit\"&gt;</code> — отправка.</li></ul><p><b>Важно:</b> просто HTML-форма никуда сообщение не отправит, для этого нужен сервер. На простом сайте обычно ставят ссылку <code>mailto:</code> или готовый сервис форм.</p><p><b>Доступность — это про всех:</b> <code>alt</code> у картинок, подписи у полей, один <code>h1</code> и заголовки по порядку, достаточный контраст, <code>lang</code> у страницы, возможность пройти сайт клавишей <code>Tab</code>. Попробуй пройти свою страницу без мыши!</p>","de":"<p>Ein Formular sammelt Eingaben vom Besucher:</p><pre class=\"ex\" data-l=\"html\">&lt;form&gt;\n  &lt;label for=\"email\"&gt;E-Mail&lt;/label&gt;\n  &lt;input type=\"email\" id=\"email\" name=\"email\"&gt;\n  &lt;textarea id=\"msg\" name=\"msg\"&gt;&lt;/textarea&gt;\n  &lt;button type=\"submit\"&gt;Senden&lt;/button&gt;\n&lt;/form&gt;</pre><ul><li><code>&lt;label for=\"email\"&gt;</code> — Beschriftung. Der Wert von <code>for</code> stimmt mit der <code>id</code> des Feldes überein: Dann wählt ein Klick auf die Beschriftung das Feld aus, und Programme für Blinde lesen vor, was das für ein Feld ist.</li><li><code>type</code> bei <code>input</code>: <code>text</code>, <code>email</code>, <code>number</code>, <code>password</code> … Der Browser prüft selbst, dass im E-Mail-Feld ein @ steht.</li><li><code>&lt;textarea&gt;</code> — großes Feld. <code>&lt;button type=\"submit\"&gt;</code> — Senden.</li></ul><p><b>Wichtig:</b> Ein reines HTML-Formular schickt die Nachricht nirgendwohin, dafür braucht man einen Server. Auf einer einfachen Website setzt man meist einen <code>mailto:</code>-Link oder einen fertigen Formular-Dienst ein.</p><p><b>Barrierefreiheit betrifft alle:</b> <code>alt</code> bei Bildern, Beschriftungen bei Feldern, ein <code>h1</code> und Überschriften in Reihenfolge, genug Kontrast, <code>lang</code> auf der Seite, die Seite mit der Taste <code>Tab</code> bedienbar. Probiere deine Seite ohne Maus durchzugehen!</p>"},"task":{"ru":"<ol><li>Сделай <code>&lt;form&gt;</code> с тремя полями: имя (<code>text</code>), почта (<code>email</code>), сообщение (<code>textarea</code>).</li><li>У каждого поля есть <code>&lt;label for=\"…\"&gt;</code>, совпадающий с <code>id</code>.</li><li>В конце кнопка <code>&lt;button type=\"submit\"&gt;</code>.</li><li>Пройди форму клавишей <code>Tab</code>.</li></ol>","de":"<ol><li>Mache ein <code>&lt;form&gt;</code> mit drei Feldern: Name (<code>text</code>), E-Mail (<code>email</code>), Nachricht (<code>textarea</code>).</li><li>Jedes Feld hat ein <code>&lt;label for=\"…\"&gt;</code>, das zur <code>id</code> passt.</li><li>Am Ende ein Knopf <code>&lt;button type=\"submit\"&gt;</code>.</li><li>Gehe das Formular mit der Taste <code>Tab</code> durch.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; }\n    input, textarea { width: 100%; padding: 8px; font: inherit; }\n  </style>\n</head>\n<body>\n  <h1>Напиши мне</h1>\n  <!-- Сделай форму: имя, почта, сообщение и кнопка отправки -->\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <st
