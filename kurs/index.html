 }</code>.</li></ol><p>Ссылка «События» в меню уже ведёт на <code>#events</code>. Проверь, что она сработала.</p>","de":"<p>Füge der Landingpage einen Abschnitt „Termine“ hinzu — so sehen Terminpläne auf Seiten von Clubs und Schulen aus:</p><ol><li>Setze vor die Fußzeile <code>&lt;section class=\"events\" id=\"events\"&gt;</code> mit einer Überschrift <code>&lt;h2&gt;</code> und drei Terminen <code>&lt;article class=\"event\"&gt;</code>.</li><li>In jedem Termin ein Datum <code>&lt;time datetime=\"…\"&gt;</code> und einen Namen <code>&lt;h3&gt;</code>.</li><li>Gestalte: <code>.event { display: flex; gap: 12px; border-bottom: 1px solid #ddd; padding: 10px 0; }</code> und fettes Datum <code>.event time { font-weight: 700; }</code>.</li></ol><p>Der Menülink „Termine“ führt schon zu <code>#events</code>. Prüfe, dass er funktioniert.</p>"},"lv3":{"ru":"<p>Последний раздел лендинга — форма вступления и плавная прокрутка:</p><ol><li>Добавь <code>&lt;section class=\"join\" id=\"join\"&gt;</code> с <code>&lt;form&gt;</code>: подпись <code>&lt;label for=\"mail\"&gt;</code>, поле <code>&lt;input type=\"email\" id=\"mail\"&gt;</code> и кнопка с классом <code>btn</code>.</li><li>Чтобы поле и кнопка стояли в ряд: <code>.join form { display: flex; gap: 8px; flex-wrap: wrap; }</code>.</li><li>Плавная прокрутка по меню: <code>html { scroll-behavior: smooth; }</code>. Нажми «Вступить» в меню и посмотри на анимацию.</li><li>Видимый фокус: <code>.join input:focus { outline: 3px solid #5b48e8; }</code>.</li></ol><p>Помни: форма пока ничего не отправляет. Для настоящей отправки нужен сервер, об этом на последнем занятии.</p>","de":"<p>Der letzte Abschnitt der Landingpage — Beitrittsformular und sanftes Scrollen:</p><ol><li>Füge <code>&lt;section class=\"join\" id=\"join\"&gt;</code> mit einem <code>&lt;form&gt;</code> hinzu: Beschriftung <code>&lt;label for=\"mail\"&gt;</code>, Feld <code>&lt;input type=\"email\" id=\"mail\"&gt;</code> und ein Knopf mit der Klasse <code>btn</code>.</li><li>Damit Feld und Knopf in einer Reihe stehen: <code>.join form { display: flex; gap: 8px; flex-wrap: wrap; }</code>.</li><li>Sanftes Scrollen über das Menü: <code>html { scroll-behavior: smooth; }</code>. Klicke im Menü auf „Beitreten“ und sieh dir die Animation an.</li><li>Sichtbarer Fokus: <code>.join input:focus { outline: 3px solid #5b48e8; }</code>.</li></ol><p>Denk daran: Das Formular sendet noch nichts. Zum echten Senden braucht man einen Server, davon in der letzten Lektion.</p>"}},{"day":22,"week":4,"title":{"ru":"Чуть-чуть JavaScript","de":"Ein bisschen JavaScript"},"goal":{"ru":"Увидеть, как страница оживает: кнопка меняет текст.","de":"Sehen, wie die Seite lebendig wird: Ein Knopf ändert Text."},"theory":{"ru":"<p>HTML — каркас, CSS — вид, <b>JavaScript</b> — поведение. Код JavaScript пишут в <code>&lt;script&gt;</code> в конце <code>&lt;body&gt;</code>. Сегодня только знакомство, на целый курс его не хватит.</p><pre class=\"ex\" data-l=\"js\">const btn = document.getElementById('btn');   // найти элемент по id\nbtn.addEventListener('click', function () {   // когда нажали\n  btn.textContent = 'Нажато!';                // поменять текст\n});</pre><ul><li><code>const</code> создаёт «коробочку» с именем (переменную).</li><li><code>document.getElementById('btn')</code> находит на странице элемент с <code>id=\"btn\"</code>.</li><li><code>addEventListener('click', …)</code> говорит: «когда на элемент нажмут, сделай вот это».</li><li><code>textContent</code> — текст элемента, его можно прочитать и поменять.</li><li>Две косые черты <code>//</code> — комментарий в JavaScript.</li></ul>","de":"<p>HTML ist das Gerüst, CSS das Aussehen, <b>JavaScript</b> das Verhalten. JavaScript-Code schreibt man in <code>&lt;script&gt;</code> am Ende von <code>&lt;body&gt;</code>. Heute ist es nur ein Kennenlernen, für einen ganzen Kurs reicht die Zeit nicht.</p><pre class=\"ex\" data-l=\"js\">const btn = document.getElementById('btn');   // Element per id finden\nbtn.addEventListener('click', function () {   // wenn geklickt wird\n  btn.textContent = 'Gedrückt!';              // Text ändern\n});</pre><ul><li><code>const</code> erstellt eine „Schachtel“ mit einem Namen (eine Variable).</li><li><code>document.getElementById('btn')</code> findet auf der Seite das Element mit <code>id=\"btn\"</code>.</li><li><code>addEventListener('click', …)</code> sagt: „Wenn auf das Element geklickt wird, tu dies.“</li><li><code>textContent</code> ist der Text des Elements, man kann ihn lesen und ändern.</li><li>Zwei Schrägstriche <code>//</code> sind in JavaScript ein Kommentar.</li></ul>"},"task":{"ru":"<ol><li>Найди в коде кнопку и абзац (<code>getElementById</code>).</li><li>Добавь обработчик клика (<code>addEventListener</code>).</li><li>Внутри поменяй <code>textContent</code> абзаца.</li><li>Нажми кнопку в результате справа: текст должен поменяться.</li></ol>","de":"<ol><li>Finde im Code den Knopf und den Absatz (<code>getElementById</code>).</li><li>Füge einen Klick-Handler hinzu (<code>addEventListener</code>).</li><li>Ändere darin den <code>textContent</code> des Absatzes.</li><li>Drücke im Ergebnis rechts den Knopf: Der Text soll sich ändern.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Кнопка-волшебница</h1>\n  <button id=\"btn\">Нажми меня</button>\n  <p id=\"msg\">Здесь появится сообщение.</p>\n  <script>\n    // 1. Найди кнопку и абзац по id\n    // 2. Когда на кнопку нажимают, поменяй текст абзаца\n  <\/script>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n  </style>\n</head>\n<body>\n  <h1>Zauberknopf</h1>\n  <button id=\"btn\">Drück mich</button>\n  <p id=\"msg\">Hier erscheint die Nachricht.</p>\n  <script>\n    // 1. Finde den Knopf und den Absatz per id\n    // 2. Wenn auf den Knopf gedrückt wird, ändere den Text des Absatzes\n  <\/script>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Найден элемент (<code>getElementById</code> или <code>querySelector</code>)","de":"Ein Element wurde gefunden (<code>getElementById</code> oder <code>querySelector</code>)"},"r":"getElementById|querySelector","f":null},{"t":"code","m":{"ru":"Есть обработчик клика","de":"Es gibt einen Klick-Handler"},"r":"addEventListener|onclick","f":null},{"t":"code","m":{"ru":"Текст элемента меняется (<code>textContent</code>)","de":"Der Text des Elements wird geändert (<code>textContent</code>)"},"r":"textContent|innerText|innerHTML","f":null},{"t":"code","m":{"ru":"В скрипте есть переменная (<code>const</code>)","de":"Im Skript gibt es eine Variable (<code>const</code>)"},"r":"<script>[\\s\\S]*(const|let|var)\\s+\\w+[\\s\\S]*<\/script>","f":null},{"t":"has","m":{"ru":"Есть кнопка <code>#plus</code>","de":"Es gibt den Knopf <code>#plus</code>"},"s":"#plus","w":null,"lv":2},{"t":"has","m":{"ru":"Есть элемент <code>#count</code>","de":"Es gibt das Element <code>#count</code>"},"s":"#count","w":null,"lv":2},{"t":"code","m":{"ru":"Есть переменная <code>let … = 0</code>","de":"Es gibt eine Variable <code>let … = 0</code>"},"r":"let\\s+\\w+\\s*=\\s*0","f":null,"lv":2},{"t":"code","m":{"ru":"Число увеличивается на 1","de":"Die Zahl wird um 1 erhöht"},"r":"\\w+\\s*=\\s*\\w+\\s*\\+\\s*1|\\+\\+","f":null,"lv":2},{"t":"has","m":{"ru":"Есть кнопка <code>#theme</code>","de":"Es gibt den Knopf <code>#theme</code>"},"s":"#theme","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть правило <code>.dark</code>","de":"Es gibt die Regel <code>.dark</code>"},"r":"\\.dark\\s*\\{","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Используется <code>classList.toggle</code>","de":"<code>classList.toggle</code> wird benutzt"},"r":"classList\\.toggle\\(","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n    .dark { background: #15172e; color: #fff; }\n  </style>\n</head>\n<body>\n  <h1>Кнопка-волшебница</h1>\n  <button id=\"btn\">Нажми меня</button>\n  <p id=\"msg\">Здесь появится сообщение.</p>\n  <button id=\"plus\">+1</button>\n  <p>Нажатий: <span id=\"count\">0</span></p>\n  <button id=\"theme\">Тёмная тема</button>\n  <script>\n    const btn = document.getElementById('btn');\n    const msg = document.getElementById('msg');\n    btn.addEventListener('click', function () {\n      msg.textContent = 'Ура, получилось!';\n    });\n    let clicks = 0;\n    const plus = document.getElementById('plus');\n    const count = document.getElementById('count');\n    plus.addEventListener('click', function () {\n      clicks = clicks + 1;\n      count.textContent = clicks;\n    });\n    document.getElementById('theme').addEventListener('click', function () {\n      document.body.classList.toggle('dark');\n    });\n  <\/script>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    button { padding: 8px 16px; font-size: 1rem; }\n    .dark { background: #15172e; color: #fff; }\n  </style>\n</head>\n<body>\n  <h1>Zauberknopf</h1>\n  <button id=\"btn\">Drück mich</button>\n  <p id=\"msg\">Hier erscheint die Nachricht.</p>\n  <button id=\"plus\">+1</button>\n  <p>Klicks: <span id=\"count\">0</span></p>\n  <button id=\"theme\">Dunkles Design</button>\n  <script>\n    const btn = document.getElementById('btn');\n    const msg = document.getElementById('msg');\n    btn.addEventListener('click', function () {\n      msg.textContent = 'Hurra, es hat geklappt!';\n    });\n    let clicks = 0;\n    const plus = document.getElementById('plus');\n    const count = document.getElementById('count');\n    plus.addEventListener('click', function () {\n      clicks = clicks + 1;\n      count.textContent = clicks;\n    });\n    document.getElementById('theme').addEventListener('click', function () {\n      document.body.classList.toggle('dark');\n    });\n  <\/script>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Три строки в скрипте: найти кнопку, найти абзац, повесить обработчик: <code>btn.addEventListener('click', function () { msg.textContent = 'Ура!'; });</code>. Для усложнения: пусть кнопка считает нажатия (<code>let count = 0;</code> и <code>count++</code>).</p>","de":"<p>Drei Zeilen im Skript: Knopf finden, Absatz finden, Handler anhängen: <code>btn.addEventListener('click', function () { msg.textContent = 'Hurra!'; });</code>. Zur Steigerung: Der Knopf soll die Klicks zählen (<code>let count = 0;</code> und <code>count++</code>).</p>"},"quiz":[{"q":{"ru":"Какой язык делает страницу «живой» (реагирует на нажатия)?","de":"Welche Sprache macht die Seite „lebendig“ (reagiert auf Klicks)?"},"o":[{"ru":"JavaScript","de":"JavaScript"},{"ru":"HTML","de":"HTML"},{"ru":"CSS","de":"CSS"}],"a":0},{"q":{"ru":"Что делает <code>getElementById('btn')</code>?","de":"Was macht <code>getElementById('btn')</code>?"},"o":[{"ru":"Находит элемент с id=\"btn\"","de":"Findet das Element mit id=\"btn\""},{"ru":"Создаёт новую кнопку","de":"Erstellt einen neuen Knopf"},{"ru":"Удаляет кнопку","de":"Löscht den Knopf"}],"a":0}],"lv2":{"ru":"<p>Сделай счётчик нажатий. Это первая программа с <b>памятью</b>:</p><ol><li>В HTML добавь <code>&lt;button id=\"plus\"&gt;+1&lt;/button&gt;</code> и <code>&lt;p&gt;Нажатий: &lt;span id=\"count\"&gt;0&lt;/span&gt;&lt;/p&gt;</code>.</li><li>В скрипте создай переменную: <code>let clicks = 0;</code> (<code>let</code> — значение можно менять, <code>const</code> — нельзя).</li><li>По клику на <code>plus</code>: <code>clicks = clicks + 1;</code> и покажи число в <code>count</code>: <code>count.textContent = clicks;</code>.</li></ol><p>Проверь руками: нажми на «+1» в окне результата. Число должно расти. Если не растёт, открой консоль (F12 → Console): там красным напишут, что не так.</p>","de":"<p>Baue einen Klickzähler. Das ist das erste Programm mit <b>Gedächtnis</b>:</p><ol><li>Füge im HTML <code>&lt;button id=\"plus\"&gt;+1&lt;/button&gt;</code> und <code>&lt;p&gt;Klicks: &lt;span id=\"count\"&gt;0&lt;/span&gt;&lt;/p&gt;</code> hinzu.</li><li>Lege im Skript eine Variable an: <code>let clicks = 0;</code> (<code>let</code> — der Wert darf sich ändern, <code>const</code> — nicht).</li><li>Beim Klick auf <code>plus</code>: <code>clicks = clicks + 1;</code> und zeige die Zahl in <code>count</code>: <code>count.textContent = clicks;</code>.</li></ol><p>Probiere es aus: Klicke im Ergebnisfenster auf „+1“. Die Zahl soll wachsen. Wenn nicht, öffne die Konsole (F12 → Console): Dort steht rot, was nicht stimmt.</p>"},"lv3":{"ru":"<p>Тёмная тема в одну строку. Так сделано на многих сайтах.</p><ol><li>Добавь кнопку <code>&lt;button id=\"theme\"&gt;Тёмная тема&lt;/button&gt;</code>.</li><li>В CSS: <code>.dark { background: #15172e; color: #fff; }</code>.</li><li>В JS: по клику на кнопку <code>document.body.classList.toggle('dark');</code>. Метод <code>toggle</code> включает класс, если его нет, и выключает, если есть.</li><li>Бонус: поменяй текст самой кнопки при каждом нажатии (подсказка: <code>if</code> / <code>else</code> и <code>classList.contains('dark')</code>).</li></ol><p>Ты только что соединил все три языка: HTML (кнопка), CSS (класс), JavaScript (переключатель).</p>","de":"<p>Dunkles Design in einer Zeile. So machen es viele Websites.</p><ol><li>Füge einen Knopf <code>&lt;button id=\"theme\"&gt;Dunkles Design&lt;/button&gt;</code> hinzu.</li><li>Im CSS: <code>.dark { background: #15172e; color: #fff; }</code>.</li><li>Im JS: Beim Klick auf den Knopf <code>document.body.classList.toggle('dark');</code>. Die Methode <code>toggle</code> schaltet die Klasse ein, wenn sie fehlt, und aus, wenn sie da ist.</li><li>Bonus: Ändere bei jedem Klick den Text des Knopfes selbst (Tipp: <code>if</code> / <code>else</code> und <code>classList.contains('dark')</code>).</li></ol><p>Du hast gerade alle drei Sprachen verbunden: HTML (Knopf), CSS (Klasse), JavaScript (Schalter).</p>"}},{"day":23,"week":4,"title":{"ru":"Формы и доступность","de":"Formulare und Barrierefreiheit"},"goal":{"ru":"Сделать форму с подписями и вспомнить, как сделать сайт удобным для всех.","de":"Ein Formular mit Beschriftungen bauen und daran denken, die Seite für alle nutzbar zu machen."},"theory":{"ru":"<p>Форма собирает ввод от посетителя:</p><pre class=\"ex\" data-l=\"html\">&lt;form&gt;\n  &lt;label for=\"email\"&gt;Почта&lt;/label&gt;\n  &lt;input type=\"email\" id=\"email\" name=\"email\"&gt;\n  &lt;textarea id=\"msg\" name=\"msg\"&gt;&lt;/textarea&gt;\n  &lt;button type=\"submit\"&gt;Отправить&lt;/button&gt;\n&lt;/form&gt;</pre><ul><li><code>&lt;label for=\"email\"&gt;</code> — подпись. Значение <code>for</code> совпадает с <code>id</code> поля, тогда клик по подписи выбирает поле, а программы для незрячих читают, что это за поле.</li><li><code>type</code> у <code>input</code>: <code>text</code>, <code>email</code>, <code>number</code>, <code>password</code>… Браузер сам проверит, что в поле для почты есть @.</li><li><code>&lt;textarea&gt;</code> — большое поле. <code>&lt;button type=\"submit\"&gt;</code> — отправка.</li></ul><p><b>Важно:</b> просто HTML-форма никуда сообщение не отправит, для этого нужен сервер. На простом сайте обычно ставят ссылку <code>mailto:</code> или готовый сервис форм.</p><p><b>Доступность — это про всех:</b> <code>alt</code> у картинок, подписи у полей, один <code>h1</code> и заголовки по порядку, достаточный контраст, <code>lang</code> у страницы, возможность пройти сайт клавишей <code>Tab</code>. Попробуй пройти свою страницу без мыши!</p>","de":"<p>Ein Formular sammelt Eingaben vom Besucher:</p><pre class=\"ex\" data-l=\"html\">&lt;form&gt;\n  &lt;label for=\"email\"&gt;E-Mail&lt;/label&gt;\n  &lt;input type=\"email\" id=\"email\" name=\"email\"&gt;\n  &lt;textarea id=\"msg\" name=\"msg\"&gt;&lt;/textarea&gt;\n  &lt;button type=\"submit\"&gt;Senden&lt;/button&gt;\n&lt;/form&gt;</pre><ul><li><code>&lt;label for=\"email\"&gt;</code> — Beschriftung. Der Wert von <code>for</code> stimmt mit der <code>id</code> des Feldes überein: Dann wählt ein Klick auf die Beschriftung das Feld aus, und Programme für Blinde lesen vor, was das für ein Feld ist.</li><li><code>type</code> bei <code>input</code>: <code>text</code>, <code>email</code>, <code>number</code>, <code>password</code> … Der Browser prüft selbst, dass im E-Mail-Feld ein @ steht.</li><li><code>&lt;textarea&gt;</code> — großes Feld. <code>&lt;button type=\"submit\"&gt;</code> — Senden.</li></ul><p><b>Wichtig:</b> Ein reines HTML-Formular schickt die Nachricht nirgendwohin, dafür braucht man einen Server. Auf einer einfachen Website setzt man meist einen <code>mailto:</code>-Link oder einen fertigen Formular-Dienst ein.</p><p><b>Barrierefreiheit betrifft alle:</b> <code>alt</code> bei Bildern, Beschriftungen bei Feldern, ein <code>h1</code> und Überschriften in Reihenfolge, genug Kontrast, <code>lang</code> auf der Seite, die Seite mit der Taste <code>Tab</code> bedienbar. Probiere deine Seite ohne Maus durchzugehen!</p>"},"task":{"ru":"<ol><li>Сделай <code>&lt;form&gt;</code> с тремя полями: имя (<code>text</code>), почта (<code>email</code>), сообщение (<code>textarea</code>).</li><li>У каждого поля есть <code>&lt;label for=\"…\"&gt;</code>, совпадающий с <code>id</code>.</li><li>В конце кнопка <code>&lt;button type=\"submit\"&gt;</code>.</li><li>Пройди форму клавишей <code>Tab</code>.</li></ol>","de":"<ol><li>Mache ein <code>&lt;form&gt;</code> mit drei Feldern: Name (<code>text</code>), E-Mail (<code>email</code>), Nachricht (<code>textarea</code>).</li><li>Jedes Feld hat ein <code>&lt;label for=\"…\"&gt;</code>, das zur <code>id</code> passt.</li><li>Am Ende ein Knopf <code>&lt;button type=\"submit\"&gt;</code>.</li><li>Gehe das Formular mit der Taste <code>Tab</code> durch.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; }\n    input, textarea { width: 100%; padding: 8px; font: inherit; }\n  </style>\n</head>\n<body>\n  <h1>Напиши мне</h1>\n  <!-- Сделай форму: имя, почта, сообщение и кнопка отправки -->\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; }\n    input, textarea { width: 100%; padding: 8px; font: inherit; }\n  </style>\n</head>\n<body>\n  <h1>Schreib mir</h1>\n  <!-- Mache ein Formular: Name, E-Mail, Nachricht und Sende-Knopf -->\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть <code>&lt;form&gt;</code>","de":"Es gibt ein <code>&lt;form&gt;</code>"},"s":"form","w":null},{"t":"count","m":{"ru":"Три подписи <code>&lt;label&gt;</code>","de":"Drei Beschriftungen <code>&lt;label&gt;</code>"},"s":"label","n":3,"w":null},{"t":"allattr","m":{"ru":"У каждой подписи есть <code>for</code>","de":"Jede Beschriftung hat <code>for</code>"},"s":"label","a":"for","r":".+","w":null},{"t":"code","m":{"ru":"Значение <code>for</code> совпадает с <code>id</code> поля","de":"Der Wert von <code>for</code> stimmt mit der <code>id</code> des Feldes überein"},"r":"<label[^>]+for=[\"\\'](\\w+)[\"\\'][\\s\\S]*?id=[\"\\']\\1[\"\\']","f":null},{"t":"has","m":{"ru":"Есть поле <code>type=\"email\"</code>","de":"Es gibt ein Feld <code>type=\"email\"</code>"},"s":"input[type=email]","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;textarea&gt;</code>","de":"Es gibt ein <code>&lt;textarea&gt;</code>"},"s":"textarea","w":null},{"t":"has","m":{"ru":"Есть кнопка отправки","de":"Es gibt einen Sende-Knopf"},"s":"button, input[type=submit]","w":null},{"t":"count","m":{"ru":"Три радиокнопки","de":"Drei Radiobuttons"},"s":"input[type=\"radio\"]","n":3,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть флажок <code>checkbox</code>","de":"Es gibt ein Kontrollkästchen <code>checkbox</code>"},"s":"input[type=\"checkbox\"]","w":null,"lv":2},{"t":"count","m":{"ru":"<code>required</code> у имени и почты","de":"<code>required</code> bei Name und E-Mail"},"s":"input[required]","n":2,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть <code>placeholder</code>","de":"Es gibt <code>placeholder</code>"},"s":"input[placeholder]","w":null,"lv":2},{"t":"count","m":{"ru":"Список с тремя вариантами <code>option</code>","de":"Auswahlliste mit drei <code>option</code>"},"s":"select option","n":3,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть число с <code>min</code> и <code>max</code>","de":"Es gibt eine Zahl mit <code>min</code> und <code>max</code>"},"s":"input[type=\"number\"][min][max]","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть <code>fieldset</code> с <code>legend</code>","de":"Es gibt <code>fieldset</code> mit <code>legend</code>"},"s":"fieldset legend","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть стиль <code>:focus</code>","de":"Es gibt einen Stil <code>:focus</code>"},"r":":focus\\s*\\{","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; }\n    input, textarea { width: 100%; padding: 8px; font: inherit; }\n    input[type=\"radio\"], input[type=\"checkbox\"] { width: auto; }\n    input:focus, textarea:focus { outline: 3px solid #5b48e8; }\n  </style>\n</head>\n<body>\n  <h1>Напиши мне</h1>\n  <form>\n    <p><label for=\"name\">Имя</label><br><input type=\"text\" id=\"name\" name=\"name\" required placeholder=\"Как тебя зовут?\"></p>\n    <p><label for=\"email\">Почта</label><br><input type=\"email\" id=\"email\" name=\"email\" required></p>\n    <p><label for=\"msg\">Сообщение</label><br><textarea id=\"msg\" name=\"msg\" rows=\"4\"></textarea></p>\n    <fieldset>\n      <legend>Как связаться</legend>\n      <input type=\"radio\" name=\"way\" id=\"w1\"> <label for=\"w1\">Почта</label>\n      <input type=\"radio\" name=\"way\" id=\"w2\"> <label for=\"w2\">Телефон</label>\n      <input type=\"radio\" name=\"way\" id=\"w3\"> <label for=\"w3\">Письмо</label>\n    </fieldset>\n    <p><label for=\"size\">Размер</label><br><select id=\"size\" name=\"size\"><option>S</option><option>M</option><option>L</option></select></p>\n    <p><label for=\"qty\">Количество</label><br><input type=\"number\" id=\"qty\" name=\"qty\" min=\"1\" max=\"10\"></p>\n    <p><input type=\"checkbox\" id=\"ok\"> <label for=\"ok\">Согласен, что ответ придёт на почту</label></p>\n    <button type=\"submit\">Отправить</button>\n  </form>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; }\n    input, textarea { width: 100%; padding: 8px; font: inherit; }\n    input[type=\"radio\"], input[type=\"checkbox\"] { width: auto; }\n    input:focus, textarea:focus { outline: 3px solid #5b48e8; }\n  </style>\n</head>\n<body>\n  <h1>Schreib mir</h1>\n  <form>\n    <p><label for=\"name\">Name</label><br><input type=\"text\" id=\"name\" name=\"name\" required placeholder=\"Wie heißt du?\"></p>\n    <p><label for=\"email\">E-Mail</label><br><input type=\"email\" id=\"email\" name=\"email\" required></p>\n    <p><label for=\"msg\">Nachricht</label><br><textarea id=\"msg\" name=\"msg\" rows=\"4\"></textarea></p>\n    <fieldset>\n      <legend>Kontakt</legend>\n      <input type=\"radio\" name=\"way\" id=\"w1\"> <label for=\"w1\">E-Mail</label>\n      <input type=\"radio\" name=\"way\" id=\"w2\"> <label for=\"w2\">Telefon</label>\n      <input type=\"radio\" name=\"way\" id=\"w3\"> <label for=\"w3\">Brief</label>\n    </fieldset>\n    <p><label for=\"size\">Größe</label><br><select id=\"size\" name=\"size\"><option>S</option><option>M</option><option>L</option></select></p>\n    <p><label for=\"qty\">Menge</label><br><input type=\"number\" id=\"qty\" name=\"qty\" min=\"1\" max=\"10\"></p>\n    <p><input type=\"checkbox\" id=\"ok\"> <label for=\"ok\">Ich bin einverstanden, dass die Antwort per Mail kommt</label></p>\n    <button type=\"submit\">Senden</button>\n  </form>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Пара «подпись + поле»: <code>&lt;label for=\"name\"&gt;Имя&lt;/label&gt; &lt;input type=\"text\" id=\"name\"&gt;</code>. Слово после <code>for</code> и после <code>id</code> одно и то же.</p>","de":"<p>Das Paar „Beschriftung + Feld“: <code>&lt;label for=\"name\"&gt;Name&lt;/label&gt; &lt;input type=\"text\" id=\"name\"&gt;</code>. Das Wort nach <code>for</code> und nach <code>id</code> ist dasselbe.</p>"},"quiz":[{"q":{"ru":"Зачем нужен <code>for</code> у <code>label</code>?","de":"Wozu ist <code>for</code> bei <code>label</code> da?"},"o":[{"ru":"Связывает подпись с полем","de":"Verknüpft die Beschriftung mit dem Feld"},{"ru":"Задаёт цвет подписи","de":"Setzt die Farbe der Beschriftung"},{"ru":"Создаёт цикл","de":"Erzeugt eine Schleife"}],"a":0},{"q":{"ru":"Отправит ли сообщение обычная HTML-форма без сервера?","de":"Verschickt ein normales HTML-Formular ohne Server die Nachricht?"},"o":[{"ru":"Нет, нужен сервер или сервис","de":"Nein, man braucht einen Server oder Dienst"},{"ru":"Да, всегда","de":"Ja, immer"},{"ru":"Да, на почту автора","de":"Ja, an die E-Mail des Autors"}],"a":0}],"lv2":{"ru":"<p>Добавь в форму ещё поля и защиту от пустых ответов:</p><ol><li>Три переключателя (радиокнопки) «Как с тобой связаться?»: <code>&lt;input type=\"radio\" name=\"way\" id=\"w1\"&gt;</code> и подпись <code>&lt;label for=\"w1\"&gt;…&lt;/label&gt;</code>. У всех трёх одинаковый <code>name</code>, чтобы выбрать можно было только один.</li><li>Флажок <code>&lt;input type=\"checkbox\" id=\"ok\"&gt;</code> с подписью «Согласен, что ответ придёт на почту».</li><li>Поставь атрибут <code>required</code> на имя и почту. Попробуй отправить пустую форму: браузер сам не даст.</li><li>Подсказка внутри поля: <code>placeholder=\"Как тебя зовут?\"</code> у имени.</li></ol>","de":"<p>Füge dem Formular weitere Felder und einen Schutz vor leeren Antworten hinzu:</p><ol><li>Drei Schalter (Radiobuttons) „Wie können wir dich erreichen?“: <code>&lt;input type=\"radio\" name=\"way\" id=\"w1\"&gt;</code> und Beschriftung <code>&lt;label for=\"w1\"&gt;…&lt;/label&gt;</code>. Alle drei haben denselben <code>name</code>, damit man nur einen wählen kann.</li><li>Ein Kontrollkästchen <code>&lt;input type=\"checkbox\" id=\"ok\"&gt;</code> mit der Beschriftung „Ich bin einverstanden, dass die Antwort per Mail kommt“.</li><li>Setze das Attribut <code>required</code> auf Name und E-Mail. Versuche, ein leeres Formular abzuschicken: Der Browser lässt es nicht zu.</li><li>Ein Hinweis im Feld: <code>placeholder=\"Wie heißt du?\"</code> beim Namen.</li></ol>"},"lv3":{"ru":"<p>Сделай форму заказа с «умными» полями.</p><ol><li>Выпадающий список: <code>&lt;select id=\"size\"&gt;</code> с тремя <code>&lt;option&gt;</code> (например, размеры S, M, L) и подписью <code>label</code>.</li><li>Число с границами: <code>&lt;input type=\"number\" id=\"qty\" min=\"1\" max=\"10\"&gt;</code> — нельзя ввести 0 или 100.</li><li>Объедини радиокнопки в рамку с названием: <code>&lt;fieldset&gt;&lt;legend&gt;Как связаться&lt;/legend&gt; … &lt;/fieldset&gt;</code>. Читалки экрана озвучат название группы.</li><li>Стилизуй поля: <code>input:focus, textarea:focus { outline: 3px solid #5b48e8; }</code>.</li></ol>","de":"<p>Baue ein Bestellformular mit „schlauen“ Feldern.</p><ol><li>Eine Auswahlliste: <code>&lt;select id=\"size\"&gt;</code> mit drei <code>&lt;option&gt;</code> (zum Beispiel Größen S, M, L) und einer Beschriftung <code>label</code>.</li><li>Eine Zahl mit Grenzen: <code>&lt;input type=\"number\" id=\"qty\" min=\"1\" max=\"10\"&gt;</code> — 0 oder 100 kann man nicht eingeben.</li><li>Fasse die Radiobuttons in einem Rahmen mit Titel zusammen: <code>&lt;fieldset&gt;&lt;legend&gt;Kontakt&lt;/legend&gt; … &lt;/fieldset&gt;</code>. Screenreader lesen den Namen der Gruppe vor.</li><li>Gestalte die Felder: <code>input:focus, textarea:focus { outline: 3px solid #5b48e8; }</code>.</li></ol>"}},{"day":24,"week":4,"title":{"ru":"Планируем свой сайт","de":"Wir planen die eigene Website"},"goal":{"ru":"Выбрать тему и составить план, прежде чем писать код.","de":"Ein Thema wählen und einen Plan erstellen, bevor man Code schreibt."},"theory":{"ru":"<p>Последние пять дней ты работаешь над <b>собственным сайтом</b>. Хороший сайт начинается не с кода, а с плана. Ответь на вопросы:</p><ul><li><b>О чём сайт?</b> Выбери то, что тебе действительно интересно: фан-страница любимой игры или группы, портфолио рисунков, мой питомец, мои проекты, рецепты, история моего города, коллекция LEGO, мой клуб.</li><li><b>Для кого?</b> Для друзей, класса, всех в интернете?</li><li><b>Какие разделы?</b> Три-четыре достаточно: «Главная», «О …», «Галерея», «Контакты».</li><li><b>Цвета и настроение.</b> Два-три цвета, которые подходят теме. Меньше значит лучше.</li></ul><p><b>Эскиз на бумаге</b> (хотя бы 5 минут) экономит часы: нарисуй, где будут шапка, меню, заголовок, блоки и подвал.</p><p><b>Безопасность:</b> не размещай на сайте адрес, телефон, школу, настоящую фамилию и фото лица, если это не обсуждено с родителями.</p>","de":"<p>Die letzten fünf Tage arbeitest du an einer <b>eigenen Website</b>. Eine gute Website beginnt nicht mit Code, sondern mit einem Plan. Beantworte die Fragen:</p><ul><li><b>Worum geht es?</b> Wähle etwas, das dich wirklich interessiert: Fanseite für ein Lieblingsspiel oder eine Band, Portfolio deiner Zeichnungen, mein Haustier, meine Projekte, Rezepte, Geschichte meiner Stadt, LEGO-Sammlung, mein Club.</li><li><b>Für wen?</b> Für Freunde, die Klasse, alle im Internet?</li><li><b>Welche Abschnitte?</b> Drei bis vier genügen: „Start“, „Über …“, „Galerie“, „Kontakt“.</li><li><b>Farben und Stimmung.</b> Zwei bis drei Farben, die zum Thema passen. Weniger ist besser.</li></ul><p>Eine <b>Skizze auf Papier</b> (mindestens 5 Minuten) spart Stunden: Zeichne, wo Kopf, Menü, Überschrift, Blöcke und Fußbereich hinkommen.</p><p><b>Sicherheit:</b> Gib auf der Website keine Adresse, Telefonnummer, Schule, keinen echten Nachnamen und kein Gesichtsfoto an, wenn das nicht mit den Eltern besprochen ist.</p>"},"task":{"ru":"<ol><li>Заполни план в комментарии (замени все <code>____</code>).</li><li>Впиши в <code>&lt;title&gt;</code> и в <code>&lt;h1&gt;</code> название своего сайта.</li><li>Нарисуй эскиз на бумаге и отметь это в чек-листе ниже.</li></ol><p>Этот файл станет основой твоего сайта: следующие дни ты продолжишь работать с ним.</p>","de":"<ol><li>Fülle den Plan im Kommentar aus (ersetze alle <code>____</code>).</li><li>Schreibe den Namen deiner Website in <code>&lt;title&gt;</code> und in <code>&lt;h1&gt;</code>.</li><li>Zeichne eine Skizze auf Papier und hake sie in der Checkliste unten ab.</li></ol><p>Diese Datei wird die Grundlage deiner Website: In den nächsten Tagen arbeitest du mit ihr weiter.</p>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    МОЙ ПЛАН САЙТА (замени каждую строку ____ своим текстом)\n    Тема: ____\n    Для кого: ____\n    Что хочу рассказать или показать: ____\n    Разделы (минимум 3): 1) ____ 2) ____ 3) ____\n    Главные цвета (2–3): ____\n    Какое настроение у сайта (спокойное, весёлое, строгое…): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    MEIN WEBSITE-PLAN (ersetze jedes ____ durch deinen Text)\n    Thema: ____\n    Für wen: ____\n    Was ich erzählen oder zeigen möchte: ____\n    Abschnitte (mindestens 3): 1) ____ 2) ____ 3) ____\n    Hauptfarben (2–3): ____\n    Stimmung der Website (ruhig, fröhlich, ernst …): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n"}},"checks":[{"t":"nocode","m":{"ru":"В плане не осталось пустых мест <code>____</code>","de":"Im Plan sind keine leeren Stellen <code>____</code> mehr"},"r":"_{4}","f":null},{"t":"code","m":{"ru":"План достаточно подробный (больше 150 символов)","de":"Der Plan ist ausführlich genug (mehr als 150 Zeichen)"},"r":"<!--[\\s\\S]{150,}?-->","f":null},{"t":"code","m":{"ru":"Есть название в <code>&lt;title&gt;</code>","de":"Es gibt einen Namen in <code>&lt;title&gt;</code>"},"r":"<title>\\s*[^<\\s][^<]*</title>","f":null},{"t":"text","m":{"ru":"Есть заголовок <code>&lt;h1&gt;</code> с названием сайта","de":"Es gibt eine Überschrift <code>&lt;h1&gt;</code> mit dem Namen der Website"},"s":"h1","r":".{3,}","w":null}],"hint":{"ru":"<p>Не придумывай слишком сложное: сайт из трёх разделов на тему, которую ты знаешь, получится лучше, чем огромный сайт «обо всём». Нужна идея? Сделай «путеводитель» по любимому занятию для новичка.</p>","de":"<p>Denke dir nichts zu Kompliziertes aus: Eine Website aus drei Abschnitten über ein Thema, das du kennst, wird besser als eine riesige Website „über alles“. Brauchst du eine Idee? Mache einen „Wegweiser“ für Anfänger zu deiner liebsten Beschäftigung.</p>"},"manual":[{"ru":"Я выбрал(а) тему, которая мне действительно интересна","de":"Ich habe ein Thema gewählt, das mich wirklich interessiert"},{"ru":"Я нарисовал(а) эскиз страницы на бумаге","de":"Ich habe eine Skizze der Seite auf Papier gezeichnet"}]},{"day":25,"week":4,"title":{"ru":"Строим структуру и наполняем сайт","de":"Struktur bauen und die Website füllen"},"goal":{"ru":"Собрать каркас сайта: шапка, меню, разделы, подвал и содержимое.","de":"Das Gerüst der Website bauen: Kopf, Menü, Abschnitte, Fußbereich und Inhalt."},"theory":{"ru":"<p>Сегодня пишешь только <b>HTML и содержание</b>, без красоты. Когда структура и тексты готовы, оформлять в разы легче.</p><p>Каркас, который у тебя получится:</p><pre class=\"ex\" data-l=\"html\">&lt;body&gt;\n  &lt;header&gt;\n    &lt;h1&gt;Название сайта&lt;/h1&gt;\n    &lt;nav&gt;\n      &lt;a href=\"#one\"&gt;Раздел 1&lt;/a&gt;\n      &lt;a href=\"#two\"&gt;Раздел 2&lt;/a&gt;\n      &lt;a href=\"#three\"&gt;Раздел 3&lt;/a&gt;\n    &lt;/nav&gt;\n  &lt;/header&gt;\n  &lt;main&gt;\n    &lt;section id=\"one\"&gt; … &lt;/section&gt;\n    &lt;section id=\"two\"&gt; … &lt;/section&gt;\n    &lt;section id=\"three\"&gt; … &lt;/section&gt;\n  &lt;/main&gt;\n  &lt;footer&gt; … &lt;/footer&gt;\n&lt;/body&gt;</pre><p>Ссылки меню начинаются с <code>#</code>: <code>href=\"#one\"</code> ведёт к элементу с <code>id=\"one\"</code> на этой же странице (якорь). Пиши настоящие тексты, а не «lorem ipsum»: так сразу видно, как будет выглядеть сайт. Не забывай <code>alt</code> у картинок (есть <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>).</p>","de":"<p>Heute schreibst du nur <b>HTML und Inhalt</b>, ohne Schönheit. Wenn Struktur und Texte fertig sind, ist das Gestalten viel leichter.</p><p>Das Gerüst, das entstehen soll:</p><pre class=\"ex\" data-l=\"html\">&lt;body&gt;\n  &lt;header&gt;\n    &lt;h1&gt;Name der Website&lt;/h1&gt;\n    &lt;nav&gt;\n      &lt;a href=\"#one\"&gt;Abschnitt 1&lt;/a&gt;\n      &lt;a href=\"#two\"&gt;Abschnitt 2&lt;/a&gt;\n      &lt;a href=\"#three\"&gt;Abschnitt 3&lt;/a&gt;\n    &lt;/nav&gt;\n  &lt;/header&gt;\n  &lt;main&gt;\n    &lt;section id=\"one\"&gt; … &lt;/section&gt;\n    &lt;section id=\"two\"&gt; … &lt;/section&gt;\n    &lt;section id=\"three\"&gt; … &lt;/section&gt;\n  &lt;/main&gt;\n  &lt;footer&gt; … &lt;/footer&gt;\n&lt;/body&gt;</pre><p>Menülinks beginnen mit <code>#</code>: <code>href=\"#one\"</code> führt zum Element mit <code>id=\"one\"</code> auf derselben Seite (Anker). Schreibe echte Texte statt „Lorem ipsum“: So siehst du gleich, wie die Website aussehen wird. Vergiss <code>alt</code> bei Bildern nicht (es gibt <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>).</p>"},"task":{"ru":"<p>Продолжай в том же файле (твой план остаётся комментарием). В <code>&lt;body&gt;</code> построй:</p><ol><li><code>header</code> с <code>h1</code> и <code>nav</code> минимум с тремя ссылками на разделы.</li><li><code>main</code> минимум с тремя <code>section</code> (у каждого свой <code>id</code> и заголовок <code>h2</code> и текст).</li><li>Одну картинку с осмысленным <code>alt</code> и один список.</li><li><code>footer</code> с короткой строкой.</li></ol>","de":"<p>Mache in derselben Datei weiter (dein Plan bleibt als Kommentar). Baue in <code>&lt;body&gt;</code>:</p><ol><li><code>header</code> mit <code>h1</code> und <code>nav</code> mit mindestens drei Links zu den Abschnitten.</li><li><code>main</code> mit mindestens drei <code>section</code> (jede mit eigener <code>id</code>, Überschrift <code>h2</code> und Text).</li><li>Ein Bild mit sinnvollem <code>alt</code> und eine Liste.</li><li><code>footer</code> mit einer kurzen Zeile.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    МОЙ ПЛАН САЙТА (замени каждую строку ____ своим текстом)\n    Тема: ____\n    Для кого: ____\n    Что хочу рассказать или показать: ____\n    Разделы (минимум 3): 1) ____ 2) ____ 3) ____\n    Главные цвета (2–3): ____\n    Какое настроение у сайта (спокойное, весёлое, строгое…): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    MEIN WEBSITE-PLAN (ersetze jedes ____ durch deinen Text)\n    Thema: ____\n    Für wen: ____\n    Was ich erzählen oder zeigen möchte: ____\n    Abschnitte (mindestens 3): 1) ____ 2) ____ 3) ____\n    Hauptfarben (2–3): ____\n    Stimmung der Website (ruhig, fröhlich, ernst …): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть <code>&lt;header&gt;</code>","de":"Es gibt <code>&lt;header&gt;</code>"},"s":"header","w":null},{"t":"count","m":{"ru":"В меню минимум три ссылки","de":"Im Menü mindestens drei Links"},"s":"nav a","n":3,"w":null},{"t":"allattr","m":{"ru":"Ссылки меню ведут на якоря (<code>#…</code>)","de":"Menülinks führen zu Ankern (<code>#…</code>)"},"s":"nav a","a":"href","r":"^#.+","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;main&gt;</code>","de":"Es gibt <code>&lt;main&gt;</code>"},"s":"main","w":null},{"t":"count","m":{"ru":"Минимум три <code>&lt;section&gt;</code>","de":"Mindestens drei <code>&lt;section&gt;</code>"},"s":"main section","n":3,"w":null},{"t":"allattr","m":{"ru":"У каждого раздела есть <code>id</code>","de":"Jeder Abschnitt hat eine <code>id</code>"},"s":"section","a":"id","r":".+","w":null},{"t":"count","m":{"ru":"В каждом разделе (минимум 3) есть <code>&lt;h2&gt;</code>","de":"In jedem Abschnitt (mindestens 3) gibt es ein <code>&lt;h2&gt;</code>"},"s":"section h2","n":3,"w":null},{"t":"allattr","m":{"ru":"Есть картинка с <code>alt</code>","de":"Es gibt ein Bild mit <code>alt</code>"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"count","m":{"ru":"Есть список минимум из трёх пунктов","de":"Es gibt eine Liste mit mindestens drei Punkten"},"s":"li","n":3,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;footer&gt;</code>","de":"Es gibt <code>&lt;footer&gt;</code>"},"s":"footer","w":null},{"t":"nocode","m":{"ru":"Нет «lorem ipsum»: тексты настоящие","de":"Kein „Lorem ipsum“: Die Texte sind echt"},"r":"lorem ipsum","f":null}],"hint":{"ru":"<p>Если не знаешь, что писать в разделе, напиши три предложения: что это, почему интересно, что посмотреть. Потом можно улучшать.</p>","de":"<p>Wenn du nicht weißt, was in einen Abschnitt soll, schreibe drei Sätze: was es ist, warum es interessant ist, was man ansehen kann. Später kannst du es verbessern.</p>"},"from":24},{"day":26,"week":4,"title":{"ru":"Оформляем сайт","de":"Die Website gestalten"},"goal":{"ru":"Подключить style.css и оформить сайт в едином стиле с переменными CSS.","de":"style.css einbinden und die Website in einheitlichem Stil mit CSS-Variablen gestalten."},"theory":{"ru":"<p>Сайт выглядит цельным, когда у него <b>единый стиль</b>: два-три цвета, один-два шрифта, одинаковые отступы и скругления. Чтобы не менять один и тот же цвет в десяти местах, используют <b>переменные CSS</b>:</p><pre class=\"ex\" data-l=\"css\">:root {\n  --main: #5b48e8;      /* главный цвет */\n  --bg: #f7f6ff;        /* фон */\n  --text: #15172e;      /* цвет текста */\n}\nbody { background: var(--bg); color: var(--text); }\na, h1 { color: var(--main); }</pre><p>Поменяй <code>--main</code> один раз, и цвет изменится везде. Всё, что ты узнал за три недели, пригодится сегодня: <code>flex</code> для шапки и карточек, <code>:hover</code> для меню, <code>border-radius</code>, <code>padding</code>, <code>transition</code>.</p>","de":"<p>Eine Website wirkt stimmig, wenn sie einen <b>einheitlichen Stil</b> hat: zwei bis drei Farben, ein bis zwei Schriften, gleiche Abstände und Rundungen. Damit man nicht dieselbe Farbe an zehn Stellen ändern muss, benutzt man <b>CSS-Variablen</b>:</p><pre class=\"ex\" data-l=\"css\">:root {\n  --main: #5b48e8;      /* Hauptfarbe */\n  --bg: #f7f6ff;        /* Hintergrund */\n  --text: #15172e;      /* Textfarbe */\n}\nbody { background: var(--bg); color: var(--text); }\na, h1 { color: var(--main); }</pre><p>Ändere <code>--main</code> einmal, und die Farbe ändert sich überall. Alles, was du in drei Wochen gelernt hast, brauchst du heute: <code>flex</code> für Kopf und Karten, <code>:hover</code> fürs Menü, <code>border-radius</code>, <code>padding</code>, <code>transition</code>.</p>"},"task":{"ru":"<ol><li>Подключи <code>style.css</code> к своей странице (тег <code>&lt;link&gt;</code> в <code>&lt;head&gt;</code>).</li><li>В <code>style.css</code> задай переменные цветов в <code>:root</code> и используй их через <code>var(--…)</code>.</li><li>Выбери шрифт без засечек (или с засечками для заголовков).</li><li>Сделай шапку и меню с <code>display: flex</code>, у ссылок меню <code>:hover</code>.</li><li>Добавь скругления <code>border-radius</code> и один эффект (<code>box-shadow</code> или <code>transition</code>).</li></ol>","de":"<ol><li>Binde <code>style.css</code> in deine Seite ein (Tag <code>&lt;link&gt;</code> in <code>&lt;head&gt;</code>).</li><li>Lege in <code>style.css</code> Farbvariablen in <code>:root</code> an und benutze sie mit <code>var(--…)</code>.</li><li>Wähle eine Schrift ohne Serifen (oder mit Serifen für Überschriften).</li><li>Mache Kopf und Menü mit <code>display: flex</code>, die Menülinks bekommen <code>:hover</code>.</li><li>Füge Rundungen mit <code>border-radius</code> und einen Effekt hinzu (<code>box-shadow</code> oder <code>transition</code>).</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    МОЙ ПЛАН САЙТА (замени каждую строку ____ своим текстом)\n    Тема: ____\n    Для кого: ____\n    Что хочу рассказать или показать: ____\n    Разделы (минимум 3): 1) ____ 2) ____ 3) ____\n    Главные цвета (2–3): ____\n    Какое настроение у сайта (спокойное, весёлое, строгое…): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    MEIN WEBSITE-PLAN (ersetze jedes ____ durch deinen Text)\n    Thema: ____\n    Für wen: ____\n    Was ich erzählen oder zeigen möchte: ____\n    Abschnitte (mindestens 3): 1) ____ 2) ____ 3) ____\n    Hauptfarben (2–3): ____\n    Stimmung der Website (ruhig, fröhlich, ernst …): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n"},"style.css":"/* Оформи свой сайт / Gestalte deine Website */\n:root {\n  --main: #5b48e8;\n  --bg: #ffffff;\n  --text: #15172e;\n}\n"},"checks":[{"t":"code","m":{"ru":"В <code>index.html</code> подключён <code>style.css</code>","de":"In <code>index.html</code> ist <code>style.css</code> eingebunden"},"r":"<link[^>]+href=[\"\\']style\\.css[\"\\']","f":"index.html"},{"t":"code","m":{"ru":"Есть переменные CSS в <code>:root</code>","de":"Es gibt CSS-Variablen in <code>:root</code>"},"r":":root\\s*\\{[^}]*--[\\w-]+\\s*:","f":"style.css"},{"t":"code","m":{"ru":"Переменные используются (<code>var(--…)</code>)","de":"Die Variablen werden benutzt (<code>var(--…)</code>)"},"r":"var\\(\\s*--","f":"style.css"},{"t":"cssnot","m":{"ru":"Выбран свой шрифт","de":"Eine eigene Schrift ist gewählt"},"s":"body","p":"font-family","r":"times","w":null},{"t":"code","m":{"ru":"Есть <code>display: flex</code>","de":"Es gibt <code>display: flex</code>"},"r":"display\\s*:\\s*flex","f":"style.css"},{"t":"code","m":{"ru":"Есть <code>:hover</code>","de":"Es gibt <code>:hover</code>"},"r":":hover","f":"style.css"},{"t":"code","m":{"ru":"Есть <code>border-radius</code>","de":"Es gibt <code>border-radius</code>"},"r":"border-radius","f":"style.css"},{"t":"code","m":{"ru":"Есть <code>box-shadow</code> или <code>transition</code>","de":"Es gibt <code>box-shadow</code> oder <code>transition</code>"},"r":"box-shadow|transition","f":"style.css"}],"hint":{"ru":"<p>Не пытайся сделать всё идеально сразу. Сначала цвета и шрифт для всей страницы, потом шапка, потом разделы. Не нравится результат? Поменяй одну переменную в <code>:root</code>.</p>","de":"<p>Versuche nicht, alles sofort perfekt zu machen. Zuerst Farben und Schrift für die ganze Seite, dann der Kopf, dann die Abschnitte. Gefällt dir das Ergebnis nicht? Ändere eine Variable in <code>:root</code>.</p>"},"from":25},{"day":27,"week":4,"title":{"ru":"Шлифовка: адаптивность и проверка","de":"Feinschliff: Responsive und Prüfung"},"goal":{"ru":"Сделать сайт удобным на телефоне и проверить его по чек-листу.","de":"Die Website auf dem Handy nutzbar machen und mit einer Checkliste prüfen."},"theory":{"ru":"<p>Сегодня доводишь сайт до готовности. Профессионалы называют это <b>QA</b> — проверка качества. Пройди по списку:</p><ul><li><b>Телефон:</b> строка <code>viewport</code>, <code>img { max-width: 100% }</code>, <code>@media</code>. Проверь кнопкой 📱.</li><li><b>Доступность:</b> у каждой картинки <code>alt</code>, достаточный контраст, весь сайт проходится клавишей <code>Tab</code>.</li><li><b>Чистота:</b> нет «lorem ipsum», нет слов вроде TODO, нет пустых мест <code>____</code>, нет опечаток.</li><li><b>Название:</b> в <code>&lt;title&gt;</code> настоящее название, а не «Document».</li><li><b>Валидатор:</b> на сайте <code>validator.w3.org</code> можно вставить свой код и увидеть ошибки в HTML.</li></ul><p>И самое важное: покажи сайт другому человеку и посмотри, где он запнётся. Это лучший тест.</p>","de":"<p>Heute bringst du die Website zur Fertigstellung. Profis nennen das <b>QA</b> — Qualitätsprüfung. Gehe die Liste durch:</p><ul><li><b>Handy:</b> die Zeile <code>viewport</code>, <code>img { max-width: 100% }</code>, <code>@media</code>. Prüfe mit dem Knopf 📱.</li><li><b>Barrierefreiheit:</b> jedes Bild hat <code>alt</code>, genug Kontrast, die ganze Seite lässt sich mit der Taste <code>Tab</code> durchgehen.</li><li><b>Sauberkeit:</b> kein „Lorem ipsum“, keine Wörter wie TODO, keine leeren Stellen <code>____</code>, keine Tippfehler.</li><li><b>Name:</b> in <code>&lt;title&gt;</code> steht ein echter Name, nicht „Document“.</li><li><b>Validator:</b> Auf <code>validator.w3.org</code> kannst du deinen Code einfügen und HTML-Fehler sehen.</li></ul><p>Und das Wichtigste: Zeige die Website einer anderen Person und sieh, wo sie ins Stocken gerät. Das ist der beste Test.</p>"},"task":{"ru":"<ol><li>Добавь в <code>&lt;head&gt;</code> <code>meta viewport</code>.</li><li>Добавь в CSS <code>img { max-width: 100%; height: auto; }</code> и хотя бы один <code>@media (max-width: 600px)</code>.</li><li>Убери из страницы весь план с <code>____</code> и любые «lorem ipsum» и TODO (комментарий с планом можно удалить или оставить без <code>____</code>).</li><li>Проверь сайт по чек-листу и отметь пункты.</li></ol>","de":"<ol><li>Füge in <code>&lt;head&gt;</code> <code>meta viewport</code> hinzu.</li><li>Füge im CSS <code>img { max-width: 100%; height: auto; }</code> und mindestens eine <code>@media (max-width: 600px)</code> hinzu.</li><li>Entferne den ganzen Plan mit <code>____</code> und jedes „Lorem ipsum“ und TODO aus der Seite (den Plan-Kommentar kannst du löschen oder ohne <code>____</code> lassen).</li><li>Prüfe die Website mit der Checkliste und hake die Punkte ab.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    МОЙ ПЛАН САЙТА (замени каждую строку ____ своим текстом)\n    Тема: ____\n    Для кого: ____\n    Что хочу рассказать или показать: ____\n    Разделы (минимум 3): 1) ____ 2) ____ 3) ____\n    Главные цвета (2–3): ____\n    Какое настроение у сайта (спокойное, весёлое, строгое…): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    MEIN WEBSITE-PLAN (ersetze jedes ____ durch deinen Text)\n    Thema: ____\n    Für wen: ____\n    Was ich erzählen oder zeigen möchte: ____\n    Abschnitte (mindestens 3): 1) ____ 2) ____ 3) ____\n    Hauptfarben (2–3): ____\n    Stimmung der Website (ruhig, fröhlich, ernst …): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n"},"style.css":"/* твой CSS */\n"},"checks":[{"t":"code","m":{"ru":"Есть <code>meta viewport</code>","de":"Es gibt <code>meta viewport</code>"},"r":"<meta[^>]+name=[\"\\']viewport[\"\\']","f":"index.html"},{"t":"code","m":{"ru":"Есть <code>@media (max-width: …)</code>","de":"Es gibt <code>@media (max-width: …)</code>"},"r":"@media\\s*\\(\\s*max-width","f":null},{"t":"css","m":{"ru":"Картинки: <code>max-width: 100%</code>","de":"Bilder: <code>max-width: 100%</code>"},"s":"img","p":"max-width","r":"^100%$","w":null},{"t":"allattr","m":{"ru":"У всех картинок есть <code>alt</code>","de":"Alle Bilder haben <code>alt</code>"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"code","m":{"ru":"В <code>&lt;title&gt;</code> настоящее название","de":"In <code>&lt;title&gt;</code> steht ein echter Name"},"r":"<title>\\s*(?!Document|\\s*<)[^<\\s][^<]*</title>","f":"index.html"},{"t":"nocode","m":{"ru":"Нет «lorem», TODO и пустых мест <code>____</code>","de":"Kein „Lorem“, TODO und keine leeren Stellen <code>____</code>"},"r":"lorem|todo|_{4}","f":null}],"hint":{"ru":"<p>Не получается @media? Пример: <code>@media (max-width: 600px) { header { flex-direction: column; } }</code>. Как проверить Tab: нажми Tab несколько раз в результате и смотри, куда идёт выделение.</p>","de":"<p>@media klappt nicht? Beispiel: <code>@media (max-width: 600px) { header { flex-direction: column; } }</code>. So prüfst du Tab: Drücke im Ergebnis mehrmals Tab und schau, wohin die Markierung wandert.</p>"},"manual":[{"ru":"Я проверил(а) сайт на ширине телефона (кнопка 📱)","de":"Ich habe die Website in Handy-Breite geprüft (Knopf 📱)"},{"ru":"Я прошёл(ла) сайт клавишей Tab без мыши","de":"Ich bin die Website mit der Taste Tab ohne Maus durchgegangen"},{"ru":"Я проверил(а) HTML на validator.w3.org","de":"Ich habe das HTML auf validator.w3.org geprüft"},{"ru":"Я показал(а) сайт другому человеку и учёл его замечания","de":"Ich habe die Website einer anderen Person gezeigt und ihre Hinweise berücksichtigt"}],"from":26},{"day":28,"week":4,"title":{"ru":"Публикация и что дальше","de":"Veröffentlichen und wie es weitergeht"},"goal":{"ru":"Понять, как сайт попадает в интернет, скачать свои файлы и выбрать следующий шаг.","de":"Verstehen, wie eine Website ins Internet kommt, die eigenen Dateien herunterladen und den nächsten Schritt wählen."},"theory":{"ru":"<p>Сайт в интернете — это те же файлы (<code>index.html</code>, <code>style.css</code>, картинки) на компьютере, который всегда включён и подключён к сети. Такой компьютер называется <b>сервером</b>, а услуга — <b>хостингом</b>. У сайта есть адрес: <b>домен</b>.</p><p>Для первого сайта подойдут бесплатные хостинги статичных сайтов, например <b>Neocities</b>: создаёшь аккаунт, загружаешь файлы через веб-интерфейс, и сайт получает адрес вида <code>имя.neocities.org</code>. Позже ты можешь перейти на GitHub Pages (там нужен Git).</p><p><b>Перед публикацией, вместе со взрослым:</b></p><ul><li>Выберите сервис и прочитайте его условия и возрастные ограничения.</li><li>Не используй настоящие имя, адрес, телефон, школу и фото лица на публичном сайте без согласия родителей. Выбери ник.</li><li>Не загружай чужие картинки и тексты без разрешения, свои проекты — пожалуйста.</li></ul><p>Даже без публикации ты можешь открыть скачанный <code>index.html</code> на своём компьютере: браузер покажет сайт, как он есть.</p>","de":"<p>Eine Website im Internet sind dieselben Dateien (<code>index.html</code>, <code>style.css</code>, Bilder) auf einem Computer, der immer eingeschaltet und mit dem Netz verbunden ist. Ein solcher Computer heißt <b>Server</b>, der Dienst heißt <b>Hosting</b>. Die Website hat eine Adresse: die <b>Domain</b>.</p><p>Für die erste Website eignen sich kostenlose Hoster für statische Websites, zum Beispiel <b>Neocities</b>: Du legst ein Konto an, lädst die Dateien über die Weboberfläche hoch, und die Website bekommt eine Adresse wie <code>name.neocities.org</code>. Später kannst du zu GitHub Pages wechseln (dort braucht man Git).</p><p><b>Vor der Veröffentlichung, gemeinsam mit einem Erwachsenen:</b></p><ul><li>Wählt den Dienst aus und lest seine Bedingungen und Altersgrenzen.</li><li>Verwende auf einer öffentlichen Website keinen echten Namen, keine Adresse, Telefonnummer, Schule und kein Gesichtsfoto ohne Zustimmung der Eltern. Wähle einen Nicknamen.</li><li>Lade keine fremden Bilder und Texte ohne Erlaubnis hoch, eigene Projekte gern.</li></ul><p>Auch ohne Veröffentlichung kannst du die heruntergeladene <code>index.html</code> auf deinem Computer öffnen: Der Browser zeigt die Website so, wie sie ist.</p>"},"task":{"ru":"<ol><li>Нажми «Скачать файлы»: на компьютер сохранятся <code>index.html</code> и <code>style.css</code>.</li><li>Открой <code>index.html</code> двойным щелчком и убедись, что всё работает (если картинки <code>cat.svg</code> и другие из курса не отображаются, это нормально: на настоящем сайте ты положишь свои файлы рядом).</li><li>Пройди чек-лист ниже.</li><li>Получи сертификат и выбери следующий шаг из списка.</li></ol>","de":"<ol><li>Drücke „Dateien herunterladen“: Auf deinem Computer werden <code>index.html</code> und <code>style.css</code> gespeichert.</li><li>Öffne <code>index.html</code> per Doppelklick und prüfe, ob alles funktioniert (wenn die Kursbilder <code>cat.svg</code> und andere nicht angezeigt werden, ist das normal: Auf einer echten Website legst du deine eigenen Dateien daneben).</li><li>Gehe die Checkliste unten durch.</li><li>Hole dir das Zertifikat und wähle den nächsten Schritt aus der Liste.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    МОЙ ПЛАН САЙТА (замени каждую строку ____ своим текстом)\n    Тема: ____\n    Для кого: ____\n    Что хочу рассказать или показать: ____\n    Разделы (минимум 3): 1) ____ 2) ____ 3) ____\n    Главные цвета (2–3): ____\n    Какое настроение у сайта (спокойное, весёлое, строгое…): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!--\n    MEIN WEBSITE-PLAN (ersetze jedes ____ durch deinen Text)\n    Thema: ____\n    Für wen: ____\n    Was ich erzählen oder zeigen möchte: ____\n    Abschnitte (mindestens 3): 1) ____ 2) ____ 3) ____\n    Hauptfarben (2–3): ____\n    Stimmung der Website (ruhig, fröhlich, ernst …): ____\n  -->\n  <h1></h1>\n</body>\n</html>\n"},"style.css":"/* твой CSS */\n"},"hint":{"ru":"<p>Если хочешь свои картинки, положи файлы (например, <code>photo.jpg</code>) в ту же папку, что и <code>index.html</code>, и напиши имя в <code>src</code>.</p>","de":"<p>Wenn du eigene Bilder möchtest, lege die Dateien (z. B. <code>photo.jpg</code>) in denselben Ordner wie <code>index.html</code> und schreibe den Namen in <code>src</code>.</p>"},"manual":[{"ru":"Я скачал(а) файлы своего сайта и открыл(а) их на компьютере","de":"Ich habe die Dateien meiner Website heruntergeladen und auf dem Computer geöffnet"},{"ru":"Я обсудил(а) с родителем, где и как публиковать сайт","de":"Ich habe mit einem Elternteil besprochen, wo und wie die Website veröffentlicht wird"},{"ru":"На сайте нет моего адреса, телефона, школы и настоящей фамилии","de":"Auf der Website stehen weder meine Adresse, Telefonnummer, Schule noch mein echter Nachname"},{"ru":"Я выбрал(а), что изучать дальше","de":"Ich habe gewählt, was ich als Nächstes lerne"}],"from":27,"extra":{"ru":"<h3>Куда двигаться дальше</h3><ul class=\"links\"><li><a href=\"https://www.freecodecamp.org\" target=\"_blank\" rel=\"noopener\">freeCodeCamp</a> — интерактивные уроки HTML и CSS (на английском).</li><li><a href=\"https://developer.mozilla.org\" target=\"_blank\" rel=\"noopener\">MDN Web Docs</a> — подробный справочник по HTML, CSS и JavaScript.</li><li><a href=\"https://www.theodinproject.com\" target=\"_blank\" rel=\"noopener\">The Odin Project</a> — серьёзная бесплатная программа по веб-разработке: как работает интернет, Git, JavaScript.</li><li><a href=\"https://codepen.io\" target=\"_blank\" rel=\"noopener\">CodePen</a> — онлайн-редактор для экспериментов.</li><li><a href=\"https://code.visualstudio.com\" target=\"_blank\" rel=\"noopener\">VS Code</a> с расширением Live Server — редактор кода на компьютере.</li><li><a href=\"https://pages.github.com\" target=\"_blank\" rel=\"noopener\">GitHub Pages</a> — публикация сайта, когда освоишь Git.</li></ul>","de":"<h3>Wie es weitergeht</h3><ul class=\"links\"><li><a href=\"https://www.freecodecamp.org\" target=\"_blank\" rel=\"noopener\">freeCodeCamp</a> — interaktive Lektionen zu HTML und CSS (auf Englisch).</li><li><a href=\"https://selfhtml.org\" target=\"_blank\" rel=\"noopener\">SELFHTML</a> — ausführliches deutschsprachiges Nachschlagewerk und Lehrbuch zu HTML und CSS.</li><li><a href=\"https://developer.mozilla.org\" target=\"_blank\" rel=\"noopener\">MDN Web Docs</a> — ausführliches Nachschlagewerk zu HTML, CSS und JavaScript.</li><li><a href=\"https://www.theodinproject.com\" target=\"_blank\" rel=\"noopener\">The Odin Project</a> — ein anspruchsvolles kostenloses Programm zur Webentwicklung: wie das Internet funktioniert, Git, JavaScript.</li><li><a href=\"https://codepen.io\" target=\"_blank\" rel=\"noopener\">CodePen</a> — Online-Editor zum Experimentieren.</li><li><a href=\"https://code.visualstudio.com\" target=\"_blank\" rel=\"noopener\">VS Code</a> mit der Erweiterung Live Server — Code-Editor für den Computer.</li><li><a href=\"https://pages.github.com\" target=\"_blank\" rel=\"noopener\">GitHub Pages</a> — Veröffentlichung, wenn du Git beherrschst.</li></ul>"},"download":true}]};</script>
<script>
(function(){
'use strict';
var D=window.COURSE,LS='kurs-v1',S;
try{S=JSON.parse(localStorage.getItem(LS))||{};}catch(e){S={};}
S.done=S.done||{};S.code=S.code||{};S.ok=S.ok||{};S.q=S.q||{};S.man=S.man||{};S.unlock=S.unlock||{};S.stat=S.stat||{};S.dates=S.dates||{};S.note=S.note||{};S.name=S.name||'Святослав';S.lang=S.lang||'ru';if(S.lang!=='de')S.lang='ru';
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function t(o){return (o&&typeof o==='object')?(o[S.lang]||o.ru):o;}
function U(k){return t(D.ui[k]);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var app=document.getElementById('app');
/* ---------- images available inside lessons ---------- */
var SVG={
'cat.svg':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="16" fill="#ffe9c7"/><path d="M28 50 L34 20 L52 38 Z M92 50 L86 20 L68 38 Z" fill="#f2a900"/><circle cx="60" cy="68" r="38" fill="#f2a900"/><circle cx="46" cy="62" r="6" fill="#15172e"/><circle cx="74" cy="62" r="6" fill="#15172e"/><path d="M54 78 Q60 86 66 78" stroke="#15172e" stroke-width="3" fill="none"/><path d="M20 72 L44 74 M20 84 L44 80 M100 72 L76 74 M100 84 L76 80" stroke="#15172e" stroke-width="2"/></svg>',
'sun.svg':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="16" fill="#cfeaff"/><g stroke="#f2a900" stroke-width="6" stroke-linecap="round"><path d="M60 12v16M60 92v16M12 60h16M92 60h16M26 26l11 11M83 83l11 11M94 26L83 37M37 83L26 94"/></g><circle cx="60" cy="60" r="24" fill="#ffc933"/></svg>',
'rocket.svg':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="16" fill="#1e2036"/><circle cx="20" cy="24" r="2" fill="#fff"/><circle cx="96" cy="18" r="2" fill="#fff"/><circle cx="100" cy="70" r="2" fill="#fff"/><path d="M60 14c16 14 20 38 14 58H46C40 52 44 28 60 14z" fill="#e8e9f7"/><circle cx="60" cy="46" r="9" fill="#1a8fe0"/><path d="M46 72l-14 16 18-4zM74 72l14 16-18-4z" fill="#ee6a3c"/><path d="M54 76h12l-6 22z" fill="#ffc933"/></svg>',
'plant.svg':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="16" fill="#e5f7ee"/><path d="M60 92V52" stroke="#0f9d8a" stroke-width="5"/><path d="M60 62C40 62 32 48 32 36c20 0 28 10 28 26zM60 52c0-18 10-28 28-28 0 14-8 28-28 28z" fill="#3fbf8f"/><path d="M40 92h40l-6 18H46z" fill="#ee6a3c"/></svg>'};
var IMG={};Object.keys(SVG).forEach(function(k){IMG[k]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SVG[k]);});
/* ---------- build page from virtual files ---------- */
function build(f){
  var h=f['index.html']||'',css=f['style.css']||'';
  h=h.replace(/<link\b[^>]*href\s*=\s*["']style\.css["'][^>]*>/ig,function(){return '<style>'+css+'</style>';});
  h=h.replace(/(src\s*=\s*["'])([\w.-]+\.svg)(["'])/g,function(m,a,n,b){return IMG[n]?a+IMG[n]+b:m;});
  return h;
}
/* ---------- syntax highlighting ---------- */
function hlTag(s){
  var m=/^(<\/?)([^\s>\/]+)([\s\S]*?)(\/?>)$/.exec(s);if(!m)return esc(s);
  var a=m[3].replace(/([^\s=<>"']+)(\s*=\s*)?("[^"]*"|'[^']*')?/g,function(x,n,eq,v){return '<i class="k-an">'+esc(n)+'</i>'+(eq?esc(eq):'')+(v?'<i class="k-av">'+esc(v)+'</i>':'');});
  return '<i class="k-tag">'+esc(m[1]+m[2])+'</i>'+a+'<i class="k-tag">'+esc(m[4])+'</i>';
}
function hlCss(src){
  var out='',re=/(\/\*[\s\S]*?\*\/)|((?:(?!\/\*)[^{}])*)(\{)([^{}]*)(\}?)/g,last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;
    if(m[1]){out+='<i class="k-cm">'+esc(m[1])+'</i>';continue;}
    out+='<i class="k-sel">'+esc(m[2])+'</i>'+esc(m[3]);
    out+=m[4].replace(/(\/\*[\s\S]*?\*\/)|([\w-]+)(\s*:)([^;]*)(;?)/g,function(x,c,p,co,v,sc){if(c)return '<i class="k-cm">'+esc(c)+'</i>';return '<i class="k-pr">'+esc(p)+'</i>'+esc(co)+'<i class="k-vl">'+esc(v)+'</i>'+esc(sc);});
    out+=esc(m[5]);
  }
  return out+esc(src.slice(last));
}
function hlHtml(src){
  var re=/(<!--[\s\S]*?-->)|(<style[^>]*>)([\s\S]*?)(<\/style>)|(<script[^>]*>)([\s\S]*?)(<\/script>)|(<\/?[a-zA-Z!][^>]*>)/g,out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+='<i class="k-cm">'+esc(m[1])+'</i>';
    else if(m[2])out+=hlTag(m[2])+hlCss(m[3])+hlTag(m[4]);
    else if(m[5])out+=hlTag(m[5])+'<i class="k-js">'+esc(m[6])+'</i>'+hlTag(m[7]);
    else out+=hlTag(m[8]);
  }
  return out+esc(src.slice(last));
}
function hl(src,file){return /\.css$/.test(file)?hlCss(src):hlHtml(src);}
/* ---------- check engine ---------- */
function runChecks(L,files){
  var checks=L.checks||[],groups={};
  checks.forEach(function(c,i){var w=c.w||800;(groups[w]=groups[w]||[]).push(i);});
  var res=new Array(checks.length);
  var jobs=Object.keys(groups).map(function(w){return new Promise(function(done){
    var fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-same-origin');
    fr.style.cssText='position:absolute;left:-9999px;top:0;height:700px;border:0;width:'+w+'px';
    fr.onload=function(){
      var d=fr.contentDocument,win=fr.contentWindow;
      groups[w].forEach(function(i){var ok=false;try{ok=evalCheck(checks[i],d,win,files);}catch(e){ok=false;}res[i]=ok;});
      fr.remove();done();
    };
    fr.srcdoc=build(files);document.body.appendChild(fr);
  });});
  return Promise.all(jobs).then(function(){return res;});
}
function allFiles(files){return Object.keys(files).map(function(k){return files[k];}).join('\n');}
function evalCheck(c,d,w,files){
  var rx=c.r!=null?new RegExp(c.r,'i'):null,els;
  function txt(e){return (e.textContent||'').replace(/\s+/g,' ').trim();}
  switch(c.t){
    case 'has':return !!d.querySelector(c.s);
    case 'count':return d.querySelectorAll(c.s).length>=c.n;
    case 'text':return [].some.call(d.querySelectorAll(c.s),function(e){return rx.test(txt(e));});
    case 'attr':return [].some.call(d.querySelectorAll(c.s),function(e){return rx.test(e.getAttribute(c.a)||'');});
    case 'allattr':els=d.querySelectorAll(c.s);return els.length>0&&[].every.call(els,function(e){return rx.test(e.getAttribute(c.a)||'');});
    case 'css':els=d.querySelector(c.s);return !!els&&rx.test(w.getComputedStyle(els).getPropertyValue(c.p));
    case 'cssnot':els=d.querySelector(c.s);return !!els&&!rx.test(w.getComputedStyle(els).getPropertyValue(c.p));
    case 'cssnum':els=d.querySelector(c.s);if(!els)return false;var v=parseFloat(w.getComputedStyle(els).getPropertyValue(c.p));if(isNaN(v))return false;return c.o==='>='?v>=c.n:c.o==='<='?v<=c.n:c.o==='>'?v>c.n:v===c.n;
    case 'code':var src=c.f?(files[c.f]||''):allFiles(files);return rx.test(src);
    case 'nocode':var s2=c.f?(files[c.f]||''):allFiles(files);return !rx.test(s2);
  }
  return false;
}

}
function quizOk(L){return !L.quiz||L.quiz.every(function(q,i){return S.q[L.day+'.'+i];});}
