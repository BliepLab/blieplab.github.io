tle>Stile</title>\n  <style>\n    .titel {\n      color: #5b48e8;\n    }\n    .box {\n      backgroud-color: #fff3d6;\n      padding: 20px\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Finde die Fehler</h1>\n  <div class=\"box\">\n    <p>Dieser Block soll hellgelb sein, mit Abstand und runden Ecken.</p>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"Заголовок <code>h1</code> цветной","de":"Die Überschrift <code>h1</code> ist farbig"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"У <code>.box</code> есть фон","de":"<code>.box</code> hat einen Hintergrund"},"s":".box","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"У <code>.box</code> есть отступ <code>padding</code>","de":"<code>.box</code> hat einen <code>padding</code>"},"s":".box","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"У <code>.box</code> скруглены углы","de":"<code>.box</code> hat runde Ecken"},"s":".box","p":"border-top-left-radius","o":">=","n":8,"w":null},{"t":"count","m":{"ru":"Два блока <code>.box</code>","de":"Zwei Blöcke <code>.box</code>"},"s":".box","n":2,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть блок с двумя классами <code>box warn</code>","de":"Es gibt einen Block mit zwei Klassen <code>box warn</code>"},"s":".box.warn","w":null,"lv":2},{"t":"cssnot","m":{"ru":"У <code>.warn</code> есть фон","de":"<code>.warn</code> hat einen Hintergrund"},"s":".warn","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":2},{"t":"css","m":{"ru":"Заголовок по центру","de":"Überschrift zentriert"},"s":".title","p":"text-align","r":"center","w":null,"lv":2},{"t":"code","m":{"ru":"Есть «журнал ошибок» в комментарии","de":"Es gibt ein „Fehlerprotokoll“ im Kommentar"},"r":"(<!--[\\s\\S]*?Ошибка|<!--[\\s\\S]*?Fehler|<!--[\\s\\S]*?ошибка)","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть правило <code>.box:hover</code>","de":"Es gibt die Regel <code>.box:hover</code>"},"r":"\\.box:hover\\s*\\{","f":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"<code>.box</code>: отступ снизу от 10px","de":"<code>.box</code>: Abstand nach unten ab 10px"},"s":".box","p":"margin-bottom","o":">=","n":10,"w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .title {\n      color: #5b48e8;\n      text-align: center;\n    }\n    .box {\n      background-color: #fff3d6;\n      padding: 20px;\n      border-radius: 12px;\n      margin-bottom: 16px;\n    }\n    .warn {\n      background-color: #ffe3e0;\n      border-left: 5px solid tomato;\n    }\n    .box:hover {\n      background-color: #ffe9a8;\n    }\n  </style>\n</head>\n<body>\n  <!-- Ошибка 1: класс titel вместо title. Ошибка 2: backgroud вместо background. Ошибка 3: нет ; после padding. -->\n  <h1 class=\"title\">Найди ошибки</h1>\n  <div class=\"box\">\n    <p>Этот блок должен быть светло-жёлтым, с отступом и скруглёнными углами.</p>\n  </div>\n  <div class=\"box warn\">\n    <p>Осторожно: этот блок — предупреждение.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    .title {\n      color: #5b48e8;\n      text-align: center;\n    }\n    .box {\n      background-color: #fff3d6;\n      padding: 20px;\n      border-radius: 12px;\n      margin-bottom: 16px;\n    }\n    .warn {\n      background-color: #ffe3e0;\n      border-left: 5px solid tomato;\n    }\n    .box:hover {\n      background-color: #ffe9a8;\n    }\n  </style>\n</head>\n<body>\n  <!-- Fehler 1: Klasse titel statt title. Fehler 2: backgroud statt background. Fehler 3: kein ; nach padding. -->\n  <h1 class=\"title\">Finde die Fehler</h1>\n  <div class=\"box\">\n    <p>Dieser Block soll hellgelb sein, mit Abstand und runden Ecken.</p>\n  </div>\n  <div class=\"box warn\">\n    <p>Vorsicht: Dieser Block ist eine Warnung.</p>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Ищи: (1) в HTML класс <code>title</code>, а в CSS <code>.titel</code>: имена не совпадают. (2) В слове <code>backgroud-color</code> не хватает буквы <code>n</code>. (3) После <code>padding: 20px</code> нет точки с запятой, и браузер слил две строки.</p>","de":"<p>Suche: (1) Im HTML steht die Klasse <code>title</code>, im CSS <code>.titel</code>: Die Namen stimmen nicht überein. (2) Im Wort <code>backgroud-color</code> fehlt der Buchstabe <code>n</code>. (3) Nach <code>padding: 20px</code> fehlt das Semikolon, und der Browser hat zwei Zeilen verschmolzen.</p>"},"quiz":[{"q":{"ru":"Что значит зачёркнутая строка в панели Styles?","de":"Was bedeutet eine durchgestrichene Zeile im Styles-Panel?"},"o":[{"ru":"Правило перебито другим или неверно","de":"Die Regel wurde überschrieben oder ist fehlerhaft"},{"ru":"Правило работает особенно сильно","de":"Die Regel wirkt besonders stark"},{"ru":"Файл удалён","de":"Die Datei ist gelöscht"}],"a":0},{"q":{"ru":"Сохраняются ли изменения, сделанные в инструментах разработчика?","de":"Werden Änderungen in den Entwicklerwerkzeugen gespeichert?"},"o":[{"ru":"Нет, их нужно перенести в код","de":"Nein, man muss sie in den Code übertragen"},{"ru":"Да, навсегда","de":"Ja, für immer"},{"ru":"Только на мобильном","de":"Nur auf dem Handy"}],"a":0}],"lv2":{"ru":"<p>Теперь добавь новый блок и сразу проверь его в DevTools (<code>F12</code>, вкладка Elements):</p><ol><li>Добавь второй блок <code>&lt;div class=\"box warn\"&gt;</code> с абзацем-предупреждением. Класс <code>warn</code> добавляется к <code>box</code> через пробел: у элемента два класса.</li><li>В CSS: <code>.warn { background-color: #ffe3e0; border-left: 5px solid tomato; }</code>.</li><li>Выровняй заголовок по центру: <code>text-align: center;</code> в правиле <code>.title</code>.</li><li>Открой DevTools, выбери новый блок и найди в панели Styles своё правило <code>.warn</code>. Что зачёркнуто?</li></ol>","de":"<p>Füge jetzt einen neuen Block hinzu und prüfe ihn sofort in den DevTools (<code>F12</code>, Tab Elements):</p><ol><li>Füge einen zweiten Block <code>&lt;div class=\"box warn\"&gt;</code> mit einem Warnabsatz hinzu. Die Klasse <code>warn</code> kommt mit Leerzeichen zu <code>box</code>: Das Element hat zwei Klassen.</li><li>Im CSS: <code>.warn { background-color: #ffe3e0; border-left: 5px solid tomato; }</code>.</li><li>Zentriere die Überschrift: <code>text-align: center;</code> in der Regel <code>.title</code>.</li><li>Öffne die DevTools, wähle den neuen Block und finde im Bereich Styles deine Regel <code>.warn</code>. Was ist durchgestrichen?</li></ol>"},"lv3":{"ru":"<p>Поработай «ошибкоискателем». Ты уже нашёл три ошибки (опечатка в имени класса, в названии свойства и пропущенная точка с запятой). Теперь:</p><ol><li>Оформи «журнал ошибок» в виде комментария в HTML: минимум 3 строки <code>&lt;!-- ошибка 1: … --&gt;</code> — что было сломано и как исправил.</li><li>Добавь ещё одно правило <code>.box:hover { background-color: #ffe9a8; }</code> и проверь в DevTools: правило есть, но пока не «горит» — наведи курсор на блок и увидишь, как оно включается.</li><li>Дай блокам внешний отступ: <code>.box { margin-bottom: 16px; }</code>.</li></ol><p>Золотое правило отладки: если что-то не работает, сначала смотри на опечатки, потом на скобки и точки с запятой.</p>","de":"<p>Arbeite als „Fehlersucher“. Du hast schon drei Fehler gefunden (Tippfehler im Klassennamen, im Eigenschaftsnamen und ein fehlendes Semikolon). Jetzt:</p><ol><li>Führe ein „Fehlerprotokoll“ als Kommentar im HTML: mindestens 3 Zeilen <code>&lt;!-- Fehler 1: … --&gt;</code> — was kaputt war und wie du es repariert hast.</li><li>Füge noch die Regel <code>.box:hover { background-color: #ffe9a8; }</code> hinzu und prüfe in den DevTools: Die Regel ist da, „leuchtet“ aber noch nicht — fahre mit dem Zeiger über den Block und sieh, wie sie anspringt.</li><li>Gib den Blöcken einen Außenabstand: <code>.box { margin-bottom: 16px; }</code>.</li></ol><p>Goldene Regel beim Fehlersuchen: Wenn etwas nicht funktioniert, schau zuerst auf Tippfehler, dann auf Klammern und Semikolons.</p>"}},{"day":16,"week":3,"title":{"ru":"Блоки, строки и смысловые теги","de":"Blöcke, Zeilenelemente und semantische Tags"},"goal":{"ru":"Отличать блочные и строчные элементы и использовать смысловые теги.","de":"Block- und Zeilenelemente unterscheiden und semantische Tags nutzen."},"theory":{"ru":"<p><b>Блочные</b> элементы (<code>p</code>, <code>h1</code>, <code>div</code>) занимают всю строку и стоят друг под другом. <b>Строчные</b> (<code>a</code>, <code>span</code>, <code>strong</code>) стоят в строке с текстом и занимают столько места, сколько нужно.</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Это &lt;span class=\"accent\"&gt;важное&lt;/span&gt; слово.&lt;/p&gt;</pre><p><code>&lt;div&gt;</code> — универсальный блок, <code>&lt;span&gt;</code> — универсальный «кусочек» текста. Но есть теги с <b>смыслом</b>, их лучше использовать вместо безликих div:</p><ul><li><code>&lt;header&gt;</code> — шапка сайта или раздела</li><li><code>&lt;nav&gt;</code> — навигация (меню)</li><li><code>&lt;main&gt;</code> — главное содержимое (один на странице)</li><li><code>&lt;section&gt;</code> — тематический раздел</li><li><code>&lt;footer&gt;</code> — подвал</li></ul><p>Смысловые теги помогают поисковикам и программам для незрячих понять страницу.</p>","de":"<p><b>Blockelemente</b> (<code>p</code>, <code>h1</code>, <code>div</code>) nehmen die ganze Zeile ein und stehen untereinander. <b>Zeilenelemente</b> (<code>a</code>, <code>span</code>, <code>strong</code>) stehen im Text und nehmen nur so viel Platz wie nötig.</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Das ist ein &lt;span class=\"accent\"&gt;wichtiges&lt;/span&gt; Wort.&lt;/p&gt;</pre><p><code>&lt;div&gt;</code> ist ein universeller Block, <code>&lt;span&gt;</code> ein universelles Textstück. Aber es gibt Tags mit <b>Bedeutung</b>, die man statt gesichtsloser divs nutzen sollte:</p><ul><li><code>&lt;header&gt;</code> — Kopf der Website oder eines Abschnitts</li><li><code>&lt;nav&gt;</code> — Navigation (Menü)</li><li><code>&lt;main&gt;</code> — Hauptinhalt (einer pro Seite)</li><li><code>&lt;section&gt;</code> — thematischer Abschnitt</li><li><code>&lt;footer&gt;</code> — Fußbereich</li></ul><p>Semantische Tags helfen Suchmaschinen und Programmen für Blinde, die Seite zu verstehen.</p>"},"task":{"ru":"<p>Перед тобой страница из одних <code>div</code>. Переделай её:</p><ol><li>Замени div на <code>header</code>, <code>nav</code>, <code>main</code>, два <code>section</code> и <code>footer</code> (не забудь закрывающие теги!).</li><li>Вместо <code>&lt;b&gt;</code> вокруг слова «роботов» поставь <code>&lt;span class=\"accent\"&gt;</code>.</li><li>В CSS дай <code>.accent</code> цвет.</li></ol>","de":"<p>Vor dir steht eine Seite aus lauter <code>div</code>. Baue sie um:</p><ol><li>Ersetze die divs durch <code>header</code>, <code>nav</code>, <code>main</code>, zwei <code>section</code> und <code>footer</code> (vergiss die schließenden Tags nicht!).</li><li>Setze statt <code>&lt;b&gt;</code> um das Wort „Roboter“ ein <code>&lt;span class=\"accent\"&gt;</code>.</li><li>Gib <code>.accent</code> im CSS eine Farbe.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    /* стиль для .accent */\n  </style>\n</head>\n<body>\n  <div class=\"header\">\n    <h1>Мой клуб</h1>\n    <div class=\"nav\"><a href=\"#about\">О нас</a> <a href=\"#events\">События</a></div>\n  </div>\n  <div class=\"main\">\n    <div class=\"section\" id=\"about\">\n      <h2>О нас</h2>\n      <p>Мы встречаемся по субботам и делаем <b>роботов</b>.</p>\n    </div>\n    <div class=\"section\" id=\"events\">\n      <h2>События</h2>\n      <p>Ближайшая встреча в субботу в 10:00.</p>\n    </div>\n  </div>\n  <div class=\"footer\"><p>© 2025 Мой клуб</p></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    /* Stil für .accent */\n  </style>\n</head>\n<body>\n  <div class=\"header\">\n    <h1>Mein Club</h1>\n    <div class=\"nav\"><a href=\"#about\">Über uns</a> <a href=\"#events\">Termine</a></div>\n  </div>\n  <div class=\"main\">\n    <div class=\"section\" id=\"about\">\n      <h2>Über uns</h2>\n      <p>Wir treffen uns samstags und bauen <b>Roboter</b>.</p>\n    </div>\n    <div class=\"section\" id=\"events\">\n      <h2>Termine</h2>\n      <p>Das nächste Treffen ist am Samstag um 10:00 Uhr.</p>\n    </div>\n  </div>\n  <div class=\"footer\"><p>© 2025 Mein Club</p></div>\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть <code>&lt;header&gt;</code>","de":"Es gibt <code>&lt;header&gt;</code>"},"s":"header","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;nav&gt;</code>","de":"Es gibt <code>&lt;nav&gt;</code>"},"s":"nav","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;main&gt;</code>","de":"Es gibt <code>&lt;main&gt;</code>"},"s":"main","w":null},{"t":"count","m":{"ru":"Минимум два <code>&lt;section&gt;</code>","de":"Mindestens zwei <code>&lt;section&gt;</code>"},"s":"section","n":2,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;footer&gt;</code>","de":"Es gibt <code>&lt;footer&gt;</code>"},"s":"footer","w":null},{"t":"nocode","m":{"ru":"Не осталось ни одного <code>&lt;div&gt;</code>","de":"Es ist kein <code>&lt;div&gt;</code> mehr übrig"},"r":"<div","f":null},{"t":"has","m":{"ru":"Есть <code>&lt;span class=\"accent\"&gt;</code>","de":"Es gibt <code>&lt;span class=\"accent\"&gt;</code>"},"s":"span.accent","w":null},{"t":"cssnot","m":{"ru":"У <code>.accent</code> есть цвет","de":"<code>.accent</code> hat eine Farbe"},"s":".accent","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"has","m":{"ru":"<code>article</code> с заголовком <code>h3</code> внутри <code>main</code>","de":"<code>article</code> mit <code>h3</code> in <code>main</code>"},"s":"main article h3","w":null,"lv":2},{"t":"has","m":{"ru":"Есть <code>&lt;time datetime=\"…\"&gt;</code>","de":"Es gibt <code>&lt;time datetime=\"…\"&gt;</code>"},"s":"time[datetime]","w":null,"lv":2},{"t":"has","m":{"ru":"Есть <code>&lt;aside&gt;</code> внутри <code>main</code>","de":"Es gibt <code>&lt;aside&gt;</code> in <code>main</code>"},"s":"main aside","w":null,"lv":2},{"t":"attr","m":{"ru":"У <code>nav</code> есть <code>aria-label</code>","de":"<code>nav</code> hat <code>aria-label</code>"},"s":"nav","a":"aria-label","r":".{3,}","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"У <code>main</code> есть <code>id=\"main\"</code>","de":"<code>main</code> hat <code>id=\"main\"</code>"},"s":"main#main","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть ссылка «Перейти к содержимому»","de":"Es gibt den Link „Zum Inhalt springen“"},"s":"a[href=\"#main\"]","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть стиль <code>a:focus</code>","de":"Es gibt einen Stil <code>a:focus</code>"},"r":"a:focus\\s*\\{","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    .accent { color: #ee6a3c; font-weight: 700; }\n    a:focus { outline: 3px solid #ee6a3c; }\n  </style>\n</head>\n<body>\n  <a href=\"#main\">Перейти к содержимому</a>\n  <header>\n    <h1>Мой клуб</h1>\n    <nav aria-label=\"Главное меню\"><a href=\"#about\">О нас</a> <a href=\"#events\">События</a></nav>\n  </header>\n  <main id=\"main\">\n    <section id=\"about\">\n      <h2>О нас</h2>\n      <p>Мы встречаемся по субботам и делаем <span class=\"accent\">роботов</span>.</p>\n    </section>\n    <section id=\"events\">\n      <h2>События</h2>\n      <p>Ближайшая встреча в субботу в 10:00.</p>\n    </section>\n    <article>\n      <h3>Новость</h3>\n      <p><time datetime=\"2025-06-14\">14 июня</time> мы собрали первого робота.</p>\n    </article>\n    <aside>\n      <p>Знаешь ли ты? Первый сайт появился в 1991 году.</p>\n    </aside>\n  </main>\n  <footer><p>© 2025 Мой клуб</p></footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 20px; }\n    .accent { color: #ee6a3c; font-weight: 700; }\n    a:focus { outline: 3px solid #ee6a3c; }\n  </style>\n</head>\n<body>\n  <a href=\"#main\">Zum Inhalt springen</a>\n  <header>\n    <h1>Mein Club</h1>\n    <nav aria-label=\"Hauptmenü\"><a href=\"#about\">Über uns</a> <a href=\"#events\">Termine</a></nav>\n  </header>\n  <main id=\"main\">\n    <section id=\"about\">\n      <h2>Über uns</h2>\n      <p>Wir treffen uns samstags und bauen <span class=\"accent\">Roboter</span>.</p>\n    </section>\n    <section id=\"events\">\n      <h2>Termine</h2>\n      <p>Das nächste Treffen ist am Samstag um 10:00 Uhr.</p>\n    </section>\n    <article>\n      <h3>Neuigkeit</h3>\n      <p>Am <time datetime=\"2025-06-14\">14. Juni</time> haben wir den ersten Roboter gebaut.</p>\n    </article>\n    <aside>\n      <p>Wusstest du? Die erste Website entstand 1991.</p>\n    </aside>\n  </main>\n  <footer><p>© 2025 Mein Club</p></footer>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Открывающий <code>&lt;div class=\"header\"&gt;</code> становится <code>&lt;header&gt;</code>, а соответствующий закрывающий <code>&lt;/div&gt;</code> становится <code>&lt;/header&gt;</code>. Меняй парами, по очереди.</p>","de":"<p>Aus dem öffnenden <code>&lt;div class=\"header\"&gt;</code> wird <code>&lt;header&gt;</code>, und das passende schließende <code>&lt;/div&gt;</code> wird zu <code>&lt;/header&gt;</code>. Ändere Paar für Paar, nacheinander.</p>"},"quiz":[{"q":{"ru":"Какой из этих элементов строчный?","de":"Welches dieser Elemente ist ein Zeilenelement?"},"o":[{"ru":"&lt;span&gt;","de":"&lt;span&gt;"},{"ru":"&lt;div&gt;","de":"&lt;div&gt;"},{"ru":"&lt;h1&gt;","de":"&lt;h1&gt;"}],"a":0},{"q":{"ru":"Для чего нужен &lt;nav&gt;?","de":"Wozu ist &lt;nav&gt; da?"},"o":[{"ru":"Для навигации (меню)","de":"Für die Navigation (Menü)"},{"ru":"Для подвала","de":"Für den Fußbereich"},{"ru":"Для картинок","de":"Für Bilder"}],"a":0}],"lv2":{"ru":"<p>Добавь в страницу ещё три смысловых тега:</p><ol><li><code>&lt;article&gt;</code> — самостоятельная запись (новость, пост). Внутри <code>main</code> добавь <code>&lt;article&gt;</code> с заголовком <code>&lt;h3&gt;</code> и абзацем.</li><li><code>&lt;time datetime=\"2025-06-14\"&gt;14 июня&lt;/time&gt;</code> — дата, понятная и людям, и программам.</li><li><code>&lt;aside&gt;</code> — боковая заметка («Знаешь ли ты…»). Положи его в <code>main</code> после статьи.</li></ol><p>Эти теги ничего не рисуют сами. Их ценность в том, что программы (поисковики, экранные дикторы) понимают структуру страницы.</p>","de":"<p>Füge der Seite drei weitere semantische Tags hinzu:</p><ol><li><code>&lt;article&gt;</code> — ein eigenständiger Beitrag (Nachricht, Post). Füge in <code>main</code> ein <code>&lt;article&gt;</code> mit Überschrift <code>&lt;h3&gt;</code> und Absatz ein.</li><li><code>&lt;time datetime=\"2025-06-14\"&gt;14. Juni&lt;/time&gt;</code> — ein Datum, das Menschen und Programme verstehen.</li><li><code>&lt;aside&gt;</code> — eine Randnotiz („Wusstest du…“). Setze sie in <code>main</code> nach dem Artikel ein.</li></ol><p>Diese Tags zeichnen selbst nichts. Ihr Wert: Programme (Suchmaschinen, Screenreader) verstehen die Struktur der Seite.</p>"},"lv3":{"ru":"<p>Доступность: сайтом пользуются и люди, которые не видят экран и ходят по странице клавиатурой.</p><ol><li>Дай меню имя: <code>&lt;nav aria-label=\"Главное меню\"&gt;</code>.</li><li>Поставь на <code>&lt;main&gt;</code> атрибут <code>id=\"main\"</code>.</li><li>В самом начале <code>body</code> добавь ссылку «Перейти к содержимому»: <code>&lt;a href=\"#main\"&gt;Перейти к содержимому&lt;/a&gt;</code>. Нажми <code>Tab</code> в окне результата — она появится первой.</li><li>Добавь в стиль: <code>a:focus { outline: 3px solid #ee6a3c; }</code>, чтобы было видно, где «стоит» клавиатура.</li></ol>","de":"<p>Barrierefreiheit: Websites nutzen auch Menschen, die den Bildschirm nicht sehen und sich mit der Tastatur durch die Seite bewegen.</p><ol><li>Gib dem Menü einen Namen: <code>&lt;nav aria-label=\"Hauptmenü\"&gt;</code>.</li><li>Setze auf <code>&lt;main&gt;</code> das Attribut <code>id=\"main\"</code>.</li><li>Füge ganz am Anfang von <code>body</code> einen Link „Zum Inhalt springen“ ein: <code>&lt;a href=\"#main\"&gt;Zum Inhalt springen&lt;/a&gt;</code>. Drücke im Ergebnisfenster <code>Tab</code> — er erscheint als Erstes.</li><li>Füge im Stil hinzu: <code>a:focus { outline: 3px solid #ee6a3c; }</code>, damit man sieht, wo die Tastatur „steht“.</li></ol>"}},{"day":17,"week":3,"title":{"ru":"Flexbox: элементы в ряд","de":"Flexbox: Elemente in einer Reihe"},"goal":{"ru":"Выстроить элементы в ряд и выровнять их с помощью flexbox.","de":"Elemente mit Flexbox in einer Reihe anordnen und ausrichten."},"theory":{"ru":"<p>Раньше блоки стояли друг под другом. <b>Flexbox</b> — способ управлять рядом элементов. Надо включить его у <b>родителя</b>, и все дети выстроятся в ряд:</p><pre class=\"ex\" data-l=\"css\">nav ul {\n  display: flex;                  /* включить flexbox */\n  gap: 16px;                      /* расстояние между элементами */\n  justify-content: space-between; /* как распределить по горизонтали */\n  align-items: center;            /* выравнивание по вертикали */\n  list-style: none;               /* убрать маркеры */\n  padding: 0;\n}</pre><ul><li><code>justify-content</code>: <code>flex-start</code> (к началу), <code>center</code> (по центру), <code>space-between</code> (по краям с равными промежутками), <code>space-around</code>.</li><li><code>align-items</code>: выравнивание поперёк ряда.</li><li>Запомни: <b>display: flex пишется у родителя</b>, а не у детей.</li></ul>","de":"<p>Bisher standen Blöcke untereinander. <b>Flexbox</b> ist eine Methode, eine Reihe von Elementen zu steuern. Man schaltet sie beim <b>Elternelement</b> ein, und alle Kinder ordnen sich in einer Reihe an:</p><pre class=\"ex\" data-l=\"css\">nav ul {\n  display: flex;                  /* Flexbox einschalten */\n  gap: 16px;                      /* Abstand zwischen Elementen */\n  justify-content: space-between; /* Verteilung horizontal */\n  align-items: center;            /* Ausrichtung vertikal */\n  list-style: none;               /* Aufzählungspunkte entfernen */\n  padding: 0;\n}</pre><ul><li><code>justify-content</code>: <code>flex-start</code> (zum Anfang), <code>center</code> (zentriert), <code>space-between</code> (an den Rändern mit gleichen Abständen), <code>space-around</code>.</li><li><code>align-items</code>: Ausrichtung quer zur Reihe.</li><li>Merke: <b>display: flex schreibt man beim Elternelement</b>, nicht bei den Kindern.</li></ul>"},"task":{"ru":"<p>Сделай из вертикального списка горизонтальное меню:</p><ol><li>Для <code>nav ul</code> включи <code>display: flex</code>.</li><li>Задай <code>gap</code> между пунктами (от 8px).</li><li>Распредели пункты: <code>justify-content</code> (например, <code>center</code>).</li><li>Убери маркеры <code>list-style: none</code> и <code>padding: 0</code>.</li></ol>","de":"<p>Mache aus der senkrechten Liste ein waagerechtes Menü:</p><ol><li>Schalte für <code>nav ul</code> <code>display: flex</code> ein.</li><li>Setze <code>gap</code> zwischen den Punkten (ab 8px).</li><li>Verteile die Punkte: <code>justify-content</code> (z. B. <code>center</code>).</li><li>Entferne die Punkte mit <code>list-style: none</code> und <code>padding: 0</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    /* твои правила для nav ul */\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Главная</a></li>\n      <li><a href=\"#\">Проекты</a></li>\n      <li><a href=\"#\">Блог</a></li>\n      <li><a href=\"#\">Контакты</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    /* deine Regeln für nav ul */\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Start</a></li>\n      <li><a href=\"#\">Projekte</a></li>\n      <li><a href=\"#\">Blog</a></li>\n      <li><a href=\"#\">Kontakt</a></li>\n    </ul>\n  </nav>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>nav ul</code>: <code>display: flex</code>","de":"<code>nav ul</code>: <code>display: flex</code>"},"s":"nav ul","p":"display","r":"^flex$","w":null},{"t":"cssnum","m":{"ru":"Есть <code>gap</code> от 8px","de":"Es gibt <code>gap</code> ab 8px"},"s":"nav ul","p":"column-gap","o":">=","n":8,"w":null},{"t":"cssnot","m":{"ru":"Задан <code>justify-content</code>","de":"<code>justify-content</code> ist gesetzt"},"s":"nav ul","p":"justify-content","r":"^(normal|flex-start)$","w":null},{"t":"css","m":{"ru":"Маркеры убраны","de":"Aufzählungspunkte sind entfernt"},"s":"nav ul","p":"list-style-type","r":"^none$","w":null},{"t":"cssnum","m":{"ru":"<code>padding: 0</code>","de":"<code>padding: 0</code>"},"s":"nav ul","p":"padding-left","o":"<=","n":0,"w":null},{"t":"count","m":{"ru":"В меню минимум пять пунктов","de":"Im Menü mindestens fünf Punkte"},"s":"nav li","n":5,"w":null,"lv":2},{"t":"code","m":{"ru":"У первого пункта <code>margin-right: auto</code>","de":"Beim ersten Punkt <code>margin-right: auto</code>"},"r":"li:first-child\\s*\\{[^}]*margin-right:\\s*auto","f":null,"lv":2},{"t":"css","m":{"ru":"У меню <code>flex-wrap: wrap</code>","de":"Das Menü hat <code>flex-wrap: wrap</code>"},"s":"nav ul","p":"flex-wrap","r":"wrap","w":null,"lv":2},{"t":"has","m":{"ru":"Есть профиль с картинкой","de":"Es gibt ein Profil mit Bild"},"s":".profile img","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"<code>.profile</code>: <code>display: flex</code>","de":"<code>.profile</code>: <code>display: flex</code>"},"s":".profile","p":"display","r":"flex","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"<code>.profile</code>: <code>align-items: center</code>","de":"<code>.profile</code>: <code>align-items: center</code>"},"s":".profile","p":"align-items","r":"center","w":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"<code>.profile</code>: <code>gap</code> от 8px","de":"<code>.profile</code>: <code>gap</code> ab 8px"},"s":".profile","p":"column-gap","o":">=","n":8,"w":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"Картинка не шире 120px","de":"Bild nicht breiter als 120px"},"s":".profile img","p":"width","o":"<=","n":120,"w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav li:first-child { margin-right: auto; }\n    .profile { display: flex; align-items: center; gap: 16px; padding: 20px; }\n    .profile img { width: 90px; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    nav ul { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: center; list-style: none; padding: 0; margin: 0; }\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Главная</a></li>\n      <li><a href=\"#\">Проекты</a></li>\n      <li><a href=\"#\">Блог</a></li>\n      <li><a href=\"#\">Контакты</a></li>\n      <li><a href=\"#\">Ещё</a></li>\n    </ul>\n  </nav>\n  <div class=\"profile\">\n    <img src=\"cat.svg\" alt=\"Рыжий кот\">\n    <div>\n      <h2>Кот Мурзик</h2>\n      <p>Спит, ест и охраняет сайт.</p>\n    </div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; margin: 0; }\n    nav li:first-child { margin-right: auto; }\n    .profile { display: flex; align-items: center; gap: 16px; padding: 20px; }\n    .profile img { width: 90px; }\n    nav { background: #15172e; padding: 12px 20px; }\n    nav a { color: #fff; text-decoration: none; }\n    nav ul { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: center; list-style: none; padding: 0; margin: 0; }\n  </style>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#\">Start</a></li>\n      <li><a href=\"#\">Projekte</a></li>\n      <li><a href=\"#\">Blog</a></li>\n      <li><a href=\"#\">Kontakt</a></li>\n      <li><a href=\"#\">Mehr</a></li>\n    </ul>\n  </nav>\n  <div class=\"profile\">\n    <img src=\"cat.svg\" alt=\"Rote Katze\">\n    <div>\n      <h2>Kater Murzik</h2>\n      <p>Schläft, frisst und bewacht die Website.</p>\n    </div>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Одно правило: <code>nav ul { display: flex; gap: 16px; justify-content: center; list-style: none; padding: 0; }</code>.</p>","de":"<p>Eine Regel: <code>nav ul { display: flex; gap: 16px; justify-content: center; list-style: none; padding: 0; }</code>.</p>"},"quiz":[{"q":{"ru":"Где нужно писать <code>display: flex</code>?","de":"Wo muss man <code>display: flex</code> schreiben?"},"o":[{"ru":"У родителя (контейнера)","de":"Beim Elternelement (Container)"},{"ru":"У каждого ребёнка","de":"Bei jedem Kind"},{"ru":"В теге &lt;head&gt;","de":"Im Tag &lt;head&gt;"}],"a":0}],"lv2":{"ru":"<p>Доведи меню до ума:</p><ol><li>Добавь пятый пункт <code>&lt;li&gt;</code>.</li><li>Прижми логотип к левому краю, а остальное к правому: у первого пункта <code>nav li:first-child { margin-right: auto; }</code>. Автоматический отступ «забирает» всё свободное место.</li><li>Если пунктов много, а экран узкий, им нужно переноситься: <code>flex-wrap: wrap;</code> в правиле <code>nav ul</code>.</li></ol><p>Поменяй <code>justify-content</code> на <code>space-between</code>, <code>flex-end</code>, <code>space-around</code> и посмотри, чем они отличаются.</p>","de":"<p>Bring das Menü in Form:</p><ol><li>Füge einen fünften Punkt <code>&lt;li&gt;</code> hinzu.</li><li>Schiebe das Logo an den linken Rand und den Rest nach rechts: beim ersten Punkt <code>nav li:first-child { margin-right: auto; }</code>. Der automatische Abstand „nimmt“ den ganzen freien Platz.</li><li>Wenn es viele Punkte und einen schmalen Bildschirm gibt, müssen sie umbrechen: <code>flex-wrap: wrap;</code> in der Regel <code>nav ul</code>.</li></ol><p>Ändere <code>justify-content</code> auf <code>space-between</code>, <code>flex-end</code>, <code>space-around</code> und sieh, wie sie sich unterscheiden.</p>"},"lv3":{"ru":"<p>Flexbox умеет не только меню. Собери «профиль»: картинка слева, текст справа.</p><ol><li>Под меню добавь <code>&lt;div class=\"profile\"&gt;</code> с <code>&lt;img src=\"cat.svg\" alt=\"…\"&gt;</code> и блоком текста (<code>&lt;div&gt;</code> с <code>&lt;h2&gt;</code> и <code>&lt;p&gt;</code>).</li><li><code>.profile { display: flex; align-items: center; gap: 16px; padding: 20px; }</code> — картинка и текст рядом, по центру по высоте.</li><li><code>.profile img { width: 90px; }</code>.</li><li>Попробуй <code>flex-direction: column;</code>: профиль встанет столбиком. Верни назад в строку.</li></ol>","de":"<p>Flexbox kann mehr als Menüs. Baue ein „Profil“: Bild links, Text rechts.</p><ol><li>Füge unter dem Menü ein <code>&lt;div class=\"profile\"&gt;</code> mit <code>&lt;img src=\"cat.svg\" alt=\"…\"&gt;</code> und einem Textblock (<code>&lt;div&gt;</code> mit <code>&lt;h2&gt;</code> und <code>&lt;p&gt;</code>) ein.</li><li><code>.profile { display: flex; align-items: center; gap: 16px; padding: 20px; }</code> — Bild und Text nebeneinander, in der Höhe zentriert.</li><li><code>.profile img { width: 90px; }</code>.</li><li>Probiere <code>flex-direction: column;</code>: Das Profil steht als Spalte. Stelle es wieder auf Zeile.</li></ol>"}},{"day":18,"week":3,"title":{"ru":"Flexbox: карточки","de":"Flexbox: Karten"},"goal":{"ru":"Сделать ряд карточек, который сам переносится на новую строку.","de":"Eine Kartenreihe machen, die von selbst in die nächste Zeile umbricht."},"theory":{"ru":"<p>Flexbox умеет не только выстраивать в ряд, но и управлять шириной детей и переносом строк:</p><pre class=\"ex\" data-l=\"css\">.cards {\n  display: flex;\n  flex-wrap: wrap;        /* переносить на новую строку, если не помещаются */\n  gap: 16px;\n}\n.card {\n  flex: 1 1 200px;        /* расти, сжиматься, базовая ширина 200px */\n  padding: 16px;\n}</pre><p><code>flex: 1 1 200px</code> читается так: «хочу быть шириной примерно 200px, но если есть место, расти (<code>1</code>), а если мало, сжимайся (<code>1</code>)». Благодаря <code>flex-wrap: wrap</code> карточки не лезут за край, а переходят вниз.</p>","de":"<p>Flexbox kann nicht nur in einer Reihe anordnen, sondern auch die Breite der Kinder und den Umbruch steuern:</p><pre class=\"ex\" data-l=\"css\">.cards {\n  display: flex;\n  flex-wrap: wrap;        /* in die nächste Zeile umbrechen, wenn kein Platz ist */\n  gap: 16px;\n}\n.card {\n  flex: 1 1 200px;        /* wachsen, schrumpfen, Basisbreite 200px */\n  padding: 16px;\n}</pre><p><code>flex: 1 1 200px</code> liest sich so: „Ich will etwa 200px breit sein, aber wenn Platz ist, wachse (<code>1</code>), und wenn wenig Platz ist, schrumpfe (<code>1</code>).“ Durch <code>flex-wrap: wrap</code> ragen die Karten nicht über den Rand, sondern rutschen nach unten.</p>"},"task":{"ru":"<ol><li>Для <code>.cards</code>: <code>display: flex</code>, <code>flex-wrap: wrap</code> и <code>gap</code>.</li><li>Для <code>.card</code>: <code>flex: 1 1 200px</code>, <code>padding</code> от 10px, фон и скруглённые углы.</li><li>Потяни разделитель окна и посмотри на кнопки 📱 ▭ 🖥 над результатом: карточки перестраиваются.</li></ol>","de":"<ol><li>Für <code>.cards</code>: <code>display: flex</code>, <code>flex-wrap: wrap</code> und <code>gap</code>.</li><li>Für <code>.card</code>: <code>flex: 1 1 200px</code>, <code>padding</code> ab 10px, Hintergrund und runde Ecken.</li><li>Probiere die Knöpfe 📱 ▭ 🖥 über dem Ergebnis aus: Die Karten ordnen sich neu an.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* правила для .cards и .card */\n  </style>\n</head>\n<body>\n  <h1>Мои проекты</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Сайт</h2><p>Страница-визитка о моих увлечениях.</p></div>\n    <div class=\"card\"><h2>Робот</h2><p>Колёса, мотор и датчик расстояния.</p></div>\n    <div class=\"card\"><h2>Игра</h2><p>Простая игра, которую можно пройти за минуту.</p></div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* Regeln für .cards und .card */\n  </style>\n</head>\n<body>\n  <h1>Meine Projekte</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Website</h2><p>Eine Visitenkarten-Seite über meine Interessen.</p></div>\n    <div class=\"card\"><h2>Roboter</h2><p>Räder, Motor und ein Abstandssensor.</p></div>\n    <div class=\"card\"><h2>Spiel</h2><p>Ein einfaches Spiel, das man in einer Minute schafft.</p></div>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>.cards</cod v":3,"opt":true},{"t":"cssnum","m":{"ru":"<code>.big</code> растёт быстрее (<code>flex-grow</code> от 2)","de":"<code>.big</code> wächst schneller (<code>flex-grow</code> ab 2)"},"s":".card.big","p":"flex-grow","o":">=","n":2,"w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"У <code>.big</code> белый текст","de":"<code>.big</code> hat weißen Text"},"s":".card.big","p":"color","r":"^rgb\\(255, 255, 255\\)$","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть <code>order: -1</code>","de":"Es gibt <code>order: -1</code>"},"r":"order:\\s*-1","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }\n    .card h2 { margin-top: 0; }\n    .card { flex: 1 1 200px; max-width: 320px; padding: 16px; background: #ecebff; border-radius: 14px; }\n    .big { flex: 2 1 260px; max-width: 420px; background: #5b48e8; color: #fff; order: -1; }\n  </style>\n</head>\n<body>\n  <h1>Мои проекты</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Сайт</h2><p>Страница-визитка о моих увлечениях.</p></div>\n    <div class=\"card\"><h2>Робот</h2><p>Колёса, мотор и датчик расстояния.</p></div>\n    <div class=\"card\"><h2>Игра</h2><p>Простая игра, которую можно пройти за минуту.</p></div>\n    <div class=\"card big\"><h2>Ещё проект</h2><p>Главная карточка выделена цветом.</p></div>\n    <div class=\"card\"><h2>Блог</h2><p>Заметки о том, что я узнал.</p></div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }\n    .card h2 { margin-top: 0; }\n    .card { flex: 1 1 200px; max-width: 320px; padding: 16px; background: #ecebff; border-radius: 14px; }\n    .big { flex: 2 1 260px; max-width: 420px; background: #5b48e8; color: #fff; order: -1; }\n  </style>\n</head>\n<body>\n  <h1>Meine Projekte</h1>\n  <div class=\"cards\">\n    <div class=\"card\"><h2>Website</h2><p>Eine Visitenkarten-Seite über meine Interessen.</p></div>\n    <div class=\"card\"><h2>Roboter</h2><p>Räder, Motor und ein Abstandssensor.</p></div>\n    <div class=\"card\"><h2>Spiel</h2><p>Ein einfaches Spiel, das man in einer Minute schafft.</p></div>\n    <div class=\"card big\"><h2>Noch ein Projekt</h2><p>Die Hauptkarte ist farbig hervorgehoben.</p></div>\n    <div class=\"card\"><h2>Blog</h2><p>Notizen darüber, was ich gelernt habe.</p></div>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Родитель: <code>.cards { display: flex; flex-wrap: wrap; gap: 16px; }</code>. Дети: <code>.card { flex: 1 1 200px; … }</code>.</p>","de":"<p>Eltern: <code>.cards { display: flex; flex-wrap: wrap; gap: 16px; }</code>. Kinder: <code>.card { flex: 1 1 200px; … }</code>.</p>"},"quiz":[{"q":{"ru":"Что делает <code>flex-wrap: wrap</code>?","de":"Was macht <code>flex-wrap: wrap</code>?"},"o":[{"ru":"Переносит элементы на новую строку, если не хватает места","de":"Bricht Elemente in die nächste Zeile um, wenn der Platz fehlt"},{"ru":"Упаковывает элементы в коробку","de":"Packt Elemente in eine Box"},{"ru":"Скрывает лишние элементы","de":"Versteckt überzählige Elemente"}],"a":0}],"lv2":{"ru":"<p>Из трёх карточек сделай полноценную сетку:</p><ol><li>Добавь ещё две карточки (всего пять). Пусть они сами переносятся на новую строку.</li><li>Ограничь ширину карточек: <code>max-width: 320px;</code>. Без этого одинокая карточка в последнем ряду растянется на всю ширину.</li><li>Выровняй ряды по центру: <code>justify-content: center;</code> в <code>.cards</code>.</li><li>Убери у заголовка в карточке верхний отступ: <code>.card h2 { margin-top: 0; }</code>.</li></ol><p>Потяни границу окна результата или нажми 📱 ▭ 🖥: сколько карточек в ряду на каждой ширине?</p>","de":"<p>Mache aus drei Karten ein richtiges Raster:</p><ol><li>Füge zwei weitere Karten hinzu (insgesamt fünf). Sie sollen von selbst in die nächste Zeile umbrechen.</li><li>Begrenze die Breite der Karten: <code>max-width: 320px;</code>. Ohne das dehnt sich eine einsame Karte in der letzten Reihe auf die volle Breite.</li><li>Zentriere die Reihen: <code>justify-content: center;</code> in <code>.cards</code>.</li><li>Entferne beim Titel in der Karte den oberen Abstand: <code>.card h2 { margin-top: 0; }</code>.</li></ol><p>Ziehe am Rand des Ergebnisfensters oder klicke 📱 ▭ 🖥: Wie viele Karten stehen auf jeder Breite in einer Reihe?</p>"},"lv3":{"ru":"<p>Тарифы, как на настоящих сайтах: одна карточка главнее остальных.</p><ol><li>Одной карточке добавь второй класс: <code>class=\"card big\"</code>.</li><li><code>.big { flex: 2 1 260px; max-width: 420px; background: #5b48e8; color: #fff; }</code>. Число <code>2</code> значит «растёт вдвое быстрее соседей».</li><li>Для особой карточки не нужно писать всё заново: <code>.big</code> только <i>переопределяет</i> часть свойств, остальное берётся из <code>.card</code>.</li><li>Задай порядок: <code>.big { order: -1; }</code> поставит её первой, не трогая HTML. Попробуй.</li></ol>","de":"<p>Tarife wie auf echten Websites: Eine Karte ist wichtiger als die anderen.</p><ol><li>Gib einer Karte eine zweite Klasse: <code>class=\"card big\"</code>.</li><li><code>.big { flex: 2 1 260px; max-width: 420px; background: #5b48e8; color: #fff; }</code>. Die Zahl <code>2</code> heißt „wächst doppelt so schnell wie die Nachbarn“.</li><li>Für die besondere Karte musst du nicht alles neu schreiben: <code>.big</code> <i>überschreibt</i> nur einen Teil der Eigenschaften, der Rest kommt aus <code>.card</code>.</li><li>Lege die Reihenfolge fest: <code>.big { order: -1; }</code> stellt sie an den Anfang, ohne das HTML anzufassen. Probiere es.</li></ol>"}},{"day":19,"week":3,"title":{"ru":"Наведение и плавные переходы","de":"Hover und sanfte Übergänge"},"goal":{"ru":"Делать кнопки, которые реагируют на мышь, и добавлять плавность.","de":"Knöpfe machen, die auf die Maus reagieren, und Sanftheit hinzufügen."},"theory":{"ru":"<p><b>Псевдокласс</b> описывает состояние элемента. Самый известный — <code>:hover</code>, когда курсор над элементом:</p><pre class=\"ex\" data-l=\"css\">.btn {\n  background: #5b48e8;\n  color: #fff;\n  padding: 10px 20px;\n  border-radius: 999px;\n  text-decoration: none;\n  display: inline-block;\n  transition: background 0.3s;   /* плавно за 0,3 секунды */\n}\n.btn:hover {\n  background: #3e2fc4;           /* когда курсор сверху */\n}</pre><ul><li><code>transition</code> делает смену значения плавной, а не мгновенной.</li><li><code>cursor: pointer</code> показывает «руку» над кликабельным.</li><li><code>transform: scale(1.05)</code> слегка увеличивает элемент: можно добавить в <code>:hover</code>.</li><li>Есть и другие состояния: <code>:focus</code> (выбран с клавиатуры), <code>:active</code> (нажат). Для удобства людей без мыши <code>:focus</code> стоит оформлять так же, как <code>:hover</code>.</li></ul>","de":"<p>Eine <b>Pseudoklasse</b> beschreibt einen Zustand eines Elements. Die bekannteste ist <code>:hover</code>, wenn der Mauszeiger über dem Element ist:</p><pre class=\"ex\" data-l=\"css\">.btn {\n  background: #5b48e8;\n  color: #fff;\n  padding: 10px 20px;\n  border-radius: 999px;\n  text-decoration: none;\n  display: inline-block;\n  transition: background 0.3s;   /* sanft in 0,3 Sekunden */\n}\n.btn:hover {\n  background: #3e2fc4;           /* wenn der Zeiger darüber ist */\n}</pre><ul><li><code>transition</code> macht den Wechsel eines Wertes sanft statt abrupt.</li><li><code>cursor: pointer</code> zeigt die „Hand“ über etwas Klickbarem.</li><li><code>transform: scale(1.05)</code> vergrößert ein Element leicht: Man kann es in <code>:hover</code> einsetzen.</li><li>Es gibt weitere Zustände: <code>:focus</code> (per Tastatur ausgewählt), <code>:active</code> (gedrückt). Für Menschen ohne Maus sollte <code>:focus</code> genauso gestaltet werden wie <code>:hover</code>.</li></ul>"},"task":{"ru":"<ol><li>Оформи ссылку-кнопку <code>.btn</code>: фон, цвет текста, <code>padding</code> от 8px, скруглённые углы, без подчёркивания, <code>display: inline-block</code>.</li><li>Добавь <code>.btn:hover</code> с другим цветом фона.</li><li>Добавь плавность <code>transition</code>.</li></ol>","de":"<ol><li>Gestalte den Link-Knopf <code>.btn</code>: Hintergrund, Textfarbe, <code>padding</code> ab 8px, runde Ecken, ohne Unterstreichung, <code>display: inline-block</code>.</li><li>Füge <code>.btn:hover</code> mit anderer Hintergrundfarbe hinzu.</li><li>Füge die Sanftheit mit <code>transition</code> hinzu.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* стили для .btn и .btn:hover */\n  </style>\n</head>\n<body>\n  <h1>Кнопка</h1>\n  <p>Наведи курсор на кнопку:</p>\n  <a class=\"btn\" href=\"#\">Нажми меня</a>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    /* Stile für .btn und .btn:hover */\n  </style>\n</head>\n<body>\n  <h1>Knopf</h1>\n  <p>Fahre mit dem Zeiger über den Knopf:</p>\n  <a class=\"btn\" href=\"#\">Drück mich</a>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"У <code>.btn</code> есть фон","de":"<code>.btn</code> hat einen Hintergrund"},"s":".btn","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"<code>.btn</code>: padding от 8px","de":"<code>.btn</code>: padding ab 8px"},"s":".btn","p":"padding-top","o":">=","n":8,"w":null},{"t":"cssnum","m":{"ru":"<code>.btn</code> со скруглёнными углами","de":"<code>.btn</code> mit runden Ecken"},"s":".btn","p":"border-top-left-radius","o":">=","n":4,"w":null},{"t":"cssnot","m":{"ru":"Без подчёркивания","de":"Ohne Unterstreichung"},"s":".btn","p":"text-decoration-line","r":"^underline$","w":null},{"t":"code","m":{"ru":"Есть правило <code>.btn:hover</code>","de":"Es gibt die Regel <code>.btn:hover</code>"},"r":"\\.btn:hover\\s*\\{","f":null},{"t":"code","m":{"ru":"Есть <code>transition</code>","de":"Es gibt <code>transition</code>"},"r":"transition\\s*:","f":null},{"t":"code","m":{"ru":"В <code>.btn:hover</code> есть <code>transform</code>","de":"In <code>.btn:hover</code> gibt es <code>transform</code>"},"r":"\\.btn:hover\\s*\\{[^}]*transform","f":null,"lv":2},{"t":"code","m":{"ru":"Есть <code>.btn:active</code>","de":"Es gibt <code>.btn:active</code>"},"r":"\\.btn:active\\s*\\{","f":null,"lv":2},{"t":"has","m":{"ru":"Есть кнопка <code>btn ghost</code>","de":"Es gibt den Knopf <code>btn ghost</code>"},"s":".btn.ghost","w":null,"lv":2},{"t":"cssnum","m":{"ru":"У <code>.ghost</code> есть рамка","de":"<code>.ghost</code> hat einen Rahmen"},"s":".ghost","p":"border-top-width","o":">=","n":1,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть блок <code>.thumb</code> с картинкой","de":"Es gibt einen Block <code>.thumb</code> mit Bild"},"s":".thumb img","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"<code>.thumb</code>: <code>overflow: hidden</code>","de":"<code>.thumb</code>: <code>overflow: hidden</code>"},"s":".thumb","p":"overflow","r":"hidden","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть <code>.thumb:hover img</code> с <code>scale</code>","de":"Es gibt <code>.thumb:hover img</code> mit <code>scale</code>"},"r":"\\.thumb:hover\\s+img\\s*\\{[^}]*scale","f":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"У <code>.thumb</code> курсор-рука","de":"<code>.thumb</code> hat den Hand-Cursor"},"s":".thumb","p":"cursor","r":"pointer","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background 0.3s, transform 0.3s; }\n    .btn:hover { background: #3e2fc4; transform: translateY(-3px); }\n    .btn:active { transform: translateY(0); }\n    .ghost { background: transparent; color: #5b48e8; border: 2px solid #5b48e8; }\n    .thumb { width: 200px; overflow: hidden; border-radius: 16px; cursor: pointer; }\n    .thumb img { width: 100%; display: block; transition: transform 0.4s; }\n    .thumb:hover img { transform: scale(1.15); }\n  </style>\n</head>\n<body>\n  <h1>Кнопка</h1>\n  <p>Наведи курсор на кнопку:</p>\n  <a class=\"btn\" href=\"#\">Нажми меня</a>\n  <a class=\"btn ghost\" href=\"#\">Отмена</a>\n  <div class=\"thumb\"><img src=\"sun.svg\" alt=\"Солнце\"></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background 0.3s, transform 0.3s; }\n    .btn:hover { background: #3e2fc4; transform: translateY(-3px); }\n    .btn:active { transform: translateY(0); }\n    .ghost { background: transparent; color: #5b48e8; border: 2px solid #5b48e8; }\n    .thumb { width: 200px; overflow: hidden; border-radius: 16px; cursor: pointer; }\n    .thumb img { width: 100%; display: block; transition: transform 0.4s; }\n    .thumb:hover img { transform: scale(1.15); }\n  </style>\n</head>\n<body>\n  <h1>Knopf</h1>\n  <p>Fahre mit dem Zeiger über den Knopf:</p>\n  <a class=\"btn\" href=\"#\">Drück mich</a>\n  <a class=\"btn ghost\" href=\"#\">Abbrechen</a>\n  <div class=\"thumb\"><img src=\"sun.svg\" alt=\"Sonne\"></div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Ссылка по умолчанию подчёркнута: убери <code>text-decoration: none;</code>. Правило наведения пишется отдельно: <code>.btn:hover { … }</code>.</p>","de":"<p>Ein Link ist standardmäßig unterstrichen: Entferne das mit <code>text-decoration: none;</code>. Die Hover-Regel schreibt man separat: <code>.btn:hover { … }</code>.</p>"},"quiz":[{"q":{"ru":"Что делает <code>transition</code>?","de":"Was macht <code>transition</code>?"},"o":[{"ru":"Делает смену стиля плавной","de":"Macht den Stilwechsel sanft"},{"ru":"Открывает новую страницу","de":"Öffnet eine neue Seite"},{"ru":"Удаляет стили","de":"Löscht Stile"}],"a":0}],"lv2":{"ru":"<p>Сделай кнопке «живые» состояния:</p><ol><li>В <code>.btn:hover</code> добавь <code>transform: translateY(-3px);</code> — кнопка слегка приподнимается. В <code>.btn</code> дополни переход: <code>transition: background 0.3s, transform 0.3s;</code>.</li><li>Состояние «нажата»: <code>.btn:active { transform: translateY(0); }</code>.</li><li>Добавь вторую кнопку <code>&lt;a class=\"btn ghost\" href=\"#\"&gt;Отмена&lt;/a&gt;</code>: <code>.ghost { background: transparent; color: #5b48e8; border: 2px solid #5b48e8; }</code>.</li></ol>","de":"<p>Gib dem Knopf „lebendige“ Zustände:</p><ol><li>Ergänze in <code>.btn:hover</code> <code>transform: translateY(-3px);</code> — der Knopf hebt sich leicht. Erweitere in <code>.btn</code> den Übergang: <code>transition: background 0.3s, transform 0.3s;</code>.</li><li>Zustand „gedrückt“: <code>.btn:active { transform: translateY(0); }</code>.</li><li>Füge einen zweiten Knopf <code>&lt;a class=\"btn ghost\" href=\"#\"&gt;Abbrechen&lt;/a&gt;</code> hinzu: <code>.ghost { background: transparent; color: #5b48e8; border: 2px solid #5b48e8; }</code>.</li></ol>"},"lv3":{"ru":"<p>Карточка с картинкой, которая увеличивается при наведении, как в галереях:</p><ol><li>HTML: <code>&lt;div class=\"thumb\"&gt;&lt;img src=\"sun.svg\" alt=\"Солнце\"&gt;&lt;/div&gt;</code>.</li><li><code>.thumb { width: 200px; overflow: hidden; border-radius: 16px; cursor: pointer; }</code>. Значение <code>overflow: hidden</code> обрезает всё, что вылезает за рамку.</li><li><code>.thumb img { width: 100%; transition: transform 0.4s; }</code> и <code>.thumb:hover img { transform: scale(1.15); }</code>.</li></ol><p>Секрет: «растёт» картинка, а «обрезает» контейнер. Убери <code>overflow: hidden</code> и посмотри, что станет.</p>","de":"<p>Eine Karte mit Bild, das sich beim Darüberfahren vergrößert, wie in Galerien:</p><ol><li>HTML: <code>&lt;div class=\"thumb\"&gt;&lt;img src=\"sun.svg\" alt=\"Sonne\"&gt;&lt;/div&gt;</code>.</li><li><code>.thumb { width: 200px; overflow: hidden; border-radius: 16px; cursor: pointer; }</code>. Der Wert <code>overflow: hidden</code> schneidet ab, was über den Rahmen hinausragt.</li><li><code>.thumb img { width: 100%; transition: transform 0.4s; }</code> und <code>.thumb:hover img { transform: scale(1.15); }</code>.</li></ol><p>Das Geheimnis: Das Bild „wächst“, der Container „schneidet ab“. Entferne <code>overflow: hidden</code> und sieh, was passiert.</p>"}},{"day":20,"week":3,"title":{"ru":"Адаптивность: сайт и на телефоне","de":"Responsive Design: auch auf dem Handy"},"goal":{"ru":"Сделать страницу удобной на экранах разных размеров.","de":"Die Seite auf Bildschirmen verschiedener Größen gut nutzbar machen."},"theory":{"ru":"<p>Больше половины людей открывают сайты на телефоне. Сайт должен сам подстраиваться. Три шага:</p><ol><li>Строка в <code>&lt;head&gt;</code>: <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code>. Без неё телефон показывает страницу уменьшенной, как на компьютере.</li><li>Гибкие картинки: <code>img { max-width: 100%; height: auto; }</code> — картинка не шире экрана.</li><li><b>Медиазапрос</b> — правила только для узких экранов:</li></ol><pre class=\"ex\" data-l=\"css\">@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;   /* на узком экране карточки друг под другом */\n  }\n}</pre><p>Кнопки <b>📱 ▭ 🖥</b> над результатом меняют ширину окна просмотра: проверяй так, как увидит посетитель.</p>","de":"<p>Mehr als die Hälfte der Menschen öffnet Websites auf dem Handy. Die Seite muss sich selbst anpassen. Drei Schritte:</p><ol><li>Eine Zeile in <code>&lt;head&gt;</code>: <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;</code>. Ohne sie zeigt das Handy die Seite verkleinert wie am Computer.</li><li>Flexible Bilder: <code>img { max-width: 100%; height: auto; }</code> — das Bild ist nie breiter als der Bildschirm.</li><li>Eine <b>Media Query</b> — Regeln nur für schmale Bildschirme:</li></ol><pre class=\"ex\" data-l=\"css\">@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;   /* auf schmalem Bildschirm Karten untereinander */\n  }\n}</pre><p>Die Knöpfe <b>📱 ▭ 🖥</b> über dem Ergebnis ändern die Breite der Vorschau: Prüfe so, wie der Besucher es sehen wird.</p>"},"task":{"ru":"<ol><li>Добавь в <code>&lt;head&gt;</code> строку <code>viewport</code>.</li><li>Задай картинке <code>max-width: 100%; height: auto;</code>.</li><li>Напиши <code>@media (max-width: 600px)</code>, где <code>.cards</code> получают <code>flex-direction: column</code>.</li><li>Нажми 📱 над результатом: карточки должны стоять друг под другом.</li></ol>","de":"<ol><li>Füge in <code>&lt;head&gt;</code> die <code>viewport</code>-Zeile hinzu.</li><li>Gib dem Bild <code>max-width: 100%; height: auto;</code>.</li><li>Schreibe <code>@media (max-width: 600px)</code>, in der <code>.cards</code> <code>flex-direction: column</code> bekommt.</li><li>Drücke 📱 über dem Ergebnis: Die Karten sollen untereinander stehen.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    /* добавь правила для картинки и @media */\n  </style>\n</head>\n<body>\n  <h1>Адаптивная страница</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Раз</div>\n    <div class=\"card\">Два</div>\n    <div class=\"card\">Три</div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    /* füge Regeln für das Bild und @media hinzu */\n  </style>\n</head>\n<body>\n  <h1>Responsive Seite</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Eins</div>\n    <div class=\"card\">Zwei</div>\n    <div class=\"card\">Drei</div>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть <code>meta viewport</code>","de":"Es gibt <code>meta viewport</code>"},"r":"<meta[^>]+name=[\"\\']viewport[\"\\']","f":null},{"t":"css","m":{"ru":"Картинка: <code>max-width: 100%</code>","de":"Bild: <code>max-width: 100%</code>"},"s":"img","p":"max-width","r":"^100%$","w":null},{"t":"code","m":{"ru":"Есть медиазапрос <code>@media (max-width: …)</code>","de":"Es gibt eine Media Query <code>@media (max-width: …)</code>"},"r":"@media\\s*\\(\\s*max-width","f":null},{"t":"css","m":{"ru":"На широком экране карточки в ряд","de":"Auf breitem Bildschirm stehen die Karten nebeneinander"},"s":".cards","p":"flex-direction","r":"^row$","w":null},{"t":"css","m":{"ru":"На узком экране (400px) карточки друг под другом","de":"Auf schmalem Bildschirm (400px) stehen die Karten untereinander"},"s":".cards","p":"flex-direction","r":"^column$","w":400},{"t":"cssnum","m":{"ru":"На узком экране (400px) заголовок до 28px","de":"Bei schmalem Bildschirm (400px) die Überschrift bis 28px"},"s":"h1","p":"font-size","o":"<=","n":28,"w":400,"lv":2},{"t":"cssnum","m":{"ru":"На узком экране поля до 14px","de":"Bei schmalem Bildschirm Ränder bis 14px"},"s":"body","p":"padding-top","o":"<=","n":14,"w":400,"lv":2},{"t":"cssnum","m":{"ru":"На широком экране (800px) заголовок крупный","de":"Bei breitem Bildschirm (800px) die Überschrift groß"},"s":"h1","p":"font-size","o":">=","n":30,"w":800,"lv":2},{"t":"code","m":{"ru":"Есть средняя ступень <code>min-width: 601px</code>","de":"Es gibt die mittlere Stufe <code>min-width: 601px</code>"},"r":"min-width:\\s*601px","f":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"На планшете (750px) карточки переносятся","de":"Auf dem Tablet (750px) brechen die Karten um"},"s":".cards","p":"flex-wrap","r":"wrap","w":750,"lv":3,"opt":true},{"t":"css","m":{"ru":"На планшете карточки не в колонке","de":"Auf dem Tablet stehen die Karten nicht in einer Spalte"},"s":".cards","p":"flex-direction","r":"row","w":750,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    img { max-width: 100%; height: auto; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    @media (max-width: 600px) {\n      .cards { flex-direction: column; }\n      h1 { font-size: 24px; }\n      body { padding: 12px; }\n    }\n    @media (min-width: 601px) and (max-width: 900px) {\n      .cards { flex-wrap: wrap; }\n      .card { flex: 1 1 45%; }\n    }\n  </style>\n</head>\n<body>\n  <h1>Адаптивная страница</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Раз</div>\n    <div class=\"card\">Два</div>\n    <div class=\"card\">Три</div>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    img { max-width: 100%; height: auto; }\n    .cards { display: flex; gap: 12px; }\n    .card { flex: 1; padding: 20px; background: #ecebff; border-radius: 12px; text-align: center; }\n    @media (max-width: 600px) {\n      .cards { flex-direction: column; }\n      h1 { font-size: 24px; }\n      body { padding: 12px; }\n    }\n    @media (min-width: 601px) and (max-width: 900px) {\n      .cards { flex-wrap: wrap; }\n      .card { flex: 1 1 45%; }\n    }\n  </style>\n</head>\n<body>\n  <h1>Responsive Seite</h1>\n  <img class=\"hero\" src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"600\">\n  <div class=\"cards\">\n    <div class=\"card\">Eins</div>\n    <div class=\"card\">Zwei</div>\n    <div class=\"card\">Drei</div>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Строка viewport идёт в <code>&lt;head&gt;</code> после <code>meta charset</code>. Медиазапрос — отдельный блок <code>@media (max-width: 600px) { … }</code>, внутри него обычные правила.</p>","de":"<p>Die viewport-Zeile steht in <code>&lt;head&gt;</code> nach <code>meta charset</code>. Die Media Query ist ein eigener Block <code>@media (max-width: 600px) { … }</code> mit normalen Regeln darin.</p>"},"quiz":[{"q":{"ru":"Когда срабатывает <code>@media (max-width: 600px)</code>?","de":"Wann greift <code>@media (max-width: 600px)</code>?"},"o":[{"ru":"Когда экран не шире 600px","de":"Wenn der Bildschirm höchstens 600px breit ist"},{"ru":"Когда экран шире 600px","de":"Wenn der Bildschirm breiter als 600px ist"},{"ru":"Всегда","de":"Immer"}],"a":0}],"lv2":{"ru":"<p>Настрой размер текста и отступов под телефон. В тот же <code>@media (max-width: 600px)</code> добавь:</p><ol><li><code>h1 { font-size: 24px; }</code> — заголовок поменьше.</li><li><code>body { padding: 12px; }</code> — поля поуже: на маленьком экране каждый пиксель на счету.</li></ol><p>Проверка работает на двух ширинах: на узкой (400px) заголовок должен быть небольшим, на широкой — оставаться крупным. Не забудь, что вне <code>@media</code> правила действуют на всех экранах!</p>","de":"<p>Passe Textgröße und Abstände an das Handy an. Ergänze im selben <code>@media (max-width: 600px)</code>:</p><ol><li><code>h1 { font-size: 24px; }</code> — kleinere Überschrift.</li><li><code>body { padding: 12px; }</code> — schmalere Ränder: Auf einem kleinen Bildschirm zählt jeder Pixel.</li></ol><p>Die Prüfung läuft bei zwei Breiten: Bei schmaler (400px) muss die Überschrift klein sein, bei breiter groß bleiben. Vergiss nicht: Regeln außerhalb von <code>@media</code> gelten auf allen Bildschirmen!</p>"},"lv3":{"ru":"<p>Три размера — три раскладки. Добавь «среднюю» ступень для планшета:</p><ol><li><code>@media (min-width: 601px) and (max-width: 900px) { … }</code> — окно между 601 и 900 пикселями.</li><li>Внутри: <code>.cards { flex-wrap: wrap; }</code> и <code>.card { flex: 1 1 45%; }</code> — карточки по две в ряд.</li><li>Проверь кнопками 📱 ▭ 🖥 над результатом: телефон — колонка, планшет — по две, компьютер — три в ряд.</li></ol><p>Так работают настоящие адаптивные сайты: несколько «контрольных точек» (breakpoints).</p>","de":"<p>Drei Größen — drei Layouts. Füge eine „mittlere“ Stufe für Tablets hinzu:</p><ol><li><code>@media (min-width: 601px) and (max-width: 900px) { … }</code> — das Fenster zwischen 601 und 900 Pixeln.</li><li>Darin: <code>.cards { flex-wrap: wrap; }</code> und <code>.card { flex: 1 1 45%; }</code> — Karten zu zweit in einer Reihe.</li><li>Prüfe mit den Knöpfen 📱 ▭ 🖥 über dem Ergebnis: Handy — Spalte, Tablet — zu zweit, Computer — drei in einer Reihe.</li></ol><p>So funktionieren echte Responsive-Websites: mehrere „Haltepunkte“ (Breakpoints).</p>"}},{"day":21,"week":3,"title":{"ru":"Проект недели: лендинг клуба","de":"Wochenprojekt: Landingpage eines Clubs"},"goal":{"ru":"Собрать полноценную адаптивную страницу из шапки, героя, карточек и подвала.","de":"Eine vollständige responsive Seite aus Kopf, Held-Bereich, Karten und Fußbereich bauen."},"theory":{"ru":"<p>Сегодня у тебя готовый HTML (прочитай его: найди <code>header</code>, <code>nav</code>, секции, <code>article</code>, <code>footer</code> и их классы) и пустой <code>style.css</code>. Твоя работа — сделать из голой страницы настоящий сайт.</p><p>План: сначала общие стили (<code>body</code>, <code>box-sizing</code>), потом шапка и меню, потом hero, карточки, подвал, и в конце адаптивность. После каждого блока смотри результат.</p>","de":"<p>Heute hast du ein fertiges HTML (lies es: Finde <code>header</code>, <code>nav</code>, die Abschnitte, <code>article</code>, <code>footer</code> und ihre Klassen) und eine leere <code>style.css</code>. Deine Arbeit: aus der nackten Seite eine richtige Website machen.</p><p>Plan: zuerst die allgemeinen Stile (<code>body</code>, <code>box-sizing</code>), dann Kopf und Menü, dann Hero, Karten, Fußbereich, am Ende die Anpassung an kleine Bildschirme. Schau nach jedem Block das Ergebnis an.</p>"},"task":{"ru":"<p>Оформи страницу в <code>style.css</code>:</p><ol><li><code>.top</code> — flex, элементы по краям; <code>nav</code> — flex с <code>gap</code>.</li><li><code>.hero</code> — по центру, фон-градиент, <code>h1</code> крупнее 32px.</li><li><code>.btn</code> — кнопка с фоном и <code>:hover</code>.</li><li><code>.cards</code> — flex с переносом, <code>.card</code> с отступами, скруглением и <code>:hover</code>.</li><li><code>.foot</code> — по центру с фоном.</li><li><code>@media (max-width: 600px)</code> — карточки в колонку.</li></ol>","de":"<p>Gestalte die Seite in <code>style.css</code>:</p><ol><li><code>.top</code> — flex, Elemente an den Rändern; <code>nav</code> — flex mit <code>gap</code>.</li><li><code>.hero</code> — zentriert, Farbverlauf, <code>h1</code> größer als 32px.</li><li><code>.btn</code> — Knopf mit Hintergrund und <code>:hover</code>.</li><li><code>.cards</code> — flex mit Umbruch, <code>.card</code> mit Abständen, runden Ecken und <code>:hover</code>.</li><li><code>.foot</code> — zentriert mit Hintergrund.</li><li><code>@media (max-width: 600px)</code> — Karten in einer Spalte.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Клуб мейкеров</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Клуб мейкеров</strong>\n    <nav>\n      <a href=\"#about\">О клубе</a>\n      <a href=\"#events\">События</a>\n      <a href=\"#join\">Вступить</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Клуб юных мейкеров</h1>\n    <p>Паяем, программируем и придумываем.</p>\n    <a class=\"btn\" href=\"#join\">Вступить</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Мастерим</h2><p>Собираем настоящие устройства.</p></article>\n    <article class=\"card\"><h2>Программируем</h2><p>Пишем код и сразу видим результат.</p></article>\n    <article class=\"card\"><h2>Показываем</h2><p>Делимся проектами с друзьями.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Клуб юных мейкеров</p>\n  </footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Maker-Club</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Maker-Club</strong>\n    <nav>\n      <a href=\"#about\">Über den Club</a>\n      <a href=\"#events\">Termine</a>\n      <a href=\"#join\">Mitmachen</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Club junger Maker</h1>\n    <p>Wir löten, programmieren und erfinden.</p>\n    <a class=\"btn\" href=\"#join\">Mitmachen</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Basteln</h2><p>Wir bauen echte Geräte.</p></article>\n    <article class=\"card\"><h2>Programmieren</h2><p>Wir schreiben Code und sehen sofort das Ergebnis.</p></article>\n    <article class=\"card\"><h2>Zeigen</h2><p>Wir teilen Projekte mit Freunden.</p></article>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Club junger Maker</p>\n  </footer>\n</body>\n</html>\n"},"style.css":"/* Оформи лендинг / Gestalte die Landingpage */\n"},"checks":[{"t":"css","m":{"ru":"<code>.top</code>: flex","de":"<code>.top</code>: flex"},"s":".top","p":"display","r":"^flex$","w":null},{"t":"css","m":{"ru":"<code>.top</code>: элементы по краям","de":"<code>.top</code>: Elemente an den Rändern"},"s":".top","p":"justify-content","r":"^space-between$","w":null},{"t":"css","m":{"ru":"<code>nav</code>: flex","de":"<code>nav</code>: flex"},"s":"nav","p":"display","r":"^flex$","w":null},{"t":"cssnum","m":{"ru":"Меню с <code>gap</code>","de":"Menü mit <code>gap</code>"},"s":"nav","p":"column-gap","o":">=","n":8,"w":null},{"t":"css","m":{"ru":"<code>.hero</code> по центру","de":"<code>.hero</code> zentriert"},"s":".hero","p":"text-align","r":"^center$","w":null},{"t":"code","m":{"ru":"У <code>.hero</code> есть фон","de":"<code>.hero</code> hat einen Hintergrund"},"r":"\\.hero\\s*\\{[^}]*background","f":"style.css"},{"t":"cssnum","m":{"ru":"Заголовок hero крупнее 32px","de":"Hero-Überschrift größer als 32px"},"s":".hero h1","p":"font-size","o":">=","n":32,"w":null},{"t":"cssnot","m":{"ru":"У <code>.btn</code> есть фон","de":"<code>.btn</code> hat einen Hintergrund"},"s":".btn","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"Есть <code>.btn:hover</code>","de":"Es gibt <code>.btn:hover</code>"},"r":"\\.btn:hover","f":"style.css"},{"t":"css","m":{"ru":"<code>.cards</code>: flex","de":"<code>.cards</code>: flex"},"s":".cards","p":"display","r":"^flex$","w":null},{"t":"css","m":{"ru":"<code>.cards</code>: перенос строк","de":"<code>.cards</code>: Zeilenumbruch"},"s":".cards","p":"flex-wrap","r":"^wrap$","w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: отступ","de":"<code>.card</code>: Innenabstand"},"s":".card","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: скругление","de":"<code>.card</code>: runde Ecken"},"s":".card","p":"border-top-left-radius","o":">=","n":8,"w":null},{"t":"code","m":{"ru":"Есть <code>.card:hover</code>","de":"Es gibt <code>.card:hover</code>"},"r":"\\.card:hover","f":"style.css"},{"t":"css","m":{"ru":"<code>.foot</code> по центру","de":"<code>.foot</code> zentriert"},"s":".foot","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"На узком экране карточки в колонку","de":"Auf schmalem Bildschirm stehen die Karten in einer Spalte"},"s":".cards","p":"flex-direction","r":"^column$","w":400},{"t":"count","m":{"ru":"Три события <code>.event</code>","de":"Drei Termine <code>.event</code>"},"s":".events .event","n":3,"w":null,"lv":2},{"t":"count","m":{"ru":"У каждого события есть <code>time</code> с датой","de":"Jeder Termin hat <code>time</code> mit Datum"},"s":".event time[datetime]","n":3,"w":null,"lv":2},{"t":"css","m":{"ru":"<code>.event</code>: <code>display: flex</code>","de":"<code>.event</code>: <code>display: flex</code>"},"s":".event","p":"display","r":"flex","w":null,"lv":2},{"t":"cssnum","m":{"ru":"У события линия снизу","de":"Der Termin hat unten eine Linie"},"s":".event","p":"border-bottom-width","o":">=","n":1,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"Дата жирная","de":"Das Datum ist fett"},"s":".event time","p":"font-weight","o":">=","n":600,"w":null,"lv":2},{"t":"has","m":{"ru":"Форма с подписью <code>label</code>","de":"Formular mit Beschriftung <code>label</code>"},"s":"#join form label[for=\"mail\"]","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть поле <code>email</code>","de":"Es gibt ein <code>email</code>-Feld"},"s":"#join input[type=\"email\"]","w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть кнопка отправки","de":"Es gibt einen Sende-Knopf"},"s":"#join button","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Плавная прокрутка <code>scroll-behavior</code>","de":"Sanftes Scrollen <code>scroll-behavior</code>"},"s":"html","p":"scroll-behavior","r":"smooth","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть <code>:focus</code> у поля","de":"Es gibt <code>:focus</code> beim Feld"},"r":"\\.join\\s+input:focus\\s*\\{","f":"style.css","lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Клуб мейкеров</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Клуб мейкеров</strong>\n    <nav>\n      <a href=\"#about\">О клубе</a>\n      <a href=\"#events\">События</a>\n      <a href=\"#join\">Вступить</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Клуб юных мейкеров</h1>\n    <p>Паяем, программируем и придумываем.</p>\n    <a class=\"btn\" href=\"#join\">Вступить</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Мастерим</h2><p>Собираем настоящие устройства.</p></article>\n    <article class=\"card\"><h2>Программируем</h2><p>Пишем код и сразу видим результат.</p></article>\n    <article class=\"card\"><h2>Показываем</h2><p>Делимся проектами с друзьями.</p></article>\n  </section>\n  <section class=\"events\" id=\"events\">\n    <h2>Ближайшие события</h2>\n    <article class=\"event\"><time datetime=\"2025-06-14\">14 июня</time><h3>Паяем первый светодиод</h3></article>\n    <article class=\"event\"><time datetime=\"2025-06-21\">21 июня</time><h3>Пишем первый сайт</h3></article>\n    <article class=\"event\"><time datetime=\"2025-06-28\">28 июня</time><h3>Показываем проекты</h3></article>\n  </section>\n  <section class=\"join\" id=\"join\">\n    <h2>Вступить в клуб</h2>\n    <form>\n      <label for=\"mail\">Твоя почта</label>\n      <input type=\"email\" id=\"mail\" name=\"mail\" placeholder=\"name@example.com\">\n      <button type=\"submit\" class=\"btn\">Отправить</button>\n    </form>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Клуб юных мейкеров</p>\n  </footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Maker-Club</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <header class=\"top\">\n    <strong class=\"logo\">Maker-Club</strong>\n    <nav>\n      <a href=\"#about\">Über den Club</a>\n      <a href=\"#events\">Termine</a>\n      <a href=\"#join\">Mitmachen</a>\n    </nav>\n  </header>\n  <section class=\"hero\">\n    <h1>Club junger Maker</h1>\n    <p>Wir löten, programmieren und erfinden.</p>\n    <a class=\"btn\" href=\"#join\">Mitmachen</a>\n  </section>\n  <section class=\"cards\" id=\"about\">\n    <article class=\"card\"><h2>Basteln</h2><p>Wir bauen echte Geräte.</p></article>\n    <article class=\"card\"><h2>Programmieren</h2><p>Wir schreiben Code und sehen sofort das Ergebnis.</p></article>\n    <article class=\"card\"><h2>Zeigen</h2><p>Wir teilen Projekte mit Freunden.</p></article>\n  </section>\n  <section class=\"events\" id=\"events\">\n    <h2>Nächste Termine</h2>\n    <article class=\"event\"><time datetime=\"2025-06-14\">14. Juni</time><h3>Wir löten die erste LED</h3></article>\n    <article class=\"event\"><time datetime=\"2025-06-21\">21. Juni</time><h3>Wir schreiben die erste Website</h3></article>\n    <article class=\"event\"><time datetime=\"2025-06-28\">28. Juni</time><h3>Wir zeigen Projekte</h3></article>\n  </section>\n  <section class=\"join\" id=\"join\">\n    <h2>Dem Club beitreten</h2>\n    <form>\n      <label for=\"mail\">Deine E-Mail</label>\n      <input type=\"email\" id=\"mail\" name=\"mail\" placeholder=\"name@example.com\">\n      <button type=\"submit\" class=\"btn\">Senden</button>\n    </form>\n  </section>\n  <footer class=\"foot\">\n    <p>© 2025 Club junger Maker</p>\n  </footer>\n</body>\n</html>\n"},"style.css":"* { box-sizing: border-box; }\nbody { margin: 0; font-family: Arial, sans-serif; color: #15172e; }\n.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #15172e; color: #fff; }\nnav { display: flex; gap: 16px; }\nnav a { color: #fff; text-decoration: none; }\n.hero { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #cfeaff, #fde8ff); }\n.hero h1 { font-size: 40px; margin: 0 0 12px; }\n.btn { display: inline-block; padding: 10px 20px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; transition: background .3s; }\n.btn:hover { background: #3e2fc4; }\n.cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px 20px; }\n.card { flex: 1 1 220px; padding: 20px; background: #f2f1fc; border-radius: 14px; transition: transform .2s; }\n.card:hover { transform: translateY(-4px); }\n.foot { text-align: center; padding: 20px; background: #ecebff; }\nhtml { scroll-behavior: smooth; }\n.events, .join { padding: 24px 20px; }\n.event { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #ddd; }\n.event time { font-weight: 700; min-width: 90px; color: #5b48e8; }\n.event h3 { margin: 0; }\n.join form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.join input { padding: 10px 14px; border: 2px solid #cfcff0; border-radius: 999px; font: inherit; }\n.join input:focus { outline: 3px solid #5b48e8; }\n@media (max-width: 600px) {\n  .cards { flex-direction: column; }\n  .top { flex-direction: column; gap: 8px; }\n}\n"},"hint":{"ru":"<p>Не пиши всё сразу: сначала <code>.top</code> и <code>nav</code>, проверь. Потом <code>.hero</code>. Если блок не меняется, проверь, что класс в CSS совпадает с классом в HTML, и что есть точка в начале.</p>","de":"<p>Schreibe nicht alles auf einmal: zuerst <code>.top</code> und <code>nav</code>, prüfen. Dann <code>.hero</code>. Wenn sich ein Block nicht ändert, prüfe, ob die Klasse im CSS mit der im HTML übereinstimmt und ob der Punkt am Anfang steht.</p>"},"quiz":[{"q":{"ru":"Что нужно, чтобы <code>nav</code> стоял в ряд?","de":"Was braucht <code>nav</code>, damit es in einer Reihe steht?"},"o":[{"ru":"<code>display: flex</code>","de":"<code>display: flex</code>"},{"ru":"<code>display: row</code>","de":"<code>display: row</code>"},{"ru":"<code>float: none</code>","de":"<code>float: none</code>"}],"a":0},{"q":{"ru":"Зачем в <code>head</code> нужна строка viewport?","de":"Wozu braucht <code>head</code> die viewport-Zeile?"},"o":[{"ru":"Чтобы страница правильно выглядела на телефоне","de":"Damit die Seite auf dem Handy richtig aussieht"},{"ru":"Чтобы страница быстрее грузилась","de":"Damit die Seite schneller lädt"},{"ru":"Для заголовка вкладки","de":"Für den Tab-Titel"}],"a":0}],"proj":true,"lv2":{"ru":"<p>Добавь в лендинг раздел «События» — так выглядят расписания на сайтах клубов и школ:</p><ol><li>Перед подвалом вставь <code>&lt;section class=\"events\" id=\"events\"&gt;</code> с заголовком <code>&lt;h2&gt;</code> и тремя событиями <code>&lt;article class=\"event\"&gt;</code>.</li><li>В каждом событии дата <code>&lt;time datetime=\"…\"&gt;</code> и название <code>&lt;h3&gt;</code>.</li><li>Оформи: <code>.event { display: flex; gap: 12px; border-bottom: 1px solid #ddd; padding: 10px 0; }</code> и жирная дата <code>.event time { font-weight: 700;
