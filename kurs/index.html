function doneCount(){return D.lessons.filter(isDone).length;}
function nextDay(){for(var i=0;i<D.lessons.length;i++)if(!isDone(D.lessons[i]))return D.lessons[i].day;return D.lessons.length;}
/* ---------- views ---------- */
function setCrumb(s){document.getElementById('crumb').textContent=s||'';}
function home(){
  if(!S.intro){location.hash='#welcome';return;}
  var n=doneCount(),tot=D.lessons.length,cur=nextDay();
  var h='<span class="eyebrow">'+U('eyebrow')+'</span><h1>'+U('title')+'</h1><p class="lead">'+U('lead')+'</p>';
  h+='<div class="how">'+D.ui.how.map(function(x){return '<div><b>'+t(x[0])+'</b><br>'+t(x[1])+'</div>';}).join('')+'</div>';
  h+='<p><a class="btn pri" href="#d'+cur+'">'+(n?U('continue'):U('start'))+' → '+(U('day')+' '+Math.min(cur,tot))+'</a></p>';
  h+='<div class="prog"><i style="width:'+Math.round(100*n/tot)+'%"></i></div><p style="font-size:.9rem;color:var(--muted);margin:0">'+n+' / '+tot+' '+U('daysdone')+'</p>';
  h+='<div class="weeks">';
  D.weeks.forEach(function(wk,wi){
    h+='<div class="week"><h3>'+U('week')+' '+(wi+1)+'. '+t(wk.title)+'</h3><p>'+t(wk.sub)+'</p><div class="days">';
    D.lessons.filter(function(L){return L.week===wi+1;}).forEach(function(L){
      var cls='day'+(isDone(L)?' done':'')+(L.day===cur?' cur':'');
      h+='<a class="'+cls+'" href="#d'+L.day+'"><span class="n">'+L.day+'</span><span>'+t(L.title)+(L.proj?' <span class="k">· '+U('project')+'</span>':'')+'</span><span class="st">'+(isDone(L)?'✅':(!isOpen(L.day)?'🔒':(L.day===cur?'▶':'')))+'</span></a>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+=reportBox();
  h+='<p><a class="btn sm" href="#welcome">'+U('welcomeLink')+'</a></p>';
  h+='<details class="note"><summary>'+U('parentTitle')+'</summary>'+t(D.ui.parent)+'</details>';
  h+='<p style="margin-top:1.5rem"><button class="btn sm" id="reset">'+U('resetAll')+'</button></p>';
  app.innerHTML=h;setCrumb('');
  document.getElementById('reset').onclick=function(){if(confirm(U('resetConfirm'))){S.done={};S.code={};S.ok={};S.q={};S.man={};S.stat={};S.dates={};save();home();}};
  bindReport();
  window.scrollTo(0,0);
}
function lesson(n){
  var L=lessonById(n);if(!L){location.hash='#home';return;}
  if(!isOpen(n)){lockView(n);return;}
  S.last=n;save();
  var files=starter(L),cur=Object.keys(files)[0],tmr=null,tmr2=null,width='100%';
  var names=Object.keys(L.files);
  var h='<div class="lbar"><a class="btn sm" href="#home">← '+U('plan')+'</a><span class="sp"></span>'+
    '<button class="btn sm" id="rep1">'+U('reportBtn')+'</button> '+(n>1?'<a class="btn sm" href="#d'+(n-1)+'">←</a>':'')+(n<D.lessons.length?'<a class="btn sm" href="#d'+(n+1)+'">→</a>':'')+'</div>';
  h+='<div class="lg"><div class="lc"><span class="eyebrow">'+U('week')+' '+L.week+' · '+U('day')+' '+L.day+' · 45 '+U('min')+'</span><h1>'+t(L.title)+'</h1><div class="goal"><b>'+U('goal')+':</b> '+t(L.goal)+'</div>'+
    '<h2>'+U('theory')+'</h2>'+t(L.theory)+
    '<div class="task"><h3>'+(L.lv2?U('lv1'):U('task'))+'</h3>'+t(L.task)+'</div>'+
    (L.lv2?'<div class="task lv2"><h3>'+U('lv2')+'</h3>'+t(L.lv2)+'</div>':'')+
    (L.lv3?'<div class="task lv3"><h3>'+U('lv3')+'</h3>'+t(L.lv3)+'</div>':'');
  if(L.quiz){h+='<div class="quiz"><h3>'+U('quiz')+'</h3>'+L.quiz.map(function(q,i){return '<div class="q" data-i="'+i+'"><div>'+t(q.q)+'</div>'+q.o.map(function(o,j){return '<button type="button" class="o" data-j="'+j+'">'+t(o)+'</button>';}).join('')+'</div>';}).join('')+'</div>';}
  if(L.manual){h+='<div class="man"><h3>'+U('checklist')+'</h3>'+L.manual.map(function(m,i){return '<label><input type="checkbox" data-i="'+i+'"'+(S.man[n+'.'+i]?' checked':'')+'> <span>'+t(m)+'</span></label>';}).join('')+'</div>';}
  if(L.extra)h+=t(L.extra);
  if(L.hint)h+='<details class="note"><summary>💡 '+U('hint')+'</summary>'+t(L.hint)+'</details>';
  h+='</div><div class="right">';
  h+='<div class="tabs" role="tablist">'+names.map(function(f,i){return '<button class="tab" role="tab" data-f="'+f+'" aria-selected="'+(i===0)+'">'+f+'</button>';}).join('')+'</div>';
  h+='<div class="ed"><div class="gut" id="gut"></div><div class="edw"><pre class="hl" id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="code"></textarea></div></div>';
  h+='<div class="pvbar"><b>'+U('result')+'</b><button class="btn sm" data-w="375px">📱</button><button class="btn sm" data-w="768px">▭</button><button class="btn sm" data-w="100%">🖥</button></div>';
  h+='<div class="pvwrap"><iframe id="pv" sandbox="allow-scripts" title="preview"></iframe></div>';
  h+='<div style="display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap"><button class="btn pri" id="chk">✔ '+U('check')+'</button><button class="btn" id="sol">'+U('solution')+'</button><button class="btn" id="rst">'+U('reset')+'</button>'+(L.download?'<button class="btn" id="dl">⬇ '+U('download')+'</button>':'')+'</div>';
  h+='<div class="chk'+((L.checks||L.quiz||L.manual)?'':' hidden')+'" id="res"><h3>'+U('requirements')+'</h3><ul id="rl">'+(L.checks||[]).map(function(c,i){var p=i?L.checks[i-1].lv||1:1,q=c.lv||1,hd=(q!==p||(i===0&&q>1))?'<li class="lvh">'+(q===2?U('lv2'):q===3?U('lv3'):U('lv1'))+'</li>':'';return hd+'<li data-i="'+i+'"><i>○</i><span>'+t(c.m)+'</span></li>';}).join('')+'</ul><div id="msg"></div></div>';
  h+='</div></div>';
  app.innerHTML=h;setCrumb(U('day')+' '+n+' / '+D.lessons.length);window.scrollTo(0,0);
  document.getElementById('rep1').onclick=printReport;
  var ta=document.getElementById('ta'),hle=document.getElementById('hl'),gut=document.getElementById('gut'),pv=document.getElementById('pv'),wrap=document.querySelector('.pvwrap');
  if(!L.checks)document.getElementById('chk').textContent='✔ '+U('check');
  function paint(){
    var v=ta.value;hle.innerHTML=hl(v,cur)+'\n';
    var c=v.split('\n').length,g='';for(var i=1;i<=c;i++)g+=i+'\n';gut.textContent=g;sync();
  }
  function sync(){hle.scrollTop=ta.scrollTop;hle.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop;}
  function preview(){pv.srcdoc=build(files);}
  function persist(){S.code[n]=files;save();}
  function load(f){cur=f;ta.value=files[f];paint();document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.f===f));});}
  load(cur);preview();
  ta.addEventListener('scroll',sync);
  ta.addEventListener('input',function(){files[cur]=ta.value;paint();clearTimeout(tmr);tmr=setTimeout(preview,300);clearTimeout(tmr2);tmr2=setTimeout(persist,500);});
  ta.addEventListener('keydown',function(e){
    if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+2;ta.dispatchEvent(new Event('input'));}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('chk').click();}
  });
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){load(b.dataset.f);};});
  document.querySelectorAll('.pvbar [data-w]').forEach(function(b){b.onclick=function(){pv.style.width=b.dataset.w;};});
  document.getElementById('rst').onclick=function(){if(!confirm(U('resetLesson')))return;var src=L.files,o={};Object.keys(src).forEach(function(k){o[k]=t(src[k]);});files=o;delete S.code[n];S.ok[n]=false;save();load(Object.keys(files)[0]);preview();};
  document.getElementById('sol').onclick=function(){
    if(!L.sol){alert(U('nosol'));return;}
    if(!confirm(U('solConfirm')))return;
    var o={};Object.keys(L.sol).forEach(function(k){o[k]=t(L.sol[k]);});Object.keys(files).forEach(function(k){if(!(k in o))o[k]=files[k];});files=o;persist();load(cur);preview();
  };
  var dl=document.getElementById('dl');
  if(dl)dl.onclick=function(){Object.keys(files).forEach(function(k,i){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([files[k]],{type:'text/plain'}));a.download=k;document.body.appendChild(a);a.click();a.remove();},i*300);});};
  function update(res){
    if(res)[].forEach.call(document.querySelectorAll('#rl li[data-i]'),function(li,i){li.className=res[i]?'ok':'no';li.firstChild.textContent=res[i]?'✓':'✗';});
    var ok=!L.checks||(res?res.every(function(r,i){return r||L.checks[i].opt;}):S.ok[n]);
    if(res){S.ok[n]=ok;var st={};res.forEach(function(r,i){var lv=String(L.checks[i].lv||1);st[lv]=st[lv]||[0,0];st[lv][1]++;if(r)st[lv][0]++;});S.stat[n]=st;}
    var fin=tryDone(L);save();
    var msg=document.getElementById('msg');
    if(isDone(L))msg.innerHTML='<div class="win">🎉 '+U('dayDone')+(n<D.lessons.length?' <a href="#d'+(n+1)+'">'+U('next')+' →</a>':'')+'</div>';
    else if(res&&ok)msg.innerHTML='<div class="win" style="background:rgba(242,169,0,.14);border-color:rgba(242,169,0,.5)">'+U('codeOkRest')+'</div>';
    else if(res)msg.innerHTML='<p style="margin:.4rem 0 0;color:var(--muted)">'+U('notYet')+'</p>';
    if(n===D.lessons.length&&isDone(L))cert();
  }
  document.getElementById('chk').onclick=function(){
    if(!L.checks){update(null);return;}
    runChecks(L,files).then(update);
  };
  if(S.ok[n]&&L.checks)[].forEach.call(document.querySelectorAll('#rl li[data-i]'),function(li){li.className='ok';li.firstChild.textContent='✓';});
  if(isDone(L))update(null);
  /* quiz */
  document.querySelectorAll('.quiz .q').forEach(function(qe){
    var i=+qe.dataset.i,q=L.quiz[i];
    if(S.q[n+'.'+i])qe.querySelectorAll('.o')[q.a].classList.add('good');
    qe.querySelectorAll('.o').forEach(function(b){b.onclick=function(){
      var j=+b.dataset.j;
      if(j===q.a){b.classList.add('good');S.q[n+'.'+i]=true;save();update(null);}
      else b.classList.add('bad');
    };});
  });
  document.querySelectorAll('.man input').forEach(function(cb){cb.onchange=function(){S.man[n+'.'+cb.dataset.i]=cb.checked;save();update(null);};});
}

/* ---------- gate (codes from mom), welcome, report ---------- */
function isOpen(n){return n===1||!!S.unlock[n];}
function norm(x){return String(x).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function sha(str){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function lockView(n){
  var L=lessonById(n);
  app.innerHTML='<div class="lbar"><a class="btn sm" href="#home">← '+U('plan')+'</a></div><div class="lock"><div class="big">🔒</div><span class="eyebrow">'+U('day')+' '+n+' · '+t(L.title)+'</span><h1>'+U('lockTitle')+'</h1><p class="lead">'+U('lockText')+'</p>'+
    '<form id="lf"><label>'+U('lockLabel')+'<br><input id="lc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX"></label> <button class="btn pri" type="submit">'+U('lockOpen')+'</button></form><p id="lm" class="lockmsg"></p></div>';
  setCrumb(U('day')+' '+n+' / '+D.lessons.length);window.scrollTo(0,0);
  document.getElementById('lf').onsubmit=function(e){
    e.preventDefault();var lm=document.getElementById('lm');
    if(!window.crypto||!crypto.subtle){lm.textContent=U('lockNoCrypto');return;}
    var c=norm(document.getElementById('lc').value);
    sha(D.gate.salt+':'+n+':'+c).then(function(hx){
      if(c&&hx===D.gate.h[n]){S.unlock[n]=true;save();lesson(n);}
      else{lm.textContent=U('lockBad');}
    });
  };
}
function welcome(){
  app.innerHTML='<div class="welcome"><span class="eyebrow">'+U('welcomeEyebrow')+'</span><h1>'+U('welcomeTitle')+'</h1>'+t(D.ui.welcome)+'<p><a class="btn pri" id="wgo" href="#d1">'+U('welcomeBtn')+'</a></p></div>';
  setCrumb('');window.scrollTo(0,0);
  document.getElementById('wgo').onclick=function(){S.intro=true;save();};
}
function reportBox(){
  var N=S.note||{};
  return '<div class="repbox"><h2>'+U('repBox')+'</h2><p>'+U('repHint')+'</p>'+
    '<label>'+U('repName')+'<input id="rn" value="'+esc(S.name||'')+'"></label>'+
    '<label>'+U('repGood')+'<textarea id="rg" rows="2">'+esc(N.good||'')+'</textarea></label>'+
    '<label>'+U('repHard')+'<textarea id="rh" rows="2">'+esc(N.hard||'')+'</textarea></label>'+
    '<label>'+U('repAsk')+'<textarea id="ra" rows="2">'+esc(N.ask||'')+'</textarea></label>'+
    '<p><button class="btn pri" id="rep2">'+U('reportBtn')+'</button></p></div>';
}
function bindReport(){
  [['rn',function(v){S.name=v;}],['rg',function(v){S.note.good=v;}],['rh',function(v){S.note.hard=v;}],['ra',function(v){S.note.ask=v;}]].forEach(function(p){
    var e=document.getElementById(p[0]);e.oninput=function(){p[1](e.value);save();};});
  document.getElementById('rep2').onclick=printReport;
}
function buildReport(){
  var tot=D.lessons.length,done=doneCount(),open=D.lessons.filter(function(L){return isOpen(L.day);}).length,l2=0,l3=0;
  var loc=S.lang==='de'?'de-DE':'ru-RU';
  var rows=D.lessons.map(function(L){
    var d=L.day,st=S.stat[d]||{},cell=function(k){var x=st[k];return x?(x[0]+'/'+x[1]):'—';};
    if(st['2']&&st['2'][0]===st['2'][1])l2++;
    if(st['3']&&st['3'][0]===st['3'][1])l3++;
    var q=L.quiz?(L.quiz.filter(function(_,i){return S.q[d+'.'+i];}).length+'/'+L.quiz.length):'—';
    var status=isDone(L)?U('stDone'):(!isOpen(d)?U('stLock'):((S.code[d]||S.stat[d])?U('stWork'):U('stNew')));
    return '<tr class="'+(isDone(L)?'rd':'')+'"><td>'+d+'</td><td>'+t(L.title)+'</td><td>'+status+'</td><td>'+cell('1')+'</td><td>'+cell('2')+'</td><td>'+cell('3')+'</td><td>'+q+'</td><td>'+(S.dates[d]?new Date(S.dates[d]).toLocaleDateString(loc):'')+'</td></tr>';
  }).join('');
  var N=S.note||{},none='<i>'+U('repNone')+'</i>';
  var h='<h1>BliepLab · '+U('repTitle')+'</h1><p><b>'+U('repStudent')+':</b> '+esc(S.name||'')+' &nbsp; <b>'+U('repDate')+':</b> '+new Date().toLocaleDateString(loc)+'</p>'+
    '<p><b>'+U('repSum')+':</b> '+done+' / '+tot+' &nbsp; <b>'+U('repOpen')+':</b> '+open+' / '+tot+' &nbsp; <b>'+U('repL2')+':</b> '+l2+' &nbsp; <b>'+U('repL3')+':</b> '+l3+'</p>'+
    '<table><thead><tr><th>'+U('repColDay')+'</th><th>'+U('repColTitle')+'</th><th>'+U('repColSt')+'</th><th>'+U('repColL1')+'</th><th>'+U('repColL2')+'</th><th>'+U('repColL3')+'</th><th>'+U('repColQ')+'</th><th>'+U('repColD')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<h3>'+U('repNotes')+'</h3><p><b>'+U('repGood')+':</b> '+(N.good?esc(N.good):none)+'</p><p><b>'+U('repHard')+':</b> '+(N.hard?esc(N.hard):none)+'</p><p><b>'+U('repAsk')+':</b> '+(N.ask?esc(N.ask):none)+'</p>';
  var ld=S.last&&S.code[S.last];
  if(ld){h+='<h3>'+U('repCode')+' '+S.last+'</h3>'+Object.keys(ld).map(function(f){return '<p class="fn">'+f+'</p><pre>'+esc(ld[f].split('\n').slice(0,60).join('\n'))+'</pre>';}).join('');}
  h+='<p class="flow">'+U('repFlow')+'</p>';
  return h;
}
function printReport(){
  document.getElementById('rep').innerHTML=buildReport();
  document.body.className='pr-rep';
  var done=function(){document.body.className='';window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(function(){window.print();},50);
}
function cert(){
  var c=document.getElementById('cert');
  c.innerHTML='<h2>BliepLab</h2><p style="font-size:1.4rem">'+U('certText')+'</p><p style="font-size:2rem;font-weight:700" id="cname">&nbsp;</p><p>'+U('certSub')+'</p><p>'+new Date().toLocaleDateString(S.lang==='de'?'de-DE':'ru-RU')+'</p>';
  if(!document.getElementById('certbox')){
    var box=document.createElement('div');box.id='certbox';box.className='win';box.style.marginTop='1rem';
    box.innerHTML='<label>'+U('yourName')+': <input id="nm" style="font:inherit;padding:.3rem .6rem;border-radius:8px;border:1px solid var(--line)"></label> <button class="btn sm" id="pr">🖨 '+U('printCert')+'</button>';
    document.getElementById('msg').appendChild(box);
    document.getElementById('pr').onclick=function(){document.getElementById('cname').textContent=document.getElementById('nm').value||' ';document.body.className='pr-cert';var d=function(){document.body.className='';window.removeEventListener('afterprint',d);};window.addEventListener('afterprint',d);setTimeout(function(){window.print();},50);};
  }
}
/* ---------- router + language ---------- */
function route(){
  var h=location.hash||'#home',m=/^#d(\d+)$/.exec(h);
  if(h==='#welcome')welcome();else if(m)lesson(+m[1]);else home();
}
function setLang(l){S.lang=l;save();document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('data-lang',l);
  document.querySelectorAll('.langsw button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.set===l));});route();}
document.querySelectorAll('.langsw button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.set);});});
window.addEventListener('hashchange',route);
document.documentElement.setAttribute('lang',S.lang);
document.querySelectorAll('.langsw button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.set===S.lang));});
window.__KURS={S:S,runChecks:runChecks,build:build,D:D,t:t};
route();
})();
</script></body></html>
