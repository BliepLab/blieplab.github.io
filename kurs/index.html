Наверх» на <code>#top</code> (дай <code>id=\"top\"</code> заголовку <code>h1</code>) и ссылка на <code>mailto:</code>.</li></ol><p>Прочитай свой код сверху вниз, как книгу: нет ли пропущенных закрывающих тегов?</p>","de":"<p>Wir steigern. Baue eine Seite, die du Freunden ohne Scham zeigen kannst:</p><ol><li>Gestalte das Foto als <code>&lt;figure&gt;</code> mit Beschriftung <code>&lt;figcaption&gt;</code>.</li><li>Füge ein Zitat <code>&lt;blockquote&gt;</code> mit einem Lieblingssatz hinzu.</li><li>Benutze in einer verschachtelten Interessenliste („Musik“ → zwei Genres) <code>&lt;ul&gt;</code> in <code>&lt;li&gt;</code>.</li><li>Unten ein Link „Nach oben“ zu <code>#top</code> (gib dem <code>h1</code> <code>id=\"top\"</code>) und ein Link mit <code>mailto:</code>.</li></ol><p>Lies deinen Code von oben nach unten wie ein Buch: Fehlt irgendwo ein schließendes Tag?</p>"}},{"day":8,"week":2,"title":{"ru":"Что такое CSS: первые стили","de":"Was ist CSS: erste Stile"},"goal":{"ru":"Написать первое правило CSS и понять, из чего оно состоит.","de":"Die erste CSS-Regel schreiben und verstehen, woraus sie besteht."},"theory":{"ru":"<p>CSS (Cascading Style Sheets) говорит браузеру, <b>как выглядят</b> элементы. Правило CSS состоит из трёх частей:</p><pre class=\"ex\" data-l=\"css\">h1 {\n  color: red;\n}\n/* селектор { свойство: значение; } */</pre><ul><li><b>Селектор</b> (<code>h1</code>) — к чему применить: ко всем заголовкам первого уровня.</li><li><b>Свойство</b> (<code>color</code>) — что менять: цвет текста.</li><li><b>Значение</b> (<code>red</code>) — на что менять.</li></ul><p>После каждого значения — точка с запятой <code>;</code>. Правила лежат в <code>&lt;style&gt;</code> внутри <code>&lt;head&gt;</code>. Два главных свойства для начала: <code>color</code> (цвет текста) и <code>background-color</code> (цвет фона).</p>","de":"<p>CSS (Cascading Style Sheets) sagt dem Browser, <b>wie Elemente aussehen</b>. Eine CSS-Regel besteht aus drei Teilen:</p><pre class=\"ex\" data-l=\"css\">h1 {\n  color: red;\n}\n/* Selektor { Eigenschaft: Wert; } */</pre><ul><li><b>Selektor</b> (<code>h1</code>) — worauf es angewendet wird: auf alle Überschriften erster Ebene.</li><li><b>Eigenschaft</b> (<code>color</code>) — was geändert wird: die Textfarbe.</li><li><b>Wert</b> (<code>red</code>) — worauf geändert wird.</li></ul><p>Nach jedem Wert steht ein Semikolon <code>;</code>. Die Regeln stehen in <code>&lt;style&gt;</code> innerhalb von <code>&lt;head&gt;</code>. Die zwei wichtigsten Eigenschaften zum Start: <code>color</code> (Textfarbe) und <code>background-color</code> (Hintergrundfarbe).</p>"},"task":{"ru":"<ol><li>Дай заголовку <code>h1</code> любой цвет текста, кроме чёрного.</li><li>Задай странице (<code>body</code>) цвет фона.</li><li>Задай абзацам (<code>p</code>) тёмно-серый цвет вместо чёрного, например <code>#333</code>.</li></ol>","de":"<ol><li>Gib der Überschrift <code>h1</code> eine beliebige Textfarbe außer Schwarz.</li><li>Gib der Seite (<code>body</code>) eine Hintergrundfarbe.</li><li>Gib den Absätzen (<code>p</code>) ein dunkles Grau statt Schwarz, z. B. <code>#333</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* Пиши правила CSS здесь */\n  </style>\n</head>\n<body>\n  <h1>Привет, CSS!</h1>\n  <p>Сейчас эта страница выглядит скучно. Давай её раскрасим.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* Schreibe hier CSS-Regeln */\n  </style>\n</head>\n<body>\n  <h1>Hallo, CSS!</h1>\n  <p>Im Moment sieht diese Seite langweilig aus. Machen wir sie bunt.</p>\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть блок <code>&lt;style&gt;</code>","de":"Es gibt einen <code>&lt;style&gt;</code>-Block"},"s":"style","w":null},{"t":"cssnot","m":{"ru":"Цвет заголовка <code>h1</code> не чёрный","de":"Die Farbe von <code>h1</code> ist nicht schwarz"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"У <code>body</code> есть цвет фона","de":"<code>body</code> hat eine Hintergrundfarbe"},"s":"body","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"Цвет абзаца <code>p</code> не чёрный","de":"Die Farbe von <code>p</code> ist nicht schwarz"},"s":"p","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnum","m":{"ru":"<code>h1</code>: размер шрифта от 36px","de":"<code>h1</code>: Schriftgröße ab 36px"},"s":"h1","p":"font-size","o":">=","n":36,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"<code>p</code>: размер шрифта от 18px","de":"<code>p</code>: Schriftgröße ab 18px"},"s":"p","p":"font-size","o":">=","n":18,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"Под <code>h1</code> есть линия","de":"Unter <code>h1</code> gibt es eine Linie"},"s":"h1","p":"border-bottom-width","o":">=","n":2,"w":null,"lv":2},{"t":"code","m":{"ru":"Есть комментарий CSS <code>/* … */</code>","de":"Es gibt einen CSS-Kommentar <code>/* … */</code>"},"r":"/\\*[\\s\\S]*?\\*/","f":null,"lv":2},{"t":"count","m":{"ru":"Список из трёх пунктов <code>&lt;li&gt;</code>","de":"Liste mit drei Punkten <code>&lt;li&gt;</code>"},"s":"ul li","n":3,"w":null,"lv":3,"opt":true},{"t":"cssnot","m":{"ru":"Цвет <code>h2</code> не чёрный","de":"Farbe von <code>h2</code> nicht schwarz"},"s":"h2","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null,"lv":3,"opt":true},{"t":"cssnot","m":{"ru":"Цвет <code>li</code> не чёрный","de":"Farbe von <code>li</code> nicht schwarz"},"s":"li","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Палитра из трёх цветов записана комментарием","de":"Die Palette aus drei Farben steht im Kommentar"},"r":"/\\*[\\s\\S]*#[0-9a-fA-F]{3,6}[\\s\\S]*#[0-9a-fA-F]{3,6}[\\s\\S]*#[0-9a-fA-F]{3,6}[\\s\\S]*?\\*/","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* палитра: #fff3d6, #5b48e8, #ee6a3c */\n    body { background-color: #fff3d6; }\n    h1 { color: #5b48e8; font-size: 40px; border-bottom: 3px solid orange; }\n    h2 { color: #ee6a3c; }\n    li { color: #5b48e8; }\n    p { color: #333; font-size: 18px; }\n  </style>\n</head>\n<body>\n  <h1>Привет, CSS!</h1>\n  <p>Сейчас эта страница выглядит скучно. Давай её раскрасим.</p>\n  <h2>Мои цвета</h2>\n  <ul>\n    <li>Кремовый</li>\n    <li>Фиолетовый</li>\n    <li>Оранжевый</li>\n  </ul>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* Palette: #fff3d6, #5b48e8, #ee6a3c */\n    body { background-color: #fff3d6; }\n    h1 { color: #5b48e8; font-size: 40px; border-bottom: 3px solid orange; }\n    h2 { color: #ee6a3c; }\n    li { color: #5b48e8; }\n    p { color: #333; font-size: 18px; }\n  </style>\n</head>\n<body>\n  <h1>Hallo, CSS!</h1>\n  <p>Im Moment sieht diese Seite langweilig aus. Machen wir sie bunt.</p>\n  <h2>Meine Farben</h2>\n  <ul>\n    <li>Creme</li>\n    <li>Violett</li>\n    <li>Orange</li>\n  </ul>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Пример: <code>body { background-color: #fff3d6; }</code>. Не забудь фигурные скобки <code>{ }</code> и точку с запятой в конце строки.</p>","de":"<p>Beispiel: <code>body { background-color: #fff3d6; }</code>. Vergiss die geschweiften Klammern <code>{ }</code> und das Semikolon am Zeilenende nicht.</p>"},"quiz":[{"q":{"ru":"Как называется часть <code>h1</code> в правиле <code>h1 { color: red; }</code>?","de":"Wie heißt der Teil <code>h1</code> in der Regel <code>h1 { color: red; }</code>?"},"o":[{"ru":"Селектор","de":"Selektor"},{"ru":"Свойство","de":"Eigenschaft"},{"ru":"Значение","de":"Wert"}],"a":0},{"q":{"ru":"Что нужно поставить после значения?","de":"Was muss nach dem Wert stehen?"},"o":[{"ru":"Точку с запятой <code>;</code>","de":"Ein Semikolon <code>;</code>"},{"ru":"Двоеточие","de":"Ein Doppelpunkt"},{"ru":"Ничего","de":"Nichts"}],"a":0}],"lv2":{"ru":"<p>Сделай заголовок и абзац выразительнее. В правила внутри <code>&lt;style&gt;</code> добавь:</p><ol><li>Для <code>h1</code>: <code>font-size: 40px;</code> (размер шрифта).</li><li>Для <code>p</code>: <code>font-size: 18px;</code>.</li><li>Для <code>h1</code> ещё и линию снизу: <code>border-bottom: 3px solid orange;</code>.</li><li>Над правилами напиши комментарий CSS: <code>/* мои стили */</code>. В CSS комментарии пишутся иначе, чем в HTML!</li></ol><p>Меняй числа и смотри, как реагирует страница. Какой размер для заголовка тебе нравится больше всего?</p>","de":"<p>Mache Überschrift und Absatz ausdrucksvoller. Ergänze in den Regeln im <code>&lt;style&gt;</code>:</p><ol><li>Für <code>h1</code>: <code>font-size: 40px;</code> (Schriftgröße).</li><li>Für <code>p</code>: <code>font-size: 18px;</code>.</li><li>Für <code>h1</code> außerdem eine Linie darunter: <code>border-bottom: 3px solid orange;</code>.</li><li>Schreibe über die Regeln einen CSS-Kommentar: <code>/* meine Stile */</code>. In CSS schreibt man Kommentare anders als in HTML!</li></ol><p>Ändere die Zahlen und sieh, wie die Seite reagiert. Welche Größe gefällt dir für die Überschrift am besten?</p>"},"lv3":{"ru":"<p>Оформи «настроение страницы»: придумай палитру из трёх цветов (например, тёмный, светлый и яркий акцент).</p><ol><li>Добавь в HTML подзаголовок <code>&lt;h2&gt;</code> и список <code>&lt;ul&gt;</code> из трёх пунктов <code>&lt;li&gt;</code>.</li><li>Покрась <code>h2</code> и <code>li</code> своими цветами из палитры (не чёрным!).</li><li>Запиши палитру комментарием в CSS, например <code>/* палитра: #fff3d6, #5b48e8, #ee6a3c */</code>.</li></ol><p>Подсказка: хорошие палитры можно подсмотреть на сайтах <code>coolors.co</code> и <code>colorhunt.co</code>.</p>","de":"<p>Gestalte die „Stimmung der Seite“: Erfinde eine Palette aus drei Farben (zum Beispiel dunkel, hell und ein kräftiger Akzent).</p><ol><li>Füge im HTML eine Unterüberschrift <code>&lt;h2&gt;</code> und eine Liste <code>&lt;ul&gt;</code> mit drei Punkten <code>&lt;li&gt;</code> hinzu.</li><li>Färbe <code>h2</code> und <code>li</code> mit deinen Farben aus der Palette (nicht schwarz!).</li><li>Notiere die Palette als CSS-Kommentar, zum Beispiel <code>/* Palette: #fff3d6, #5b48e8, #ee6a3c */</code>.</li></ol><p>Tipp: Gute Paletten findest du auf <code>coolors.co</code> und <code>colorhunt.co</code>.</p>"}},{"day":9,"week":2,"title":{"ru":"Селекторы: теги, классы и id","de":"Selektoren: Tags, Klassen und IDs"},"goal":{"ru":"Выбирать нужные элементы по тегу, классу и id.","de":"Die richtigen Elemente nach Tag, Klasse und ID auswählen."},"theory":{"ru":"<p>Селектор выбирает, к чему применить стиль. Три главных вида:</p><pre class=\"ex\" data-l=\"css\">p { color: #333; }          /* все абзацы (по тегу) */\n.note { color: green; }     /* всё с class=\"note\" */\n#title { color: red; }      /* один элемент с id=\"title\" */</pre><pre class=\"ex\" data-l=\"html\">&lt;h1 id=\"title\"&gt;Заголовок&lt;/h1&gt;\n&lt;p class=\"note\"&gt;Важная заметка&lt;/p&gt;\n&lt;p class=\"note big\"&gt;Заметка и ещё класс big&lt;/p&gt;</pre><ul><li><b>Класс</b> (<code>.note</code>) можно давать многим элементам, а у одного элемента может быть несколько классов через пробел.</li><li><b>id</b> (<code>#title</code>) должен быть уникальным на странице.</li><li>Если правила спорят, побеждает более точный селектор: id сильнее класса, класс сильнее тега.</li></ul>","de":"<p>Ein Selektor wählt aus, worauf ein Stil angewendet wird. Drei Hauptarten:</p><pre class=\"ex\" data-l=\"css\">p { color: #333; }          /* alle Absätze (nach Tag) */\n.note { color: green; }     /* alles mit class=\"note\" */\n#title { color: red; }      /* ein Element mit id=\"title\" */</pre><pre class=\"ex\" data-l=\"html\">&lt;h1 id=\"title\"&gt;Überschrift&lt;/h1&gt;\n&lt;p class=\"note\"&gt;Wichtige Notiz&lt;/p&gt;\n&lt;p class=\"note big\"&gt;Notiz und noch die Klasse big&lt;/p&gt;</pre><ul><li>Eine <b>Klasse</b> (<code>.note</code>) kann man vielen Elementen geben, und ein Element kann mehrere Klassen haben, durch Leerzeichen getrennt.</li><li>Eine <b>ID</b> (<code>#title</code>) muss auf der Seite einmalig sein.</li><li>Wenn Regeln streiten, gewinnt der genauere Selektor: ID schlägt Klasse, Klasse schlägt Tag.</li></ul>"},"task":{"ru":"<ol><li>Создай правило <code>.highlight</code> с жёлтым фоном (<code>background-color: yellow;</code>).</li><li>Добавь <code>class=\"highlight\"</code> двум абзацам из трёх.</li><li>Создай правило <code>#title</code> и дай заголовку цвет.</li></ol>","de":"<ol><li>Erstelle die Regel <code>.highlight</code> mit gelbem Hintergrund (<code>background-color: yellow;</code>).</li><li>Gib zwei von drei Absätzen <code>class=\"highlight\"</code>.</li><li>Erstelle die Regel <code>#title</code> und gib der Überschrift eine Farbe.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* твои правила */\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Мои дела</h1>\n  <p>Сделать уроки</p>\n  <p>Погулять</p>\n  <p>Записать код</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* deine Regeln */\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Meine Aufgaben</h1>\n  <p>Hausaufgaben machen</p>\n  <p>Spazieren gehen</p>\n  <p>Code schreiben</p>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть правило <code>.highlight { … }</code>","de":"Es gibt die Regel <code>.highlight { … }</code>"},"r":"\\.highlight\\s*\\{","f":null},{"t":"count","m":{"ru":"Класс <code>highlight</code> у двух элементов","de":"Die Klasse <code>highlight</code> bei zwei Elementen"},"s":".highlight","n":2,"w":null},{"t":"cssnot","m":{"ru":"У <code>.highlight</code> есть фон","de":"<code>.highlight</code> hat einen Hintergrund"},"s":".highlight","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"Есть правило <code>#title { … }</code>","de":"Es gibt die Regel <code>#title { … }</code>"},"r":"#title\\s*\\{","f":null},{"t":"cssnot","m":{"ru":"Цвет <code>#title</code> не чёрный","de":"Die Farbe von <code>#title</code> ist nicht schwarz"},"s":"#title","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"count","m":{"ru":"Класс <code>done</code> у двух дел","de":"Klasse <code>done</code> bei zwei Aufgaben"},"s":".done","n":2,"w":null,"lv":2},{"t":"css","m":{"ru":"У <code>.done</code> текст зачёркнут","de":"Bei <code>.done</code> ist der Text durchgestrichen"},"s":".done","p":"text-decoration-line","r":"line-through","w":null,"lv":2},{"t":"has","m":{"ru":"Есть подзаголовок <code>&lt;h2&gt;</code>","de":"Es gibt eine Unterüberschrift <code>&lt;h2&gt;</code>"},"s":"h2","w":null,"lv":2},{"t":"css","m":{"ru":"<code>h1</code>: шрифт Georgia","de":"<code>h1</code>: Schrift Georgia"},"s":"h1","p":"font-family","r":"Georgia","w":null,"lv":2},{"t":"css","m":{"ru":"<code>h2</code>: шрифт Georgia (одно правило через запятую)","de":"<code>h2</code>: Schrift Georgia (eine Regel mit Komma)"},"s":"h2","p":"font-family","r":"Georgia","w":null,"lv":2},{"t":"count","m":{"ru":"Список минимум из шести пунктов","de":"Liste mit mindestens sechs Punkten"},"s":"ul li","n":6,"w":null,"lv":3,"opt":true},{"t":"cssnot","m":{"ru":"Чётные пункты закрашены (<code>nth-child(even)</code>)","de":"Gerade Punkte sind gefärbt (<code>nth-child(even)</code>)"},"s":"li:nth-child(even)","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Первый пункт жирный","de":"Der erste Punkt ist fett"},"s":"li:first-child","p":"font-weight","r":"^(700|bold)$","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Последний пункт курсивом","de":"Der letzte Punkt ist kursiv"},"s":"li:last-child","p":"font-style","r":"italic","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .highlight { background-color: yellow; }\n    #title { color: #ee6a3c; }\n    h1, h2 { font-family: Georgia, serif; }\n    .done { text-decoration: line-through; color: gray; }\n    li:nth-child(even) { background: #ecebff; }\n    li:first-child { font-weight: bold; }\n    li:last-child { font-style: italic; }\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Мои дела</h1>\n  <p class=\"highlight\">Сделать уроки</p>\n  <p>Погулять</p>\n  <p class=\"highlight\">Записать код</p>\n  <p class=\"done\">Позавтракать</p>\n  <p class=\"done\">Собрать рюкзак</p>\n  <h2>Завтра</h2>\n  <ul>\n    <li>Утренняя зарядка</li>\n    <li>Урок кода</li>\n    <li>Прогулка</li>\n    <li>Рисование</li>\n    <li>Чтение</li>\n    <li>Ужин с семьёй</li>\n  </ul>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    .highlight { background-color: yellow; }\n    #title { color: #ee6a3c; }\n    h1, h2 { font-family: Georgia, serif; }\n    .done { text-decoration: line-through; color: gray; }\n    li:nth-child(even) { background: #ecebff; }\n    li:first-child { font-weight: bold; }\n    li:last-child { font-style: italic; }\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Meine Aufgaben</h1>\n  <p class=\"highlight\">Hausaufgaben machen</p>\n  <p>Spazieren gehen</p>\n  <p class=\"highlight\">Code schreiben</p>\n  <p class=\"done\">Frühstücken</p>\n  <p class=\"done\">Rucksack packen</p>\n  <h2>Morgen</h2>\n  <ul>\n    <li>Morgengymnastik</li>\n    <li>Code-Lektion</li>\n    <li>Spaziergang</li>\n    <li>Zeichnen</li>\n    <li>Lesen</li>\n    <li>Abendessen mit der Familie</li>\n  </ul>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Класс в CSS пишется с точкой (<code>.highlight</code>), а в HTML — без неё: <code>class=\"highlight\"</code>. Id в CSS пишется с решёткой <code>#</code>.</p>","de":"<p>Eine Klasse schreibt man im CSS mit Punkt (<code>.highlight</code>), im HTML ohne: <code>class=\"highlight\"</code>. Eine ID schreibt man im CSS mit Raute <code>#</code>.</p>"},"quiz":[{"q":{"ru":"Как в CSS выбрать все элементы с <code>class=\"note\"</code>?","de":"Wie wählt man im CSS alle Elemente mit <code>class=\"note\"</code>?"},"o":[{"ru":"<code>.note</code>","de":"<code>.note</code>"},{"ru":"<code>#note</code>","de":"<code>#note</code>"},{"ru":"<code>note</code>","de":"<code>note</code>"}],"a":0},{"q":{"ru":"Сколько элементов на странице могут иметь один и тот же id?","de":"Wie viele Elemente einer Seite dürfen dieselbe ID haben?"},"o":[{"ru":"Только один","de":"Nur eines"},{"ru":"Сколько угодно","de":"Beliebig viele"},{"ru":"Не больше трёх","de":"Höchstens drei"}],"a":0}],"lv2":{"ru":"<p>Добавь в страницу «Мои дела» ещё один смысл для классов:</p><ol><li>Добавь два дела с классом <code>done</code> (выполнено) и правило <code>.done { text-decoration: line-through; color: gray; }</code>. Зачёркнутое и серое читается как «готово».</li><li>Добавь подзаголовок <code>&lt;h2&gt;Завтра&lt;/h2&gt;</code> и покрась <code>h1</code> и <code>h2</code> одним правилом через запятую: <code>h1, h2 { font-family: Georgia, serif; }</code>. Запятая означает «и то, и другое».</li></ol>","de":"<p>Gib den Klassen auf der Seite „Meine Aufgaben“ noch eine Bedeutung:</p><ol><li>Füge zwei erledigte Aufgaben mit der Klasse <code>done</code> hinzu und die Regel <code>.done { text-decoration: line-through; color: gray; }</code>. Durchgestrichen und grau liest sich als „erledigt“.</li><li>Füge eine Unterüberschrift <code>&lt;h2&gt;Morgen&lt;/h2&gt;</code> hinzu und gestalte <code>h1</code> und <code>h2</code> mit einer Regel mit Komma: <code>h1, h2 { font-family: Georgia, serif; }</code>. Das Komma bedeutet „und“.</li></ol>"},"lv3":{"ru":"<p>Полосатый список — вот где пригодятся «умные» селекторы:</p><ol><li>Добавь список <code>&lt;ul&gt;</code> минимум из шести пунктов.</li><li><code>li:nth-child(even) { background: #ecebff; }</code> закрасит чётные пункты.</li><li><code>li:first-child { font-weight: bold; }</code> сделает первый пункт жирным, <code>li:last-child { font-style: italic; }</code> — последний курсивным.</li><li>Попробуй <code>li:nth-child(3)</code> и <code>li:nth-child(odd)</code>. Что покрасится?</li></ol><p>Двоеточие + слово — это <b>псевдокласс</b>: состояние или позиция элемента.</p>","de":"<p>Eine gestreifte Liste — hier sind „schlaue“ Selektoren nützlich:</p><ol><li>Füge eine Liste <code>&lt;ul&gt;</code> mit mindestens sechs Punkten hinzu.</li><li><code>li:nth-child(even) { background: #ecebff; }</code> färbt die geraden Punkte.</li><li><code>li:first-child { font-weight: bold; }</code> macht den ersten Punkt fett, <code>li:last-child { font-style: italic; }</code> den letzten kursiv.</li><li>Probiere <code>li:nth-child(3)</code> und <code>li:nth-child(odd)</code>. Was wird gefärbt?</li></ol><p>Doppelpunkt + Wort ist eine <b>Pseudoklasse</b>: ein Zustand oder eine Position des Elements.</p>"}},{"day":10,"week":2,"title":{"ru":"Текст: шрифты, размер и выравнивание","de":"Text: Schriften, Größe und Ausrichtung"},"goal":{"ru":"Управлять шрифтом, размером, выравниванием и расстоянием между строками.","de":"Schrift, Größe, Ausrichtung und Zeilenabstand steuern."},"theory":{"ru":"<p>Самые полезные свойства текста:</p><pre class=\"ex\" data-l=\"css\">body {\n  font-family: Georgia, serif;   /* шрифт (запасные через запятую) */\n  font-size: 18px;               /* размер */\n  line-height: 1.6;              /* расстояние между строками */\n}\nh1 {\n  text-align: center;            /* выравнивание */\n  text-transform: uppercase;     /* ЗАГЛАВНЫЕ */\n  letter-spacing: 2px;           /* расстояние между буквами */\n  font-weight: 700;              /* жирность */\n}</pre><ul><li>Шрифт указывают списком: если первого нет на компьютере, берётся следующий. В конце всегда ставь общий тип: <code>serif</code> (с засечками), <code>sans-serif</code> (без) или <code>monospace</code>.</li><li>Единицы: <code>px</code> — пиксели. <code>rem</code> — относительно базового размера (1rem ≈ 16px), хорош для адаптивных сайтов.</li><li>Хорошая читаемость: размер от 16px, <code>line-height</code> около 1.5–1.7.</li></ul>","de":"<p>Die nützlichsten Texteigenschaften:</p><pre class=\"ex\" data-l=\"css\">body {\n  font-family: Georgia, serif;   /* Schrift (Ersatz mit Komma) */\n  font-size: 18px;               /* Größe */\n  line-height: 1.6;              /* Abstand zwischen Zeilen */\n}\nh1 {\n  text-align: center;            /* Ausrichtung */\n  text-transform: uppercase;     /* GROSSBUCHSTABEN */\n  letter-spacing: 2px;           /* Abstand zwischen Buchstaben */\n  font-weight: 700;              /* Dicke */\n}</pre><ul><li>Die Schrift gibt man als Liste an: Wenn die erste auf dem Computer fehlt, wird die nächste genommen. Am Ende steht immer eine allgemeine Art: <code>serif</code> (mit Serifen), <code>sans-serif</code> (ohne) oder <code>monospace</code>.</li><li>Einheiten: <code>px</code> — Pixel. <code>rem</code> — relativ zur Grundgröße (1rem ≈ 16px), gut für responsive Seiten.</li><li>Gute Lesbarkeit: Größe ab 16px, <code>line-height</code> etwa 1,5–1,7.</li></ul>"},"task":{"ru":"<ol><li>Дай всей странице (<code>body</code>) шрифт <code>Georgia, serif</code>.</li><li>Заголовок <code>h1</code>: по центру и ЗАГЛАВНЫМИ.</li><li>Абзацы <code>p</code>: размер не меньше 18px и <code>line-height</code>.</li></ol>","de":"<ol><li>Gib der ganzen Seite (<code>body</code>) die Schrift <code>Georgia, serif</code>.</li><li>Überschrift <code>h1</code>: zentriert und in GROSSBUCHSTABEN.</li><li>Absätze <code>p</code>: Größe mindestens 18px und <code>line-height</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* твои правила */\n  </style>\n</head>\n<body>\n  <h1>Как читать код</h1>\n  <p>Код читают сверху вниз, как книгу. Сначала смотри на структуру: заголовки, блоки, списки. Потом на детали.</p>\n  <p>Хорошая привычка: делать маленькие изменения и сразу смотреть результат.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* deine Regeln */\n  </style>\n</head>\n<body>\n  <h1>Code lesen</h1>\n  <p>Code liest man von oben nach unten, wie ein Buch. Schau zuerst auf die Struktur: Überschriften, Blöcke, Listen. Dann auf die Details.</p>\n  <p>Eine gute Gewohnheit: kleine Änderungen machen und sofort das Ergebnis ansehen.</p>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>body</code>: шрифт Georgia","de":"<code>body</code>: Schrift Georgia"},"s":"body","p":"font-family","r":"georgia","w":null},{"t":"css","m":{"ru":"<code>h1</code> по центру","de":"<code>h1</code> zentriert"},"s":"h1","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"<code>h1</code> ЗАГЛАВНЫМИ","de":"<code>h1</code> in GROSSBUCHSTABEN"},"s":"h1","p":"text-transform","r":"^uppercase$","w":null},{"t":"cssnum","m":{"ru":"<code>p</code>: размер не меньше 18px","de":"<code>p</code>: Größe mindestens 18px"},"s":"p","p":"font-size","o":">=","n":18,"w":null},{"t":"code","m":{"ru":"Задан <code>line-height</code>","de":"<code>line-height</code> ist gesetzt"},"r":"line-height\\s*:","f":null},{"t":"cssnum","m":{"ru":"Ширина <code>p</code> ограничена (до 650px)","de":"Breite von <code>p</code> begrenzt (bis 650px)"},"s":"p","p":"max-width","o":"<=","n":650,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"У <code>h1</code> есть <code>letter-spacing</code>","de":"<code>h1</code> hat <code>letter-spacing</code>"},"s":"h1","p":"letter-spacing","o":">=","n":1,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"У абзаца красная строка <code>text-indent</code>","de":"Der Absatz hat Einzug <code>text-indent</code>"},"s":"p","p":"text-indent","o":">=","n":10,"w":null,"lv":2},{"t":"css","m":{"ru":"Цитата курсивом","de":"Zitat kursiv"},"s":"blockquote","p":"font-style","r":"italic","w":null,"lv":2},{"t":"cssnum","m":{"ru":"У цитаты линия слева","de":"Das Zitat hat links eine Linie"},"s":"blockquote","p":"border-left-width","o":">=","n":3,"w":null,"lv":2},{"t":"code","m":{"ru":"Есть стиль первой буквы <code>::first-letter</code>","de":"Es gibt einen Stil für den ersten Buchstaben <code>::first-letter</code>"},"r":"::?first-letter","f":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Ссылка без подчёркивания","de":"Link ohne Unterstreichung"},"s":"a","p":"text-decoration-line","r":"none","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Подчёркивание при наведении <code>a:hover</code>","de":"Unterstreichung beim Darüberfahren <code>a:hover</code>"},"r":"a:hover\\s*\\{[^}]*underline","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть капитель <code>small-caps</code>","de":"Es gibt Kapitälchen <code>small-caps</code>"},"r":"small-caps","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Georgia, serif; }\n    h1 { text-align: center; text-transform: uppercase; }\n    p { font-size: 18px; line-height: 1.6; max-width: 600px; text-indent: 20px; }\n    h1 { letter-spacing: 2px; }\n    h2 { font-variant: small-caps; }\n    blockquote { font-style: italic; border-left: 4px solid #5b48e8; padding-left: 12px; }\n    p:first-of-type::first-letter { font-size: 3em; font-weight: bold; }\n    a { text-decoration: none; }\n    a:hover { text-decoration: underline; }\n  </style>\n</head>\n<body>\n  <h1>Как читать код</h1>\n  <p>Код читают сверху вниз, как книгу. Сначала смотри на структуру: заголовки, блоки, списки. Потом на детали.</p>\n  <p>Хорошая привычка: делать маленькие изменения и сразу смотреть результат.</p>\n  <h2>Полезная ссылка</h2>\n  <blockquote>Код — это текст, который понимает компьютер.</blockquote>\n  <p>Справочник: <a href=\"https://developer.mozilla.org\">MDN</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Georgia, serif; }\n    h1 { text-align: center; text-transform: uppercase; }\n    p { font-size: 18px; line-height: 1.6; max-width: 600px; text-indent: 20px; }\n    h1 { letter-spacing: 2px; }\n    h2 { font-variant: small-caps; }\n    blockquote { font-style: italic; border-left: 4px solid #5b48e8; padding-left: 12px; }\n    p:first-of-type::first-letter { font-size: 3em; font-weight: bold; }\n    a { text-decoration: none; }\n    a:hover { text-decoration: underline; }\n  </style>\n</head>\n<body>\n  <h1>Code lesen</h1>\n  <p>Code liest man von oben nach unten, wie ein Buch. Schau zuerst auf die Struktur: Überschriften, Blöcke, Listen. Dann auf die Details.</p>\n  <p>Eine gute Gewohnheit: kleine Änderungen machen und sofort das Ergebnis ansehen.</p>\n  <h2>Nützlicher Link</h2>\n  <blockquote>Code ist Text, den der Computer versteht.</blockquote>\n  <p>Nachschlagewerk: <a href=\"https://developer.mozilla.org\">MDN</a></p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Несколько свойств для одного селектора пишут в одних скобках, каждое со своей точкой с запятой: <code>h1 { text-align: center; text-transform: uppercase; }</code>.</p>","de":"<p>Mehrere Eigenschaften für einen Selektor stehen in denselben Klammern, jede mit eigenem Semikolon: <code>h1 { text-align: center; text-transform: uppercase; }</code>.</p>"},"quiz":[{"q":{"ru":"Какое свойство меняет расстояние между строками?","de":"Welche Eigenschaft ändert den Abstand zwischen Zeilen?"},"o":[{"ru":"line-height","de":"line-height"},{"ru":"font-size","de":"font-size"},{"ru":"text-align","de":"text-align"}],"a":0}],"lv2":{"ru":"<p>Сделай текст удобным для чтения, как в хорошей статье:</p><ol><li><code>p { max-width: 600px; }</code> — слишком длинные строки читать тяжело. Ограничь ширину.</li><li><code>h1 { letter-spacing: 2px; }</code> — расстояние между буквами.</li><li><code>p { text-indent: 20px; }</code> — красная строка у абзацев.</li><li>Добавь цитату <code>&lt;blockquote&gt;</code> и стиль к ней: <code>font-style: italic;</code> и <code>border-left: 4px solid #5b48e8;</code> с отступом <code>padding-left</code>.</li></ol>","de":"<p>Mache den Text angenehm lesbar, wie in einem guten Artikel:</p><ol><li><code>p { max-width: 600px; }</code> — zu lange Zeilen lesen sich schwer. Begrenze die Breite.</li><li><code>h1 { letter-spacing: 2px; }</code> — Abstand zwischen den Buchstaben.</li><li><code>p { text-indent: 20px; }</code> — Einzug der ersten Zeile.</li><li>Füge ein Zitat <code>&lt;blockquote&gt;</code> hinzu und gib ihm Stil: <code>font-style: italic;</code> und <code>border-left: 4px solid #5b48e8;</code> mit Abstand <code>padding-left</code>.</li></ol>"},"lv3":{"ru":"<p>Вёрстка как в журнале. Попробуй три приёма, которые часто используют в блогах:</p><ol><li>Большая первая буква: <code>p:first-of-type::first-letter { font-size: 3em; font-weight: bold; }</code>.</li><li>Ссылка без подчёркивания, которая подчёркивается при наведении: <code>a { text-decoration: none; }</code> и <code>a:hover { text-decoration: underline; }</code>. Для этого добавь в текст ссылку.</li><li>Подзаголовок капителью: <code>h2 { font-variant: small-caps; }</code> (добавь <code>&lt;h2&gt;</code>).</li></ol>","de":"<p>Layout wie in einer Zeitschrift. Probiere drei Kniffe, die in Blogs oft benutzt werden:</p><ol><li>Großer erster Buchstabe: <code>p:first-of-type::first-letter { font-size: 3em; font-weight: bold; }</code>.</li><li>Ein Link ohne Unterstreichung, der beim Darüberfahren unterstrichen wird: <code>a { text-decoration: none; }</code> und <code>a:hover { text-decoration: underline; }</code>. Füge dafür dem Text einen Link hinzu.</li><li>Zwischenüberschrift in Kapitälchen: <code>h2 { font-variant: small-caps; }</code> (füge ein <code>&lt;h2&gt;</code> hinzu).</li></ol>"}},{"day":11,"week":2,"title":{"ru":"Коробочная модель: отступы и рамки","de":"Das Box-Modell: Abstände und Rahmen"},"goal":{"ru":"Понять, что каждый элемент — коробка, и управлять её отступами.","de":"Verstehen, dass jedes Element eine Box ist, und ihre Abstände steuern."},"theory":{"ru":"<p>Для браузера каждый элемент — прямоугольная коробка из четырёх слоёв (изнутри наружу):</p><ol><li><b>content</b> — содержимое (текст, картинка).</li><li><b>padding</b> — внутренний отступ между содержимым и рамкой.</li><li><b>border</b> — рамка.</li><li><b>margin</b> — внешний отступ до соседей.</li></ol><pre class=\"ex\" data-l=\"css\">.card {\n  width: 300px;\n  padding: 20px;                 /* внутри */\n  border: 2px solid #5b48e8;     /* толщина стиль цвет */\n  border-radius: 16px;           /* скруглённые углы */\n  margin: 30px auto;             /* снаружи: 30px сверху и снизу, auto = по центру */\n}</pre><p>Волшебная строка для новичков: <code>* { box-sizing: border-box; }</code>. С ней заданная ширина включает padding и рамку, считать проще.</p>","de":"<p>Für den Browser ist jedes Element eine rechteckige Box aus vier Schichten (von innen nach außen):</p><ol><li><b>content</b> — Inhalt (Text, Bild).</li><li><b>padding</b> — Innenabstand zwischen Inhalt und Rahmen.</li><li><b>border</b> — Rahmen.</li><li><b>margin</b> — Außenabstand zu den Nachbarn.</li></ol><pre class=\"ex\" data-l=\"css\">.card {\n  width: 300px;\n  padding: 20px;                 /* innen */\n  border: 2px solid #5b48e8;     /* Dicke Stil Farbe */\n  border-radius: 16px;           /* runde Ecken */\n  margin: 30px auto;             /* außen: 30px oben und unten, auto = zentriert */\n}</pre><p>Eine Zauberzeile für Anfänger: <code>* { box-sizing: border-box; }</code>. Damit enthält die angegebene Breite Padding und Rahmen, das Rechnen wird einfacher.</p>"},"task":{"ru":"<p>Оформи карточку <code>.card</code> как на примере:</p><ol><li>Ширина около 300px (не больше 400px).</li><li>Внутренний отступ <code>padding</code> от 12px.</li><li>Рамка толщиной от 1px и скруглённые углы.</li><li>По центру страницы: <code>margin: 30px auto;</code>.</li></ol>","de":"<p>Gestalte die Karte <code>.card</code> wie im Beispiel:</p><ol><li>Breite etwa 300px (höchstens 400px).</li><li>Innenabstand <code>padding</code> ab 12px.</li><li>Rahmen ab 1px Dicke und runde Ecken.</li><li>In der Seitenmitte: <code>margin: 30px auto;</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    /* Стилизуй .card ниже */\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Карточка</h2>\n    <p>Моя первая коробка с настоящими отступами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    /* Gestalte .card unten */\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Karte</h2>\n    <p>Meine erste Box mit echten Abständen.</p>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnum","m":{"ru":"Ширина <code>.card</code> не больше 400px","de":"Breite von <code>.card</code> höchstens 400px"},"s":".card","p":"width","o":"<=","n":400,"w":null},{"t":"cssnum","m":{"ru":"<code>padding</code> не меньше 12px","de":"<code>padding</code> mindestens 12px"},"s":".card","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"Есть рамка","de":"Es gibt einen Rahmen"},"s":".card","p":"border-top-width","o":">=","n":1,"w":null},{"t":"cssnum","m":{"ru":"Углы скруглены","de":"Ecken sind abgerundet"},"s":".card","p":"border-top-left-radius","o":">=","n":4,"w":null},{"t":"cssnum","m":{"ru":"Карточка по центру (<code>margin: … auto</code>)","de":"Karte ist zentriert (<code>margin: … auto</code>)"},"s":".card","p":"margin-left","o":">=","n":20,"w":null},{"t":"count","m":{"ru":"Две карточки <code>.card</code>","de":"Zwei Karten <code>.card</code>"},"s":".card","n":2,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"У <code>.card h2</code> нет верхнего отступа","de":"Bei <code>.card h2</code> gibt es keinen oberen Abstand"},"s":".card h2","p":"margin-top","o":"=","n":0,"w":null,"lv":2},{"t":"cssnum","m":{"ru":"Левая рамка толще (от 6px)","de":"Linker Rahmen dicker (ab 6px)"},"s":".card","p":"border-left-width","o":">=","n":6,"w":null,"lv":2},{"t":"has","m":{"ru":"Есть значок <code>.badge</code>","de":"Es gibt ein Abzeichen <code>.badge</code>"},"s":".badge","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"<code>.badge</code>: <code>display: inline-block</code>","de":"<code>.badge</code>: <code>display: inline-block</code>"},"s":".badge","p":"display","r":"inline-block","w":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"<code>.badge</code>: отступ по бокам от 6px","de":"<code>.badge</code>: Seitenabstand ab 6px"},"s":".badge","p":"padding-left","o":">=","n":6,"w":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"<code>.badge</code>: сильно скруглён","de":"<code>.badge</code>: stark abgerundet"},"s":".badge","p":"border-top-left-radius","o":">=","n":10,"w":null,"lv":3,"opt":true},{"t":"cssnot","m":{"ru":"<code>.badge</code>: есть фон","de":"<code>.badge</code>: hat Hintergrund"},"s":".badge","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    .card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; background: #fff; border-left: 8px solid #ee6a3c; }\n    .card h2 { margin-top: 0; }\n    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #ee6a3c; color: #fff; }\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Карточка <span class=\"badge\">NEW</span></h2>\n    <p>Моя первая коробка с настоящими отступами.</p>\n  </div>\n  <div class=\"card\">\n    <h2>Вторая карточка</h2>\n    <p>Теперь их две, и между ними виден отступ.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    .card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; background: #fff; border-left: 8px solid #ee6a3c; }\n    .card h2 { margin-top: 0; }\n    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #ee6a3c; color: #fff; }\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Karte <span class=\"badge\">NEU</span></h2>\n    <p>Meine erste Box mit echten Abständen.</p>\n  </div>\n  <div class=\"card\">\n    <h2>Zweite Karte</h2>\n    <p>Jetzt sind es zwei, und zwischen ihnen sieht man den Abstand.</p>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Всё в одном правиле: <code>.card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; }</code>. Попробуй менять числа и смотри, что меняется.</p>","de":"<p>Alles in einer Regel: <code>.card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; }</code>. Probiere, die Zahlen zu ändern, und schau, was sich ändert.</p>"},"quiz":[{"q":{"ru":"Какой слой находится между содержимым и рамкой?","de":"Welche Schicht liegt zwischen Inhalt und Rahmen?"},"o":[{"ru":"padding","de":"padding"},{"ru":"margin","de":"margin"},{"ru":"outline","de":"outline"}],"a":0},{"q":{"ru":"Что делает <code>margin: 0 auto;</code> у блока с заданной шириной?","de":"Was macht <code>margin: 0 auto;</code> bei einem Block mit fester Breite?"},"o":[{"ru":"Центрирует его по горизонтали","de":"Zentriert ihn horizontal"},{"ru":"Прячет его","de":"Versteckt ihn"},{"ru":"Делает рамку","de":"Macht einen Rahmen"}],"a":0}],"lv2":{"ru":"<p>Одна карточка — это мало. Добавь вторую и поиграй с отступами:</p><ol><li>Скопируй весь блок <code>&lt;div class=\"card\"&gt;…&lt;/div&gt;</code> и вставь под первым. Поменяй текст.</li><li>У заголовка внутри карточки убери верхний отступ: <code>.card h2 { margin-top: 0; }</code>. Сравни: отступ «снаружи» — <code>margin</code>, «внутри» — <code>padding</code>.</li><li>Сделай левую рамку толще остальных: <code>border-left: 8px solid #ee6a3c;</code>.</li></ol>","de":"<p>Eine Karte ist zu wenig. Füge eine zweite hinzu und spiele mit den Abständen:</p><ol><li>Kopiere den ganzen Block <code>&lt;div class=\"card\"&gt;…&lt;/div&gt;</code> und füge ihn unter dem ersten ein. Ändere den Text.</li><li>Entferne beim Titel in der Karte den oberen Abstand: <code>.card h2 { margin-top: 0; }</code>. Vergleiche: Abstand „außen“ ist <code>margin</code>, „innen“ <code>padding</code>.</li><li>Mache den linken Rahmen dicker als die anderen: <code>border-left: 8px solid #ee6a3c;</code>.</li></ol>"},"lv3":{"ru":"<p>Научись мерить коробки и делать значки:</p><ol><li>Внутри первой карточки добавь <code>&lt;span class=\"badge\"&gt;NEW&lt;/span&gt;</code>.</li><li>Стиль значка: <code>display: inline-block; padding: 2px 10px; border-radius: 999px; background: #ee6a3c; color: #fff;</code>.</li><li><b>Эксперимент.</b> Временно удали строку <code>* { box-sizing: border-box; }</code> и посмотри, как изменилась ширина карточки: теперь рамка и отступ прибавляются к ширине. Верни строку обратно и запомни: так считать проще.</li></ol><p>Откроешь DevTools на 15-м дне — там коробочная модель нарисована как цветная схема.</p>","de":"<p>Lerne, Kästen zu messen und Abzeichen zu bauen:</p><ol><li>Füge in der ersten Karte <code>&lt;span class=\"badge\"&gt;NEU&lt;/span&gt;</code> ein.</li><li>Stil des Abzeichens: <code>display: inline-block; padding: 2px 10px; border-radius: 999px; background: #ee6a3c; color: #fff;</code>.</li><li><b>Experiment.</b> Lösche vorübergehend die Zeile <code>* { box-sizing: border-box; }</code> und sieh, wie sich die Breite der Karte ändert: Rahmen und Abstand kommen jetzt zur Breite dazu. Setze die Zeile wieder ein und merke dir: So lässt sich leichter rechnen.</li></ol><p>Wenn du an Tag 15 die DevTools öffnest, ist das Box-Modell dort als farbiges Schema gezeichnet.</p>"}},{"day":12,"week":2,"title":{"ru":"Цвета и фон","de":"Farben und Hintergrund"},"goal":{"ru":"Задавать цвета тремя способами и делать градиентный фон.","de":"Farben auf drei Arten angeben und einen Farbverlauf als Hintergrund machen."},"theory":{"ru":"<p>В CSS цвет можно записать по-разному:</p><pre class=\"ex\" data-l=\"css\">color: tomato;                 /* имя цвета */\ncolor: #1a8fe0;                /* hex: #RRGGBB (красный, зелёный, синий) */\ncolor: rgb(15, 157, 138);      /* rgb: три числа 0–255 */\nbackground: linear-gradient(90deg, #ffe29f, #ffa99f);  /* градиент */</pre><ul><li>Hex и rgb — одно и то же, записанное по-разному. В hex первые две цифры — красный, следующие две — зелёный, последние две — синий.</li><li><b>Контраст:</b> текст должен хорошо читаться на фоне. Светло-серый на белом — плохая идея, особенно для людей с плохим зрением.</li></ul>","de":"<p>In CSS kann man eine Farbe auf verschiedene Weise schreiben:</p><pre class=\"ex\" data-l=\"css\">color: tomato;                 /* Farbname */\ncolor: #1a8fe0;                /* Hex: #RRGGBB (Rot, Grün, Blau) */\ncolor: rgb(15, 157, 138);      /* rgb: drei Zahlen 0–255 */\nbackground: linear-gradient(90deg, #ffe29f, #ffa99f);  /* Farbverlauf */</pre><ul><li>Hex und rgb sind dasselbe, anders geschrieben. Bei Hex sind die ersten zwei Ziffern Rot, die nächsten zwei Grün, die letzten zwei Blau.</li><li><b>Kontrast:</b> Text muss auf dem Hintergrund gut lesbar sein. Hellgrau auf Weiß ist eine schlechte Idee, besonders für Menschen mit schwacher Sehkraft.</li></ul>"},"task":{"ru":"<ol><li>Дай блоку <code>#a</code> цвет фона по имени (например, <code>tomato</code>).</li><li>Блоку <code>#b</code> — hex-цвет (<code>#1a8fe0</code>).</li><li>Блоку <code>#c</code> — через <code>rgb(…)</code>.</li><li>Задай фон страницы <code>linear-gradient</code>.</li></ol>","de":"<ol><li>Gib dem Block <code>#a</code> eine Hintergrundfarbe per Name (z. B. <code>tomato</code>).</li><li>Dem Block <code>#b</code> eine Hex-Farbe (<code>#1a8fe0</code>).</li><li>Dem Block <code>#c</code> eine Farbe mit <code>rgb(…)</code>.</li><li>Setze den Seitenhintergrund mit <code>linear-gradient</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { padding: 20px; }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    /* Покрась блоки #a, #b, #c и фон страницы */\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { padding: 20px; }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    /* Färbe die Blöcke #a, #b, #c und den Seitenhintergrund */\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"У <code>#a</code> есть цвет","de":"<code>#a</code> hat eine Farbe"},"s":"#a","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"<code>#b</code> задан через hex","de":"<code>#b</code> ist per Hex gesetzt"},"r":"#b\\s*\\{[^}]*#[0-9a-f]{3,8}","f":null},{"t":"code","m":{"ru":"<code>#c</code> задан через <code>rgb()</code>","de":"<code>#c</code> ist per <code>rgb()</code> gesetzt"},"r":"#c\\s*\\{[^}]*rgb\\(","f":null},{"t":"code","m":{"ru":"Есть <code>linear-gradient</code>","de":"Es gibt <code>linear-gradient</code>"},"r":"linear-gradient\\(","f":null},{"t":"count","m":{"ru":"Пять блоков <code>.swatch</code>","de":"Fünf Blöcke <code>.swatch</code>"},"s":".swatch","n":5,"w":null,"lv":2},{"t":"code","m":{"ru":"<code>#d</code> задан через <code>hsl()</code>","de":"<code>#d</code> ist mit <code>hsl()</code> gesetzt"},"r":"#d\\s*\\{[^}]*hsl\\(","f":null,"lv":2},{"t":"code","m":{"ru":"<code>#e</code> задан через <code>rgba()</code>","de":"<code>#e</code> ist mit <code>rgba()</code> gesetzt"},"r":"#e\\s*\\{[^}]*rgba\\(","f":null,"lv":2},{"t":"text","m":{"ru":"В блоках есть подписи","de":"Die Blöcke haben Beschriftungen"},"s":".swatch","r":"\\S","w":null,"lv":3,"opt":true},{"t":"cssnum","m":{"ru":"Текст жирный","de":"Text ist fett"},"s":".swatch","p":"font-weight","o":">=","n":600,"w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть <code>radial-gradient</code>","de":"Es gibt <code>radial-gradient</code>"},"r":"radial-gradient\\(","f":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть пунктирная рамка <code>dashed</code>","de":"Es gibt einen gestrichelten Rahmen <code>dashed</code>"},"r":"dashed","f":null,"lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { padding: 20px; background: linear-gradient(90deg, #ffe29f, #ffa99f); }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    #a { background-color: tomato; }\n    #b { background-color: #1a8fe0; }\n    #c { background-color: rgb(15, 157, 138); }\n    #d { background-color: hsl(280, 70%, 55%); }\n    #e { background-color: rgba(21, 23, 46, 0.5); border: 3px dashed #15172e; }\n    .swatch { color: white; font-weight: 700; text-align: center; line-height: 60px; }\n    #b { background-image: radial-gradient(circle, #5fb7f0, #1a8fe0); }\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\">Томатный</div>\n  <div class=\"swatch\" id=\"b\">Голубой</div>\n  <div class=\"swatch\" id=\"c\">Бирюзовый</div>\n  <div class=\"swatch\" id=\"d\">Фиолетовый</div>\n  <div class=\"swatch\" id=\"e\">Полупрозрачный</div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { padding: 20px; background: linear-gradient(90deg, #ffe29f, #ffa99f); }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    #a { background-color: tomato; }\n    #b { background-color: #1a8fe0; }\n    #c { background-color: rgb(15, 157, 138); }\n    #d { background-color: hsl(280, 70%, 55%); }\n    #e { background-color: rgba(21, 23, 46, 0.5); border: 3px dashed #15172e; }\n    .swatch { color: white; font-weight: 700; text-align: center; line-height: 60px; }\n    #b { background-image: radial-gradient(circle, #5fb7f0, #1a8fe0); }\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\">Tomatenrot</div>\n  <div class=\"swatch\" id=\"b\">Hellblau</div>\n  <div class=\"swatch\" id=\"c\">Türkis</div>\n  <div class=\"swatch\" id=\"d\">Violett</div>\n  <div class=\"swatch\" id=\"e\">Halbtransparent</div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Одно правило для каждого блока: <code>#b { background-color: #1a8fe0; }</code>. Для градиента: <code>body { background: linear-gradient(90deg, #ffe29f, #ffa99f); }</code>.</p>","de":"<p>Eine Regel pro Block: <code>#b { background-color: #1a8fe0; }</code>. Für den Verlauf: <code>body { background: linear-gradient(90deg, #ffe29f, #ffa99f); }</code>.</p>"},"quiz":[{"q":{"ru":"Какой текст читается лучше?","de":"Welcher Text ist besser lesbar?"},"o":[{"ru":"Светло-серый на белом","de":"Hellgrau auf Weiß"},{"ru":"Тёмно-синий на светло-жёлтом","de":"Dunkelblau auf Hellgelb"},{"ru":"Жёлтый на белом","de":"Gelb auf Weiß"}],"a":1},{"q":{"ru":"Что обозначает <code>#ff0000</code>?","de":"Was bedeutet <code>#ff0000</code>?"},"o":[{"ru":"Красный","de":"Rot"},{"ru":"Зелёный","de":"Grün"},{"ru":"Синий","de":"Blau"}],"a":0}],"lv2":{"ru":"<p>Добавь два блока с новыми способами записи цвета:</p><ol><li>Ещё два блока: <code>&lt;div class=\"swatch\" id=\"d\"&gt;&lt;/div&gt;</code> и <code>&lt;div class=\"swatch\" id=\"e\"&gt;&lt;/div&gt;</code>.</li><li><code>#d</code> покрась через <code>hsl()</code>: <code>background-color: hsl(280, 70%, 55%);</code>. Три числа: оттенок (0–360), насыщенность и яркость. Крути первое число — получишь все цвета радуги.</li><li><code>#e</code> сделай полупрозрачным через <code>rgba(…, 0.5)</code>: четвёртое число — прозрачность от 0 до 1. Через такой блок будет виден фон страницы.</li></ol>","de":"<p>Füge zwei Blöcke mit neuen Schreibweisen für Farben hinzu:</p><ol><li>Zwei weitere Blöcke: <code>&lt;div class=\"swatch\" id=\"d\"&gt;&lt;/div&gt;</code> und <code>&lt;div class=\"swatch\" id=\"e\"&gt;&lt;/div&gt;</code>.</li><li>Färbe <code>#d</code> mit <code>hsl()</code>: <code>background-color: hsl(280, 70%, 55%);</code>. Drei Zahlen: Farbton (0–360), Sättigung und Helligkeit. Drehe an der ersten Zahl — du bekommst alle Regenbogenfarben.</li><li>Mache <code>#e</code> mit <code>rgba(…, 0.5)</code> halbtransparent: Die vierte Zahl ist die Durchsichtigkeit von 0 bis 1. Durch so einen Block sieht man den Seitenhintergrund.</li></ol>"},"lv3":{"ru":"<p>Палитра с подписями и контрастом. Хороший сайт читается, поэтому текст не должен сливаться с фоном.</p><ol><li>Впиши в каждый блок название цвета: <code>&lt;div class=\"swatch\" id=\"a\"&gt;Томатный&lt;/div&gt;</code>.</li><li>Сделай текст блоков белым (<code>color: white</code>) и жирным, поставь его по центру высоты через <code>line-height: 60px</code> и по центру ширины через <code>text-align: center</code>.</li><li>Одному блоку задай фон через <code>radial-gradient(circle, … , …)</code>, а другому — пунктирную рамку <code>border: 3px dashed #15172e;</code>.</li></ol><p>Проверь контраст: на жёлтом фоне белый текст плохо виден, на тёмном — хорошо. Если не уверен, сделай текст тёмным.</p>","de":"<p>Palette mit Beschriftung und Kontrast. Eine gute Website ist lesbar, deshalb darf der Text nicht mit dem Hintergrund verschmelzen.</p><ol><li>Schreibe in jeden Block den Farbnamen: <code>&lt;div class=\"swatch\" id=\"a\"&gt;Tomatenrot&lt;/div&gt;</code>.</li><li>Mache den Text der Blöcke weiß (<code>color: white</code>) und fett, zentriere ihn in der Höhe mit <code>line-height: 60px</code> und in der Breite mit <code>text-align: center</code>.</li><li>Gib einem Block einen Hintergrund mit <code>radial-gradient(circle, … , …)</code> und einem anderen einen gestrichelten Rahmen <code>border: 3px dashed #15172e;</code>.</li></ol><p>Prüfe den Kontrast: Auf gelbem Hintergrund ist weißer Text schlecht zu sehen, auf dunklem gut. Wenn du unsicher bist, nimm dunklen Text.</p>"}},{"day":13,"week":2,"title":{"ru":"Отдельный файл style.css","de":"Eine eigene Datei style.css"},"goal":{"ru":"Вынести стили в отдельный файл и подключить его.","de":"Die Stile in eine eigene Datei auslagern und einbinden."},"theory":{"ru":"<p>Когда стилей много, их выносят в файл <code>style.css</code>. Один такой файл можно подключить ко всем страницам сайта: поменял цвет в одном месте, и он поменялся везде.</p><pre class=\"ex\" data-l=\"html\">&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Моя страница&lt;/title&gt;\n  &lt;link rel=\"stylesheet\" href=\"style.css\"&gt;\n&lt;/head&gt;</pre><ul><li><code>&lt;link&gt;</code> стоит в <code>&lt;head&gt;</code>, он «пустой» (без закрывающего тега).</li><li><code>rel=\"stylesheet\"</code> — это таблица стилей. <code>href</code> — путь к файлу.</li><li>В CSS-файле нет тегов HTML, только правила и комментарии <code>/* … */</code>.</li></ul><p>Теперь в редакторе две вкладки: <code>index.html</code> и <code>style.css</code>. Переключайся между ними.</p>","de":"<p>Wenn es viele Stile gibt, lagert man sie in die Datei <code>style.css</code> aus. Eine solche Datei kann man in alle Seiten einer Website einbinden: Farbe an einer Stelle geändert, und sie ändert sich überall.</p><pre class=\"ex\" data-l=\"html\">&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Meine Seite&lt;/title&gt;\n  &lt;link rel=\"stylesheet\" href=\"style.css\"&gt;\n&lt;/head&gt;</pre><ul><li><code>&lt;link&gt;</code> steht in <code>&lt;head&gt;</code>, es ist „leer“ (ohne schließendes Tag).</li><li><code>rel=\"stylesheet\"</code> bedeutet Stylesheet. <code>href</code> ist der Pfad zur Datei.</li><li>In der CSS-Datei gibt es keine HTML-Tags, nur Regeln und Kommentare <code>/* … */</code>.</li></ul><p>Jetzt gibt es im Editor zwei Tabs: <code>index.html</code> und <code>style.css</code>. Wechsle zwischen ihnen.</p>"},"task":{"ru":"<ol><li>В <code>index.html</code> подключи <code>style.css</code> тегом <code>&lt;link&gt;</code> в <code>&lt;head&gt;</code>. Сразу изменится вид страницы.</li><li>В <code>style.css</code> добавь правило для ссылок <code>a</code> с цветом, отличным от стандартного синего.</li><li>Добавь в <code>style.css</code> комментарий <code>/* … */</code> над одним из правил.</li></ol>","de":"<ol><li>Binde in <code>index.html</code> die Datei <code>style.css</code> mit <code>&lt;link&gt;</code> in <code>&lt;head&gt;</code> ein. Das Aussehen der Seite ändert sich sofort.</li><li>Füge in <code>style.css</code> eine Regel für Links <code>a</code> mit einer anderen Farbe als dem Standardblau hinzu.</li><li>Füge in <code>style.css</code> über einer Regel einen Kommentar <code>/* … */</code> hinzu.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Моя страница</title>\n  <!-- подключи style.css здесь -->\n</head>\n<body>\n  <h1>Файл со стилями</h1>\n  <p>Теперь стили живут отдельно.</p>\n  <p><a href=\"https://wikipedia.org\">Читать больше</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Meine Seite</title>\n  <!-- binde style.css hier ein -->\n</head>\n<body>\n  <h1>Datei mit Stilen</h1>\n  <p>Jetzt wohnen die Stile getrennt.</p>\n  <p><a href=\"https://wikipedia.org\">Mehr lesen</a></p>\n</body>\n</html>\n"},"style.css":"body {\n  font-family: Arial, sans-serif;\n  background-color: #fff8e6;\n  padding: 20px;\n}\n\nh1 {\n  color: #5b48e8;\n}\n"},"checks":[{"t":"code","m":{"ru":"В <code>index.html</code> подключён <code>style.css</code>","de":"In <code>index.html</code> ist <code>style.css</code> eingebunden"},"r":"<link[^>]+rel=[\"\\']stylesheet[\"\\'][^>]+href=[\"\\']style\\.css[\"\\']|<link[^>]+href=[\"\\']style\\.css[\"\\'][^>]+rel=[\"\\']stylesheet[\"\\']","f":"index.html"},{"t":"cssnot","m":{"ru":"Стили из файла работают (заголовок цветной)","de":"Die Stile aus der Datei wirken (Überschrift ist farbig)"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"Ссылки <code>a</code> имеют свой цвет","de":"Links <code>a</code> haben eine eigene Farbe"},"s":"a","p":"color","r":"^rgb\\(0, 0, 238\\)$","w":null},{"t":"code","m":{"ru":"В <code>style.css</code> есть комментарий","de":"In <code>style.css</code> gibt es einen Kommentar"},"r":"/\\*[\\s\\S]*?\\*/","f":"style.css"},{"t":"has","m":{"ru":"Есть абзац с классом <code>note</code>","de":"Es gibt einen Absatz mit der Klasse <code>note</code>"},"s":"p.note","w":null,"lv":2},{"t":"code","m":{"ru":"В <code>style.css</code> есть правило <code>.note</code>","de":"In <code>style.css</code> gibt es die Regel <code>.note</code>"},"r":"\\.note\\s*\\{","f":"style.css","lv":2},{"t":"cssnot","m":{"ru":"У <code>.note</code> есть фон","de":"<code>.note</code> hat einen Hintergrund"},"s":".note","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":2},{"t":"code","m":{"ru":"В <code>style.css</code> есть <code>a:hover</code>","de":"In <code>style.css</code> gibt es <code>a:hover</code>"},"r":"a:hover","f":"style.css","lv":2},{"t":"count","m":{"ru":"Меню из трёх ссылок","de":"Menü aus drei Links"},"s":"ul.menu li a","n":3,"w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Подвал по центру","de":"Fußzeile zentriert"},"s":"footer","p":"text-align","r":"center","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Пункты меню в ряд","de":"Menüpunkte in einer Reihe"},"s":".menu li","p":"display","r":"inline-block","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"В <code>style.css</code> минимум 4 комментария","de":"In <code>style.css</code> mindestens 4 Kommentare"},"r":"(/\\*[\\s\\S]*?\\*/[\\s\\S]*){4}","f":"style.css","lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Моя страница</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Файл со стилями</h1>\n  <p>Теперь стили живут отдельно.</p>\n  <p><a href=\"https://wikipedia.org\">Читать больше</a></p>\n  <p class=\"note\">Заметка: теперь все стили лежат в файле <code>style.css</code>.</p>\n  <ul class=\"menu\">\n    <li><a href=\"#\">Главная</a></li>\n    <li><a href=\"#\">Блог</a></li>\n    <li><a href=\"#\">Контакты</a></li>\n  </ul>\n  <footer>© 2025 Моя страница</footer>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Meine Seite</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Datei mit Stilen</h1>\n  <p>Jetzt wohnen die Stile getrennt.</p>\n  <p><a href=\"https://wikipedia.org\">Mehr lesen</a></p>\n  <p class=\"note\">Notiz: Jetzt liegen alle Stile in der Datei <code>style.css</code>.</p>\n  <ul class=\"menu\">\n    <li><a href=\"#\">Start</a></li>\n    <li><a href=\"#\">Blog</a></li>\n    <li><a href=\"#\">Kontakt</a></li>\n  </ul>\n  <footer>© 2025 Meine Seite</footer>\n</body>\n</html>\n"},"style.css":"body {\n  font-family: Arial, sans-serif;\n  background-color: #fff8e6;\n  padding: 20px;\n}\n\nh1 {\n  color: #5b48e8;\n}\n\n/* цвет ссылок / Linkfarbe */\na {\n  color: #ee6a3c;\n}\n\n/* ===== Заметки / Notizen ===== */\n.note {\n  background: #fff0c2;\n  padding: 12px;\n  border-left: 5px solid #ee6a3c;\n}\na:hover {\n  text-decoration: underline;\n}\n\n/* ===== Меню / Menü ===== */\n.menu {\n  list-style: none;\n  padding: 0;\n}\n.menu li {\n  display: inline-block;\n  margin-right: 12px;\n}\n\n/* ===== Подвал / Fußzeile ===== */\nfooter {\n  text-align: center;\n  color: #777;\n}\n"},"hint":{"ru":"<p>Строка подключения: <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Она должна быть между <code>&lt;head&gt;</code> и <code>&lt;/head&gt;</code>. Комментарий в CSS: <code>/* текст */</code>.</p>","de":"<p>Die Einbindungszeile: <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Sie muss zwischen <code>&lt;head&gt;</code> und <code>&lt;/head&gt;</code> stehen. Kommentar in CSS: <code>/* Text */</code>.</p>"},"quiz":[{"q":{"ru":"Где в HTML подключают файл стилей?","de":"Wo bindet man in HTML die Stildatei ein?"},"o":[{"ru":"В &lt;head&gt; тегом &lt;link&gt;","de":"In &lt;head&gt; mit dem Tag &lt;link&gt;"},{"ru":"В &lt;body&gt; тегом &lt;style&gt;","de":"In &lt;body&gt; mit dem Tag &lt;style&gt;"},{"ru":"В имени файла","de":"Im Dateinamen"}],"a":0}],"lv2":{"ru":"<p>Работай в двух файлах сразу (переключай вкладки над редактором):</p><ol><li>В <code>index.html</code> добавь абзац <code>&lt;p class=\"note\"&gt;Заметка…&lt;/p&gt;</code>.</li><li>В <code>style.css</code> оформи его: <code>.note { background: #fff0c2; padding: 12px; border-left: 5px solid #ee6a3c; }</code>.</li><li>Добавь в <code>style.css</code> правило для наведения на ссылку: <code>a:hover { text-decoration: underline; }</code>.</li></ol><p>Заметил? HTML менять не пришлось, чтобы изменить внешний вид. В этом и смысл отдельного файла.</p>","de":"<p>Arbeite in zwei Dateien gleichzeitig (wechsle die Tabs über dem Editor):</p><ol><li>Füge in <code>index.html</code> einen Absatz <code>&lt;p class=\"note\"&gt;Notiz…&lt;/p&gt;</code> hinzu.</li><li>Gestalte ihn in <code>style.css</code>: <code>.note { background: #fff0c2; padding: 12px; border-left: 5px solid #ee6a3c; }</code>.</li><li>Füge in <code>style.css</code> eine Regel für das Darüberfahren über Links hinzu: <code>a:hover { text-decoration: underline; }</code>.</li></ol><p>Gemerkt? Das HTML musste nicht geändert werden, um das Aussehen zu ändern. Genau das ist der Sinn einer eigenen Datei.</p>"},"lv3":{"ru":"<p>Наведи порядок, как делают профессионалы:</p><ol><li>Добавь в <code>index.html</code> меню <code>&lt;ul class=\"menu\"&gt;</code> из трёх ссылок и подвал <code>&lt;footer&gt;© 2025&lt;/footer&gt;</code>.</li><li>В <code>style.css</code> убери маркеры у меню (<code>list-style: none; padding: 0;</code>), а пункты поставь в ряд: <code>.menu li { display: inline-block; margin-right: 12px; }</code>.</li><li>Подвал по центру серым цветом.</li><li>Раздели файл CSS комментариями-заголовками: <code>/* ===== Меню ===== */</code>. Всего в файле минимум 4 комментария. Через месяц ты скажешь себе спасибо.</li></ol>","de":"<p>Schaffe Ordnung wie die Profis:</p><ol><li>Füge in <code>index.html</code> ein Menü <code>&lt;ul class=\"menu\"&gt;</code> aus drei Links und eine Fußzeile <code>&lt;footer&gt;© 2025&lt;/footer&gt;</code> hinzu.</li><li>Entferne in <code>style.css</code> die Aufzählungszeichen beim Menü (<code>list-style: none; padding: 0;</code>) und stelle die Punkte in eine Reihe: <code>.menu li { display: inline-block; margin-right: 12px; }</code>.</li><li>Die Fußzeile zentriert in grauer Farbe.</li><li>Teile die CSS-Datei mit Kommentar-Überschriften: <code>/* ===== Menü ===== */</code>. Insgesamt mindestens 4 Kommentare in der Datei. In einem Monat wirst du dir dafür danken.</li></ol>"}},{"day":14,"week":2,"title":{"ru":"Проект недели: оформляем визитку","de":"Wochenprojekt: die Visitenkarte gestalten"},"goal":{"ru":"Применить всё из недели CSS на готовой странице.","de":"Alles aus der CSS-Woche auf einer fertigen Seite anwenden."},"theory":{"ru":"<p>HTML уже написан, он перед тобой. Твоя задача — открыть <code>style.css</code> и оформить страницу. Сначала <b>прочитай</b> HTML: найди классы (<code>card</code>, <code>photo</code>, <code>lead</code>, <code>hobbies</code>, <code>link</code>). По ним ты будешь выбирать элементы.</p><p>Совет: делай по одному правилу, смотри результат справа, потом следующее.</p>","de":"<p>Das HTML ist schon geschrieben, es liegt vor dir. Deine Aufgabe ist, <code>style.css</code> zu öffnen und die Seite zu gestalten. <b>Lies</b> zuerst das HTML: Finde die Klassen (<code>card</code>, <code>photo</code>, <code>lead</code>, <code>hobbies</code>, <code>link</code>). Mit ihnen wählst du die Elemente aus.</p><p>Tipp: Mache eine Regel nach der anderen, schau dir das Ergebnis rechts an, dann die nächste.</p>"},"task":{"ru":"<p>Открой вкладку <code>style.css</code> и сделай:</p><ol><li><code>body</code>: шрифт без засечек и цветной фон или градиент.</li><li><code>.card</code>: ширина до 420px, по центру, <code>padding</code> от 20px, скруглённые углы, белый фон и тень <code>box-shadow</code>.</li><li><code>.photo</code>: круглая (<code>border-radius: 50%</code>), ширина около 120px, по центру (<code>display: block; margin: 0 auto;</code>).</li><li><code>h1</code> по центру и цветной.</li><li><code>.hobbies</code>: убери маркеры (<code>list-style: none;</code>).</li><li><code>.link</code>: как кнопка: цвет, padding, скруглённые углы, без подчёркивания.</li></ol>","de":"<p>Öffne den Tab <code>style.css</code> und mache:</p><ol><li><code>body</code>: Schrift ohne Serifen und farbiger Hintergrund oder Verlauf.</li><li><code>.card</code>: Breite bis 420px, zentriert, <code>padding</code> ab 20px, runde Ecken, weißer Hintergrund und Schatten <code>box-shadow</code>.</li><li><code>.photo</code>: rund (<code>border-radius: 50%</code>), Breite etwa 120px, zentriert (<code>display: block; margin: 0 auto;</code>).</li><li><code>h1</code> zentriert und farbig.</li><li><code>.hobbies</code>: Aufzählungspunkte entfernen (<code>list-style: none;</code>).</li><li><code>.link</code>: wie ein Knopf: Farbe, Padding, runde Ecken, ohne Unterstreichung.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Визитка</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Рыжий кот\">\n    <h1>Привет, я кот Мурзик</h1>\n    <p class=\"lead\">Обожаю спать и мечтаю о рыбе.</p>\n    <ul class=\"hobbies\">\n      <li>Сон</li>\n      <li>Рыба</li>\n      <li>Солнечные ванны</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Мой блог</a>\n  </main>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Visitenkarte</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Rote Katze\">\n    <h1>Hallo, ich bin Kater Murzik</h1>\n    <p class=\"lead\">Ich liebe Schlafen und träume von Fisch.</p>\n    <ul class=\"hobbies\">\n      <li>Schlafen</li>\n      <li>Fisch</li>\n      <li>Sonnenbaden</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Mein Blog</a>\n  </main>\n</body>\n</html>\n"},"style.css":"/* Оформи страницу здесь / Gestalte die Seite hier */\n"},"checks":[{"t":"code","m":{"ru":"Задан фон страницы","de":"Der Seitenhintergrund ist gesetzt"},"r":"background(-color)?\\s*:","f":"style.css"},{"t":"css","m":{"ru":"<code>body</code>: шрифт без засечек","de":"<code>body</code>: Schrift ohne Serifen"},"s":"body","p":"font-family","r":"(arial|helvetica|verdana|tahoma|sans|trebuchet|segoe|system)","w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> не шире 420px","de":"<code>.card</code> höchstens 420px breit"},"s":".card","p":"width","o":"<=","n":420,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> по центру","de":"<code>.card</code> zentriert"},"s":".card","p":"margin-left","o":">=","n":20,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code>: padding от 20px","de":"<code>.card</code>: padding ab 20px"},"s":".card","p":"padding-top","o":">=","n":20,"w":null},{"t":"cssnum","m":{"ru":"<code>.card</code> со скруглёнными углами","de":"<code>.card</code> mit runden Ecken"},"s":".card","p":"border-top-left-radius","o":">=","n":8,"w":null},{"t":"cssnot","m":{"ru":"<code>.card</code> с тенью","de":"<code>.card</code> mit Schatten"},"s":".card","p":"box-shadow","r":"^none$","w":null},{"t":"cssnum","m":{"ru":"<code>.photo</code> круглая","de":"<code>.photo</code> ist rund"},"s":".photo","p":"border-top-left-radius","o":">=","n":50,"w":null},{"t":"css","m":{"ru":"<code>h1</code> по центру","de":"<code>h1</code> zentriert"},"s":"h1","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"У списка нет маркеров","de":"Die Liste hat keine Punkte"},"s":".hobbies","p":"list-style-type","r":"^none$","w":null},{"t":"cssnot","m":{"ru":"<code>.link</code> без подчёркивания","de":"<code>.link</code> ohne Unterstreichung"},"s":".link","p":"text-decoration-line","r":"^underline$","w":null},{"t":"css","m":{"ru":"Увлечения в ряд (<code>inline-block</code>)","de":"Interessen in einer Reihe (<code>inline-block</code>)"},"s":".hobbies li","p":"display","r":"inline-block","w":null,"lv":2},{"t":"cssnot","m":{"ru":"У увлечений есть фон","de":"Die Interessen haben Hintergrund"},"s":".hobbies li","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":2},{"t":"code","m":{"ru":"Есть <code>.link:hover</code>","de":"Es gibt <code>.link:hover</code>"},"r":"\\.link:hover\\s*\\{","f":"style.css","lv":2},{"t":"code","m":{"ru":"Есть <code>transition</code>","de":"Es gibt <code>transition</code>"},"r":"transition","f":"style.css","lv":2},{"t":"css","m":{"ru":"<code>.lead</code> курсивом","de":"<code>.lead</code> kursiv"},"s":".lead","p":"font-style","r":"italic","w":null,"lv":2},{"t":"count","m":{"ru":"Две карточки <code>.card</code>","de":"Zwei Karten <code>.card</code>"},"s":".card","n":2,"w":null,"lv":3,"opt":true},{"t":"has","m":{"ru":"Есть карточка с классами <code>card dark</code>","de":"Es gibt eine Karte mit den Klassen <code>card dark</code>"},"s":".card.dark","w":null,"lv":3,"opt":true},{"t":"cssnot","m":{"ru":"У тёмной карточки есть фон","de":"Die dunkle Karte hat Hintergrund"},"s":".card.dark","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null,"lv":3,"opt":true},{"t":"css","m":{"ru":"Текст в тёмной карточке белый","de":"Text in der dunklen Karte ist weiß"},"s":".card.dark","p":"color","r":"^rgb\\(255, 255, 255\\)$","w":null,"lv":3,"opt":true},{"t":"code","m":{"ru":"Есть правило <code>.dark h1</code>","de":"Es gibt die Regel <code>.dark h1</code>"},"r":"\\.dark\\s+h1\\s*\\{","f":"style.css","lv":3,"opt":true}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Визитка</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Рыжий кот\">\n    <h1>Привет, я кот Мурзик</h1>\n    <p class=\"lead\">Обожаю спать и мечтаю о рыбе.</p>\n    <ul class=\"hobbies\">\n      <li>Сон</li>\n      <li>Рыба</li>\n      <li>Солнечные ванны</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Мой блог</a>\n  </main>\n  <section class=\"card dark\">\n    <h1>Ночная версия</h1>\n    <p>Тот же стиль, другие цвета.</p>\n  </section>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Visitenkarte</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <main class=\"card\">\n    <img class=\"photo\" src=\"cat.svg\" alt=\"Rote Katze\">\n    <h1>Hallo, ich bin Kater Murzik</h1>\n    <p class=\"lead\">Ich liebe Schlafen und träume von Fisch.</p>\n    <ul class=\"hobbies\">\n      <li>Schlafen</li>\n      <li>Fisch</li>\n      <li>Sonnenbaden</li>\n    </ul>\n    <a class=\"link\" href=\"#\">Mein Blog</a>\n  </main>\n  <section class=\"card dark\">\n    <h1>Nachtversion</h1>\n    <p>Derselbe Stil, andere Farben.</p>\n  </section>\n</body>\n</html>\n"},"style.css":"* { box-sizing: border-box; }\nbody { font-family: Arial, sans-serif; background: linear-gradient(135deg, #cfeaff, #fde8ff); margin: 0; padding: 20px; }\n.card { width: 340px; margin: 30px auto; padding: 24px; background: #fff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }\n.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto 12px; }\nh1 { text-align: center; color: #5b48e8; }\n.lead { text-align: center; color: #555; }\n.hobbies { list-style: none; padding: 0; }\n.link { display: inline-block; padding: 8px 16px; background: #5b48e8; color: #fff; border-radius: 999px; text-decoration: none; }\n.hobbies li { display: inline-block; background: #ecebff; padding: 4px 12px; border-radius: 999px; margin: 0 6px 6px 0; }\n.link { transition: background 0.3s; }\n.link:hover { background: #3e2fc4; }\n.lead { font-style: italic; }\n.photo { border: 4px solid #fff; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }\n.dark { background: #15172e; color: #fff; }\n.dark h1 { color: #ffd166; }\n"},"hint":{"ru":"<p>Пример для круглой картинки: <code>.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto; }</code>. Тень: <code>box-shadow: 0 8px 24px rgba(0,0,0,.15);</code>.</p>","de":"<p>Beispiel für ein rundes Bild: <code>.photo { display: block; width: 120px; border-radius: 50%; margin: 0 auto; }</code>. Schatten: <code>box-shadow: 0 8px 24px rgba(0,0,0,.15);</code>.</p>"},"quiz":[{"q":{"ru":"Какое свойство делает картинку круглой?","de":"Welche Eigenschaft macht ein Bild rund?"},"o":[{"ru":"border-radius: 50%","de":"border-radius: 50%"},{"ru":"margin: 50%","de":"margin: 50%"},{"ru":"round: yes","de":"round: yes"}],"a":0},{"q":{"ru":"Что нужно сделать, чтобы CSS из <code>style.css</code> заработал?","de":"Was muss man tun, damit das CSS aus <code>style.css</code> wirkt?"},"o":[{"ru":"Подключить файл тегом &lt;link&gt;","de":"Die Datei mit &lt;link&gt; einbinden"},{"ru":"Переименовать файл в style.html","de":"Die Datei in style.html umbenennen"},{"ru":"Ничего","de":"Nichts"}],"a":0}],"proj":true,"lv2":{"ru":"<p>Доведи визитку до «живой»:</p><ol><li>Сделай увлечения «таблетками»: <code>.hobbies li { display: inline-block; background: #ecebff; padding: 4px 12px; border-radius: 999px; margin: 0 6px 6px 0; }</code>.</li><li>Добавь кнопке эффект наведения: <code>.link:hover { background: #3e2fc4; }</code> и плавность <code>transition: background 0.3s;</code> в <code>.link</code>.</li><li>Подчеркни вводный абзац курсивом: <code>.lead { font-style: italic; }</code>.</li></ol>","de":"<p>Mache die Visitenkarte „lebendig“:</p><ol><li>Gestalte die Interessen als „Tabletten“: <code>.hobbies li { display: inline-block; background: #ecebff; padding: 4px 12px; border-radius: 999px; margin: 0 6px 6px 0; }</code>.</li><li>Gib dem Knopf einen Hover-Effekt: <code>.link:hover { background: #3e2fc4; }</code> und Weichheit <code>transition: background 0.3s;</code> in <code>.link</code>.</li><li>Hebe den Einleitungsabsatz kursiv hervor: <code>.lead { font-style: italic; }</code>.</li></ol>"},"lv3":{"ru":"<p>Сделай вторую карточку — «ночную» версию той же визитки. Так выглядят темы оформления на настоящих сайтах.</p><ol><li>В HTML под первой карточкой добавь <code>&lt;section class=\"card dark\"&gt;</code> с заголовком и абзацем (копия с другим текстом).</li><li>Второй класс <code>dark</code> меняет только цвета: <code>.dark { background: #15172e; color: #fff; }</code> и <code>.dark h1 { color: #ffd166; }</code>.</li><li>Добавь фото рамку: <code>.photo { border: 4px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); }</code>.</li></ol><p>Ты обошёлся без копирования всего CSS: класс <code>card</code> задаёт форму, класс <code>dark</code> — цвет.</p>","de":"<p>Baue eine zweite Karte — die „Nacht“-Version derselben Visitenkarte. So sehen Designs auf echten Websites aus.</p><ol><li>Füge im HTML unter der ersten Karte <code>&lt;section class=\"card dark\"&gt;</code> mit Überschrift und Absatz hinzu (Kopie mit anderem Text).</li><li>Die zweite Klasse <code>dark</code> ändert nur Farben: <code>.dark { background: #15172e; color: #fff; }</code> und <code>.dark h1 { color: #ffd166; }</code>.</li><li>Gib dem Foto einen Rahmen: <code>.photo { border: 4px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); }</code>.</li></ol><p>Du hast ohne Kopieren des ganzen CSS gearbeitet: Die Klasse <code>card</code> gibt die Form, die Klasse <code>dark</code> die Farbe.</p>"}},{"day":15,"week":3,"title":{"ru":"Инструменты разработчика: находим ошибки","de":"Entwicklerwerkzeuge: Fehler finden"},"goal":{"ru":"Открывать инструменты браузера, читать чужой код и исправлять ошибки.","de":"Die Browser-Werkzeuge öffnen, fremden Code lesen und Fehler korrigieren."},"theory":{"ru":"<p>В каждом браузере есть <b>инструменты разработчика</b>. Открой их так: правая кнопка мыши по элементу → «Просмотреть код» (Inspect), или <code>F12</code> (на Mac: <code>Cmd+Option+I</code>). Попробуй прямо сейчас: нажми правой кнопкой на результат справа и выбери «Просмотреть код».</p><ul><li><b>Elements</b> — дерево HTML. Наведи курсор на строку: элемент подсветится на странице.</li><li><b>Styles</b> — правила CSS выбранного элемента. Зачёркнутые строки — перебитые или неверные правила. Значения можно менять прямо там и сразу видеть результат.</li><li><b>Computed</b> — итоговые стили и схема коробки (margin, border, padding).</li><li><b>Console</b> — сообщения об ошибках.</li></ul><p><b>Важно:</b> изменения в инструментах не сохраняются, это только эксперимент. Удачное нужно перенести в свой код.</p><p>Три самые частые ошибки новичков: опечатка в имени класса, опечатка в названии свойства и забытая точка с запятой.</p>","de":"<p>Jeder Browser hat <b>Entwicklerwerkzeuge</b>. So öffnest du sie: Rechtsklick auf ein Element → „Untersuchen“ (Inspect), oder <code>F12</code> (am Mac: <code>Cmd+Option+I</code>). Probiere es gleich aus: Klicke rechts auf das Ergebnis und wähle „Untersuchen“.</p><ul><li><b>Elements</b> — der HTML-Baum. Fahre mit der Maus über eine Zeile: Das Element wird auf der Seite markiert.</li><li><b>Styles</b> — die CSS-Regeln des gewählten Elements. Durchgestrichene Zeilen sind überschriebene oder fehlerhafte Regeln. Werte kann man dort direkt ändern und sieht das Ergebnis sofort.</li><li><b>Computed</b> — die endgültigen Stile und das Boxschema (margin, border, padding).</li><li><b>Console</b> — Fehlermeldungen.</li></ul><p><b>Wichtig:</b> Änderungen in den Werkzeugen werden nicht gespeichert, das ist nur ein Experiment. Das Gelungene musst du in deinen Code übertragen.</p><p>Die drei häufigsten Anfängerfehler: ein Tippfehler im Klassennamen, ein Tippfehler im Eigenschaftsnamen und ein vergessenes Semikolon.</p>"},"task":{"ru":"<p>В этом коде спрятаны <b>три ошибки</b>. Из-за них заголовок не фиолетовый, а блок без фона и отступов. Найди и исправь их, глядя на результат и читая код:</p><ol><li>Заголовок не красится.</li><li>У блока нет фона.</li><li>У блока нет отступа и скругления.</li></ol>","de":"<p>In diesem Code stecken <b>drei Fehler</b>. Deshalb ist die Überschrift nicht violett und der Block ohne Hintergrund und Abstand. Finde und korrigiere sie, indem du das Ergebnis ansiehst und den Code liest:</p><ol><li>Die Überschrift wird nicht gefärbt.</li><li>Der Block hat keinen Hintergrund.</li><li>Der Block hat keinen Abstand und keine runden Ecken.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .titel {\n      color: #5b48e8;\n    }\n    .box {\n      backgroud-color: #fff3d6;\n      padding: 20px\n      border-radius: 12px;\n    }\n  </style>\n</head>\n<body>\n  <h1 class=\"title\">Найди ошибки</h1>\n  <div class=\"box\">\n    <p>Этот блок должен быть светло-жёлтым, с отступом и скруглёнными углами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <ti
