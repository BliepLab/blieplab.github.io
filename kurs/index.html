<!doctype html>
<html lang="ru" data-lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BliepLab · Сайт за месяц / Website in einem Monat</title>
<meta name="description" content="Интерактивный курс на месяц: HTML и CSS с живым результатом. / Interaktiver Monatskurs: HTML und CSS mit Live-Ergebnis.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f7f6ff;--bg2:#ecebff;--ink:#15172e;--muted:#474a6b;--line:rgba(21,23,46,.14);--cyan:#1a8fe0;--magenta:#5b48e8;--lime:#f2a900;--orange:#ee6a3c;--green:#0f9d8a;--display:"Unbounded","Arial Black",sans-serif;--body:"Manrope","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,246,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1400px;margin:0 auto;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
header.top a{color:var(--ink);text-decoration:none;font-weight:700}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:#fff}
.langsw button{font-family:var(--mono);font-size:.76rem;padding:.3rem .7rem;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:999px}
.langsw button[aria-pressed="true"]{background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#fff;font-weight:600}
main{max-width:1400px;margin:0 auto;padding:1.6rem 1rem 4rem}
h1{font-family:var(--display);font-size:clamp(1.8rem,4.5vw,2.8rem);line-height:1.08;margin:.4rem 0 .8rem;font-weight:900;text-wrap:balance}
h2{font-family:var(--display);font-size:clamp(1.15rem,2.4vw,1.5rem);margin:1.6rem 0 .6rem}
h3{font-size:1.02rem;margin:1rem 0 .3rem}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.lead{font-size:1.1rem;color:var(--muted);max-width:68ch}
code{font-family:var(--mono);font-size:.86em;background:var(--bg2);padding:.1em .35em;border-radius:6px}
a{color:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-weight:700;padding:.6rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#fff;border:0}
.btn.sm{padding:.3rem .8rem;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
/* home */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin:1.2rem 0}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.how b{font-family:var(--mono);font-size:.78rem;color:var(--magenta)}
.prog{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:.6rem 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:99px;transition:width .4s}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin:1rem 0}
.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem}
.week h3{margin:0 0 .2rem;font-family:var(--display);font-size:1rem}
.week p{margin:.2rem 0 .7rem;color:var(--muted);font-size:.92rem}
.days{display:flex;flex-direction:column;gap:.35rem}
.day{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);padding:.35rem .6rem;border-radius:10px;border:1px solid transparent;background:var(--bg)}
.day:hover{border-color:var(--cyan)}
.day .n{font-family:var(--mono);font-size:.78rem;width:1.8rem;color:var(--muted)}
.day .st{margin-left:auto;font-size:.9rem}
.day.done{background:rgba(15,157,138,.1)}.day.cur{border-color:var(--magenta);background:rgba(91,72,232,.08)}
.day .k{font-size:.7rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--orange)}
details.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin:1rem 0}
details.note summary{cursor:pointer;font-weight:700}
/* lesson */
.lbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.lbar .sp{flex:1}
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.2rem;align-items:start}
@media(max-width:980px){.lg{grid-template-columns:minmax(0,1fr)}}
.lc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1rem 1.2rem}
.lc h1{font-size:clamp(1.3rem,3vw,1.8rem)}
.goal{background:rgba(26,143,224,.09);border-left:4px solid var(--cyan);border-radius:0 10px 10px 0;padding:.5rem .8rem;margin:.5rem 0}
.task{background:rgba(242,169,0,.12);border-left:4px solid var(--lime);border-radius:0 10px 10px 0;padding:.6rem .9rem;margin:.9rem 0}
.task h3{margin-top:0}
.lc ol,.lc ul{padding-left:1.3rem}.lc li{margin:.25rem 0}
pre.ex{font-family:var(--mono);font-size:.82rem;line-height:1.55;background:#1e2036;color:#e8e9f7;border-radius:12px;padding:.7rem .9rem;overflow:auto;margin:.6rem 0;white-space:pre}
.ed i,pre.ex i{font-style:normal}.ed i.k-cm,pre.ex i.k-cm{font-style:italic}
.k-tag{color:#ff8fb0}.k-an{color:#ffd479}.k-av{color:#8ee6b3}.k-cm{color:#8b8fb5;font-style:italic}.k-sel{color:#ffd479}.k-pr{color:#7fd0ff}.k-vl{color:#8ee6b3}.k-js{color:#e8e9f7}
.right{position:sticky;top:64px}
@media(max-width:980px){.right{position:static}}
.tabs{display:flex;gap:.3rem;margin-bottom:.4rem;align-items:center;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:.78rem;padding:.3rem .7rem;border-radius:8px 8px 0 0;border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:#1e2036;color:#fff;border-color:#1e2036}
.ed{position:relative;height:300px;background:#1e2036;border-radius:0 12px 12px 12px;overflow:hidden;display:flex}
.gut{font-family:var(--mono);font-size:13px;line-height:20px;padding:10px 6px 10px 8px;color:#6b6f98;text-align:right;white-space:pre;overflow:hidden;user-select:none;min-width:2.6rem;background:#181a2e}
.edw{position:relative;flex:1;min-width:0}
.ed pre.hl,.ed textarea{position:absolute;inset:0;margin:0;border:0;padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:20px;white-space:pre;tab-size:2;overflow:auto;background:transparent;letter-spacing:0;word-spacing:0}
.ed pre.hl{color:#e8e9f7;pointer-events:none;overflow:hidden}
.ed textarea{color:transparent;caret-color:#fff;resize:none;outline:none;-webkit-text-fill-color:transparent}
.ed textarea::selection{background:rgba(120,140,255,.45);-webkit-text-fill-color:transparent}
.pvbar{display:flex;gap:.4rem;align-items:center;margin:.7rem 0 .3rem;flex-wrap:wrap}
.pvbar b{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.pvwrap{background:repeating-conic-gradient(#e7e6f7 0 25%,#f2f1fc 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:12px;padding:0;height:300px;overflow:auto;display:flex;justify-content:center}
.pvwrap iframe{border:0;background:#fff;height:100%;width:100%;transition:width .25s}
.chk{margin-top:.8rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem 1rem}
.chk h3{margin:.1rem 0 .4rem}
.chk ul{list-style:none;padding:0;margin:.3rem 0}
.chk li{display:flex;gap:.5rem;align-items:flex-start;margin:.25rem 0;font-size:.93rem}
.chk li i{font-style:normal;width:1.2rem;flex:none}
.chk li.ok{color:#0b6d5f}.chk li.no{color:var(--orange)}
.win{background:rgba(15,157,138,.12);border:1px solid rgba(15,157,138,.4);border-radius:12px;padding:.6rem .9rem;margin-top:.6rem;font-weight:700}
.quiz{margin:.9rem 0}.quiz .q{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;margin:.5rem 0}
.quiz .o{display:block;width:100%;text-align:left;font:inherit;padding:.35rem .6rem;margin:.25rem 0;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.quiz .o.good{background:rgba(15,157,138,.15);border-color:#0f9d8a}.quiz .o.bad{background:rgba(238,106,60,.12);border-color:var(--orange)}
.man label{display:flex;gap:.5rem;align-items:flex-start;margin:.35rem 0}
.links li{margin:.3rem 0}
.cert{display:none}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{display:block;position:absolute;inset:0;padding:3rem;text-align:center;border:8px double #5b48e8;margin:1rem}}
.cert h2{font-size:2rem}
.hidden{display:none!important}

<script>window.COURSE={"ui":{"eyebrow":{"ru":"Курс для подростков · 4 недели · 45 минут в день","de":"Kurs für Jugendliche · 4 Wochen · 45 Minuten pro Tag"},"title":{"ru":"Сайт за месяц","de":"Eine Website in einem Monat"},"lead":{"ru":"28 коротких занятий: от первой строчки HTML до своего сайта. Ты пишешь код прямо здесь, справа сразу видишь результат, а проверка подсказывает, что ещё нужно. Ничего устанавливать не надо.","de":"28 kurze Lektionen: von der ersten HTML-Zeile bis zur eigenen Website. Du schreibst den Code direkt hier, rechts siehst du sofort das Ergebnis, und die Prüfung zeigt dir, was noch fehlt. Du musst nichts installieren."},"how":[[{"ru":"1 · Читай (10 мин)","de":"1 · Lesen (10 Min.)"},{"ru":"Короткое объяснение с примерами кода.","de":"Kurze Erklärung mit Codebeispielen."}],[{"ru":"2 · Пиши (25 мин)","de":"2 · Schreiben (25 Min.)"},{"ru":"Задание в редакторе. Результат виден сразу.","de":"Aufgabe im Editor. Das Ergebnis siehst du sofort."}],[{"ru":"3 · Проверяй (5 мин)","de":"3 · Prüfen (5 Min.)"},{"ru":"Кнопка «Проверить» отмечает, что готово, а что нет.","de":"Der Knopf „Prüfen“ zeigt, was fertig ist und was nicht."}],[{"ru":"4 · Повтори (5 мин)","de":"4 · Wiederholen (5 Min.)"},{"ru":"Один вопрос себе: что я сегодня понял(а)?","de":"Eine Frage an dich selbst: Was habe ich heute verstanden?"}]],"continue":{"ru":"Продолжить","de":"Weiter"},"start":{"ru":"Начать","de":"Starten"},"day":{"ru":"День","de":"Tag"},"daysdone":{"ru":"дней пройдено","de":"Tage geschafft"},"week":{"ru":"Неделя","de":"Woche"},"project":{"ru":"проект","de":"Projekt"},"parentTitle":{"ru":"Для родителя или наставника","de":"Für Eltern oder Begleiter"},"parent":{"ru":"<p>Вам не нужно уметь программировать. Ваша роль: помочь подростку найти 45 спокойных минут каждый день и спрашивать о том, что получилось.</p><ul><li><b>Ритм важнее скорости.</b> Лучше 45 минут каждый день, чем 5 часов в воскресенье. Один пропущенный день не страшен: просто продолжайте.</li><li><b>Не исправляйте за него.</b> Если что-то не работает, спросите: «Что показывает проверка? Что говорит код?» Ошибка — часть обучения.</li><li><b>Пусть объяснит вам.</b> Попросите подростка показать результат и рассказать, как это работает: так закрепляется понимание.</li><li><b>Раз в неделю смотрите проект недели</b> (дни 7, 14, 21) и хвалите конкретное: цвет, идею, аккуратный код.</li><li><b>Безопасность в интернете.</b> Если сайт будет опубликован (день 28), не размещайте на нём адрес, телефон, школу, фото лица и настоящую фамилию без договорённости. Выберите сервис вместе, прочитайте условия и возрастные ограничения.</li><li><b>Код сохраняется в этом браузере.</b> Не очищайте данные сайта и не меняйте браузер, пока курс не закончен; в день 28 можно скачать файлы.</li></ul>","de":"<p>Du musst nicht programmieren können. Deine Rolle: helfen, jeden Tag 45 ruhige Minuten zu finden, und nach dem Ergebnis fragen.</p><ul><li><b>Rhythmus ist wichtiger als Tempo.</b> Besser jeden Tag 45 Minuten als 5 Stunden am Sonntag. Ein verpasster Tag ist nicht schlimm: einfach weitermachen.</li><li><b>Nicht für das Kind korrigieren.</b> Wenn etwas nicht funktioniert, frage: „Was zeigt die Prüfung? Was sagt der Code?“ Fehler gehören zum Lernen.</li><li><b>Lass es dir erklären.</b> Bitte den Jugendlichen, das Ergebnis zu zeigen und zu erklären, wie es funktioniert: So festigt sich das Verständnis.</li><li><b>Einmal pro Woche das Wochenprojekt ansehen</b> (Tage 7, 14, 21) und etwas Konkretes loben: Farbe, Idee, sauberen Code.</li><li><b>Sicherheit im Netz.</b> Wenn die Website veröffentlicht wird (Tag 28), gehören keine Adresse, Telefonnummer, Schule, kein Gesichtsfoto und kein echter Nachname ohne Absprache darauf. Wählt den Dienst gemeinsam aus und lest die Bedingungen und Altersgrenzen.</li><li><b>Der Code wird in diesem Browser gespeichert.</b> Lösche die Websitedaten nicht und wechsle den Browser nicht, bis der Kurs fertig ist; an Tag 28 kannst du die Dateien herunterladen.</li></ul>"},"resetAll":{"ru":"Начать курс заново","de":"Kurs von vorn beginnen"},"resetConfirm":{"ru":"Удалить весь прогресс и код? Это нельзя отменить.","de":"Gesamten Fortschritt und Code löschen? Das lässt sich nicht rückgängig machen."},"plan":{"ru":"План","de":"Plan"},"min":{"ru":"минут","de":"Minuten"},"goal":{"ru":"Цель","de":"Ziel"},"theory":{"ru":"Что нужно знать","de":"Das musst du wissen"},"task":{"ru":"Задание","de":"Aufgabe"},"quiz":{"ru":"Проверь себя","de":"Teste dich"},"checklist":{"ru":"Чек-лист","de":"Checkliste"},"hint":{"ru":"Подсказка","de":"Tipp"},"result":{"ru":"Результат","de":"Ergebnis"},"check":{"ru":"Проверить","de":"Prüfen"},"solution":{"ru":"Показать решение","de":"Lösung zeigen"},"reset":{"ru":"Сбросить","de":"Zurücksetzen"},"download":{"ru":"Скачать файлы","de":"Dateien herunterladen"},"requirements":{"ru":"Что должно получиться","de":"Das soll herauskommen"},"resetLesson":{"ru":"Вернуть код задания к началу? Твои изменения будут удалены.","de":"Code der Aufgabe auf den Anfang zurücksetzen? Deine Änderungen gehen verloren."},"nosol":{"ru":"Для этого задания нет готового решения: оно твоё.","de":"Für diese Aufgabe gibt es keine fertige Lösung: Sie gehört dir."},"solConfirm":{"ru":"Попробуй ещё раз сам(а) минут 10. Показать решение? Оно заменит твой код.","de":"Versuche es noch einmal selbst, etwa 10 Minuten. Lösung zeigen? Sie ersetzt deinen Code."},"dayDone":{"ru":"День пройден!","de":"Tag geschafft!"},"next":{"ru":"Следующий день","de":"Nächster Tag"},"codeOkRest":{"ru":"Код готов. Осталось ответить на вопросы или отметить пункты чек-листа.","de":"Der Code ist fertig. Beantworte noch die Fragen oder hake die Checkliste ab."},"notYet":{"ru":"Пока не всё. Посмотри на пункты с ✗, поправь код и нажми «Проверить» ещё раз. Если застрял, открой подсказку.","de":"Noch nicht alles. Schau dir die Punkte mit ✗ an, verbessere den Code und drücke wieder „Prüfen“. Wenn du feststeckst, öffne den Tipp."},"certText":{"ru":"Сертификат: успешно прошёл(а) курс «Сайт за месяц»","de":"Zertifikat: Kurs „Eine Website in einem Monat“ erfolgreich abgeschlossen"},"certSub":{"ru":"28 уроков HTML и CSS · свой сайт","de":"28 Lektionen HTML und CSS · eigene Website"},"yourName":{"ru":"Твоё имя","de":"Dein Name"},"printCert":{"ru":"Распечатать сертификат","de":"Zertifikat drucken"}},"weeks":[{"title":{"ru":"Каркас: HTML","de":"Gerüst: HTML"},"sub":{"ru":"Теги, текст, списки, ссылки, картинки и скелет страницы.","de":"Tags, Text, Listen, Links, Bilder und das Gerüst einer Seite."}},{"title":{"ru":"Внешний вид: CSS","de":"Aussehen: CSS"},"sub":{"ru":"Селекторы, шрифты, коробочная модель, цвета и отдельный файл стилей.","de":"Selektoren, Schrift, Box-Modell, Farben und eine eigene Stil-Datei."}},{"title":{"ru":"Макет и аккуратность","de":"Layout und Sauberkeit"},"sub":{"ru":"Инструменты разработчика, flexbox, наведение, адаптивность.","de":"Entwicklerwerkzeuge, Flexbox, Hover, Responsive Design."}},{"title":{"ru":"Свой сайт","de":"Eigene Website"},"sub":{"ru":"Чуть-чуть JavaScript, формы, план, сборка, шлифовка и публикация.","de":"Ein bisschen JavaScript, Formulare, Plan, Bau, Feinschliff und Veröffentlichung."}}],"lessons":[{"day":1,"week":1,"title":{"ru":"Что такое сайт и как он устроен","de":"Was ist eine Website und wie funktioniert sie?"},"goal":{"ru":"Понять, что сайт — это текстовые файлы, и написать первые строки HTML.","de":"Verstehen, dass eine Website aus Textdateien besteht, und die ersten HTML-Zeilen schreiben."},"theory":{"ru":"<p>Когда ты открываешь сайт, браузер (Chrome, Firefox, Safari) просит у <b>сервера</b> файлы и показывает их. Файлы — обычный текст, который люди написали на трёх языках:</p><ul><li><b>HTML</b> — каркас и смысл: что здесь заголовок, что абзац, что ссылка.</li><li><b>CSS</b> — внешний вид: цвета, шрифты, отступы.</li><li><b>JavaScript</b> — поведение: что происходит, когда нажимаешь кнопку.</li></ul><p>Сравни с домом: HTML — стены и комнаты, CSS — краска и мебель, JavaScript — электричество и выключатели.</p><p>Любой сайт можно «подсмотреть»: нажми <code>Ctrl+U</code> (на Mac <code>Cmd+Option+U</code>) на любой странице и увидишь её HTML. Попробуй прямо сейчас на любимом сайте.</p><p>Вот самая первая страница. Тег <code>&lt;h1&gt;</code> — главный заголовок, <code>&lt;p&gt;</code> — абзац:</p><pre class=\"ex\" data-l=\"html\">&lt;h1&gt;Привет, мир!&lt;/h1&gt;\n&lt;p&gt;Это моя первая страница.&lt;/p&gt;</pre>","de":"<p>Wenn du eine Website öffnest, bittet der Browser (Chrome, Firefox, Safari) einen <b>Server</b> um Dateien und zeigt sie an. Die Dateien sind einfacher Text, den Menschen in drei Sprachen geschrieben haben:</p><ul><li><b>HTML</b> — Gerüst und Bedeutung: Was ist hier eine Überschrift, was ein Absatz, was ein Link.</li><li><b>CSS</b> — Aussehen: Farben, Schriften, Abstände.</li><li><b>JavaScript</b> — Verhalten: Was passiert, wenn man auf einen Knopf drückt.</li></ul><p>Vergleiche es mit einem Haus: HTML sind Wände und Zimmer, CSS Farbe und Möbel, JavaScript Strom und Schalter.</p><p>Jede Website kann man „ansehen“: Drücke <code>Strg+U</code> (am Mac <code>Cmd+Option+U</code>) auf einer beliebigen Seite und du siehst ihr HTML. Probiere es gleich bei deiner Lieblingsseite aus.</p><p>Hier ist die allererste Seite. Der Tag <code>&lt;h1&gt;</code> ist die Hauptüberschrift, <code>&lt;p&gt;</code> ein Absatz:</p><pre class=\"ex\" data-l=\"html\">&lt;h1&gt;Hallo, Welt!&lt;/h1&gt;\n&lt;p&gt;Das ist meine erste Seite.&lt;/p&gt;</pre>"},"task":{"ru":"<ol><li>Измени текст в <code>&lt;h1&gt;</code>: пусть там будет твоё имя.</li><li>Добавь под ним ещё один абзац <code>&lt;p&gt;…&lt;/p&gt;</code> о том, что тебе нравится.</li><li>Нажми «Проверить».</li></ol>","de":"<ol><li>Ändere den Text in <code>&lt;h1&gt;</code>: Dort soll dein Name stehen.</li><li>Füge darunter einen weiteren Absatz <code>&lt;p&gt;…&lt;/p&gt;</code> hinzu, über etwas, das dir gefällt.</li><li>Drücke „Prüfen“.</li></ol>"},"files":{"index.html":{"ru":"<h1>Привет, мир!</h1>\n<p>Это моя первая страница.</p>\n","de":"<h1>Hallo, Welt!</h1>\n<p>Das ist meine erste Seite.</p>\n"}},"checks":[{"t":"has","m":{"ru":"Есть заголовок <code>&lt;h1&gt;</code>","de":"Es gibt eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"text","m":{"ru":"Текст заголовка изменён (там твоё имя)","de":"Der Überschrifttext ist geändert (dein Name steht dort)"},"s":"h1","r":"^(?!Привет, мир!$|Hallo, Welt!$).+","w":null},{"t":"count","m":{"ru":"Есть минимум два абзаца <code>&lt;p&gt;</code>","de":"Es gibt mindestens zwei Absätze <code>&lt;p&gt;</code>"},"s":"p","n":2,"w":null}],"sol":{"index.html":{"ru":"<h1>Аня</h1>\n<p>Это моя первая страница.</p>\n<p>Мне нравится рисовать и слушать музыку.</p>\n","de":"<h1>Anna</h1>\n<p>Das ist meine erste Seite.</p>\n<p>Ich zeichne gern und höre Musik.</p>\n"}},"hint":{"ru":"<p>Теги пишутся парами: открывающий <code>&lt;p&gt;</code> и закрывающий <code>&lt;/p&gt;</code> (со слэшем). Текст — между ними. Новый абзац — новая пара тегов на новой строке.</p>","de":"<p>Tags werden paarweise geschrieben: öffnend <code>&lt;p&gt;</code> und schließend <code>&lt;/p&gt;</code> (mit Schrägstrich). Der Text steht dazwischen. Ein neuer Absatz ist ein neues Tag-Paar in einer neuen Zeile.</p>"},"quiz":[{"q":{"ru":"Какой язык отвечает за внешний вид страницы (цвета, шрифты)?","de":"Welche Sprache ist für das Aussehen der Seite zuständig (Farben, Schriften)?"},"o":[{"ru":"HTML","de":"HTML"},{"ru":"CSS","de":"CSS"},{"ru":"JavaScript","de":"JavaScript"}],"a":1},{"q":{"ru":"Что делает браузер, когда ты открываешь сайт?","de":"Was macht der Browser, wenn du eine Website öffnest?"},"o":[{"ru":"Просит у сервера файлы и показывает их","de":"Er bittet einen Server um Dateien und zeigt sie an"},{"ru":"Рисует страницу сам, без файлов","de":"Er zeichnet die Seite selbst, ohne Dateien"},{"ru":"Скачивает сайт и удаляет его с сервера","de":"Er lädt die Website herunter und löscht sie vom Server"}],"a":0}]},{"day":2,"week":1,"title":{"ru":"Теги, элементы и заголовки","de":"Tags, Elemente und Überschriften"},"goal":{"ru":"Понимать, из чего состоит элемент, и строить структуру из заголовков и абзацев.","de":"Verstehen, woraus ein Element besteht, und eine Struktur aus Überschriften und Absätzen bauen."},"theory":{"ru":"<p><b>Элемент</b> = открывающий тег + содержимое + закрывающий тег:</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Это абзац&lt;/p&gt;\n&lt;!--  ↑ открывающий  ↑ содержимое  ↑ закрывающий --&gt;</pre><ul><li>Заголовки: <code>&lt;h1&gt;</code> самый важный (на странице он один), затем <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> и так до <code>&lt;h6&gt;</code>. Они как главы книги.</li><li>Абзац: <code>&lt;p&gt;</code>. Браузер сам делает отступы между абзацами.</li><li><code>&lt;hr&gt;</code> — горизонтальная линия, <code>&lt;br&gt;</code> — перенос строки. Они «пустые» и закрывающего тега не имеют.</li><li><b>Комментарий</b> <code>&lt;!-- … --&gt;</code> виден только в коде, браузер его пропускает. Удобно оставлять заметки себе.</li></ul><p>Элементы можно вкладывать друг в друга, но закрывать нужно в обратном порядке, как матрёшки.</p>","de":"<p>Ein <b>Element</b> = öffnendes Tag + Inhalt + schließendes Tag:</p><pre class=\"ex\" data-l=\"html\">&lt;p&gt;Das ist ein Absatz&lt;/p&gt;\n&lt;!--  ↑ öffnend  ↑ Inhalt  ↑ schließend --&gt;</pre><ul><li>Überschriften: <code>&lt;h1&gt;</code> ist die wichtigste (es gibt nur eine pro Seite), dann <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code> bis <code>&lt;h6&gt;</code>. Sie sind wie Buchkapitel.</li><li>Absatz: <code>&lt;p&gt;</code>. Der Browser macht die Abstände zwischen Absätzen selbst.</li><li><code>&lt;hr&gt;</code> ist eine waagerechte Linie, <code>&lt;br&gt;</code> ein Zeilenumbruch. Sie sind „leer“ und haben kein schließendes Tag.</li><li>Ein <b>Kommentar</b> <code>&lt;!-- … --&gt;</code> ist nur im Code sichtbar, der Browser überspringt ihn. Praktisch für Notizen an dich selbst.</li></ul><p>Elemente kann man ineinander verschachteln, aber man muss sie in umgekehrter Reihenfolge schließen, wie Matroschkas.</p>"},"task":{"ru":"<p>Напиши страницу о своём увлечении (хобби, игра, спорт, музыка):</p><ol><li>Один заголовок <code>&lt;h1&gt;</code> с названием.</li><li>Два подзаголовка <code>&lt;h2&gt;</code> (например, «Почему мне это нравится» и «С чего начать»).</li><li>Под каждым подзаголовком — абзац <code>&lt;p&gt;</code> из 1–2 предложений.</li><li>Одна линия <code>&lt;hr&gt;</code> между разделами.</li></ol>","de":"<p>Schreibe eine Seite über dein Hobby (Spiel, Sport, Musik …):</p><ol><li>Eine Überschrift <code>&lt;h1&gt;</code> mit dem Titel.</li><li>Zwei Unterüberschriften <code>&lt;h2&gt;</code> (z. B. „Warum mir das gefällt“ und „Wie man anfängt“).</li><li>Unter jeder Unterüberschrift ein Absatz <code>&lt;p&gt;</code> mit 1–2 Sätzen.</li><li>Eine Linie <code>&lt;hr&gt;</code> zwischen den Abschnitten.</li></ol>"},"files":{"index.html":{"ru":"<!-- Напиши здесь свою страницу. Строки в такой рамке — комментарии, их не видно. -->\n","de":"<!-- Schreibe hier deine Seite. Zeilen in diesem Rahmen sind Kommentare, man sieht sie nicht. -->\n"}},"checks":[{"t":"count","m":{"ru":"Один заголовок <code>&lt;h1&gt;</code>","de":"Eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","n":1,"w":null},{"t":"nocode","m":{"ru":"Не больше одного <code>&lt;h1&gt;</code>","de":"Nicht mehr als ein <code>&lt;h1&gt;</code>"},"r":"<h1[^>]*>[\\s\\S]*<h1","f":null},{"t":"count","m":{"ru":"Минимум два подзаголовка <code>&lt;h2&gt;</code>","de":"Mindestens zwei Unterüberschriften <code>&lt;h2&gt;</code>"},"s":"h2","n":2,"w":null},{"t":"count","m":{"ru":"Минимум два абзаца <code>&lt;p&gt;</code>","de":"Mindestens zwei Absätze <code>&lt;p&gt;</code>"},"s":"p","n":2,"w":null},{"t":"has","m":{"ru":"Есть линия <code>&lt;hr&gt;</code>","de":"Es gibt eine Linie <code>&lt;hr&gt;</code>"},"s":"hr","w":null}],"sol":{"index.html":{"ru":"<h1>Скейтбординг</h1>\n<h2>Почему мне это нравится</h2>\n<p>Это свобода и каждый день новый трюк.</p>\n<hr>\n<h2>С чего начать</h2>\n<p>Нужны доска, шлем и терпение.</p>\n","de":"<h1>Skateboarden</h1>\n<h2>Warum mir das gefällt</h2>\n<p>Es ist Freiheit und jeden Tag ein neuer Trick.</p>\n<hr>\n<h2>Wie man anfängt</h2>\n<p>Man braucht ein Board, einen Helm und Geduld.</p>\n"}},"hint":{"ru":"<p>Не забывай закрывающие теги: <code>&lt;/h2&gt;</code>, <code>&lt;/p&gt;</code>. Заголовок <code>&lt;h1&gt;</code> только один, подзаголовков может быть сколько угодно.</p>","de":"<p>Vergiss die schließenden Tags nicht: <code>&lt;/h2&gt;</code>, <code>&lt;/p&gt;</code>. Es gibt nur ein <code>&lt;h1&gt;</code>, Unterüberschriften darf es beliebig viele geben.</p>"},"quiz":[{"q":{"ru":"Какой тег закрывает абзац?","de":"Welches Tag schließt einen Absatz?"},"o":[{"ru":"&lt;p/&gt;","de":"&lt;p/&gt;"},{"ru":"&lt;/p&gt;","de":"&lt;/p&gt;"},{"ru":"&lt;end p&gt;","de":"&lt;end p&gt;"}],"a":1}]},{"day":3,"week":1,"title":{"ru":"Текст: выделение и списки","de":"Text: Hervorhebung und Listen"},"goal":{"ru":"Выделять слова и делать маркированные и нумерованные списки.","de":"Wörter hervorheben und Aufzählungen sowie nummerierte Listen machen."},"theory":{"ru":"<ul><li><code>&lt;strong&gt;</code> — важное слово (жирный), <code>&lt;em&gt;</code> — акцент (курсив). Они несут смысл, а не только вид.</li><li><code>&lt;ul&gt;</code> — маркированный список, <code>&lt;ol&gt;</code> — нумерованный. Каждый пункт — <code>&lt;li&gt;</code>.</li></ul><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Хлеб&lt;/li&gt;\n  &lt;li&gt;Молоко&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;ol&gt;\n  &lt;li&gt;Открой редактор&lt;/li&gt;\n  &lt;li&gt;Напиши код&lt;/li&gt;\n&lt;/ol&gt;</pre><p>Обрати внимание: <code>&lt;li&gt;</code> стоит <b>внутри</b> <code>&lt;ul&gt;</code> или <code>&lt;ol&gt;</code>, а отступ (два пробела) помогает видеть вложенность.</p>","de":"<ul><li><code>&lt;strong&gt;</code> — wichtiges Wort (fett), <code>&lt;em&gt;</code> — Betonung (kursiv). Sie tragen Bedeutung, nicht nur Aussehen.</li><li><code>&lt;ul&gt;</code> — Aufzählung mit Punkten, <code>&lt;ol&gt;</code> — nummerierte Liste. Jeder Punkt ist ein <code>&lt;li&gt;</code>.</li></ul><pre class=\"ex\" data-l=\"html\">&lt;ul&gt;\n  &lt;li&gt;Brot&lt;/li&gt;\n  &lt;li&gt;Milch&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;ol&gt;\n  &lt;li&gt;Öffne den Editor&lt;/li&gt;\n  &lt;li&gt;Schreibe Code&lt;/li&gt;\n&lt;/ol&gt;</pre><p>Beachte: <code>&lt;li&gt;</code> steht <b>innerhalb</b> von <code>&lt;ul&gt;</code> oder <code>&lt;ol&gt;</code>, und die Einrückung (zwei Leerzeichen) hilft, die Verschachtelung zu sehen.</p>"},"task":{"ru":"<p>Сделай страницу «Рецепт бутерброда» (или любого блюда):</p><ol><li>Заголовок <code>&lt;h1&gt;</code>.</li><li>Маркированный список <code>&lt;ul&gt;</code> с тремя ингредиентами.</li><li>Нумерованный список <code>&lt;ol&gt;</code> с тремя шагами.</li><li>Одно слово сделай <code>&lt;strong&gt;</code>, одно — <code>&lt;em&gt;</code>.</li></ol>","de":"<p>Mache eine Seite „Rezept für ein Butterbrot“ (oder ein anderes Gericht):</p><ol><li>Eine Überschrift <code>&lt;h1&gt;</code>.</li><li>Eine Aufzählung <code>&lt;ul&gt;</code> mit drei Zutaten.</li><li>Eine nummerierte Liste <code>&lt;ol&gt;</code> mit drei Schritten.</li><li>Ein Wort als <code>&lt;strong&gt;</code>, ein Wort als <code>&lt;em&gt;</code>.</li></ol>"},"files":{"index.html":{"ru":"<h1>Рецепт</h1>\n<!-- Добавь списки ниже -->\n","de":"<h1>Rezept</h1>\n<!-- Füge unten die Listen hinzu -->\n"}},"checks":[{"t":"has","m":{"ru":"Есть заголовок <code>&lt;h1&gt;</code>","de":"Es gibt eine Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"count","m":{"ru":"Список <code>&lt;ul&gt;</code> минимум из 3 пунктов <code>&lt;li&gt;</code>","de":"Liste <code>&lt;ul&gt;</code> mit mindestens 3 Punkten <code>&lt;li&gt;</code>"},"s":"ul > li","n":3,"w":null},{"t":"count","m":{"ru":"Список <code>&lt;ol&gt;</code> минимум из 3 пунктов","de":"Liste <code>&lt;ol&gt;</code> mit mindestens 3 Punkten"},"s":"ol > li","n":3,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;strong&gt;</code>","de":"Es gibt <code>&lt;strong&gt;</code>"},"s":"strong","w":null},{"t":"has","m":{"ru":"Есть <code>&lt;em&gt;</code>","de":"Es gibt <code>&lt;em&gt;</code>"},"s":"em","w":null}],"sol":{"index.html":{"ru":"<h1>Рецепт бутерброда</h1>\n<h2>Ингредиенты</h2>\n<ul>\n  <li>Хлеб</li>\n  <li>Сыр</li>\n  <li>Помидор</li>\n</ul>\n<h2>Шаги</h2>\n<ol>\n  <li>Отрежь хлеб</li>\n  <li>Положи <strong>сыр</strong></li>\n  <li>Добавь <em>помидор</em></li>\n</ol>\n","de":"<h1>Rezept für ein Butterbrot</h1>\n<h2>Zutaten</h2>\n<ul>\n  <li>Brot</li>\n  <li>Käse</li>\n  <li>Tomate</li>\n</ul>\n<h2>Schritte</h2>\n<ol>\n  <li>Schneide das Brot</li>\n  <li>Lege den <strong>Käse</strong> darauf</li>\n  <li>Füge die <em>Tomate</em> hinzu</li>\n</ol>\n"}},"hint":{"ru":"<p>Структура: <code>&lt;ul&gt;</code>, внутри него три <code>&lt;li&gt;…&lt;/li&gt;</code>, потом <code>&lt;/ul&gt;</code>.</p>","de":"<p>Aufbau: <code>&lt;ul&gt;</code>, darin drei <code>&lt;li&gt;…&lt;/li&gt;</code>, dann <code>&lt;/ul&gt;</code>.</p>"},"quiz":[{"q":{"ru":"Где должен стоять тег &lt;li&gt;?","de":"Wo muss das Tag &lt;li&gt; stehen?"},"o":[{"ru":"Внутри &lt;ul&gt; или &lt;ol&gt;","de":"Innerhalb von &lt;ul&gt; oder &lt;ol&gt;"},{"ru":"Где угодно","de":"Irgendwo"},{"ru":"Только в заголовке","de":"Nur in einer Überschrift"}],"a":0}]},{"day":4,"week":1,"title":{"ru":"Ссылки","de":"Links"},"goal":{"ru":"Делать ссылки на другие сайты и страницы и понимать атрибуты.","de":"Links zu anderen Websites und Seiten machen und Attribute verstehen."},"theory":{"ru":"<p>Ссылка — элемент <code>&lt;a&gt;</code> (anchor, «якорь»). Адрес лежит в <b>атрибуте</b> <code>href</code>:</p><pre class=\"ex\" data-l=\"html\">&lt;a href=\"https://wikipedia.org\"&gt;Википедия&lt;/a&gt;</pre><p><b>Атрибут</b> — дополнительная информация внутри открывающего тега: <code>имя=\"значение\"</code>. Значение всегда в кавычках.</p><ul><li><code>target=\"_blank\"</code> — открыть в новой вкладке (добавь рядом <code>rel=\"noopener\"</code> для безопасности).</li><li>Ссылка на другую страницу своего сайта: <code>&lt;a href=\"kontakt.html\"&gt;</code> (без https), это «относительный» адрес.</li><li>Ссылка на почту: <code>&lt;a href=\"mailto:name@example.com\"&gt;</code>.</li></ul>","de":"<p>Ein Link ist das Element <code>&lt;a&gt;</code> (Anker). Die Adresse steht im <b>Attribut</b> <code>href</code>:</p><pre class=\"ex\" data-l=\"html\">&lt;a href=\"https://wikipedia.org\"&gt;Wikipedia&lt;/a&gt;</pre><p>Ein <b>Attribut</b> ist zusätzliche Information im öffnenden Tag: <code>name=\"wert\"</code>. Der Wert steht immer in Anführungszeichen.</p><ul><li><code>target=\"_blank\"</code> — in neuem Tab öffnen (setze zur Sicherheit <code>rel=\"noopener\"</code> dazu).</li><li>Link auf eine andere Seite deiner Website: <code>&lt;a href=\"kontakt.html\"&gt;</code> (ohne https), das ist eine „relative“ Adresse.</li><li>Link zu einer E-Mail: <code>&lt;a href=\"mailto:name@example.com\"&gt;</code>.</li></ul>"},"task":{"ru":"<ol><li>Добавь ссылку на сайт, который тебе нравится: <code>href</code> начинается с <code>https://</code>.</li><li>Пусть она открывается в новой вкладке (<code>target=\"_blank\"</code>).</li><li>Добавь вторую ссылку на другую страницу: <code>href=\"kontakt.html\"</code> с текстом «Контакты».</li></ol>","de":"<ol><li>Füge einen Link zu einer Website hinzu, die dir gefällt: <code>href</code> beginnt mit <code>https://</code>.</li><li>Er soll sich in einem neuen Tab öffnen (<code>target=\"_blank\"</code>).</li><li>Füge einen zweiten Link zu einer anderen Seite hinzu: <code>href=\"kontakt.html\"</code> mit dem Text „Kontakt“.</li></ol>"},"files":{"index.html":{"ru":"<h1>Мои ссылки</h1>\n<p>Здесь будут мои любимые места в интернете.</p>\n","de":"<h1>Meine Links</h1>\n<p>Hier kommen meine liebsten Orte im Internet hin.</p>\n"}},"checks":[{"t":"attr","m":{"ru":"Есть ссылка с адресом <code>https://…</code>","de":"Es gibt einen Link mit Adresse <code>https://…</code>"},"s":"a","a":"href","r":"^https?://","w":null},{"t":"attr","m":{"ru":"Одна ссылка открывается в новой вкладке","de":"Ein Link öffnet sich in einem neuen Tab"},"s":"a","a":"target","r":"^_blank$","w":null},{"t":"attr","m":{"ru":"Есть ссылка на <code>kontakt.html</code>","de":"Es gibt einen Link auf <code>kontakt.html</code>"},"s":"a","a":"href","r":"^kontakt\\.html$","w":null},{"t":"text","m":{"ru":"У ссылки есть текст между тегами","de":"Der Link hat Text zwischen den Tags"},"s":"a","r":".+","w":null}],"sol":{"index.html":{"ru":"<h1>Мои ссылки</h1>\n<p>Здесь будут мои любимые места в интернете.</p>\n<p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Википедия</a></p>\n<p><a href=\"kontakt.html\">Контакты</a></p>\n","de":"<h1>Meine Links</h1>\n<p>Hier kommen meine liebsten Orte im Internet hin.</p>\n<p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Wikipedia</a></p>\n<p><a href=\"kontakt.html\">Kontakt</a></p>\n"}},"hint":{"ru":"<p>Текст ссылки стоит между <code>&lt;a …&gt;</code> и <code>&lt;/a&gt;</code>. Если нажмёшь на «Контакты» в результате, откроется пустая страница: такой файл мы ещё не создали, это нормально.</p>","de":"<p>Der Linktext steht zwischen <code>&lt;a …&gt;</code> und <code>&lt;/a&gt;</code>. Wenn du im Ergebnis auf „Kontakt“ klickst, öffnet sich eine leere Seite: Diese Datei haben wir noch nicht erstellt, das ist normal.</p>"},"quiz":[{"q":{"ru":"Где в ссылке лежит адрес?","de":"Wo liegt in einem Link die Adresse?"},"o":[{"ru":"В атрибуте href","de":"Im Attribut href"},{"ru":"В тексте между тегами","de":"Im Text zwischen den Tags"},{"ru":"В теге &lt;link&gt;","de":"Im Tag &lt;link&gt;"}],"a":0}]},{"day":5,"week":1,"title":{"ru":"Картинки","de":"Bilder"},"goal":{"ru":"Вставлять картинки и понимать, зачем нужен атрибут alt.","de":"Bilder einfügen und verstehen, wozu das Attribut alt da ist."},"theory":{"ru":"<p>Картинка — элемент <code>&lt;img&gt;</code>. Он «пустой» (без закрывающего тега) и имеет атрибуты:</p><pre class=\"ex\" data-l=\"html\">&lt;img src=\"cat.svg\" alt=\"Рыжий кот\" width=\"200\"&gt;</pre><ul><li><code>src</code> — путь к файлу картинки.</li><li><code>alt</code> — описание словами. Его читают программы для незрячих, и он виден, если картинка не загрузилась. Поисковики тоже его читают. <b>alt нужен всегда.</b></li><li><code>width</code> — ширина в пикселях (высота подберётся сама).</li></ul><p>В этом курсе у тебя есть четыре готовые картинки: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>. На настоящем сайте ты положишь файл рядом с HTML и напишешь его имя в <code>src</code>.</p>","de":"<p>Ein Bild ist das Element <code>&lt;img&gt;</code>. Es ist „leer“ (ohne schließendes Tag) und hat Attribute:</p><pre class=\"ex\" data-l=\"html\">&lt;img src=\"cat.svg\" alt=\"Rote Katze\" width=\"200\"&gt;</pre><ul><li><code>src</code> — Pfad zur Bilddatei.</li><li><code>alt</code> — Beschreibung in Worten. Sie wird von Programmen für Blinde vorgelesen und erscheint, wenn das Bild nicht lädt. Auch Suchmaschinen lesen sie. <b>alt ist immer nötig.</b></li><li><code>width</code> — Breite in Pixeln (die Höhe passt sich an).</li></ul><p>In diesem Kurs hast du vier fertige Bilder: <code>cat.svg</code>, <code>sun.svg</code>, <code>rocket.svg</code>, <code>plant.svg</code>. Auf einer echten Website legst du die Datei neben das HTML und schreibst ihren Namen in <code>src</code>.</p>"},"task":{"ru":"<ol><li>Вставь две картинки из списка выше.</li><li>У каждой напиши осмысленный <code>alt</code> (не «картинка», а что на ней).</li><li>Одной задай <code>width=\"200\"</code>.</li></ol>","de":"<ol><li>Füge zwei Bilder aus der Liste oben ein.</li><li>Schreibe bei jedem ein sinnvolles <code>alt</code> (nicht „Bild“, sondern was darauf zu sehen ist).</li><li>Gib einem <code>width=\"200\"</code>.</li></ol>"},"files":{"index.html":{"ru":"<h1>Моя галерея</h1>\n<!-- Вставь картинки здесь -->\n","de":"<h1>Meine Galerie</h1>\n<!-- Füge hier die Bilder ein -->\n"}},"checks":[{"t":"count","m":{"ru":"Минимум две картинки <code>&lt;img&gt;</code>","de":"Mindestens zwei Bilder <code>&lt;img&gt;</code>"},"s":"img","n":2,"w":null},{"t":"allattr","m":{"ru":"У каждой картинки есть <code>src</code> (файл .svg)","de":"Jedes Bild hat <code>src</code> (Datei .svg)"},"s":"img","a":"src","r":"svg","w":null},{"t":"allattr","m":{"ru":"У каждой картинки есть описание <code>alt</code> (минимум 4 символа)","de":"Jedes Bild hat eine Beschreibung <code>alt</code> (mindestens 4 Zeichen)"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"attr","m":{"ru":"Одной картинке задана ширина 200","de":"Bei einem Bild ist die Breite 200 gesetzt"},"s":"img","a":"width","r":"^200$","w":null}],"sol":{"index.html":{"ru":"<h1>Моя галерея</h1>\n<img src=\"cat.svg\" alt=\"Рыжий кот с усами\" width=\"200\">\n<img src=\"rocket.svg\" alt=\"Ракета летит среди звёзд\">\n","de":"<h1>Meine Galerie</h1>\n<img src=\"cat.svg\" alt=\"Rote Katze mit Schnurrhaaren\" width=\"200\">\n<img src=\"rocket.svg\" alt=\"Rakete fliegt zwischen Sternen\">\n"}},"hint":{"ru":"<p>Пример одной строки: <code>&lt;img src=\"sun.svg\" alt=\"Жёлтое солнце с лучами\"&gt;</code>. Закрывающего тега нет.</p>","de":"<p>Beispiel für eine Zeile: <code>&lt;img src=\"sun.svg\" alt=\"Gelbe Sonne mit Strahlen\"&gt;</code>. Es gibt kein schließendes Tag.</p>"},"quiz":[{"q":{"ru":"Зачем нужен alt?","de":"Wozu ist alt da?"},"o":[{"ru":"Чтобы картинка была красивее","de":"Damit das Bild schöner aussieht"},{"ru":"Чтобы описать картинку словами для незрячих и на случай ошибки загрузки","de":"Um das Bild in Worten zu beschreiben, für Blinde und falls das Laden fehlschlägt"},{"ru":"Чтобы изменить размер","de":"Um die Größe zu ändern"}],"a":1}]},{"day":6,"week":1,"title":{"ru":"Скелет страницы: head и body","de":"Das Gerüst einer Seite: head und body"},"goal":{"ru":"Знать структуру настоящего HTML-файла и ориентироваться в нём.","de":"Den Aufbau einer echten HTML-Datei kennen und sich darin zurechtfinden."},"theory":{"ru":"<p>До сих пор мы писали только содержимое. Настоящий HTML-файл имеет скелет:</p><pre class=\"ex\" data-l=\"html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"ru\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Название вкладки&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Всё, что видно на странице&lt;/h1&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><ul><li><code>&lt;!DOCTYPE html&gt;</code> — сообщает браузеру: «это современный HTML».</li><li><code>&lt;html lang=\"ru\"&gt;</code> — весь документ и его язык.</li><li><code>&lt;head&gt;</code> — служебное, не показывается на странице: кодировка (<code>meta charset</code>) и <code>&lt;title&gt;</code> — название во вкладке браузера.</li><li><code>&lt;body&gt;</code> — всё, что видит посетитель.</li></ul><p><b>Как ориентироваться в коде:</b> смотри на отступы. Всё, что внутри <code>&lt;head&gt;</code>, сдвинуто на два пробела. Закрывающий тег стоит на том же уровне, что и открывающий.</p>","de":"<p>Bisher haben wir nur Inhalt geschrieben. Eine echte HTML-Datei hat ein Gerüst:</p><pre class=\"ex\" data-l=\"html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"de\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Name des Tabs&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Alles, was auf der Seite zu sehen ist&lt;/h1&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><ul><li><code>&lt;!DOCTYPE html&gt;</code> — sagt dem Browser: „Das ist modernes HTML“.</li><li><code>&lt;html lang=\"de\"&gt;</code> — das ganze Dokument und seine Sprache.</li><li><code>&lt;head&gt;</code> — Technisches, wird nicht angezeigt: Zeichensatz (<code>meta charset</code>) und <code>&lt;title&gt;</code> — der Name im Browser-Tab.</li><li><code>&lt;body&gt;</code> — alles, was der Besucher sieht.</li></ul><p><b>So findest du dich im Code zurecht:</b> Achte auf die Einrückung. Alles in <code>&lt;head&gt;</code> ist um zwei Leerzeichen eingerückt. Das schließende Tag steht auf derselben Ebene wie das öffnende.</p>"},"task":{"ru":"<p>Ниже — только содержимое. Оберни его в полный скелет:</p><ol><li><code>&lt;!DOCTYPE html&gt;</code> в первой строке.</li><li><code>&lt;html lang=\"ru\"&gt;</code>, внутри <code>&lt;head&gt;</code> и <code>&lt;body&gt;</code>.</li><li>В <code>&lt;head&gt;</code>: <code>&lt;meta charset=\"utf-8\"&gt;</code> и <code>&lt;title&gt;</code> со своим названием.</li><li>Содержимое перенеси в <code>&lt;body&gt;</code>. Посмотри, как изменилось название вкладки браузера в твоём окне (здесь его не видно, но на сайте оно будет).</li></ol>","de":"<p>Unten steht nur der Inhalt. Verpacke ihn in ein vollständiges Gerüst:</p><ol><li><code>&lt;!DOCTYPE html&gt;</code> in der ersten Zeile.</li><li><code>&lt;html lang=\"de\"&gt;</code>, darin <code>&lt;head&gt;</code> und <code>&lt;body&gt;</code>.</li><li>In <code>&lt;head&gt;</code>: <code>&lt;meta charset=\"utf-8\"&gt;</code> und <code>&lt;title&gt;</code> mit deinem eigenen Namen.</li><li>Verschiebe den Inhalt in <code>&lt;body&gt;</code>. (Der Tab-Name ist hier nicht zu sehen, aber auf einer echten Website erscheint er.)</li></ol>"},"files":{"index.html":{"ru":"<h1>Мой сайт</h1>\n<p>Скоро здесь будет много интересного.</p>\n","de":"<h1>Meine Website</h1>\n<p>Bald gibt es hier viel Interessantes.</p>\n"}},"checks":[{"t":"code","m":{"ru":"Первая строка: <code>&lt;!DOCTYPE html&gt;</code>","de":"Erste Zeile: <code>&lt;!DOCTYPE html&gt;</code>"},"r":"^\\s*<!DOCTYPE html>","f":null},{"t":"code","m":{"ru":"Есть <code>&lt;html lang=\"…\"&gt;</code>","de":"Es gibt <code>&lt;html lang=\"…\"&gt;</code>"},"r":"<html[^>]*\\blang=","f":null},{"t":"code","m":{"ru":"В <code>&lt;head&gt;</code> есть <code>meta charset</code>","de":"In <code>&lt;head&gt;</code> gibt es <code>meta charset</code>"},"r":"<head>[\\s\\S]*<meta\\s+charset=[\\s\\S]*</head>","f":null},{"t":"code","m":{"ru":"Есть <code>&lt;title&gt;</code> с названием","de":"Es gibt <code>&lt;title&gt;</code> mit einem Namen"},"r":"<title>\\s*[^<\\s][^<]*</title>","f":null},{"t":"code","m":{"ru":"Заголовок <code>&lt;h1&gt;</code> находится внутри <code>&lt;body&gt;</code>","de":"Die Überschrift <code>&lt;h1&gt;</code> steht in <code>&lt;body&gt;</code>"},"r":"<body>[\\s\\S]*<h1[\\s\\S]*</body>","f":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Мой сайт</title>\n</head>\n<body>\n  <h1>Мой сайт</h1>\n  <p>Скоро здесь будет много интересного.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Meine Website</title>\n</head>\n<body>\n  <h1>Meine Website</h1>\n  <p>Bald gibt es hier viel Interessantes.</p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Порядок: <code>html</code> содержит <code>head</code> и <code>body</code>. Внутри <code>head</code> — <code>meta</code> и <code>title</code>. Внутри <code>body</code> — всё видимое.</p>","de":"<p>Reihenfolge: <code>html</code> enthält <code>head</code> und <code>body</code>. In <code>head</code> stehen <code>meta</code> und <code>title</code>. In <code>body</code> steht alles Sichtbare.</p>"},"quiz":[{"q":{"ru":"Где находится элемент &lt;title&gt;?","de":"Wo steht das Element &lt;title&gt;?"},"o":[{"ru":"В &lt;head&gt;","de":"In &lt;head&gt;"},{"ru":"В &lt;body&gt;","de":"In &lt;body&gt;"},{"ru":"После &lt;/html&gt;","de":"Nach &lt;/html&gt;"}],"a":0},{"q":{"ru":"Что видит посетитель на странице?","de":"Was sieht der Besucher auf der Seite?"},"o":[{"ru":"Всё из &lt;head&gt;","de":"Alles aus &lt;head&gt;"},{"ru":"Всё из &lt;body&gt;","de":"Alles aus &lt;body&gt;"},{"ru":"Только &lt;title&gt;","de":"Nur &lt;title&gt;"}],"a":1}]},{"day":7,"week":1,"title":{"ru":"Проект недели: страница-визитка","de":"Wochenprojekt: eine Visitenkarten-Seite"},"goal":{"ru":"Собрать всё из первой недели в одну страницу о себе.","de":"Alles aus der ersten Woche in einer Seite über dich zusammenführen."},"theory":{"ru":"<p>Сегодня ты ничего нового не учишь, а собираешь всё в одном месте. Перед работой повтори: заголовки, абзацы, списки, ссылки, картинки, скелет.</p><p>Подумай, что ты хочешь рассказать: как тебя зовут, чем увлекаешься, что любишь. Не пиши личных данных (адрес, телефон, школа): страница может когда-нибудь стать публичной.</p>","de":"<p>Heute lernst du nichts Neues, sondern bringst alles an einem Ort zusammen. Wiederhole vorab: Überschriften, Absätze, Listen, Links, Bilder, Gerüst.</p><p>Überlege, was du erzählen möchtest: wie du heißt, was du magst. Schreibe keine persönlichen Daten (Adresse, Telefon, Schule): Die Seite könnte irgendwann öffentlich werden.</p>"},"task":{"ru":"<p>Построй страницу «Обо мне». В ней должно быть:</p><ol><li>Полный скелет страницы (DOCTYPE, head с title, body).</li><li>Заголовок <code>&lt;h1&gt;</code> с твоим именем или ником.</li><li>Минимум два абзаца о себе.</li><li>Одна картинка с осмысленным <code>alt</code>.</li><li>Список <code>&lt;ul&gt;</code> из трёх увлечений, в одном слове <code>&lt;strong&gt;</code>.</li><li>Одна ссылка на то, что тебе нравится, и линия <code>&lt;hr&gt;</code>.</li></ol><p>Ответь ещё на вопросы внизу.</p>","de":"<p>Baue eine Seite „Über mich“. Sie soll enthalten:</p><ol><li>Ein vollständiges Gerüst (DOCTYPE, head mit title, body).</li><li>Eine Überschrift <code>&lt;h1&gt;</code> mit deinem Namen oder Nicknamen.</li><li>Mindestens zwei Absätze über dich.</li><li>Ein Bild mit sinnvollem <code>alt</code>.</li><li>Eine Liste <code>&lt;ul&gt;</code> mit drei Interessen, bei einem Wort <code>&lt;strong&gt;</code>.</li><li>Einen Link zu etwas, das dir gefällt, und eine Linie <code>&lt;hr&gt;</code>.</li></ol><p>Beantworte unten noch die Fragen.</p>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!-- Собери здесь страницу «Обо мне» -->\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title></title>\n</head>\n<body>\n  <!-- Baue hier die Seite „Über mich“ -->\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть <code>&lt;!DOCTYPE html&gt;</code>","de":"Es gibt <code>&lt;!DOCTYPE html&gt;</code>"},"r":"^\\s*<!DOCTYPE html>","f":null},{"t":"code","m":{"ru":"У страницы есть <code>&lt;title&gt;</code>","de":"Die Seite hat einen <code>&lt;title&gt;</code>"},"r":"<title>\\s*[^<\\s][^<]*</title>","f":null},{"t":"has","m":{"ru":"Заголовок <code>&lt;h1&gt;</code>","de":"Überschrift <code>&lt;h1&gt;</code>"},"s":"h1","w":null},{"t":"count","m":{"ru":"Минимум два абзаца","de":"Mindestens zwei Absätze"},"s":"p","n":2,"w":null},{"t":"allattr","m":{"ru":"Картинка с осмысленным <code>alt</code>","de":"Bild mit sinnvollem <code>alt</code>"},"s":"img","a":"alt","r":".{4,}","w":null},{"t":"count","m":{"ru":"Список из трёх пунктов","de":"Liste mit drei Punkten"},"s":"ul > li","n":3,"w":null},{"t":"has","m":{"ru":"Есть <code>&lt;strong&gt;</code>","de":"Es gibt <code>&lt;strong&gt;</code>"},"s":"li strong, p strong","w":null},{"t":"attr","m":{"ru":"Есть внешняя ссылка","de":"Es gibt einen externen Link"},"s":"a","a":"href","r":"^https?://","w":null},{"t":"has","m":{"ru":"Есть линия <code>&lt;hr&gt;</code>","de":"Es gibt eine Linie <code>&lt;hr&gt;</code>"},"s":"hr","w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Обо мне</title>\n</head>\n<body>\n  <h1>Привет, я Макс</h1>\n  <img src=\"rocket.svg\" alt=\"Ракета среди звёзд\" width=\"160\">\n  <p>Мне 15 лет, и я учусь делать сайты.</p>\n  <p>Больше всего мне нравится придумывать и мастерить.</p>\n  <hr>\n  <h2>Мои увлечения</h2>\n  <ul>\n    <li><strong>Космос</strong></li>\n    <li>Музыка</li>\n    <li>Игры</li>\n  </ul>\n  <p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Читаю Википедию</a></p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Über mich</title>\n</head>\n<body>\n  <h1>Hallo, ich bin Max</h1>\n  <img src=\"rocket.svg\" alt=\"Rakete zwischen Sternen\" width=\"160\">\n  <p>Ich bin 15 und lerne, Websites zu bauen.</p>\n  <p>Am liebsten denke ich mir Dinge aus und baue sie.</p>\n  <hr>\n  <h2>Meine Interessen</h2>\n  <ul>\n    <li><strong>Weltraum</strong></li>\n    <li>Musik</li>\n    <li>Spiele</li>\n  </ul>\n  <p><a href=\"https://wikipedia.org\" target=\"_blank\" rel=\"noopener\">Ich lese Wikipedia</a></p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Двигайся по пунктам и после каждого нажимай «Проверить». Если что-то не показывается, посмотри, закрыт ли тег и стоит ли элемент внутри <code>&lt;body&gt;</code>.</p>","de":"<p>Arbeite die Punkte der Reihe nach ab und drücke nach jedem „Prüfen“. Wenn etwas nicht angezeigt wird, schau, ob das Tag geschlossen ist und das Element in <code>&lt;body&gt;</code> steht.</p>"},"quiz":[{"q":{"ru":"Какой тег делает пункт в списке?","de":"Welches Tag macht einen Listenpunkt?"},"o":[{"ru":"&lt;li&gt;","de":"&lt;li&gt;"},{"ru":"&lt;ul&gt;","de":"&lt;ul&gt;"},{"ru":"&lt;p&gt;","de":"&lt;p&gt;"}],"a":0},{"q":{"ru":"Какой атрибут хранит адрес ссылки?","de":"Welches Attribut speichert die Adresse eines Links?"},"o":[{"ru":"src","de":"src"},{"ru":"href","de":"href"},{"ru":"alt","de":"alt"}],"a":1},{"q":{"ru":"Что не нужно писать на публичной странице о себе?","de":"Was gehört nicht auf eine öffentliche Seite über dich?"},"o":[{"ru":"Любимую музыку","de":"Lieblingsmusik"},{"ru":"Домашний адрес и телефон","de":"Wohnadresse und Telefonnummer"},{"ru":"Свои увлечения","de":"Deine Interessen"}],"a":1}],"proj":true},{"day":8,"week":2,"title":{"ru":"Что такое CSS: первые стили","de":"Was ist CSS: erste Stile"},"goal":{"ru":"Написать первое правило CSS и понять, из чего оно состоит.","de":"Die erste CSS-Regel schreiben und verstehen, woraus sie besteht."},"theory":{"ru":"<p>CSS (Cascading Style Sheets) говорит браузеру, <b>как выглядят</b> элементы. Правило CSS состоит из трёх частей:</p><pre class=\"ex\" data-l=\"css\">h1 {\n  color: red;\n}\n/* селектор { свойство: значение; } */</pre><ul><li><b>Селектор</b> (<code>h1</code>) — к чему применить: ко всем заголовкам первого уровня.</li><li><b>Свойство</b> (<code>color</code>) — что менять: цвет текста.</li><li><b>Значение</b> (<code>red</code>) — на что менять.</li></ul><p>После каждого значения — точка с запятой <code>;</code>. Правила лежат в <code>&lt;style&gt;</code> внутри <code>&lt;head&gt;</code>. Два главных свойства для начала: <code>color</code> (цвет текста) и <code>background-color</code> (цвет фона).</p>","de":"<p>CSS (Cascading Style Sheets) sagt dem Browser, <b>wie Elemente aussehen</b>. Eine CSS-Regel besteht aus drei Teilen:</p><pre class=\"ex\" data-l=\"css\">h1 {\n  color: red;\n}\n/* Selektor { Eigenschaft: Wert; } */</pre><ul><li><b>Selektor</b> (<code>h1</code>) — worauf es angewendet wird: auf alle Überschriften erster Ebene.</li><li><b>Eigenschaft</b> (<code>color</code>) — was geändert wird: die Textfarbe.</li><li><b>Wert</b> (<code>red</code>) — worauf geändert wird.</li></ul><p>Nach jedem Wert steht ein Semikolon <code>;</code>. Die Regeln stehen in <code>&lt;style&gt;</code> innerhalb von <code>&lt;head&gt;</code>. Die zwei wichtigsten Eigenschaften zum Start: <code>color</code> (Textfarbe) und <code>background-color</code> (Hintergrundfarbe).</p>"},"task":{"ru":"<ol><li>Дай заголовку <code>h1</code> любой цвет текста, кроме чёрного.</li><li>Задай странице (<code>body</code>) цвет фона.</li><li>Задай абзацам (<code>p</code>) тёмно-серый цвет вместо чёрного, например <code>#333</code>.</li></ol>","de":"<ol><li>Gib der Überschrift <code>h1</code> eine beliebige Textfarbe außer Schwarz.</li><li>Gib der Seite (<code>body</code>) eine Hintergrundfarbe.</li><li>Gib den Absätzen (<code>p</code>) ein dunkles Grau statt Schwarz, z. B. <code>#333</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* Пиши правила CSS здесь */\n  </style>\n</head>\n<body>\n  <h1>Привет, CSS!</h1>\n  <p>Сейчас эта страница выглядит скучно. Давай её раскрасим.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* Schreibe hier CSS-Regeln */\n  </style>\n</head>\n<body>\n  <h1>Hallo, CSS!</h1>\n  <p>Im Moment sieht diese Seite langweilig aus. Machen wir sie bunt.</p>\n</body>\n</html>\n"}},"checks":[{"t":"has","m":{"ru":"Есть блок <code>&lt;style&gt;</code>","de":"Es gibt einen <code>&lt;style&gt;</code>-Block"},"s":"style","w":null},{"t":"cssnot","m":{"ru":"Цвет заголовка <code>h1</code> не чёрный","de":"Die Farbe von <code>h1</code> ist nicht schwarz"},"s":"h1","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"У <code>body</code> есть цвет фона","de":"<code>body</code> hat eine Hintergrundfarbe"},"s":"body","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"cssnot","m":{"ru":"Цвет абзаца <code>p</code> не чёрный","de":"Die Farbe von <code>p</code> ist nicht schwarz"},"s":"p","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { background-color: #fff3d6; }\n    h1 { color: #5b48e8; }\n    p { color: #333; }\n  </style>\n</head>\n<body>\n  <h1>Привет, CSS!</h1>\n  <p>Сейчас эта страница выглядит скучно. Давай её раскрасим.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { background-color: #fff3d6; }\n    h1 { color: #5b48e8; }\n    p { color: #333; }\n  </style>\n</head>\n<body>\n  <h1>Hallo, CSS!</h1>\n  <p>Im Moment sieht diese Seite langweilig aus. Machen wir sie bunt.</p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Пример: <code>body { background-color: #fff3d6; }</code>. Не забудь фигурные скобки <code>{ }</code> и точку с запятой в конце строки.</p>","de":"<p>Beispiel: <code>body { background-color: #fff3d6; }</code>. Vergiss die geschweiften Klammern <code>{ }</code> und das Semikolon am Zeilenende nicht.</p>"},"quiz":[{"q":{"ru":"Как называется часть <code>h1</code> в правиле <code>h1 { color: red; }</code>?","de":"Wie heißt der Teil <code>h1</code> in der Regel <code>h1 { color: red; }</code>?"},"o":[{"ru":"Селектор","de":"Selektor"},{"ru":"Свойство","de":"Eigenschaft"},{"ru":"Значение","de":"Wert"}],"a":0},{"q":{"ru":"Что нужно поставить после значения?","de":"Was muss nach dem Wert stehen?"},"o":[{"ru":"Точку с запятой <code>;</code>","de":"Ein Semikolon <code>;</code>"},{"ru":"Двоеточие","de":"Ein Doppelpunkt"},{"ru":"Ничего","de":"Nichts"}],"a":0}]},{"day":9,"week":2,"title":{"ru":"Селекторы: теги, классы и id","de":"Selektoren: Tags, Klassen und IDs"},"goal":{"ru":"Выбирать нужные элементы по тегу, классу и id.","de":"Die richtigen Elemente nach Tag, Klasse und ID auswählen."},"theory":{"ru":"<p>Селектор выбирает, к чему применить стиль. Три главных вида:</p><pre class=\"ex\" data-l=\"css\">p { color: #333; }          /* все абзацы (по тегу) */\n.note { color: green; }     /* всё с class=\"note\" */\n#title { color: red; }      /* один элемент с id=\"title\" */</pre><pre class=\"ex\" data-l=\"html\">&lt;h1 id=\"title\"&gt;Заголовок&lt;/h1&gt;\n&lt;p class=\"note\"&gt;Важная заметка&lt;/p&gt;\n&lt;p class=\"note big\"&gt;Заметка и ещё класс big&lt;/p&gt;</pre><ul><li><b>Класс</b> (<code>.note</code>) можно давать многим элементам, а у одного элемента может быть несколько классов через пробел.</li><li><b>id</b> (<code>#title</code>) должен быть уникальным на странице.</li><li>Если правила спорят, побеждает более точный селектор: id сильнее класса, класс сильнее тега.</li></ul>","de":"<p>Ein Selektor wählt aus, worauf ein Stil angewendet wird. Drei Hauptarten:</p><pre class=\"ex\" data-l=\"css\">p { color: #333; }          /* alle Absätze (nach Tag) */\n.note { color: green; }     /* alles mit class=\"note\" */\n#title { color: red; }      /* ein Element mit id=\"title\" */</pre><pre class=\"ex\" data-l=\"html\">&lt;h1 id=\"title\"&gt;Überschrift&lt;/h1&gt;\n&lt;p class=\"note\"&gt;Wichtige Notiz&lt;/p&gt;\n&lt;p class=\"note big\"&gt;Notiz und noch die Klasse big&lt;/p&gt;</pre><ul><li>Eine <b>Klasse</b> (<code>.note</code>) kann man vielen Elementen geben, und ein Element kann mehrere Klassen haben, durch Leerzeichen getrennt.</li><li>Eine <b>ID</b> (<code>#title</code>) muss auf der Seite einmalig sein.</li><li>Wenn Regeln streiten, gewinnt der genauere Selektor: ID schlägt Klasse, Klasse schlägt Tag.</li></ul>"},"task":{"ru":"<ol><li>Создай правило <code>.highlight</code> с жёлтым фоном (<code>background-color: yellow;</code>).</li><li>Добавь <code>class=\"highlight\"</code> двум абзацам из трёх.</li><li>Создай правило <code>#title</code> и дай заголовку цвет.</li></ol>","de":"<ol><li>Erstelle die Regel <code>.highlight</code> mit gelbem Hintergrund (<code>background-color: yellow;</code>).</li><li>Gib zwei von drei Absätzen <code>class=\"highlight\"</code>.</li><li>Erstelle die Regel <code>#title</code> und gib der Überschrift eine Farbe.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* твои правила */\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Мои дела</h1>\n  <p>Сделать уроки</p>\n  <p>Погулять</p>\n  <p>Записать код</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* deine Regeln */\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Meine Aufgaben</h1>\n  <p>Hausaufgaben machen</p>\n  <p>Spazieren gehen</p>\n  <p>Code schreiben</p>\n</body>\n</html>\n"}},"checks":[{"t":"code","m":{"ru":"Есть правило <code>.highlight { … }</code>","de":"Es gibt die Regel <code>.highlight { … }</code>"},"r":"\\.highlight\\s*\\{","f":null},{"t":"count","m":{"ru":"Класс <code>highlight</code> у двух элементов","de":"Die Klasse <code>highlight</code> bei zwei Elementen"},"s":".highlight","n":2,"w":null},{"t":"cssnot","m":{"ru":"У <code>.highlight</code> есть фон","de":"<code>.highlight</code> hat einen Hintergrund"},"s":".highlight","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"Есть правило <code>#title { … }</code>","de":"Es gibt die Regel <code>#title { … }</code>"},"r":"#title\\s*\\{","f":null},{"t":"cssnot","m":{"ru":"Цвет <code>#title</code> не чёрный","de":"Die Farbe von <code>#title</code> ist nicht schwarz"},"s":"#title","p":"color","r":"^rgb\\(0, 0, 0\\)$","w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    .highlight { background-color: yellow; }\n    #title { color: #ee6a3c; }\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Мои дела</h1>\n  <p class=\"highlight\">Сделать уроки</p>\n  <p>Погулять</p>\n  <p class=\"highlight\">Записать код</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    .highlight { background-color: yellow; }\n    #title { color: #ee6a3c; }\n  </style>\n</head>\n<body>\n  <h1 id=\"title\">Meine Aufgaben</h1>\n  <p class=\"highlight\">Hausaufgaben machen</p>\n  <p>Spazieren gehen</p>\n  <p class=\"highlight\">Code schreiben</p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Класс в CSS пишется с точкой (<code>.highlight</code>), а в HTML — без неё: <code>class=\"highlight\"</code>. Id в CSS пишется с решёткой <code>#</code>.</p>","de":"<p>Eine Klasse schreibt man im CSS mit Punkt (<code>.highlight</code>), im HTML ohne: <code>class=\"highlight\"</code>. Eine ID schreibt man im CSS mit Raute <code>#</code>.</p>"},"quiz":[{"q":{"ru":"Как в CSS выбрать все элементы с <code>class=\"note\"</code>?","de":"Wie wählt man im CSS alle Elemente mit <code>class=\"note\"</code>?"},"o":[{"ru":"<code>.note</code>","de":"<code>.note</code>"},{"ru":"<code>#note</code>","de":"<code>#note</code>"},{"ru":"<code>note</code>","de":"<code>note</code>"}],"a":0},{"q":{"ru":"Сколько элементов на странице могут иметь один и тот же id?","de":"Wie viele Elemente einer Seite dürfen dieselbe ID haben?"},"o":[{"ru":"Только один","de":"Nur eines"},{"ru":"Сколько угодно","de":"Beliebig viele"},{"ru":"Не больше трёх","de":"Höchstens drei"}],"a":0}]},{"day":10,"week":2,"title":{"ru":"Текст: шрифты, размер и выравнивание","de":"Text: Schriften, Größe und Ausrichtung"},"goal":{"ru":"Управлять шрифтом, размером, выравниванием и расстоянием между строками.","de":"Schrift, Größe, Ausrichtung und Zeilenabstand steuern."},"theory":{"ru":"<p>Самые полезные свойства текста:</p><pre class=\"ex\" data-l=\"css\">body {\n  font-family: Georgia, serif;   /* шрифт (запасные через запятую) */\n  font-size: 18px;               /* размер */\n  line-height: 1.6;              /* расстояние между строками */\n}\nh1 {\n  text-align: center;            /* выравнивание */\n  text-transform: uppercase;     /* ЗАГЛАВНЫЕ */\n  letter-spacing: 2px;           /* расстояние между буквами */\n  font-weight: 700;              /* жирность */\n}</pre><ul><li>Шрифт указывают списком: если первого нет на компьютере, берётся следующий. В конце всегда ставь общий тип: <code>serif</code> (с засечками), <code>sans-serif</code> (без) или <code>monospace</code>.</li><li>Единицы: <code>px</code> — пиксели. <code>rem</code> — относительно базового размера (1rem ≈ 16px), хорош для адаптивных сайтов.</li><li>Хорошая читаемость: размер от 16px, <code>line-height</code> около 1.5–1.7.</li></ul>","de":"<p>Die nützlichsten Texteigenschaften:</p><pre class=\"ex\" data-l=\"css\">body {\n  font-family: Georgia, serif;   /* Schrift (Ersatz mit Komma) */\n  font-size: 18px;               /* Größe */\n  line-height: 1.6;              /* Abstand zwischen Zeilen */\n}\nh1 {\n  text-align: center;            /* Ausrichtung */\n  text-transform: uppercase;     /* GROSSBUCHSTABEN */\n  letter-spacing: 2px;           /* Abstand zwischen Buchstaben */\n  font-weight: 700;              /* Dicke */\n}</pre><ul><li>Die Schrift gibt man als Liste an: Wenn die erste auf dem Computer fehlt, wird die nächste genommen. Am Ende steht immer eine allgemeine Art: <code>serif</code> (mit Serifen), <code>sans-serif</code> (ohne) oder <code>monospace</code>.</li><li>Einheiten: <code>px</code> — Pixel. <code>rem</code> — relativ zur Grundgröße (1rem ≈ 16px), gut für responsive Seiten.</li><li>Gute Lesbarkeit: Größe ab 16px, <code>line-height</code> etwa 1,5–1,7.</li></ul>"},"task":{"ru":"<ol><li>Дай всей странице (<code>body</code>) шрифт <code>Georgia, serif</code>.</li><li>Заголовок <code>h1</code>: по центру и ЗАГЛАВНЫМИ.</li><li>Абзацы <code>p</code>: размер не меньше 18px и <code>line-height</code>.</li></ol>","de":"<ol><li>Gib der ganzen Seite (<code>body</code>) die Schrift <code>Georgia, serif</code>.</li><li>Überschrift <code>h1</code>: zentriert und in GROSSBUCHSTABEN.</li><li>Absätze <code>p</code>: Größe mindestens 18px und <code>line-height</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    /* твои правила */\n  </style>\n</head>\n<body>\n  <h1>Как читать код</h1>\n  <p>Код читают сверху вниз, как книгу. Сначала смотри на структуру: заголовки, блоки, списки. Потом на детали.</p>\n  <p>Хорошая привычка: делать маленькие изменения и сразу смотреть результат.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    /* deine Regeln */\n  </style>\n</head>\n<body>\n  <h1>Code lesen</h1>\n  <p>Code liest man von oben nach unten, wie ein Buch. Schau zuerst auf die Struktur: Überschriften, Blöcke, Listen. Dann auf die Details.</p>\n  <p>Eine gute Gewohnheit: kleine Änderungen machen und sofort das Ergebnis ansehen.</p>\n</body>\n</html>\n"}},"checks":[{"t":"css","m":{"ru":"<code>body</code>: шрифт Georgia","de":"<code>body</code>: Schrift Georgia"},"s":"body","p":"font-family","r":"georgia","w":null},{"t":"css","m":{"ru":"<code>h1</code> по центру","de":"<code>h1</code> zentriert"},"s":"h1","p":"text-align","r":"^center$","w":null},{"t":"css","m":{"ru":"<code>h1</code> ЗАГЛАВНЫМИ","de":"<code>h1</code> in GROSSBUCHSTABEN"},"s":"h1","p":"text-transform","r":"^uppercase$","w":null},{"t":"cssnum","m":{"ru":"<code>p</code>: размер не меньше 18px","de":"<code>p</code>: Größe mindestens 18px"},"s":"p","p":"font-size","o":">=","n":18,"w":null},{"t":"code","m":{"ru":"Задан <code>line-height</code>","de":"<code>line-height</code> ist gesetzt"},"r":"line-height\\s*:","f":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { font-family: Georgia, serif; }\n    h1 { text-align: center; text-transform: uppercase; }\n    p { font-size: 18px; line-height: 1.6; }\n  </style>\n</head>\n<body>\n  <h1>Как читать код</h1>\n  <p>Код читают сверху вниз, как книгу. Сначала смотри на структуру: заголовки, блоки, списки. Потом на детали.</p>\n  <p>Хорошая привычка: делать маленькие изменения и сразу смотреть результат.</p>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { font-family: Georgia, serif; }\n    h1 { text-align: center; text-transform: uppercase; }\n    p { font-size: 18px; line-height: 1.6; }\n  </style>\n</head>\n<body>\n  <h1>Code lesen</h1>\n  <p>Code liest man von oben nach unten, wie ein Buch. Schau zuerst auf die Struktur: Überschriften, Blöcke, Listen. Dann auf die Details.</p>\n  <p>Eine gute Gewohnheit: kleine Änderungen machen und sofort das Ergebnis ansehen.</p>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Несколько свойств для одного селектора пишут в одних скобках, каждое со своей точкой с запятой: <code>h1 { text-align: center; text-transform: uppercase; }</code>.</p>","de":"<p>Mehrere Eigenschaften für einen Selektor stehen in denselben Klammern, jede mit eigenem Semikolon: <code>h1 { text-align: center; text-transform: uppercase; }</code>.</p>"},"quiz":[{"q":{"ru":"Какое свойство меняет расстояние между строками?","de":"Welche Eigenschaft ändert den Abstand zwischen Zeilen?"},"o":[{"ru":"line-height","de":"line-height"},{"ru":"font-size","de":"font-size"},{"ru":"text-align","de":"text-align"}],"a":0}]},{"day":11,"week":2,"title":{"ru":"Коробочная модель: отступы и рамки","de":"Das Box-Modell: Abstände und Rahmen"},"goal":{"ru":"Понять, что каждый элемент — коробка, и управлять её отступами.","de":"Verstehen, dass jedes Element eine Box ist, und ihre Abstände steuern."},"theory":{"ru":"<p>Для браузера каждый элемент — прямоугольная коробка из четырёх слоёв (изнутри наружу):</p><ol><li><b>content</b> — содержимое (текст, картинка).</li><li><b>padding</b> — внутренний отступ между содержимым и рамкой.</li><li><b>border</b> — рамка.</li><li><b>margin</b> — внешний отступ до соседей.</li></ol><pre class=\"ex\" data-l=\"css\">.card {\n  width: 300px;\n  padding: 20px;                 /* внутри */\n  border: 2px solid #5b48e8;     /* толщина стиль цвет */\n  border-radius: 16px;           /* скруглённые углы */\n  margin: 30px auto;             /* снаружи: 30px сверху и снизу, auto = по центру */\n}</pre><p>Волшебная строка для новичков: <code>* { box-sizing: border-box; }</code>. С ней заданная ширина включает padding и рамку, считать проще.</p>","de":"<p>Für den Browser ist jedes Element eine rechteckige Box aus vier Schichten (von innen nach außen):</p><ol><li><b>content</b> — Inhalt (Text, Bild).</li><li><b>padding</b> — Innenabstand zwischen Inhalt und Rahmen.</li><li><b>border</b> — Rahmen.</li><li><b>margin</b> — Außenabstand zu den Nachbarn.</li></ol><pre class=\"ex\" data-l=\"css\">.card {\n  width: 300px;\n  padding: 20px;                 /* innen */\n  border: 2px solid #5b48e8;     /* Dicke Stil Farbe */\n  border-radius: 16px;           /* runde Ecken */\n  margin: 30px auto;             /* außen: 30px oben und unten, auto = zentriert */\n}</pre><p>Eine Zauberzeile für Anfänger: <code>* { box-sizing: border-box; }</code>. Damit enthält die angegebene Breite Padding und Rahmen, das Rechnen wird einfacher.</p>"},"task":{"ru":"<p>Оформи карточку <code>.card</code> как на примере:</p><ol><li>Ширина около 300px (не больше 400px).</li><li>Внутренний отступ <code>padding</code> от 12px.</li><li>Рамка толщиной от 1px и скруглённые углы.</li><li>По центру страницы: <code>margin: 30px auto;</code>.</li></ol>","de":"<p>Gestalte die Karte <code>.card</code> wie im Beispiel:</p><ol><li>Breite etwa 300px (höchstens 400px).</li><li>Innenabstand <code>padding</code> ab 12px.</li><li>Rahmen ab 1px Dicke und runde Ecken.</li><li>In der Seitenmitte: <code>margin: 30px auto;</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    /* Стилизуй .card ниже */\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Карточка</h2>\n    <p>Моя первая коробка с настоящими отступами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    /* Gestalte .card unten */\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Karte</h2>\n    <p>Meine erste Box mit echten Abständen.</p>\n  </div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnum","m":{"ru":"Ширина <code>.card</code> не больше 400px","de":"Breite von <code>.card</code> höchstens 400px"},"s":".card","p":"width","o":"<=","n":400,"w":null},{"t":"cssnum","m":{"ru":"<code>padding</code> не меньше 12px","de":"<code>padding</code> mindestens 12px"},"s":".card","p":"padding-top","o":">=","n":12,"w":null},{"t":"cssnum","m":{"ru":"Есть рамка","de":"Es gibt einen Rahmen"},"s":".card","p":"border-top-width","o":">=","n":1,"w":null},{"t":"cssnum","m":{"ru":"Углы скруглены","de":"Ecken sind abgerundet"},"s":".card","p":"border-top-left-radius","o":">=","n":4,"w":null},{"t":"cssnum","m":{"ru":"Карточка по центру (<code>margin: … auto</code>)","de":"Karte ist zentriert (<code>margin: … auto</code>)"},"s":".card","p":"margin-left","o":">=","n":20,"w":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    .card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; background: #fff; }\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Карточка</h2>\n    <p>Моя первая коробка с настоящими отступами.</p>\n  </div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; background: #f2f1fc; }\n    .card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; background: #fff; }\n  </style>\n</head>\n<body>\n  <div class=\"card\">\n    <h2>Karte</h2>\n    <p>Meine erste Box mit echten Abständen.</p>\n  </div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Всё в одном правиле: <code>.card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; }</code>. Попробуй менять числа и смотри, что меняется.</p>","de":"<p>Alles in einer Regel: <code>.card { width: 300px; padding: 20px; border: 2px solid #5b48e8; border-radius: 16px; margin: 30px auto; }</code>. Probiere, die Zahlen zu ändern, und schau, was sich ändert.</p>"},"quiz":[{"q":{"ru":"Какой слой находится между содержимым и рамкой?","de":"Welche Schicht liegt zwischen Inhalt und Rahmen?"},"o":[{"ru":"padding","de":"padding"},{"ru":"margin","de":"margin"},{"ru":"outline","de":"outline"}],"a":0},{"q":{"ru":"Что делает <code>margin: 0 auto;</code> у блока с заданной шириной?","de":"Was macht <code>margin: 0 auto;</code> bei einem Block mit fester Breite?"},"o":[{"ru":"Центрирует его по горизонтали","de":"Zentriert ihn horizontal"},{"ru":"Прячет его","de":"Versteckt ihn"},{"ru":"Делает рамку","de":"Macht einen Rahmen"}],"a":0}]},{"day":12,"week":2,"title":{"ru":"Цвета и фон","de":"Farben und Hintergrund"},"goal":{"ru":"Задавать цвета тремя способами и делать градиентный фон.","de":"Farben auf drei Arten angeben und einen Farbverlauf als Hintergrund machen."},"theory":{"ru":"<p>В CSS цвет можно записать по-разному:</p><pre class=\"ex\" data-l=\"css\">color: tomato;                 /* имя цвета */\ncolor: #1a8fe0;                /* hex: #RRGGBB (красный, зелёный, синий) */\ncolor: rgb(15, 157, 138);      /* rgb: три числа 0–255 */\nbackground: linear-gradient(90deg, #ffe29f, #ffa99f);  /* градиент */</pre><ul><li>Hex и rgb — одно и то же, записанное по-разному. В hex первые две цифры — красный, следующие две — зелёный, последние две — синий.</li><li><b>Контраст:</b> текст должен хорошо читаться на фоне. Светло-серый на белом — плохая идея, особенно для людей с плохим зрением.</li></ul>","de":"<p>In CSS kann man eine Farbe auf verschiedene Weise schreiben:</p><pre class=\"ex\" data-l=\"css\">color: tomato;                 /* Farbname */\ncolor: #1a8fe0;                /* Hex: #RRGGBB (Rot, Grün, Blau) */\ncolor: rgb(15, 157, 138);      /* rgb: drei Zahlen 0–255 */\nbackground: linear-gradient(90deg, #ffe29f, #ffa99f);  /* Farbverlauf */</pre><ul><li>Hex und rgb sind dasselbe, anders geschrieben. Bei Hex sind die ersten zwei Ziffern Rot, die nächsten zwei Grün, die letzten zwei Blau.</li><li><b>Kontrast:</b> Text muss auf dem Hintergrund gut lesbar sein. Hellgrau auf Weiß ist eine schlechte Idee, besonders für Menschen mit schwacher Sehkraft.</li></ul>"},"task":{"ru":"<ol><li>Дай блоку <code>#a</code> цвет фона по имени (например, <code>tomato</code>).</li><li>Блоку <code>#b</code> — hex-цвет (<code>#1a8fe0</code>).</li><li>Блоку <code>#c</code> — через <code>rgb(…)</code>.</li><li>Задай фон страницы <code>linear-gradient</code>.</li></ol>","de":"<ol><li>Gib dem Block <code>#a</code> eine Hintergrundfarbe per Name (z. B. <code>tomato</code>).</li><li>Dem Block <code>#b</code> eine Hex-Farbe (<code>#1a8fe0</code>).</li><li>Dem Block <code>#c</code> eine Farbe mit <code>rgb(…)</code>.</li><li>Setze den Seitenhintergrund mit <code>linear-gradient</code>.</li></ol>"},"files":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { padding: 20px; }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    /* Покрась блоки #a, #b, #c и фон страницы */\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { padding: 20px; }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    /* Färbe die Blöcke #a, #b, #c und den Seitenhintergrund */\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n"}},"checks":[{"t":"cssnot","m":{"ru":"У <code>#a</code> есть цвет","de":"<code>#a</code> hat eine Farbe"},"s":"#a","p":"background-color","r":"^rgba\\(0, 0, 0, 0\\)$","w":null},{"t":"code","m":{"ru":"<code>#b</code> задан через hex","de":"<code>#b</code> ist per Hex gesetzt"},"r":"#b\\s*\\{[^}]*#[0-9a-f]{3,8}","f":null},{"t":"code","m":{"ru":"<code>#c</code> задан через <code>rgb()</code>","de":"<code>#c</code> ist per <code>rgb()</code> gesetzt"},"r":"#c\\s*\\{[^}]*rgb\\(","f":null},{"t":"code","m":{"ru":"Есть <code>linear-gradient</code>","de":"Es gibt <code>linear-gradient</code>"},"r":"linear-gradient\\(","f":null}],"sol":{"index.html":{"ru":"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Стили</title>\n  <style>\n    body { padding: 20px; background: linear-gradient(90deg, #ffe29f, #ffa99f); }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    #a { background-color: tomato; }\n    #b { background-color: #1a8fe0; }\n    #c { background-color: rgb(15, 157, 138); }\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n","de":"<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Stile</title>\n  <style>\n    body { padding: 20px; background: linear-gradient(90deg, #ffe29f, #ffa99f); }\n    .swatch { height: 60px; margin: 8px 0; border-radius: 10px; }\n    #a { background-color: tomato; }\n    #b { background-color: #1a8fe0; }\n    #c { background-color: rgb(15, 157, 138); }\n  </style>\n</head>\n<body>\n  <div class=\"swatch\" id=\"a\"></div>\n  <div class=\"swatch\" id=\"b\"></div>\n  <div class=\"swatch\" id=\"c\"></div>\n</body>\n</html>\n"}},"hint":{"ru":"<p>Одно правило для каждого блока: <code>#b { background-color: #1a8fe0; }</code>. Для градиента: <code>body { background: linear-gradient(90deg, #ffe29f, #ffa99f); }</code>.</p>","de":"<p>Eine Regel pro Block: <code>#b { background-color: #1a8fe0; }</code>. Für den Verlauf: <code>body { background: linear-gradient(90deg, #ffe29f, #ffa99f); }</code>.</p>"},"quiz":[{"q":{"ru":"Какой текст читается лучше?","de":"Welcher Text ist besser lesbar?"},"o":[{"ru":"Светло-серый на белом","de":"Hellgrau auf Weiß"},{"ru":"Тёмно-синий на светло-жёлтом","de":"Dunkelblau
